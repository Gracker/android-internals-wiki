<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">Omnibox 的 :</tspan>
<tspan x="310.0" dy="34.0">进入 SQL 查询</tspan>
</text>
<path d="M 679 60 Q 890.0 60.2 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.3 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">结果列语义</tspan>
<tspan x="890.0" dy="34.0">名称 / 时间 / dur 或 value</tspan>
</text>
<path d="M 679 340 Q 890.0 340.5 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.5 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">映射 Slice / Counter</tspan>
<tspan x="890.0" dy="34.0">必要时按列 pivot</tspan>
</text>
<path d="M 99 340 Q 310.0 340.1 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.0 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">Debug Track</tspan>
<tspan x="310.0" dy="34.0">放回统一时间轴</tspan>
</text>
<text x="600" y="565" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">机制与取证示意；对象、版本与完整性按正文核对</tspan>
