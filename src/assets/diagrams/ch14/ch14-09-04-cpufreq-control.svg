<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">policy、governor 与 driver 的职责链</title>
<desc id="desc">policy 管控制范围，governor 提目标，driver 提交硬件。 固件、温控和内部控制仍可影响最终有效运行状态。 policy
共享控制接口与 min/max → governor
根据负载提出目标；governor
根据负载提出目标 → scaling driver
解析并提交支持的频点；scaling driver
解析并提交支持的频点 → 硬件 / 固件
实际执行仍需反馈核对</desc>
