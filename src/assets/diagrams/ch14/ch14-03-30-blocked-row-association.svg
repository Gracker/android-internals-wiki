<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">阻塞原因字段需要成功关联状态行</title>
<desc id="desc">采到事件、找到最近阻塞行并解析有效符号后才能补齐阻塞线索。 配置过 Tracepoint 不代表字段必有值；NULL 需检查事件、关联和符号。 sched_blocked_reason
包含 pid / caller / io_wait → 按线程寻找最近阻塞行
事件时序与历史仍可用；按线程寻找最近阻塞行
事件时序与历史仍可用 → 补写 io_wait
有效符号时补函数名；补写 io_wait
有效符号时补函数名 → 状态行与独立证据对齐
再判断阻塞资源</desc>
