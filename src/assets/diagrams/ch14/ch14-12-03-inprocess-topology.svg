<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">进程内producer、service与consumer共同组成自采集</title>
<desc id="desc">应用自己控制进程内service的配置、启停和导出。 只有注册到本backend的数据源；不连接系统producer socket，不自动包含其他进程或ftrace。 应用数据源
TrackEvent / custom → 进程内tracing service
会话buffer与保留策略；进程内tracing service
会话buffer与保留策略 → 应用consumer session
配置、启停与导出</desc>
