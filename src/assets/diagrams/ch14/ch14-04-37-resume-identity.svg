<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">历史会话按快照恢复而非重读 active</title>
<desc id="desc">恢复固定 provider/runtime 身份，已删除的绑定 provider 应明确失败。 v1.3.0 的纯 env Qoder 快照存在缺口，应在修复版本回归或新建会话。 读取历史 session snapshot
provider / runtime 身份 → 绑定 provider 仍存在
不存在即 fail-fast；绑定 provider 仍存在
不存在即 fail-fast → env/default 的 override
优先于当前环境变量；env/default 的 override
优先于当前环境变量 → 恢复原有执行身份
不受后来 active 切换影响</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
