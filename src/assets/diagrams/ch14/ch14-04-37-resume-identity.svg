<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">读取历史 session snapshot</tspan>
<tspan x="310.0" dy="34.0">provider / runtime 身份</tspan>
</text>
