<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">四类复用机制的输入与输出</title>
<desc id="desc">按查询语义、结构化指标和界面步骤选择复用层。 SQL 宏和 UI 宏是两套执行机制，不能互换配置。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="600" fill="white"/>
<path d="M 79 55 Q 310.0 54.8 541 55 Q 545 55 545 59 L 545 201 Q 545 205 541 205 Q 310.0 205.6 79 205 Q 75 205 75 201 L 75 59 Q 75 55 79 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">SQL 标准库</tspan>
<tspan x="310.0" dy="34.0">INCLUDE 模块 → 表 / 视图 / 函数</tspan>
</text>
<path d="M 659 55 Q 890.0 54.5 1121 55 Q 1125 55 1125 59 L 1125 201 Q 1125 205 1121 205 Q 890.0 205.2 659 205 Q 655 205 655 201 L 655 59 Q 655 55 659 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">Trace Summarization</tspan>
<tspan x="890.0" dy="34.0">规格 + 查询 → TraceSummary</tspan>
</text>
<path d="M 79 310 Q 310.0 310.4 541 310 Q 545 310 545 314 L 545 456 Q 545 460 541 460 Q 310.0 460.2 79 460 Q 75 460 75 456 L 75 314 Q 75 310 79 310" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="376.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">存量 v1 指标</tspan>
<tspan x="310.0" dy="34.0">SQL + 自定义 proto → TraceMetrics</tspan>
</text>
<path d="M 659 310 Q 890.0 309.8 1121 310 Q 1125 310 1125 314 L 1125 456 Q 1125 460 1121 460 Q 890.0 459.4 659 460 Q 655 460 655 456 L 655 314 Q 655 310 659 310" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="890.0" y="376.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">UI 命令宏</tspan>
<tspan x="890.0" dy="34.0">JSON 命令序列 → 界面状态</tspan>
</text>
</svg>
