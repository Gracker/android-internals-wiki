<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">pending fence靠同buffer后续调用重检查</title>
<desc id="desc">pending事件延后检查，补写仍使用原signal时间。 无后续有效检查可缺尾；60秒过滤已signal事件年龄，不是让等待fence超时。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
