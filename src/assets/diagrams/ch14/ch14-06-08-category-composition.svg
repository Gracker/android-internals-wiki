<title id="title">atrace category 可同时控制 tag 与内核事件</title>
<desc id="desc">精确事件配置与 Android category 可以并用，再核对展开后的实际覆盖。 category 存在不保证其中每个可选事件在目标设备上可用。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
