<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">App Actual结束点与帧身份分别核对</title>
<desc id="desc">App Actual通常取queue与acquire signal较晚者，pending时固定实现回退queue。 Actual end不无条件证明GPU完成或物理显示；关联保留upid、Layer和Actual行ID。 App SurfaceFrame
软件起点与预测时序 → 通常 max(queue, signal)
pending暂用queue time；通常 max(queue, signal)
pending暂用queue time → App token / Layer / upid
多Layer可共享同token；App token / Layer / upid
多Layer可共享同token → 对应SF DisplayFrame
另查display present反馈</desc>
