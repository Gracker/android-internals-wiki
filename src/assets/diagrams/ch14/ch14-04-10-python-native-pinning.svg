<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Python 包与原生工具分别锁定</title>
<desc id="desc">显式选择原生二进制，并把实际版本与摘要写入报告。 perfetto 0.57.2 的包内清单固定 v56.1；包号不能证明运行的是 v57.2。 Python 依赖版本
读取该包 prebuilt 清单 → 显式 bin_path
指向已验证的 v57.2；显式 bin_path
指向已验证的 v57.2 → 检查版本与 SHA 摘要
不依赖下载文件名；检查版本与 SHA 摘要
不依赖下载文件名 → 随结果保存 toolchain
工具升级重跑 golden</desc>
