<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">UI状态提示调查方向，因果还需现场证据</title>
<desc id="desc">先看jank_tag与原始类型，再沿当前对象的线程、GPU和显示依赖继续调查。 Self/Other是归类口径；应用负载可能影响系统侧，good/stuffing/dropped也要分开统计。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="630" fill="white"/>
<path d="M 79 50 Q 310.0 50.7 541 50 Q 545 50 545 54 L 545 206 Q 545 210 541 210 Q 310.0 210.4 79 210 Q 75 210 75 206 L 75 54 Q 75 50 79 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">Self Jank</tspan>
<tspan x="310.0" dy="34.0">查App工作、调度、GPU和提交</tspan>
</text>
<path d="M 659 50 Q 890.0 49.9 1121 50 Q 1125 50 1125 54 L 1125 206 Q 1125 210 1121 210 Q 890.0 209.9 659 210 Q 655 210 655 206 L 655 54 Q 655 50 659 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">Other Jank</tspan>
<tspan x="890.0" dy="34.0">查SF/显示，同时复核应用影响</tspan>
</text>
<path d="M 79 325 Q 310.0 324.6 541 325 Q 545 325 545 329 L 545 481 Q 545 485 541 485 Q 310.0 485.1 79 485 Q 75 485 75 481 L 75 329 Q 75 325 79 325" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="396.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">Stuffing / 高延迟</tspan>
<tspan x="310.0" dy="34.0">工作可按时，队列持续晚present</tspan>
</text>
<path d="M 659 325 Q 890.0 325.5 1121 325 Q 1125 325 1125 329 L 1125 481 Q 1125 485 1121 485 Q 890.0 485.1 659 485 Q 655 485 655 481 L 655 329 Q 655 325 659 325" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="890.0" y="396.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">Dropped / Non-perceivable</tspan>
<tspan x="890.0" dy="34.0">保留状态与分母，不混入正常完成</tspan>
</text>
</svg>
