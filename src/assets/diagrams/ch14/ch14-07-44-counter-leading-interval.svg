<text x="480.0" y="296" text-anchor="middle" style="font-size:21px">
<tspan x="480.0" dy="0">值 A</tspan>
</text>
<path d="M 609 270 Q 750.0 269.8 891 270 Q 895 270 895 274 L 895 303 Q 895 307 891 307 Q 750.0 307.0 609 307 Q 605 307 605 303 L 605 274 Q 605 270 609 270" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="750.0" y="296" text-anchor="middle" style="font-size:21px">
<tspan x="750.0" dy="0">值 B</tspan>
