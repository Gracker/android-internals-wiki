<path d="M 899 270 Q 970.0 269.6 1041 270 Q 1045 270 1045 274 L 1045 303 Q 1045 307 1041 307 Q 970.0 306.3 899 307 Q 895 307 895 303 L 895 274 Q 895 270 899 270" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="970.0" y="296" text-anchor="middle" style="font-size:21px">
