<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">计数器点还原成前向保持区间</title>
<desc id="desc">同轨按 ts/id 稳定排序，从当前点延续到下一点，再按窗口裁剪。 同时间戳较早记录形成零时长；若不接受最后 ID 规则，应标成歧义。 按 track_id 分组
按 ts、id 稳定排序 → 当前 ts → 下一 ts
相同时间戳先处理；当前 ts → 下一 ts
相同时间戳先处理 → 尾点延续至明确终点
报告外推与首段未知</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="690" fill="white"/>
<path d="M 365 120.0 L 450 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.6 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.4 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">按 track_id 分组</tspan>
<tspan x="215.0" dy="34.0">按 ts、id 稳定排序</tspan>
</text>
<path d="M 454 60 Q 600.0 59.8 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.7 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">当前 ts → 下一 ts</tspan>
<tspan x="600.0" dy="34.0">相同时间戳先处理</tspan>
</text>
<path d="M 839 60 Q 985.0 60.5 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.7 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">尾点延续至明确终点</tspan>
<tspan x="985.0" dy="34.0">报告外推与首段未知</tspan>
</text>
<text x="241" y="293" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">采样点后保持</tspan>
</text>
