<title id="title">系统 CUJ 指标汇合三类独立证据</title>
<desc id="desc">系统 CUJ 标记、结束后 Counter 和逐帧 FrameTimeline 提供不同层次证据。 聚合计数与逐帧模型可能缺采或采用不同分类，不能强行视为同一结果。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
