<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从业务窗口进入 CPU 与线程状态视图</title>
<desc id="desc">用一次业务窗口联读 CPU Scheduling 和 Thread State。 整段线程生命周期中的正常睡眠占比不能解释一次卡顿。 选业务 Slice / 帧
先确定范围与实例 → Thread State
拆执行、排队与等待；Thread State
拆执行、排队与等待 → CPU Scheduling
查运行核心与竞争者；CPU Scheduling
查运行核心与竞争者 → 独立因果证据
回到栈、同步和设备</desc>
