<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">acquire、present与release分别约束不同边界</title>
<desc id="desc">写完成、显示参考时间与旧buffer安全复用由不同同步信号说明。 proto有RELEASE_FENCE枚举不等于AOSP发射它；present不能代替release或光学测量。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
