<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">异步停止先完整写尾packet，再提交和确认</title>
<desc id="desc">异步清理须完成packet、writer提交与停止确认，并遵守consumer超时。 Finalize早于Flush；多写入线程分别同步，flush callback连接断开时可能不回调。 OnStop取ack closure
延后本实例停止 → 清理线程写末尾packet
Finalize或离开作用域；清理线程写末尾packet
Finalize或离开作用域 → 最后Trace中ctx.Flush
提交本线程/实例writer；最后Trace中ctx.Flush
提交本线程/实例writer → 执行停止确认closure
consumer超时前完成</desc>
