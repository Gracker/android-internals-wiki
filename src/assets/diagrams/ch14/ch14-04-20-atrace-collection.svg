<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">平台 ATrace 事件进入系统 Trace 的条件</title>
<desc id="desc">目标应用允许列表与 ftrace 采集把平台埋点送入系统缓冲。 配置请求不保证设备实际覆盖；RING_BUFFER 满后会覆盖最早数据。 应用 Trace / ATrace_*
平台 APP 分类事件 → atrace_apps 包名允许
启用对应应用追踪；atrace_apps 包名允许
启用对应应用追踪 → linux.ftrace 采集
送入系统 Trace buffer；linux.ftrace 采集
送入系统 Trace buffer → Trace Processor 导入
查询对应业务 Slice</desc>
