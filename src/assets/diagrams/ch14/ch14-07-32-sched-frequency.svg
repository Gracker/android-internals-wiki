<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">调度与频率按 ucpu 关联驻留时间</title>
<desc id="desc">sched 与频率区间先在相同 ucpu 上求交，再按线程和频点累加交集时长。 仅使用选定的单条频率轨道；被排除的多轨 CPU 与缺失频率要报告。 调度运行区间作为独立输入；频率区间作为独立输入，与调度求交；按线程与频点累加交集输出dur</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="830" fill="white"/>
<path d="M 280 180 L 280 410 L 385 410" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 375 404 L 385 410 L 375 416" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890 180 L 890 410 L 815 410" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 404 L 815 410 L 825 416" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 470 L 600 600" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 590 L 600 600 L 606 590" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 280.0 60.1 491 60 Q 495 60 495 64 L 495 176 Q 495 180 491 180 Q 280.0 179.6 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="280.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="280.0" dy="0">sched：运行区间</tspan>
<tspan x="280.0" dy="34.0">utid + ucpu</tspan>
</text>
<path d="M 679 60 Q 890.0 59.7 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 180.2 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">Counter：频率保持区间</tspan>
<tspan x="890.0" dy="34.0">track_id → ucpu</tspan>
</text>
<path d="M 389 350 Q 600.0 349.8 811 350 Q 815 350 815 354 L 815 466 Q 815 470 811 470 Q 600.0 469.5 389 470 Q 385 470 385 466 L 385 354 Q 385 350 389 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="401.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">按相同 ucpu 求时间交集</tspan>
<tspan x="600.0" dy="34.0">使用输出 dur 加权</tspan>
</text>
<path d="M 389 600 Q 600.0 599.9 811 600 Q 815 600 815 604 L 815 716 Q 815 720 811 720 Q 600.0 720.3 389 720 Q 385 720 385 716 L 385 604 Q 385 600 389 600" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="651.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">线程 × 频点驻留</tspan>
<tspan x="600.0" dy="34.0">保留实例与频率覆盖</tspan>
</text>
</svg>
