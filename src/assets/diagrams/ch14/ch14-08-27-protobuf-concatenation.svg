<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">手工富化是拼接 TracePacket 流</title>
<desc id="desc">原始 protobuf trace 后附符号与去混淆 TracePacket 流，得到富化文件。 这里适用于相容原生 protobuf 流，不能把任意 pprof、TAR 或 JSON 当作同一种字节流拼接。 符号化读取原始输入；去混淆独立读取同一原始输入；原始流仍需保留并拼入最终文件；把符号包流附到原始流；把去混淆包流附到原始流</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="840" fill="white"/>
<path d="M 600 180 L 600 240 L 215 240 L 215 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 290 L 215 300 L 221 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 240 L 985 240 L 985 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 290 L 985 300 L 991 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 600" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 590 L 600 600 L 606 590" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 215 420 L 215 660 L 450 660" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 654 L 450 660 L 440 666" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 420 L 985 660 L 750 660" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 760 654 L 750 660 L 760 666" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 60.6 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.0 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">原始 protobuf trace</tspan>
<tspan x="600.0" dy="34.0">同一份输入</tspan>
</text>
<path d="M 69 300 Q 215.0 300.8 361 300 Q 365 300 365 304 L 365 416 Q 365 420 361 420 Q 215.0 420.5 69 420 Q 65 420 65 416 L 65 304 Q 65 300 69 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="351.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">symbolize</tspan>
<tspan x="215.0" dy="34.0">输出 symbols.pb</tspan>
</text>
<path d="M 839 300 Q 985.0 300.4 1131 300 Q 1135 300 1135 304 L 1135 416 Q 1135 420 1131 420 Q 985.0 419.5 839 420 Q 835 420 835 416 L 835 304 Q 835 300 839 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="351.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">deobfuscate</tspan>
<tspan x="985.0" dy="34.0">输出 deobfuscation.pb</tspan>
</text>
<path d="M 454 600 Q 600.0 600.1 746 600 Q 750 600 750 604 L 750 716 Q 750 720 746 720 Q 600.0 720.2 454 720 Q 450 720 450 716 L 450 604 Q 450 600 454 600" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="651.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">原始流 + 两份富化包流</tspan>
<tspan x="600.0" dy="34.0">拼接后重新导入核对</tspan>
</text>
</svg>
