<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Runnable 延迟查询必须复核邻接关系</title>
<desc id="desc">结果保留实例与状态行，并要求 Runnable 的结束等于 Running 的开始。 缺 wake 或未闭合 Running 会使结果不完整；空结果不是零延迟。 按 upid / utid 选现场
保留两端状态 id → 标准库候选关联
前面的 R / R+；标准库候选关联
前面的 R / R+ → 闭合与邻接检查
runnable.ts + dur = running.ts；闭合与邻接检查
runnable.ts + dur = running.ts → 回看 CPU / priority / waker
在业务时间窗内解释</desc>
