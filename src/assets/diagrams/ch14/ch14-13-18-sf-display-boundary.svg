<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">SF Actual覆盖显示栈，release与光学另查</title>
<desc id="desc">SF Actual从系统处理起点延伸到显示栈present反馈。 Composer/DisplayHAL包含在综合路径中，不能把这一段当SF CPU时长或光学响应时间。 SF主线程处理DisplayFrame
CPU与异步合成组织 → CLIENT或DEVICE输出
Composer / Display HAL；CLIENT或DEVICE输出
Composer / Display HAL → present反馈作为终点
release和光学另有证据</desc>
