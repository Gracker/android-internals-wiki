<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">DataGrid、Data Explorer 与 SQL 分别负责什么</title>
<desc id="desc">Data Explorer 组织查询图，Trace Processor 执行结构化查询，DataGrid 显示结果。 图形界面帮助筛选，不替代字段语义与原始 Trace 证据。 Data Explorer 节点图
筛选、聚合和关联 → 结构化查询送入 TP
同步、查询和物化；结构化查询送入 TP
同步、查询和物化 → DataGrid 读取结果表
排序、过滤与透视；DataGrid 读取结果表
排序、过滤与透视 → 保存明确 SQL 和版本
回查 Trace 与源码</desc>
