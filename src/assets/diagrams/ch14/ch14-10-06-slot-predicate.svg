<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">等待、非阻塞与超额dequeue是不同分支</title>
<desc id="desc">缺可用buffer或队列超限时重试，非阻塞返回还受acquired数量条件约束。 简化主要非shared分支；已有queued且dequeue到上限先报INVALID_OPERATION，唤醒不保证获得slot。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 600 180 L 600 255 L 215 255 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 255 L 985 255 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 60.0 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.0 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">dequeue主路径简化</tspan>
<tspan x="600.0" dy="34.0">先查上限，再查可用条件</tspan>
</text>
<path d="M 69 340 Q 215.0 340.8 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.3 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="375.52000000000004" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">已queued且dequeue超额</tspan>
<tspan x="215.0" dy="32.64">INVALID_OPERATION</tspan>
<tspan x="215.0" dy="32.64">不当作等待超时</tspan>
</text>
<path d="M 454 340 Q 600.0 340.3 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.3 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="374.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">nonblock或async</tspan>
<tspan x="600.0" dy="34.0">且acquired≤max时</tspan>
<tspan x="600.0" dy="34.0">WOULD_BLOCK</tspan>
</text>
<path d="M 839 340 Q 985.0 340.7 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.5 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="985.0" y="374.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">其余走release等待</tspan>
<tspan x="985.0" dy="34.0">超时可TIMED_OUT</tspan>
<tspan x="985.0" dy="34.0">醒来拿锁后重新检查</tspan>
</text>
</svg>
