<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">节点图经 summarizer 生成可读取的结果表</title>
<desc id="desc">执行服务把节点转成结构化查询，通过 summarizer 管理物化结果。 临时表名和界面状态不作长期稳定接口，UI 与 TP 版本分别保存。 节点生成 StructuredQuery
包含输入和转换 → summarizer 同步 spec
按节点查询与物化；summarizer 同步 spec
按节点查询与物化 → 返回当前结果表名
SQLDataSource 指向该表；返回当前结果表名
SQLDataSource 指向该表 → DataGrid 分页和交互
保存可复用的明确查询</desc>
