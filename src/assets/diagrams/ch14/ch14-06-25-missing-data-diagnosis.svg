<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">轨道缺失按四类问题定位</title>
<desc id="desc">依次区分事件未注册、配置未启用、传输丢失和缺少语义派生。 每轮只改变一个采集变量，并保存同一复现场景的覆盖证据。 事件是否存在
设备事件列表和调用点 → 配置是否启用
类别、包名、错误详情；配置是否启用
类别、包名、错误详情 → 采集是否保留
按层检查损失与窗口；采集是否保留
按层检查损失与窗口 → 解析是否派生
先原始事件，再领域表</desc>
