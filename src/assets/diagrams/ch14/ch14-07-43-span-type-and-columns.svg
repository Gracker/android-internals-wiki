<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">算子类型、空键和同名列分别验证</title>
<desc id="desc">执行前验证时间列、分区列和透传业务列，避免隐藏丢行或创建错误。 NULL 分区行会跳过；payload 同名列须重命名，两侧都缺 dur 会失败。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 79 50 Q 310.0 50.4 541 50 Q 545 50 545 54 L 545 196 Q 545 200 541 200 Q 310.0 199.5 79 200 Q 75 200 75 196 L 75 54 Q 75 50 79 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">ts 与有效 dur</tspan>
<tspan x="310.0" dy="34.0">两侧显式区间最清楚</tspan>
</text>
<path d="M 659 50 Q 890.0 50.4 1121 50 Q 1125 50 1125 54 L 1125 196 Q 1125 200 1121 200 Q 890.0 199.8 659 200 Q 655 200 655 196 L 655 54 Q 655 50 659 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">整数且非空分区</tspan>
<tspan x="890.0" dy="34.0">NULL 不会作为实体保留</tspan>
</text>
<path d="M 79 315 Q 310.0 314.2 541 315 Q 545 315 545 319 L 545 461 Q 545 465 541 465 Q 310.0 464.4 79 465 Q 75 465 75 461 L 75 319 Q 75 315 79 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">两侧相同分区名</tspan>
<tspan x="310.0" dy="34.0">表达同一种实际实体</tspan>
</text>
<path d="M 659 315 Q 890.0 315.5 1121 315 Q 1125 315 1125 319 L 1125 461 Q 1125 465 1121 465 Q 890.0 464.2 659 465 Q 655 465 655 461 L 655 319 Q 655 315 659 315" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="890.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">业务列先消除同名</tspan>
<tspan x="890.0" dy="34.0">保留来源 ID，避免冲突</tspan>
</text>
</svg>
