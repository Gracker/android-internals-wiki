<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">第三方交互用自有标记和帧证据组合</title>
<desc id="desc">第三方交互保留自定义 Slice ID，与同进程帧窗口求交并核对调度。 一个帧可落在多个自定义窗口内，行数不能直接累加；时间相关也不是因果。 应用自有命名空间
受控的 async cookie 生命周期 → custom_cuj_id + upid
保留不同交互实例；custom_cuj_id + upid
保留不同交互实例 → 与帧和线程状态求交
核对 legacy模型与缺口；与帧和线程状态求交
核对 legacy模型与缺口 → 结合 JankStats 和对照
不冒用系统 CUJ Counter</desc>
