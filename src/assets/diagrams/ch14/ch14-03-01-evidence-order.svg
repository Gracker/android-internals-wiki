<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">用状态定位阶段，再用独立证据解释原因</title>
<desc id="desc">先固定业务窗口和对象，再结合状态与独立证据定位等待或执行。 状态名称本身不能指出应用函数、锁或具体设备。 业务区间 / deadline
明确 ts、dur 与对象 → 状态 / 调度区间
哪个 utid 在做什么；状态 / 调度区间
哪个 utid 在做什么 → 独立证据
栈、Binder、锁与设备；独立证据
栈、Binder、锁与设备 → 同条件修改对照
验证因果与实际收益</desc>
