<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">schedutil 映射经过 vendor hook 和频点解析</title>
<desc id="desc">利用率和 capacity 参与映射，非零 vendor 结果可替换默认映射。 更新间隔来自 policy transition delay；图不承诺固定周期或最终频率。 进入vendor映射钩子；返回0则走默认map_util_freq；返回非零则采用vendor映射；默认映射后进入缓存或驱动解析；vendor映射后进入缓存或驱动解析</desc>
