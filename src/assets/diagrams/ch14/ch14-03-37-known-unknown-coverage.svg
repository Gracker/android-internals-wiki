<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">已知状态与未知覆盖分别报告</title>
<desc id="desc">半开裁剪后累计闭合正时长，并报告业务窗口中未覆盖的部分。 未闭合尾部或缺口不能按零耗时处理；覆盖异常先检查输入。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
