<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">启动 Trace 的准备、触发和覆盖窗口</title>
<desc id="desc">配置与一次性属性先准备，待持久属性和 traced 就绪后启动采集。 数据分区与服务就绪之前的阶段可能缺失，preserve 模式不能同时改时钟和缓冲大小。 下次启动等待服务条件；条件满足才启动采集</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="620" fill="white"/>
<path d="M 365 100 L 450 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 94 L 450 100 L 440 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 100 L 835 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 94 L 835 100 L 825 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 45 Q 215.0 44.2 361 45 Q 365 45 365 49 L 365 151 Q 365 155 361 155 Q 215.0 155.7 69 155 Q 65 155 65 151 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">准备 boottrace.pbtxt</tspan>
<tspan x="215.0" dy="34.0">设置下次启动触发属性</tspan>
</text>
<path d="M 454 45 Q 600.0 45.6 746 45 Q 750 45 750 49 L 750 151 Q 750 155 746 155 Q 600.0 155.7 454 155 Q 450 155 450 151 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">持久属性 + traced 就绪</tspan>
<tspan x="600.0" dy="34.0">满足 init 条件</tspan>
</text>
<path d="M 839 45 Q 985.0 45.2 1131 45 Q 1135 45 1135 49 L 1135 151 Q 1135 155 1131 155 Q 985.0 154.3 839 155 Q 835 155 835 151 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="91.84" text-anchor="middle" style="font-size:24px">
<tspan x="985.0" dy="0">清空一次性属性</tspan>
<tspan x="985.0" dy="32.64">启动 Perfetto boot trace</tspan>
</text>
<text x="241" y="323" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">启动过程示意</tspan>
</text>
<path d="M 255 339 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 259 300 Q 390.0 300.3 521 300 Q 525 300 525 304 L 525 333 Q 525 337 521 337 Q 390.0 337.5 259 337 Q 255 337 255 333 L 255 304 Q 255 300 259 300" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="390.0" y="326" text-anchor="middle" style="font-size:21px">
<tspan x="390.0" dy="0">可能未覆盖的早期阶段</tspan>
</text>
<path d="M 529 300 Q 795.0 300.6 1061 300 Q 1065 300 1065 304 L 1065 333 Q 1065 337 1061 337 Q 795.0 336.2 529 337 Q 525 337 525 333 L 525 304 Q 525 300 529 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="795.0" y="326" text-anchor="middle" style="font-size:21px">
<tspan x="795.0" dy="0">服务就绪后的采集窗口</tspan>
</text>
</svg>
