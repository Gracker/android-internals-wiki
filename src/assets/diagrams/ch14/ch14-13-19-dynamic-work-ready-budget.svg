<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">动态work与ready预算决定候选唤醒</title>
<desc id="desc">目标VSYNC、ready预算与work预算决定调度候选，实际唤醒还受now和重新调度约束。 Expected宽度不是刷新周期；固定提前1–3ms模型不能替代实际版本的调度逻辑。 选择预测目标VSYNC
结合now与调度约束 → ready = VSYNC − readyDuration
候选wake = ready − work；ready = VSYNC − readyDuration
候选wake = ready − work → 实际wake夹到max(now,候选)
再考虑重新调度约束</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
