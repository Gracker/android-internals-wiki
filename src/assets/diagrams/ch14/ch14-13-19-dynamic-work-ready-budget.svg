<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.3 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 180.8 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">选择预测目标VSYNC</tspan>
<tspan x="215.0" dy="34.0">结合now与调度约束</tspan>
</text>
<path d="M 454 60 Q 600.0 59.8 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.4 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="97.56" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">ready = VSYNC −</tspan>
<tspan x="600.0" dy="29.92">readyDuration</tspan>
<tspan x="600.0" dy="29.92">候选wake = ready − work</tspan>
</text>
<path d="M 839 60 Q 985.0 60.8 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.6 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">wake = max(now, 候选)</tspan>
<tspan x="985.0" dy="34.0">再查重新调度约束</tspan>
</text>
<text x="600" y="720" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">区间仅示意预算关系；目标VSYNC在两预算之后</tspan>
</text>
<text x="256" y="423" text-anchor="end" style="font-size:23px">
<tspan x="256" dy="0">预算关系</tspan>
</text>
<path d="M 270 439 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 274 400 Q 480.0 399.6 686 400 Q 690 400 690 404 L 690 433 Q 690 437 686 437 Q 480.0 437.2 274 437 Q 270 437 270 433 L 270 404 Q 270 400 274 400" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="480.0" y="426" text-anchor="middle" style="font-size:21px">
<tspan x="480.0" dy="0">workDuration</tspan>
</text>
<path d="M 694 400 Q 855.0 400.6 1016 400 Q 1020 400 1020 404 L 1020 433 Q 1020 437 1016 437 Q 855.0 437.7 694 437 Q 690 437 690 433 L 690 404 Q 690 400 694 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="855.0" y="426" text-anchor="middle" style="font-size:21px">
<tspan x="855.0" dy="0">readyDuration</tspan>
