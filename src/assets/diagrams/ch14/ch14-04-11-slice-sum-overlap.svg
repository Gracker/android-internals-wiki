<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Slice 的累计时长不等于墙钟或 CPU 时间</title>
<desc id="desc">slice 是通用事件视图，嵌套与并行会重复覆盖相同墙钟。 图中条长只示意包含关系；SUM(dur) 不自动得到业务独占耗时。 行数与累计时长是两个数据规模指标；累计区间可能有嵌套与并行重叠</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 365 100 L 450 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 94 L 450 100 L 440 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 100 L 835 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 94 L 835 100 L 825 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 45 Q 215.0 45.6 361 45 Q 365 45 365 49 L 365 151 Q 365 155 361 155 Q 215.0 155.2 69 155 Q 65 155 65 151 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">COUNT(*)</tspan>
<tspan x="215.0" dy="34.0">统计 slice 行数量</tspan>
</text>
<path d="M 454 45 Q 600.0 44.8 746 45 Q 750 45 750 49 L 750 151 Q 750 155 746 155 Q 600.0 154.5 454 155 Q 450 155 450 151 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">SUM(正 dur)</tspan>
<tspan x="600.0" dy="34.0">累计事件覆盖时长</tspan>
</text>
<path d="M 839 45 Q 985.0 45.6 1131 45 Q 1135 45 1135 49 L 1135 151 Q 1135 155 1131 155 Q 985.0 154.2 839 155 Q 835 155 835 151 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">按轨道与语义解释</tspan>
<tspan x="985.0" dy="34.0">不能直接称用户态 CPU</tspan>
</text>
<text x="241" y="288" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">父 Slice</tspan>
</text>
<path d="M 255 304 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 259 265 Q 630.0 265.7 1001 265 Q 1005 265 1005 269 L 1005 298 Q 1005 302 1001 302 Q 630.0 301.4 259 302 Q 255 302 255 298 L 255 269 Q 255 265 259 265" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="630.0" y="291" text-anchor="middle" style="font-size:21px">
<tspan x="630.0" dy="0">外层业务事件</tspan>
</text>
<text x="241" y="393" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">子 Slice</tspan>
</text>
<path d="M 255 409 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 459 370 Q 625.0 370.7 791 370 Q 795 370 795 374 L 795 403 Q 795 407 791 407 Q 625.0 407.3 459 407 Q 455 407 455 403 L 455 374 Q 455 370 459 370" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="625.0" y="396" text-anchor="middle" style="font-size:21px">
<tspan x="625.0" dy="0">已包含在外层中</tspan>
</text>
</svg>
