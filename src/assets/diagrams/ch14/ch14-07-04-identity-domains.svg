<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">操作系统编号、实例、轨道与事件不能混用</title>
<desc id="desc">用 upid/utid 关联实例，用模型事件 ID 指认具体对象。 pid/tid 会复用；track_id 不是通用帧号或 Binder 事务号。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 79 50 Q 310.0 50.0 541 50 Q 545 50 545 54 L 545 196 Q 545 200 541 200 Q 310.0 199.3 79 200 Q 75 200 75 196 L 75 54 Q 75 50 79 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">pid / tid</tspan>
<tspan x="310.0" dy="34.0">操作系统可见编号，可复用</tspan>
</text>
<path d="M 659 50 Q 890.0 50.8 1121 50 Q 1125 50 1125 54 L 1125 196 Q 1125 200 1121 200 Q 890.0 200.2 659 200 Q 655 200 655 196 L 655 54 Q 655 50 659 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">upid / utid</tspan>
<tspan x="890.0" dy="34.0">同一 Trace 内的实例身份</tspan>
</text>
<path d="M 79 315 Q 310.0 315.7 541 315 Q 545 315 545 319 L 545 461 Q 545 465 541 465 Q 310.0 464.4 79 465 Q 75 465 75 461 L 75 319 Q 75 315 79 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">track_id</tspan>
<tspan x="310.0" dy="34.0">事件所在轨道</tspan>
</text>
<path d="M 659 315 Q 890.0 315.5 1121 315 Q 1125 315 1125 319 L 1125 461 Q 1125 465 1121 465 Q 890.0 464.5 659 465 Q 655 465 655 461 L 655 319 Q 655 315 659 315" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="890.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">slice / frame / Binder ID</tspan>
<tspan x="890.0" dy="34.0">按各自模型关系关联</tspan>
</text>
</svg>
