<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">线程状态按真实目标窗口裁剪</title>
<desc id="desc">同线程区间按边界计算交集，才能把成本限定在目标操作中。 轨道仅示范一个相交情形，不代表实测时长；D 状态的原因仍要另外取证。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="660" fill="white"/>
<path d="M 69 45 Q 215.0 45.5 361 45 Q 365 45 365 49 L 365 151 Q 365 155 361 155 Q 215.0 155.0 69 155 Q 65 155 65 151 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">目标 Slice</tspan>
<tspan x="215.0" dy="34.0">半开窗口 [S, E)</tspan>
</text>
<path d="M 454 45 Q 600.0 44.7 746 45 Q 750 45 750 49 L 750 151 Q 750 155 746 155 Q 600.0 154.6 454 155 Q 450 155 450 151 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">同 utid 状态区间</tspan>
<tspan x="600.0" dy="34.0">[st.ts, st.ts + dur)</tspan>
</text>
<path d="M 839 45 Q 985.0 45.0 1131 45 Q 1135 45 1135 49 L 1135 151 Q 1135 155 1131 155 Q 985.0 155.0 839 155 Q 835 155 835 151 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">只累计相交部分</tspan>
<tspan x="985.0" dy="34.0">裁掉窗口外区间</tspan>
</text>
<text x="600" y="615" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">交集 = min(结束时刻) − max(开始时刻)，仅统计正相交</tspan>
</text>
<text x="241" y="273" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">目标窗口</tspan>
</text>
<path d="M 255 289 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 489 250 Q 685.0 250.0 881 250 Q 885 250 885 254 L 885 283 Q 885 287 881 287 Q 685.0 286.7 489 287 Q 485 287 485 283 L 485 254 Q 485 250 489 250" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="685.0" y="276" text-anchor="middle" style="font-size:21px">
<tspan x="685.0" dy="0">[S, E)</tspan>
</text>
<text x="241" y="378" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">状态区间</tspan>
</text>
<path d="M 255 394 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 279 355 Q 675.0 354.3 1071 355 Q 1075 355 1075 359 L 1075 388 Q 1075 392 1071 392 Q 675.0 391.8 279 392 Q 275 392 275 388 L 275 359 Q 275 355 279 355" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="675.0" y="381" text-anchor="middle" style="font-size:21px">
<tspan x="675.0" dy="0">一个跨越目标窗口的状态区间</tspan>
</text>
<text x="241" y="483" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">交集</tspan>
</text>
<path d="M 255 499 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 489 460 Q 685.0 459.5 881 460 Q 885 460 885 464 L 885 493 Q 885 497 881 497 Q 685.0 497.8 489 497 Q 485 497 485 493 L 485 464 Q 485 460 489 460" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="685.0" y="486" text-anchor="middle" style="font-size:21px">
<tspan x="685.0" dy="0">只计入共同覆盖范围</tspan>
</text>
</svg>
