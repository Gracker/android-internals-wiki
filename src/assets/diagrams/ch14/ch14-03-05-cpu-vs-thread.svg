<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">同一调度事实的 CPU 与线程视角</title>
<desc id="desc">sched_slice 回答 CPU 由谁运行，thread_state 回答线程的状态与可用线索。 状态重建可能有缺口；dur = −1 不能作为负时长加入统计。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
