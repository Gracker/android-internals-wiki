<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">符号化与去混淆产物和原始 trace 一起交付</title>
<desc id="desc">traceconv bundle 读取原始 trace，收集匹配符号和映射后生成 TAR。 是否包含 symbols.pb/deobfuscation.pb 取决于收集结果；打包不证明所有符号已还原。 原始 Perfetto trace
保留可富化的采样数据 → 匹配符号与 R8 映射
按构建和包名配置；匹配符号与 R8 映射
按构建和包名配置 → traceconv bundle
生成 trace archive；traceconv bundle
生成 trace archive → TAR：trace.perfetto
成功时附符号 / 去混淆包</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
