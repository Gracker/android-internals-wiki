<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Data Source 路由到哪个 Central Buffer</title>
<desc id="desc">target_buffer 是 buffers 数组中从零开始的下标。 隔离高低频数据可减少相互覆盖，仍不扩大 ftrace 或 Producer SMB。 高频数据写入第0号central buffer；低频映射单独保留在第1号central buffer</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 312 195 L 312 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 306 320 L 312 330 L 318 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 887 195 L 887 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 881 320 L 887 330 L 893 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 79 55 Q 312.5 54.3 546 55 Q 550 55 550 59 L 550 191 Q 550 195 546 195 Q 312.5 195.8 79 195 Q 75 195 75 191 L 75 59 Q 75 55 79 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="312.5" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="312.5" dy="0">高频 ftrace 等数据源</tspan>
<tspan x="312.5" dy="34.0">选择 target_buffer = 0</tspan>
</text>
<path d="M 654 55 Q 887.5 55.4 1121 55 Q 1125 55 1125 59 L 1125 191 Q 1125 195 1121 195 Q 887.5 194.5 654 195 Q 650 195 650 191 L 650 59 Q 650 55 654 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="887.5" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="887.5" dy="0">低频进程映射等数据源</tspan>
<tspan x="887.5" dy="34.0">选择 target_buffer = 1</tspan>
</text>
<path d="M 79 330 Q 312.5 329.4 546 330 Q 550 330 550 334 L 550 466 Q 550 470 546 470 Q 312.5 470.6 79 470 Q 75 470 75 466 L 75 334 Q 75 330 79 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="312.5" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="312.5" dy="0">buffers[0]</tspan>
<tspan x="312.5" dy="34.0">独立容量与 fill policy</tspan>
</text>
<path d="M 654 330 Q 887.5 330.8 1121 330 Q 1125 330 1125 334 L 1125 466 Q 1125 470 1121 470 Q 887.5 469.8 654 470 Q 650 470 650 466 L 650 334 Q 650 330 654 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="887.5" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="887.5" dy="0">buffers[1]</tspan>
<tspan x="887.5" dy="34.0">独立容量与 fill policy</tspan>
</text>
<text x="600" y="565" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">这是分区示例；索引和容量必须匹配实际 TraceConfig</tspan>
</text>
</svg>
