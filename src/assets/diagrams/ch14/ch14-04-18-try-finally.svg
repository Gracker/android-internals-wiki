<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">同步 Trace 用 finally 保持线程内平衡</title>
<desc id="desc">进入区间后在 finally 中结束，异常也保留正确的嵌套关系。 名称短且稳定；固定版本按 UTF-16 单元检查 127 上限。 同线程 beginSection
短、稳定的阶段名称 → try 执行业务
可正常返回或抛异常；try 执行业务
可正常返回或抛异常 → finally 必须执行
调用 endSection；finally 必须执行
调用 endSection → 回到外层调用
保持同步区间严格嵌套</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 525 120.0 L 675 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 665 114.0 L 675 120.0 L 665 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 59.4 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 179.4 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">同线程 beginSection</tspan>
<tspan x="310.0" dy="34.0">短、稳定的阶段名称</tspan>
</text>
<path d="M 679 60 Q 890.0 60.3 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 180.6 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">try 执行业务</tspan>
<tspan x="890.0" dy="34.0">可正常返回或抛异常</tspan>
</text>
<path d="M 679 340 Q 890.0 339.7 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.4 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">finally 必须执行</tspan>
<tspan x="890.0" dy="34.0">调用 endSection</tspan>
</text>
<path d="M 99 340 Q 310.0 340.7 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 459.8 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">回到外层调用</tspan>
<tspan x="310.0" dy="34.0">保持同步区间严格嵌套</tspan>
</text>
</svg>
