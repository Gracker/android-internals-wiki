<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">R+ 内再次 waking 可把原区间分成两段</title>
<desc id="desc">该 tag 的 IsRunnable 只识别 R，R+ 内的 waking 会截断原行并打开 R。 这是经固定源码与主机合成输入复核的导入行为，不是内核强制规则。 抢占切出
原行打开 R+ → R+ 中又收到 waking
IsRunnable 未识别 R+；R+ 中又收到 waking
IsRunnable 未识别 R+ → 截断 R+ 并新开 R
附新 waker 线索；截断 R+ 并新开 R
附新 waker 线索 → 下一次 switch in
完整等待需回看两段</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 525 120.0 L 675 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 665 114.0 L 675 120.0 L 665 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 59.5 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 179.3 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">抢占切出</tspan>
<tspan x="310.0" dy="34.0">原行打开 R+</tspan>
</text>
<path d="M 679 60 Q 890.0 59.7 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.7 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">R+ 中又收到 waking</tspan>
<tspan x="890.0" dy="34.0">IsRunnable 未识别 R+</tspan>
</text>
<path d="M 679 340 Q 890.0 340.4 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.8 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">截断 R+ 并新开 R</tspan>
<tspan x="890.0" dy="34.0">附新 waker 线索</tspan>
</text>
<path d="M 99 340 Q 310.0 339.6 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 459.6 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">下一次 switch in</tspan>
<tspan x="310.0" dy="34.0">完整等待需回看两段</tspan>
</text>
</svg>
