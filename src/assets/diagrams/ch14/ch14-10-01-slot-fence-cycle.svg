<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">slot所有权循环与fence访问依赖</title>
<desc id="desc">slot在Producer、queued、Consumer与free状态间流转，fence约束读写安全。 非shared常规路径示意；slot可取与fence已signal是两件事，下游持有可形成背压。 生产者取得slot并遵守写入依赖后提交；消费者acquire并等待可读依赖；消费者不再需要该buffer后交还并传回依赖；归还slot后生产者重新检查并遵守复写依赖</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="650" fill="white"/>
<path d="M 495 125 L 705 125" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 695 119 L 705 125 L 695 131" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 920 190 L 920 370" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 914 360 L 920 370 L 926 360" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 705 435 L 495 435" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 505 429 L 495 435 L 505 441" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 280 370 L 280 190" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 274 200 L 280 190 L 286 200" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 280.0 59.8 491 60 Q 495 60 495 64 L 495 186 Q 495 190 491 190 Q 280.0 190.2 69 190 Q 65 190 65 186 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="280.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="280.0" dy="0">Producer dequeue</tspan>
<tspan x="280.0" dy="34.0">拿到slot与上次release fence</tspan>
</text>
<path d="M 709 60 Q 920.0 60.3 1131 60 Q 1135 60 1135 64 L 1135 186 Q 1135 190 1131 190 Q 920.0 189.4 709 190 Q 705 190 705 186 L 705 64 Q 705 60 709 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="920.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="920.0" dy="0">绘制后 queue</tspan>
<tspan x="920.0" dy="34.0">提交buffer与acquire fence</tspan>
</text>
<path d="M 709 370 Q 920.0 370.7 1131 370 Q 1135 370 1135 374 L 1135 496 Q 1135 500 1131 500 Q 920.0 500.2 709 500 Q 705 500 705 496 L 705 374 Q 705 370 709 370" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="920.0" y="426.5" text-anchor="middle" style="font-size:25px">
<tspan x="920.0" dy="0">Consumer acquire</tspan>
<tspan x="920.0" dy="34.0">读之前遵守acquire fence</tspan>
</text>
<path d="M 69 370 Q 280.0 369.3 491 370 Q 495 370 495 374 L 495 496 Q 495 500 491 500 Q 280.0 500.7 69 500 Q 65 500 65 496 L 65 374 Q 65 370 69 370" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="280.0" y="426.5" text-anchor="middle" style="font-size:25px">
<tspan x="280.0" dy="0">Consumer release</tspan>
<tspan x="280.0" dy="34.0">归还slot并传回release fence</tspan>
</text>
</svg>
