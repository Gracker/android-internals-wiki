<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Android 17 SurfaceFlinger 帧循环</title>
<desc id="desc">按 onFrameSignal、commit、composite 与输出阶段追踪同一轮工作。 composite 有条件执行；源码函数不保证都有同名 trace Slice。 Scheduler
onFrameSignal → compositor.commit
事务、layer 状态与准备；compositor.commit
事务、layer 状态与准备 → 满足合成条件
compositor.composite；满足合成条件
compositor.composite → CompositionEngine
Output::present；CompositionEngine
Output::present → presentFrameAndReleaseLayers
继续核对实际输出与同步</desc>
