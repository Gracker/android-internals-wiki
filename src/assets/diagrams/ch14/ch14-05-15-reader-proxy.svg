<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">EventHub</tspan>
<tspan x="310.0" dy="34.0">设备时间 + RawEvent.readTime</tspan>
</text>
<path d="M 679 60 Q 890.0 60.5 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.3 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">InputReader 处理</tspan>
<tspan x="890.0" dy="34.0">解释并生成 notifyMotion</tspan>
</text>
<path d="M 679 340 Q 890.0 340.1 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.2 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">TracedInputListener 包装</tspan>
<tspan x="890.0" dy="34.0">UnwantedInteractionBlocker</tspan>
</text>
<path d="M 99 340 Q 310.0 340.5 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 459.9 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">notifyMotion 下游</tspan>
<tspan x="310.0" dy="34.0">输入分发与帧候选</tspan>
</text>
<text x="600" y="565" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">跨挂起时 MONOTONIC 与 BOOTTIME 时长不同，分段不能混加</tspan>
</text>
