<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Reader 代理边界与真实设备读取分开</title>
<desc id="desc">read_time 取 TracedInputListener 包装 Slice 起点，属于 Reader 监听链路代理。 它不是 EventHub readTime；软件候选 present 也不是面板发光时刻。 EventHub
设备时间 + RawEvent.readTime → InputReader 处理
解释并生成 notifyMotion；InputReader 处理
解释并生成 notifyMotion → TracedInputListener 包装
UnwantedInteractionBlocker；TracedInputListener 包装
UnwantedInteractionBlocker → notifyMotion 下游
输入分发与帧候选</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
