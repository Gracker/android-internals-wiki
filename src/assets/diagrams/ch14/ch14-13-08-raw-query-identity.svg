<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">raw查询先保留身份，再解释时间字段</title>
<desc id="desc">从scope筛选目标候选，保留原始slice、track、layer、frame和时间。 名称模式可混入多实例；参数可能来自旧状态，先核验同次提交再求阶段差。 scope=graphics_frame_event
按layer片段找候选 → 保留frame_slice_id / track_id
原始ts、dur与track name；保留frame_slice_id / track_id
原始ts、dur与track name → 区分Raw / Phase及质量
开放尾、缺事件、span；区分Raw / Phase及质量
开放尾、缺事件、span → 限定实例与时间窗
再做端点与依赖核验</desc>
