<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">每帧频率驻留分两次交集</title>
<desc id="desc">先将 sched 与频率按 ucpu 求交，再把运行片段按 utid 裁进 doFrame。 两个输入阶段都必须互斥；帧或频率轨道异常时先停止或明确排除。 选 upid / doFrame ID
检查同 utid 帧区间 → sched × 频率
按 ucpu 求交；sched × 频率
按 ucpu 求交 → 运行频率片段 × doFrame
按 utid 再次求交；运行频率片段 × doFrame
按 utid 再次求交 → 每帧 × 核心 × 频点
累加输出交集 dur</desc>
