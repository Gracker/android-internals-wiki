<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">StateDescriptor 与事件名编码</title>
<desc id="desc">TYPE_STATE 事件通过轨道描述和事件名表达状态。 固定 v57.2/v58.2 实测：省略名可清空，显式空串会保留状态行。 TrackDescriptor
uuid + state descriptor → TrackEvent
TYPE_STATE = 5 + track_uuid；TrackEvent
TYPE_STATE = 5 + track_uuid → 实际状态值
name 或 interned name_iid；实际状态值
name 或 interned name_iid → 清空编码
省略事件名；核对 SDK 输出</desc>
