<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">锁竞争与帧按交集关联</title>
<desc id="desc">竞争区间可跨过 doFrame 边界，应计算交集并检查重叠覆盖。 同类竞争若重叠，简单相加会多算；需要时先合并区间。 doFrame 的 UI utid
确定回调区间 → 同 utid 的 monitor Slice
允许两端跨界；同 utid 的 monitor Slice
允许两端跨界 → 交集长度计入该帧
同类重叠先合并</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="690" fill="white"/>
