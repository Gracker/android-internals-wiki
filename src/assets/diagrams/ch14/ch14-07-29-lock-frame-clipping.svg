<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.6 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.7 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">doFrame 的 UI utid</tspan>
<tspan x="215.0" dy="34.0">确定回调区间</tspan>
</text>
<path d="M 454 60 Q 600.0 60.3 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.3 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">同 utid 的 monitor Slice</tspan>
<tspan x="600.0" dy="34.0">允许两端跨界</tspan>
</text>
<path d="M 839 60 Q 985.0 59.9 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.4 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">交集长度计入该帧</tspan>
<tspan x="985.0" dy="34.0">同类重叠先合并</tspan>
</text>
<text x="241" y="283" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">doFrame</tspan>
</text>
