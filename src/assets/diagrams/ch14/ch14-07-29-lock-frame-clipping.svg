<path d="M 489 260 Q 700.0 259.6 911 260 Q 915 260 915 264 L 915 293 Q 915 297 911 297 Q 700.0 297.0 489 297 Q 485 297 485 293 L 485 264 Q 485 260 489 260" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="700.0" y="286" text-anchor="middle" style="font-size:21px">
<tspan x="700.0" dy="0">UI 回调</tspan>
</text>
