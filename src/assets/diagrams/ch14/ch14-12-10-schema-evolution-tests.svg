<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">私有协议的四处演进要一起验收</title>
<desc id="desc">稳定字段、写入接口、importer与SQL测试必须同步维护。 应用仅增加proto不保证公开UI能解释；无法长期维护解析链路时优先标准TrackEvent。 </desc>
