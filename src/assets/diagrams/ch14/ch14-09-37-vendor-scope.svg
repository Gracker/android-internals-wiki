<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">通用内核与设备实现的证据层次</title>
<desc id="desc">通用内核说明框架，设备源码/sysfs/trace确认实际策略。 缺少目标设备证据时停留在通用机制，不能互推不同厂商。 固定通用内核
CPUFreq / EAS / CPUIdle机制 → 目标设备实现
频点表、EM、hook、thermal；目标设备实现
频点表、EM、hook、thermal → 现场 sysfs 与 trace
确认配置及实际响应；现场 sysfs 与 trace
确认配置及实际响应 → 同设备同版本实验
验证性能与能耗影响</desc>
