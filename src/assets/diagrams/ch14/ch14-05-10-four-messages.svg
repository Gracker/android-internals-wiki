<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">四个消息节点与往返分段</title>
<desc id="desc">dispatch、receive、finish、finish_ack 依次界定分发、处理与确认。 输入通道是 socket；ACK 段不能称为 Binder 往返。 分发段；处理段；ACK段</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="660" fill="white"/>
<path d="M 300 100 L 340 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 330 94 L 340 100 L 330 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 580 100 L 620 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 610 94 L 620 100 L 610 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 860 100 L 900 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890 94 L 900 100 L 890 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 64 45 Q 180.0 44.9 296 45 Q 300 45 300 49 L 300 151 Q 300 155 296 155 Q 180.0 154.4 64 155 Q 60 155 60 151 L 60 49 Q 60 45 64 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="180.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="180.0" dy="0">dispatch</tspan>
<tspan x="180.0" dy="34.0">系统发出事件</tspan>
</text>
<path d="M 344 45 Q 460.0 45.7 576 45 Q 580 45 580 49 L 580 151 Q 580 155 576 155 Q 460.0 154.7 344 155 Q 340 155 340 151 L 340 49 Q 340 45 344 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="460.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="460.0" dy="0">receive</tspan>
<tspan x="460.0" dy="34.0">应用收到事件</tspan>
</text>
<path d="M 624 45 Q 740.0 44.4 856 45 Q 860 45 860 49 L 860 151 Q 860 155 856 155 Q 740.0 154.9 624 155 Q 620 155 620 151 L 620 49 Q 620 45 624 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="740.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="740.0" dy="0">finish</tspan>
<tspan x="740.0" dy="34.0">应用发出确认</tspan>
</text>
<path d="M 904 45 Q 1020.0 44.9 1136 45 Q 1140 45 1140 49 L 1140 151 Q 1140 155 1136 155 Q 1020.0 155.1 904 155 Q 900 155 900 151 L 900 49 Q 900 45 904 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1020.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="1020.0" dy="0">finish_ack</tspan>
<tspan x="1020.0" dy="34.0">系统收到确认</tspan>
</text>
<text x="600" y="615" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">total = 三段之和；FINISHED 不保证画面已经显示</tspan>
</text>
<text x="241" y="278" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">分发</tspan>
</text>
<path d="M 255 294 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 259 255 Q 365.0 255.4 471 255 Q 475 255 475 259 L 475 288 Q 475 292 471 292 Q 365.0 292.1 259 292 Q 255 292 255 288 L 255 259 Q 255 255 259 255" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="365.0" y="281" text-anchor="middle" style="font-size:21px">
<tspan x="365.0" dy="0">receive − dispatch</tspan>
</text>
<text x="241" y="378" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">处理</tspan>
</text>
<path d="M 255 394 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 479 355 Q 650.0 354.3 821 355 Q 825 355 825 359 L 825 388 Q 825 392 821 392 Q 650.0 391.4 479 392 Q 475 392 475 388 L 475 359 Q 475 355 479 355" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="650.0" y="381" text-anchor="middle" style="font-size:21px">
<tspan x="650.0" dy="0">finish − receive</tspan>
</text>
<text x="241" y="478" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">确认</tspan>
</text>
<path d="M 255 494 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 829 455 Q 955.0 454.5 1081 455 Q 1085 455 1085 459 L 1085 488 Q 1085 492 1081 492 Q 955.0 491.3 829 492 Q 825 492 825 488 L 825 459 Q 825 455 829 455" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="955.0" y="481" text-anchor="middle" style="font-size:21px">
<tspan x="955.0" dy="0">finish_ack − finish</tspan>
</text>
</svg>
