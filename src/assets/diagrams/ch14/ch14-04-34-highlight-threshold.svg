<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">变化高亮按单位选择判断分支</title>
<desc id="desc">有效变化先按单位检查绝对与相对阈值，再决定界面高亮。 这是 UI 变化规则，不是统计显著性检验；NULL 和 unknown 分支需保留。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 600 180 L 600 255 L 215 255 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 255 L 985 255 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 59.2 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.6 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">有效数值且 assessment</tspan>
<tspan x="600.0" dy="34.0">不是 same / unknown</tspan>
</text>
<path d="M 69 340 Q 215.0 340.4 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.9 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="375.52000000000004" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">ms / fps / bytes / ns</tspan>
<tspan x="215.0" dy="32.64">同时达到绝对与相对阈值</tspan>
<tspan x="215.0" dy="32.64">相对未知则只看绝对</tspan>
</text>
<path d="M 454 340 Q 600.0 339.5 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.5 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="374.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">百分比 / count</tspan>
<tspan x="600.0" dy="34.0">达到绝对阈值</tspan>
<tspan x="600.0" dy="34.0">或相对幅度 ≥ 5%</tspan>
</text>
<path d="M 839 340 Q 985.0 339.9 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.6 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="985.0" y="374.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">无匹配绝对单位</tspan>
<tspan x="985.0" dy="34.0">有相对值：幅度 ≥ 5%</tspan>
<tspan x="985.0" dy="34.0">否则绝对变化 &gt; 1e-9</tspan>
</text>
<text x="600" y="565" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">相对阈值：变化幅度 5%；绝对阈值按正文列出的单位规则</tspan>
</text>
</svg>
