<tspan x="215.0" dy="0">前一闭合Running</tspan>
<tspan x="215.0" dy="34.0">CPU a</tspan>
</text>
<path d="M 454 60 Q 600.0 59.3 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.3 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">中间状态需另查</tspan>
<tspan x="600.0" dy="34.0">不能从空隙直接推定</tspan>
</text>
<path d="M 839 60 Q 985.0 59.3 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.5 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">首次新CPU闭合Running</tspan>
<tspan x="985.0" dy="34.0">CPU b，记录此ts</tspan>
</text>
<text x="600" y="720" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">两个频率行仍属于同一个新CPU调度段</tspan>
</text>
<text x="246" y="323" text-anchor="end" style="font-size:23px">
<tspan x="246" dy="0">同一目标utid</tspan>
</text>
