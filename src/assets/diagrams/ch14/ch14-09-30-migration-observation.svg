<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">迁核观测起点与两段间隙都有限制</title>
<desc id="desc">ts是首次观测到新CPU运行的起点，不是迁核决定的精确时刻。 两段间隙可含Runnable、Sleeping、开放段或缺口，不能直接当Runnable时长。 前一闭合Running
CPU a → 中间状态需另查
不能从空隙直接推定；中间状态需另查
不能从空隙直接推定 → 首次新CPU闭合Running
CPU b，记录此ts</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
