<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从FrameTimeline目标帧找到FrameTracer候选</title>
<desc id="desc">固定目标进程/Layer与窗口，再用transaction和present核对跨源候选。 框架名和时间接近不证明同一帧；独立Surface先确认覆盖和真正Producer。 选目标Actual id
upid / Layer / token / 窗口 → 查同Layer附近Raw与phase
保留buffer轨道和frame号；查同Layer附近Raw与phase
保留buffer轨道和frame号 → 核对transaction / BufferTX
对照present与同帧依赖；核对transaction / BufferTX
对照present与同帧依赖 → 输出匹配依据和缺口
不写token=frame number</desc>
