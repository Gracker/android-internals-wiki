<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">观察到 D</tspan>
<tspan x="600.0" dy="34.0">不可中断等待候选</tspan>
</text>
<path d="M 69 340 Q 215.0 340.6 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.4 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">块 I/O / 文件页 / Swap</tspan>
<tspan x="215.0" dy="34.0">核对请求与故障事件</tspan>
</text>
<path d="M 454 340 Q 600.0 339.6 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.9 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">回收 / 页迁移 / 压缩</tspan>
<tspan x="600.0" dy="34.0">核对内存压力与路径</tspan>
</text>
<path d="M 839 340 Q 985.0 339.5 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.9 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">驱动 / 内核同步</tspan>
<tspan x="985.0" dy="34.0">核对条件、持有者和唤醒</tspan>
</text>
