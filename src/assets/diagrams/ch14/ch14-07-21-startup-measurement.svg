<tspan x="890.0" dy="0">TTID：首次显示</tspan>
<tspan x="890.0" dy="34.0">关联首个有效显示帧</tspan>
</text>
<path d="M 99 340 Q 310.0 340.1 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 459.3 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">TTFD：完全显示</tspan>
<tspan x="310.0" dy="34.0">依赖 reportFullyDrawn 证据</tspan>
