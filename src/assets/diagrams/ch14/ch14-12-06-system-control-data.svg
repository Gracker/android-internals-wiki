<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">系统consumer控制会话，应用producer只贡献数据</title>
<desc id="desc">应用通过producer接口注册/写事件，授权consumer控制整机采集。 producer策略、关闭consumer实现与系统读取权限是不同条件；进程内session另有独立路径。 应用经producer socket连接系统service；具consumer权限的一方控制配置和生命周期；系统trace由授权consumer读取；配置选中的系统数据源汇入同一会话</desc>
