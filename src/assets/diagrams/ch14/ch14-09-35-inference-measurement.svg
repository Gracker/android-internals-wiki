<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">推理实验把性能、状态与计量放在一起</title>
<desc id="desc">同一实验记录CPU、GPU/DDR、thermal、TTFT/TPOT与可靠能耗。 设备不暴露GPU或DDR时，结论限定CPU侧；trace频率不能代替功耗仪。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 79 50 Q 310.0 49.3 541 50 Q 545 50 545 54 L 545 196 Q 545 200 541 200 Q 310.0 199.3 79 200 Q 75 200 75 196 L 75 54 Q 75 50 79 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">CPU侧</tspan>
<tspan x="310.0" dy="34.0">sched、cpufreq、线程身份与覆盖</tspan>
</text>
<path d="M 659 50 Q 890.0 49.5 1121 50 Q 1125 50 1125 54 L 1125 196 Q 1125 200 1121 200 Q 890.0 200.0 659 200 Q 655 200 655 196 L 655 54 Q 655 50 659 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">GPU / 内存侧</tspan>
<tspan x="890.0" dy="34.0">job、GPU频率、带宽或DDR频率</tspan>
</text>
<path d="M 79 315 Q 310.0 314.9 541 315 Q 545 315 545 319 L 545 461 Q 545 465 541 465 Q 310.0 465.2 79 465 Q 75 465 75 461 L 75 319 Q 75 315 79 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">约束与输出</tspan>
<tspan x="310.0" dy="34.0">thermal、TTFT、TPOT和阶段标记</tspan>
</text>
<path d="M 659 315 Q 890.0 314.6 1121 315 Q 1125 315 1125 319 L 1125 461 Q 1125 465 1121 465 Q 890.0 464.4 659 465 Q 655 465 655 461 L 655 319 Q 655 315 659 315" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="890.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">能源计量</tspan>
<tspan x="890.0" dy="34.0">同一实验中的可靠功耗 / 能耗</tspan>
</text>
</svg>
