<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">原始行、缺字段与零耗时分别判断</title>
<desc id="desc">先看采集覆盖、原始行数和候选字段，再决定可统计的样本集合。 字段非空不证明关联正确，空结果不能当作零延迟。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="600" fill="white"/>
<path d="M 79 55 Q 310.0 54.3 541 55 Q 545 55 545 59 L 545 201 Q 545 205 541 205 Q 310.0 204.8 79 205 Q 75 205 75 201 L 75 59 Q 75 55 79 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">原始行数</tspan>
<tspan x="310.0" dy="34.0">可能含帧附件放大</tspan>
</text>
<path d="M 659 55 Q 890.0 55.5 1121 55 Q 1125 55 1125 59 L 1125 201 Q 1125 205 1121 205 Q 890.0 205.3 659 205 Q 655 205 655 201 L 655 59 Q 655 55 659 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">条件字段计数</tspan>
<tspan x="890.0" dy="34.0">只表示候选可用性</tspan>
</text>
<path d="M 79 310 Q 310.0 309.5 541 310 Q 545 310 545 314 L 545 456 Q 545 460 541 460 Q 310.0 459.4 79 460 Q 75 460 75 456 L 75 314 Q 75 310 79 310" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="376.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">NULL 字段</tspan>
<tspan x="310.0" dy="34.0">缺记录、映射或关联</tspan>
</text>
<path d="M 659 310 Q 890.0 309.7 1121 310 Q 1125 310 1125 314 L 1125 456 Q 1125 460 1121 460 Q 890.0 460.4 659 460 Q 655 460 655 456 L 655 314 Q 655 310 659 310" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="890.0" y="376.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">空表 / 零计数</tspan>
<tspan x="890.0" dy="34.0">回查采集与业务场景</tspan>
</text>
</svg>
