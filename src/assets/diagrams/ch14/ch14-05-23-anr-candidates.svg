<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ANR 记录与进程、计时器候选</title>
<desc id="desc">ErrorId、subject 和最近计时器构成 ANR 候选，进程候选数单独输出。 PID-only 连接会受复用影响；平台默认值不是所有设备固定超时。 ErrorId + subject
识别输入类 ANR → 按 PID 找前序计时器
仍需验证属于本次 ANR；按 PID 找前序计时器
仍需验证属于本次 ANR → 仅按 PID 连接 process
可映射多个 upid；仅按 PID 连接 process
可映射多个 upid → 核心 ANR 去重
输出候选进程数与回退标记</desc>
