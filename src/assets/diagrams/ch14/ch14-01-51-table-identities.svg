<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从线程 Slice 关联到进程实例</title>
<desc id="desc">线程 Slice 可沿线程轨道、线程和进程表关联到进程实例。 这是本节线程 Slice 查询的链路；非线程轨道要用各自关联表，pid 与名称也不能替代 upid / utid。 slice
track_id 与区间 → thread_track
id → utid；thread_track
id → utid → thread
utid → upid；thread
utid → upid → process
upid 与进程信息</desc>
