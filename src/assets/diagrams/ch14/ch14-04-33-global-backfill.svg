<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">v1.3.0 默认回填是全局候选</title>
<desc id="desc">默认 SQL 未限制应用、Layer 和业务窗口，需验证后才可用于场景回归。 启动取全局最大 dur，帧统计可混入多进程、多 Layer 与 SF 行。 全局 android_startups
或所有正时长 Actual 行 → 默认回填 SQL
无目标应用 / 场景过滤；默认回填 SQL
无目标应用 / 场景过滤 → 只能先作为候选值
核对身份、窗口与帧口径；只能先作为候选值
核对身份、窗口与帧口径 → 正式 Skill / SQL
用 golden Trace 验证定义</desc>
