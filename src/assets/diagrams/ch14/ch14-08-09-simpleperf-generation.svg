<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Simpleperf 从设备采样到主机导入</title>
<desc id="desc">先记录 perf.data，再用 report-sample 导出 Simpleperf protobuf。 100 Hz 是示例选择；目标包、权限、符号路径与构建必须匹配。 app_profiler.py
在具备权限的设备录制 → perf.data + 构建产物
保存原始报告；perf.data + 构建产物
保存原始报告 → report-sample --protobuf
并显式 --show-callchain；report-sample --protobuf
并显式 --show-callchain → simpleperf.trace 导入
保留时间、utid 与调用树</desc>
