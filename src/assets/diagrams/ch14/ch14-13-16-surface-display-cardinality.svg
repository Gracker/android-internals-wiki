<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">同一App token可有多个Layer Actual</title>
<desc id="desc">应用Expected按upid/token共享，多个Layer Actual再连接DisplayFrame。 Actual不能按token去重；DisplayFrame的surface token为NULL，重复display token是正常多对一。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
