<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">同步标记在同一线程配对</title>
<desc id="desc">beginSection 和 endSection 在同一线程按嵌套顺序配对。 图示表达生命周期，条长非测量；App tag 未启用或窗口不覆盖时不会形成相应证据。 同线程 beginSection
稳定的操作名 → try 执行业务阶段
避免无意义高频事件；try 执行业务阶段
避免无意义高频事件 → finally endSection
异常也关闭最近区间</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="470" fill="white"/>
<path d="M 365 120.0 L 450 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.2 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 180.7 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">同线程 beginSection</tspan>
<tspan x="215.0" dy="34.0">稳定的操作名</tspan>
</text>
<path d="M 454 60 Q 600.0 59.8 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.5 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">try 执行业务阶段</tspan>
<tspan x="600.0" dy="34.0">避免无意义高频事件</tspan>
</text>
<path d="M 839 60 Q 985.0 60.6 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.3 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">finally endSection</tspan>
<tspan x="985.0" dy="34.0">异常也关闭最近区间</tspan>
</text>
<text x="600" y="425" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">同步区间不用于跨线程关联</tspan>
</text>
<text x="241" y="273" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">同一线程</tspan>
</text>
<path d="M 255 289 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 259 250 Q 645.0 249.5 1031 250 Q 1035 250 1035 254 L 1035 283 Q 1035 287 1031 287 Q 645.0 286.5 259 287 Q 255 287 255 283 L 255 254 Q 255 250 259 250" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="645.0" y="276" text-anchor="middle" style="font-size:21px">
<tspan x="645.0" dy="0">begin → 业务 → finally / end 的一个区间</tspan>
</text>
</svg>
