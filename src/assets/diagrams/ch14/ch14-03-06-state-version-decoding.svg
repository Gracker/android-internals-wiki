<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">状态字符随报告编码与输入格式解释</title>
<desc id="desc">先核对内核版本和输入格式，再解释特殊状态或复合字符串。 当前 6.18 报告掩码与旧布局不同，颜色也不是稳定语义。 原始输入
二进制报告或文本 → 内核版本 / 报告布局
缺版本可回退旧规则；内核版本 / 报告布局
缺版本可回退旧规则 → Perfetto 状态字符串
保留 state / end_state；Perfetto 状态字符串
保留 state / end_state → 对照当前产生路径
I 也不等于 CPU idle</desc>
