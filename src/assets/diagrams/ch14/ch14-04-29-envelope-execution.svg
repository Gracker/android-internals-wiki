<path d="M 600 180 L 600 255 L 985 255 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 59.9 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.1 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">meta.executionStatus</tspan>
<tspan x="600.0" dy="34.0">随数据跨产品面保存</tspan>
</text>
<path d="M 69 340 Q 215.0 339.9 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.3 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">observed</tspan>
<tspan x="215.0" dy="34.0">成功并得到数据</tspan>
</text>
<path d="M 454 340 Q 600.0 340.5 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.2 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
