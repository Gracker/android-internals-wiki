<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">先还原队列区间，再裁 ANR 窗口</title>
<desc id="desc">先从完整队列采样还原状态，再求与 ANR 窗口的正交集。 不能先删掉窗口前的采样；system_server 队列不能直接归给 ANR 进程。 先生成状态区间；再与候选ANR窗口求交</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="650" fill="white"/>
<path d="M 365 95 L 450 95" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 89 L 450 95 L 440 101" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 95 L 835 95" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 89 L 835 95 L 825 101" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 40 Q 215.0 39.8 361 40 Q 365 40 365 44 L 365 146 Q 365 150 361 150 Q 215.0 149.9 69 150 Q 65 150 65 146 L 65 44 Q 65 40 69 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">完整队列采样</tspan>
<tspan x="215.0" dy="34.0">保留窗口前最近状态</tspan>
</text>
<path d="M 454 40 Q 600.0 40.2 746 40 Q 750 40 750 44 L 750 146 Q 750 150 746 150 Q 600.0 150.1 454 150 Q 450 150 450 146 L 450 44 Q 450 40 454 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="86.84" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">还原正长度状态区间</tspan>
<tspan x="600.0" dy="32.64">保留 track / system_upid</tspan>
</text>
<path d="M 839 40 Q 985.0 39.5 1131 40 Q 1135 40 1135 44 L 1135 146 Q 1135 150 1131 150 Q 985.0 150.4 839 150 Q 835 150 835 146 L 835 44 Q 835 40 839 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">MAX(起点) / MIN(终点)</tspan>
<tspan x="985.0" dy="34.0">只保留正长度交集</tspan>
</text>
<text x="241" y="293" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">队列非零</tspan>
</text>
<path d="M 255 309 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 259 270 Q 580.0 270.6 901 270 Q 905 270 905 274 L 905 303 Q 905 307 901 307 Q 580.0 306.6 259 307 Q 255 307 255 303 L 255 274 Q 255 270 259 270" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="580.0" y="296" text-anchor="middle" style="font-size:21px">
<tspan x="580.0" dy="0">状态在窗口前已经开始</tspan>
</text>
<text x="241" y="403" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">ANR 窗口</tspan>
</text>
<path d="M 255 419 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 459 380 Q 715.0 380.7 971 380 Q 975 380 975 384 L 975 413 Q 975 417 971 417 Q 715.0 417.0 459 417 Q 455 417 455 413 L 455 384 Q 455 380 459 380" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="715.0" y="406" text-anchor="middle" style="font-size:21px">
<tspan x="715.0" dy="0">仅累计与上轨相交部分</tspan>
</text>
</svg>
