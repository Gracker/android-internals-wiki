<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">同一 ucpu 的频率区间</tspan>
<tspan x="310.0" dy="34.0">确认轨道与缺口</tspan>
</text>
