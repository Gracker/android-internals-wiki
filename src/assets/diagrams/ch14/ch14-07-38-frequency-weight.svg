<tspan x="890.0" dy="0">按有效时长归一化</tspan>
<tspan x="890.0" dy="34.0">同时报告 covered_s</tspan>
</text>
<path d="M 99 340 Q 310.0 340.6 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.2 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">结合运行、idle 与簇能力</tspan>
<tspan x="310.0" dy="34.0">不能单独估算能量</tspan>
