<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">pprof 按指标建立聚合树</title>
<desc id="desc">导入器把叶到根的 location_id 反转为根到叶，并按指标保留聚合值。 time_nanos、duration 或 period 元数据不能还原每个样本发生时刻。 sample_type
cpu / ns 或 alloc / bytes → location_id：叶 → 根
按格式读取路径；location_id：叶 → 根
按格式读取路径 → 反转为根 → 叶
建立调用树与符号；反转为根 → 叶
建立调用树与符号 → 每种指标保留聚合值
不生成逐样本时间线</desc>
