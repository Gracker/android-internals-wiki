<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">UI 宏逐条等待执行并传播异常</title>
<desc id="desc">折叠、固定和创建调试轨道按顺序执行，分组键保留实例身份。 固定 Android 17 的宏遇抛错或 rejected Promise 会中断；内部吞错另论。 Collapse
折叠现有轨道 → Pin
固定匹配 CPU 轨道；Pin
固定匹配 CPU 轨道 → 查询主线程 slice
分组键含 upid；查询主线程 slice
分组键含 upid → Pivot 调试轨道
同名进程仍分开</desc>
