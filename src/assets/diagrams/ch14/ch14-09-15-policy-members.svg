<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">related_cpus 与 affected_cpus 的集合范围</title>
<desc id="desc">related_cpus 包含关联的在线与离线 CPU，affected_cpus 是当前在线受影响成员。 设备不导出字段时记录缺失，不能推测补齐；命令仅做语法检查。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
