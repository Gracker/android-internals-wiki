<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">火焰图宽度表达聚合量，纵向表达调用深度</title>
<desc id="desc">合成示例中两条叶路径的计数为 37 与 63，上层累计为 100。 子块宽度按计数37:63绘制；横向不是时间轴，单位必须另行确认。 main 调用 render；render 下 layout 分支的合成计数37；render 下 draw 分支的合成计数63</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="690" fill="white"/>
<path d="M 600 160 L 600 230" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 220 L 600 230 L 606 220" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 330 L 600 380 L 316.5 380 L 316.5 430" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 310.5 420 L 316.5 430 L 322.5 420" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 330 L 600 380 L 766.5 380 L 766.5 430" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 760.5 420 L 766.5 430 L 772.5 420" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 154 60 Q 600.0 60.2 1046 60 Q 1050 60 1050 64 L 1050 156 Q 1050 160 1046 160 Q 600.0 160.2 154 160 Q 150 160 150 156 L 150 64 Q 150 60 154 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="118.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">main：cumulative 100 / self 0</tspan>
</text>
<path d="M 154 230 Q 600.0 230.6 1046 230 Q 1050 230 1050 234 L 1050 326 Q 1050 330 1046 330 Q 600.0 330.2 154 330 Q 150 330 150 326 L 150 234 Q 150 230 154 230" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="288.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">render：cumulative 100 / self 0</tspan>
</text>
<path d="M 154 430 Q 316.5 430.5 479 430 Q 483 430 483 434 L 483 546 Q 483 550 479 550 Q 316.5 549.5 154 550 Q 150 550 150 546 L 150 434 Q 150 430 154 430" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="316.5" y="481.5" text-anchor="middle" style="font-size:25px">
<tspan x="316.5" dy="0">layout</tspan>
<tspan x="316.5" dy="34.0">cumulative / self = 37</tspan>
</text>
<path d="M 487 430 Q 766.5 429.5 1046 430 Q 1050 430 1050 434 L 1050 546 Q 1050 550 1046 550 Q 766.5 550.2 487 550 Q 483 550 483 546 L 483 434 Q 483 430 487 430" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="766.5" y="481.5" text-anchor="middle" style="font-size:25px">
<tspan x="766.5" dy="0">draw</tspan>
<tspan x="766.5" dy="34.0">cumulative / self = 63</tspan>
</text>
<text x="600" y="650" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">main → render → 叶函数；这是合成计数，不是实测耗时</tspan>
</text>
</svg>
