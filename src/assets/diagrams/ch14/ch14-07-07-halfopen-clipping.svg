<tspan x="215.0" dy="34.0">保留原始纳秒</tspan>
</text>
<path d="M 454 60 Q 600.0 59.9 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.7 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">窗口 [w.start,w.end)</tspan>
