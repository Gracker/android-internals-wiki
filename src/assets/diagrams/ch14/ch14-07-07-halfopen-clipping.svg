<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">半开窗口按交集长度统计</title>
<desc id="desc">窗口裁剪使用最大起点和最小终点，只保留正交集。 首尾相接不贡献覆盖时间；图中位置仅作区间关系示意。 事件 [a.start,a.end)
保留原始纳秒 → 窗口 [w.start,w.end)
明确分析分母；窗口 [w.start,w.end)
明确分析分母 → 交集起点取 MAX
终点取 MIN，dur&gt;0</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
