<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">合成区间的端点与交集</title>
<desc id="desc">合成 SQL 中相交区间取较大起点和较小终点，首尾相接不输出正交集。 图上数值对应教程合成输入，不是设备性能时间。 A：[10,20)、[30,40)
B：[15,35)、[40,45) → 正交集：[15,20)
以及 [30,35)；正交集：[15,20)
以及 [30,35) → A 在40结束，B从40开始
只接触端点，不计覆盖</desc>
