<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">业务状态查询先消除进程实例与 Slice 歧义</title>
<desc id="desc">只有明确实例和业务区间后，状态分解才有可回查的对象。 同名进程多实例或无匹配时返回空结果；最长 doFrame 只是候选。 包名候选进程
示例要求恰好一个 upid → 选闭合业务 Slice
dur、ts、id 稳定排序；选闭合业务 Slice
dur、ts、id 稳定排序 → 保留 slice_id / utid
回查实际目标；保留 slice_id / utid
回查实际目标 → 将 ts、dur、utid
交给区间状态函数</desc>
