<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Running 外层可以包含中断处理</title>
<desc id="desc">没有 sched_switch 时，中断处理仍可落在当前任务外层 Running 内。 轨道仅表达嵌套关系，条长不代表实测或 CPU 比例。 中断进入不一定触发任务切换；中断返回后继续当前任务</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="620" fill="white"/>
<path d="M 365 100 L 450 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 94 L 450 100 L 440 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 100 L 835 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 94 L 835 100 L 825 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 45 Q 215.0 44.3 361 45 Q 365 45 365 49 L 365 151 Q 365 155 361 155 Q 215.0 155.1 69 155 Q 65 155 65 151 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="108.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">调度器当前任务</tspan>
</text>
<path d="M 454 45 Q 600.0 44.7 746 45 Q 750 45 750 49 L 750 151 Q 750 155 746 155 Q 600.0 155.0 454 155 Q 450 155 450 151 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">HardIRQ / SoftIRQ</tspan>
<tspan x="600.0" dy="34.0">可打断当前执行</tspan>
</text>
<path d="M 839 45 Q 985.0 45.2 1131 45 Q 1135 45 1135 49 L 1135 151 Q 1135 155 1131 155 Q 985.0 155.4 839 155 Q 835 155 835 151 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">回到原任务</tspan>
<tspan x="985.0" dy="34.0">可无 sched_switch</tspan>
</text>
<text x="600" y="575" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">Running 不是应用函数独占 CPU 的计时器</tspan>
</text>
<text x="241" y="283" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">线程调度</tspan>
</text>
<path d="M 255 299 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 259 260 Q 655.0 259.4 1051 260 Q 1055 260 1055 264 L 1055 293 Q 1055 297 1051 297 Q 655.0 297.5 259 297 Q 255 297 255 293 L 255 264 Q 255 260 259 260" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="655.0" y="286" text-anchor="middle" style="font-size:21px">
<tspan x="655.0" dy="0">Running 外层区间</tspan>
</text>
<text x="241" y="388" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">同 CPU 中断</tspan>
</text>
<path d="M 255 404 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 479 365 Q 595.0 365.8 711 365 Q 715 365 715 369 L 715 398 Q 715 402 711 402 Q 595.0 401.4 479 402 Q 475 402 475 398 L 475 369 Q 475 365 479 365" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="595.0" y="391" text-anchor="middle" style="font-size:21px">
<tspan x="595.0" dy="0">IRQ / SoftIRQ</tspan>
</text>
</svg>
