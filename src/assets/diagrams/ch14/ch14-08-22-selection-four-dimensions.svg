<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">选区分析同时固定四个维度</title>
<desc id="desc">时间、线程、场景和指标共同定义一张可比较的火焰图。 冷暖启动、缓存状态和不同单位混合后，排名可能失去问题指向。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 79 50 Q 310.0 49.8 541 50 Q 545 50 545 54 L 545 196 Q 545 200 541 200 Q 310.0 199.4 79 200 Q 75 200 75 196 L 75 54 Q 75 50 79 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">时间窗口</tspan>
<tspan x="310.0" dy="34.0">异常帧、启动或明确用户标记</tspan>
</text>
<path d="M 659 50 Q 890.0 49.5 1121 50 Q 1125 50 1125 54 L 1125 196 Q 1125 200 1121 200 Q 890.0 200.3 659 200 Q 655 200 655 196 L 655 54 Q 655 50 659 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">进程 / 线程实例</tspan>
<tspan x="890.0" dy="34.0">实际 upid / utid</tspan>
</text>
<path d="M 79 315 Q 310.0 315.4 541 315 Q 545 315 545 319 L 545 461 Q 545 465 541 465 Q 310.0 465.6 79 465 Q 75 465 75 461 L 75 319 Q 75 315 79 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">场景条件</tspan>
<tspan x="310.0" dy="34.0">冷暖启动、首帧 / 滚动、缓存</tspan>
</text>
<path d="M 659 315 Q 890.0 314.7 1121 315 Q 1125 315 1125 319 L 1125 461 Q 1125 465 1121 465 Q 890.0 464.6 659 465 Q 655 465 655 461 L 655 319 Q 655 315 659 315" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="890.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">度量与单位</tspan>
<tspan x="890.0" dy="34.0">样本数、CPU时间、字节等</tspan>
</text>
</svg>
