<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 60.2 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 180.6 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">发现候选 SurfaceFrame</tspan>
<tspan x="310.0" dy="34.0">保留Actual ID与原始jank</tspan>
