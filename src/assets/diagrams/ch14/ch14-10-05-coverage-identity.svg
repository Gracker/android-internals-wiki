<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">FrameTimeline覆盖不足时沿真实队列补证</title>
<desc id="desc">宿主FrameTimeline与外部内容帧分开，缺App Actual时继续查Producer/Layer/fence。 固定文档标注SurfaceView未完整支持，不能据此推定所有版本、厂商或无更新。 发现候选 SurfaceFrame
保留Actual ID与原始jank → 固定实例、Layer和track
再配BLAST与buffer/frame；固定实例、Layer和track
再配BLAST与buffer/frame → 检查实际FrameTimeline覆盖
宿主不替代独立内容；检查实际FrameTimeline覆盖
宿主不替代独立内容 → 缺失时沿真实队列与fence
恢复latch/present/release联系</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
