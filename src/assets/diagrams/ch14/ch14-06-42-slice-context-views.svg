<tspan x="985.0" dy="0">统一上下文视图</tspan>
<tspan x="985.0" dy="34.0">thread_or_process_slice</tspan>
</text>
<path d="M 69 340 Q 215.0 340.3 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.9 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">utid / tid / upid</tspan>
<tspan x="215.0" dy="34.0">定位实际执行线程</tspan>
</text>
<path d="M 454 340 Q 600.0 339.5 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.8 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
