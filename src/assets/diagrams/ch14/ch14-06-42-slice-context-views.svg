<tspan x="215.0" dy="0">线程同步区间</tspan>
<tspan x="215.0" dy="34.0">thread_slice</tspan>
</text>
<path d="M 454 60 Q 600.0 60.1 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.8 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">进程异步区间</tspan>
<tspan x="600.0" dy="34.0">process_slice</tspan>
</text>
<path d="M 839 60 Q 985.0 60.4 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.2 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
