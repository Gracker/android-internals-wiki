<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">异步任务跨度与线程内同步阶段</title>
<desc id="desc">整项协程使用异步区间，确定不挂起的 DAO 和映射阶段各在线程内标记。 示例 DAO 明确为同步方法；实际 suspend DAO 不能套同线程同步包装。 在该线程内执行同步阶段；在该线程内执行同步阶段</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="710" fill="white"/>
<path d="M 600 145 L 600 220 L 310 220 L 310 285" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 275 L 310 285 L 316 275" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 145 L 600 220 L 890 220 L 890 285" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 275 L 890 285 L 896 275" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 35 Q 600.0 34.4 811 35 Q 815 35 815 39 L 815 141 Q 815 145 811 145 Q 600.0 144.7 389 145 Q 385 145 385 141 L 385 39 Q 385 35 389 35" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="81.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Feed.load 异步任务</tspan>
<tspan x="600.0" dy="34.0">包含排队、等待与换线程</tspan>
</text>
<path d="M 79 285 Q 310.0 284.7 541 285 Q 545 285 545 289 L 545 401 Q 545 405 541 405 Q 310.0 405.0 79 405 Q 75 405 75 401 L 75 289 Q 75 285 79 285" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="336.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">IO worker：Feed.queryDb</tspan>
<tspan x="310.0" dy="34.0">同步 DAO，不跨挂起点</tspan>
</text>
<path d="M 659 285 Q 890.0 285.7 1121 285 Q 1125 285 1125 289 L 1125 401 Q 1125 405 1121 405 Q 890.0 404.4 659 405 Q 655 405 655 401 L 655 289 Q 655 285 659 285" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="336.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">Default worker：mapModels</tspan>
<tspan x="890.0" dy="34.0">纯同步映射区间</tspan>
</text>
<text x="241" y="533" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">逻辑任务跨度</tspan>
</text>
<path d="M 255 549 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 279 510 Q 655.0 510.8 1031 510 Q 1035 510 1035 514 L 1035 543 Q 1035 547 1031 547 Q 655.0 546.8 279 547 Q 275 547 275 543 L 275 514 Q 275 510 279 510" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="655.0" y="536" text-anchor="middle" style="font-size:21px">
<tspan x="655.0" dy="0">async：还包括阶段之间的非执行时间</tspan>
</text>
</svg>
