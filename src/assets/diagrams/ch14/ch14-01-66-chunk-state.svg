<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">共享内存 Chunk 的状态交接</title>
<desc id="desc">Producer 写入与 service 读取按 ABI 状态交接，完成后复用空间。 这是常规共享内存路径；传输仿真模式可跳过 BeingRead，数值顺序不代表状态流转顺序。 Free
Producer 可取得 chunk → BeingWritten
Producer 序列化写入；BeingWritten
Producer 序列化写入 → Complete
提交完成，service 可取得；Complete
提交完成，service 可取得 → BeingRead
service 正在复制读取；service完成读取后释放，回到Free状态</desc>
