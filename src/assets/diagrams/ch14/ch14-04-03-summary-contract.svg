<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从进程区间到统一 TraceSummary</title>
<desc id="desc">标准库区间经实例分组与指标规格，输出带维度和单位的结果。 upid 只在当前 Trace 内有效；示例没有限定特定业务窗口。 Trace + 内存模块
得到 ts / dur / 字节值 → 按 upid + 名称分组
保留同名进程实例；按 upid + 名称分组
保留同名进程实例 → 指标规格与加权计算
声明维度、值列与 BYTES；指标规格与加权计算
声明维度、值列与 BYTES → TraceSummary
bundle / specs / rows</desc>
