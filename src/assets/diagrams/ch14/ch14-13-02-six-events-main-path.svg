<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">六类emit回到提交、读取与显示依赖</title>
<desc id="desc">DEQUEUE与QUEUE记录提交上下文，acquire、latch、可选CLIENT和present各有独立含义。 这是公共路径示意；acquire signal可晚于latch，release路径不属于六类emit。 Producer持有并提交
DEQUEUE / QUEUE → SF采纳目标buffer
LATCH，未必已signal；SF采纳目标buffer
LATCH，未必已signal → 真正读取遵守acquire
ACQUIRE_FENCE记signal；真正读取遵守acquire
ACQUIRE_FENCE记signal → 可选CLIENT路径
FALLBACK_COMPOSITION；可选CLIENT路径
FALLBACK_COMPOSITION → 显示栈present反馈
PRESENT_FENCE</desc>
