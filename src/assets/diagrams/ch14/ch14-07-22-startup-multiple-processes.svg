<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">一次启动可能映射多个进程实例</title>
<desc id="desc">startup_id 是启动身份，进程映射和最终显示匹配实例要分别保存。 多个进程行会重复同一组 TTID/TTFD，不能直接按结果行累加启动次数。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
