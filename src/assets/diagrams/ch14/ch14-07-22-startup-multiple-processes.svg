<tspan x="600.0" dy="34.0">保留平台启动分类</tspan>
</text>
<path d="M 69 340 Q 215.0 339.4 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.7 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
