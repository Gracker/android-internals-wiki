<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">逐帧覆盖不能直接相加为全局总量</title>
<desc id="desc">UI与RenderThread分别选utid；重叠模型窗口可能覆盖同一Running。 改RenderThread要同时改两个CTE；GPU、SF与显示仍走各自证据链。 模型窗口A
同一目标线程 → 模型窗口B
可能与A重叠；模型窗口B
可能与A重叠 → 逐帧分别统计
不能直接相加当总量</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="760" fill="white"/>
<path d="M 365 120.0 L 450 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.8 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 180.4 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">模型窗口A</tspan>
<tspan x="215.0" dy="34.0">同一目标线程</tspan>
</text>
<path d="M 454 60 Q 600.0 59.9 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.6 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">模型窗口B</tspan>
<tspan x="600.0" dy="34.0">可能与A重叠</tspan>
</text>
<path d="M 839 60 Q 985.0 60.0 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.3 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">逐帧分别统计</tspan>
<tspan x="985.0" dy="34.0">不能直接相加当总量</tspan>
</text>
<text x="600" y="720" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">需全局总量时先处理窗口并集，不能重复计数</tspan>
</text>
<text x="246" y="323" text-anchor="end" style="font-size:23px">
<tspan x="246" dy="0">模型帧A</tspan>
</text>
<path d="M 260 339 H 1100" stroke="#777777" stroke-width="1.5"/>
<path d="M 364 300 Q 580.0 299.9 796 300 Q 800 300 800 304 L 800 333 Q 800 337 796 337 Q 580.0 336.8 364 337 Q 360 337 360 333 L 360 304 Q 360 300 364 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="580.0" y="326" text-anchor="middle" style="font-size:21px">
<tspan x="580.0" dy="0">窗口A</tspan>
</text>
<text x="246" y="423" text-anchor="end" style="font-size:23px">
<tspan x="246" dy="0">模型帧B</tspan>
</text>
<path d="M 260 439 H 1100" stroke="#777777" stroke-width="1.5"/>
<path d="M 644 400 Q 840.0 399.7 1036 400 Q 1040 400 1040 404 L 1040 433 Q 1040 437 1036 437 Q 840.0 436.9 644 437 Q 640 437 640 433 L 640 404 Q 640 400 644 400" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="840.0" y="426" text-anchor="middle" style="font-size:21px">
<tspan x="840.0" dy="0">窗口B</tspan>
</text>
<text x="246" y="523" text-anchor="end" style="font-size:23px">
<tspan x="246" dy="0">同一Running</tspan>
</text>
<path d="M 260 539 H 1100" stroke="#777777" stroke-width="1.5"/>
<path d="M 684 500 Q 725.0 500.0 766 500 Q 770 500 770 504 L 770 533 Q 770 537 766 537 Q 725.0 536.2 684 537 Q 680 537 680 533 L 680 504 Q 680 500 684 500" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="725.0" y="526" text-anchor="middle" style="font-size:21px">
<tspan x="725.0" dy="0">运行</tspan>
</text>
</svg>
