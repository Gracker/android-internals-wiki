<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">ANR 记录、超时到期与查询窗口</title>
<desc id="desc">到期候选等于 ErrorId 记录时刻减 timer_delay，窗口向前展开超时长度。 estimated_timer 只标缺字段回退；0 也不证明计时器归属正确。 扣除记录延后；向前展开查询范围</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="600" fill="white"/>
<path d="M 365 95 L 450 95" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 89 L 450 95 L 440 101" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 95 L 835 95" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 89 L 835 95 L 825 101" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 40 Q 215.0 40.6 361 40 Q 365 40 365 44 L 365 146 Q 365 150 361 150 Q 215.0 149.5 69 150 Q 65 150 65 146 L 65 44 Q 65 40 69 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">ErrorId 记录 ts</tspan>
<tspan x="215.0" dy="34.0">可能晚于到期</tspan>
</text>
<path d="M 454 40 Q 600.0 39.2 746 40 Q 750 40 750 44 L 750 146 Q 750 150 746 150 Q 600.0 150.0 454 150 Q 450 150 450 146 L 450 44 Q 450 40 454 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">到期 = ts − timer_delay</tspan>
<tspan x="600.0" dy="34.0">缺值时使用估算回退</tspan>
</text>
<path d="M 839 40 Q 985.0 40.3 1131 40 Q 1135 40 1135 44 L 1135 146 Q 1135 150 1131 150 Q 985.0 149.9 839 150 Q 835 150 835 146 L 835 44 Q 835 40 839 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">窗口起点 = 到期 − 超时</tspan>
<tspan x="985.0" dy="34.0">不是已证实阻塞起点</tspan>
</text>
<text x="241" y="323" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">超时窗口示意</tspan>
</text>
<path d="M 255 339 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 289 300 Q 570.0 299.8 851 300 Q 855 300 855 304 L 855 333 Q 855 337 851 337 Q 570.0 337.5 289 337 Q 285 337 285 333 L 285 304 Q 285 300 289 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="570.0" y="326" text-anchor="middle" style="font-size:21px">
<tspan x="570.0" dy="0">[窗口起点, 到期)</tspan>
</text>
<path d="M 859 300 Q 945.0 299.5 1031 300 Q 1035 300 1035 304 L 1035 333 Q 1035 337 1031 337 Q 945.0 337.0 859 337 Q 855 337 855 333 L 855 304 Q 855 300 859 300" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="945.0" y="326" text-anchor="middle" style="font-size:21px">
<tspan x="945.0" dy="0">记录延后</tspan>
</text>
</svg>
