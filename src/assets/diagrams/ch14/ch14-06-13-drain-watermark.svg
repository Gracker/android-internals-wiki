<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">定时读取与水位轮询的配合</title>
<desc id="desc">显式活跃请求参与最短周期选择，未请求时按水位轮询覆盖决定默认周期。 100 / 1000 ms 是控制器默认分支，实际唤醒与读完时刻不由它独立保证。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
