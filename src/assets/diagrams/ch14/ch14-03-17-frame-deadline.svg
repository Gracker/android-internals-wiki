<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">doFrame 的 CPU 时间与整帧截止时间</title>
<desc id="desc">帧是否超时由对应 FrameTimeline 窗口判断，线程状态用于解释其中一段。 16.67 / 8.33 ms 是名义周期，不能直接作单个 doFrame Running 的通用阈值。 Expected / Actual 帧
对应进程、Layer 和 token → 截止与分类
overrun / jank / present；截止与分类
overrun / jank / present → 线程窗口
Running、R、S 等；线程窗口
Running、R、S 等 → 其他关键依赖
RT / GPU / SF / fence</desc>
