<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Java Trace 每次调用的 backend 选择</title>
<desc id="desc">支持的单个 category 按 ATrace、SDK 启用状态及偏好位选择一条写入路径。 同一次调用最多写一个 backend；注册、属性缓存与设备传输需另外验证。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 79 50 Q 310.0 49.5 541 50 Q 545 50 545 54 L 545 196 Q 545 200 541 200 Q 310.0 200.8 79 200 Q 75 200 75 196 L 75 54 Q 75 50 79 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">ATrace 关 / SDK 关</tspan>
<tspan x="310.0" dy="34.0">不产生事件</tspan>
</text>
<path d="M 659 50 Q 890.0 50.3 1121 50 Q 1125 50 1125 54 L 1125 196 Q 1125 200 1121 200 Q 890.0 200.4 659 200 Q 655 200 655 196 L 655 54 Q 655 50 659 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">ATrace 开 / SDK 关</tspan>
<tspan x="890.0" dy="34.0">写 libcutils atrace</tspan>
</text>
<path d="M 79 315 Q 310.0 314.9 541 315 Q 545 315 545 319 L 545 461 Q 545 465 541 465 Q 310.0 465.6 79 465 Q 75 465 75 461 L 75 319 Q 75 315 79 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">ATrace 关 / SDK 开</tspan>
<tspan x="310.0" dy="34.0">写 Perfetto TrackEvent</tspan>
</text>
<path d="M 659 315 Q 890.0 315.4 1121 315 Q 1125 315 1125 319 L 1125 461 Q 1125 465 1121 465 Q 890.0 464.5 659 465 Q 655 465 655 461 L 655 319 Q 655 315 659 315" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="890.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">ATrace 开 / SDK 开</tspan>
<tspan x="890.0" dy="34.0">偏好位选 SDK，否则用 atrace</tspan>
</text>
</svg>
