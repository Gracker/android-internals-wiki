<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">私有packet可保留原始字节，但SQL需要解析链路</title>
<desc id="desc">私有数据源从编码到SQL必须有对应schema、importer和表。 未知字段保留在原始文件，不会自动成为业务SQL行；没有错误日志也不足以证明导入成功。 应用私有schema
稳定字段编号与单位 → 生成pbzero写入接口
编码TracePacket；生成pbzero写入接口
编码TracePacket → Trace Processor importer
解析并写入storage；Trace Processor importer
解析并写入storage → 业务SQL与回归样本
核对未知枚举和输出</desc>
