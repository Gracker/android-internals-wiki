<text x="310.0" y="121.84" text-anchor="middle" style="font-size:24px">
<tspan x="310.0" dy="0">应用侧原因</tspan>
<tspan x="310.0" dy="32.64">AppDeadline / AppResynced / Unknown</tspan>
</text>
