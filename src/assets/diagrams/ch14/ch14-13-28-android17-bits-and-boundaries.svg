<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Android17原始bit、标签与严重度分别保存</title>
<desc id="desc">17新增bit与non-jank mask描述不同状态，统计时保留原始类型、工具标签和幅度。 stuffing等可描述高延迟而不增加severity；experimental字段不用于正式jank指标，标签组合有优先级。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
