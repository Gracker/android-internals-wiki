</text>
<path d="M 659 325 Q 890.0 324.4 1121 325 Q 1125 325 1125 329 L 1125 481 Q 1125 485 1121 485 Q 890.0 485.6 659 485 Q 655 485 655 481 L 655 329 Q 655 325 659 325" fill="white" stroke="#E8913A" stroke-width="3"/>
