</text>
<path d="M 79 325 Q 310.0 325.3 541 325 Q 545 325 545 329 L 545 481 Q 545 485 541 485 Q 310.0 485.6 79 485 Q 75 485 75 481 L 75 329 Q 75 325 79 325" fill="white" stroke="#4A90D9" stroke-width="3"/>
