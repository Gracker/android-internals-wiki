<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Binder 两端分别与调度状态求交</title>
<desc id="desc">客户端和服务端各自的事务区间需要关联各自线程状态。 客户端睡眠可能是正常等待回复；服务端 Runnable 才是服务线程排队线索。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
