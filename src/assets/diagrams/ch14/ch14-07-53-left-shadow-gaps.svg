<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">SPAN_LEFT_JOIN 保留左侧无覆盖区间</title>
<desc id="desc">左连接把左区间按右侧覆盖切开，未覆盖部分的右侧业务列为 NULL。 影子时间段是算子补出的占位，不能当作采集到的右侧事件。 左侧：[10,30)
右侧：[15,20) → 交集段带右侧业务列
两侧空档保留为 NULL；交集段带右侧业务列
两侧空档保留为 NULL → 输出三段并保留左身份
输入互斥条件仍然适用</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
