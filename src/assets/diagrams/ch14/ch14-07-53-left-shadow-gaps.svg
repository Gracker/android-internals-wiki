<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">左侧：[10,30)</tspan>
<tspan x="215.0" dy="34.0">右侧：[15,20)</tspan>
</text>
<path d="M 454 60 Q 600.0 59.5 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.4 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">交集段带右侧业务列</tspan>
<tspan x="600.0" dy="34.0">两侧空档保留为 NULL</tspan>
</text>
<path d="M 839 60 Q 985.0 60.5 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.1 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">输出三段并保留左身份</tspan>
<tspan x="985.0" dy="34.0">输入互斥条件仍然适用</tspan>
</text>
<text x="241" y="283" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">左侧</tspan>
</text>
