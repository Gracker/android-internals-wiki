<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">完整后代与第一层子 Slice 的区别</title>
<desc id="desc">从选定 doFrame 遍历完整子树，按时间、深度和 ID 展开。 未闭合 dur=-1 保留 unclosed 状态，时长显示 NULL。 父到子；父到子；继续递归后代</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="700" fill="white"/>
<path d="M 600 140 L 600 205 L 305 205 L 305 260" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 299 250 L 305 260 L 311 250" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 140 L 600 205 L 895 205 L 895 260" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 889 250 L 895 260 L 901 250" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 305 360 L 305 470" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 299 460 L 305 470 L 311 460" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 40 Q 600.0 39.5 811 40 Q 815 40 815 44 L 815 136 Q 815 140 811 140 Q 600.0 139.5 389 140 Q 385 140 385 136 L 385 44 Q 385 40 389 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="81.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">选定 upid + frame_id</tspan>
<tspan x="600.0" dy="34.0">doFrame Slice</tspan>
</text>
<path d="M 84 260 Q 305.0 260.2 526 260 Q 530 260 530 264 L 530 356 Q 530 360 526 360 Q 305.0 360.2 84 360 Q 80 360 80 356 L 80 264 Q 80 260 84 260" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="305.0" y="301.5" text-anchor="middle" style="font-size:25px">
<tspan x="305.0" dy="0">第一层子 Slice</tspan>
<tspan x="305.0" dy="34.0">parent_id = do_frame_id</tspan>
</text>
<path d="M 674 260 Q 895.0 259.4 1116 260 Q 1120 260 1120 264 L 1120 356 Q 1120 360 1116 360 Q 895.0 360.2 674 360 Q 670 360 670 356 L 670 264 Q 670 260 674 260" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="895.0" y="301.5" text-anchor="middle" style="font-size:25px">
<tspan x="895.0" dy="0">其他第一层子 Slice</tspan>
<tspan x="895.0" dy="34.0">动画 / 遍历等</tspan>
</text>
<path d="M 84 470 Q 305.0 469.6 526 470 Q 530 470 530 474 L 530 566 Q 530 570 526 570 Q 305.0 570.7 84 570 Q 80 570 80 566 L 80 474 Q 80 470 84 470" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="305.0" y="511.5" text-anchor="middle" style="font-size:25px">
<tspan x="305.0" dy="0">更深后代 Slice</tspan>
<tspan x="305.0" dy="34.0">第一层等值 JOIN 会漏掉</tspan>
</text>
</svg>
