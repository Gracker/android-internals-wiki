<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">固定版本轮询读取 scaling_cur_freq</title>
<desc id="desc">区分文档所写的路径、实际实现和硬件反馈能力。 读取失败、空值或解析失败可填0；0先按缺失或无效候选处理。 文档 / proto 注释
写 cpuinfo_cur_freq → 同版本实现 ReadCpuCurrFreq
实际读 scaling_cur_freq；同版本实现 ReadCpuCurrFreq
实际读 scaling_cur_freq → 多数表示 driver 请求状态
不能等同瞬时硬件时钟；多数表示 driver 请求状态
不能等同瞬时硬件时钟 → 硬件反馈另核对
cpuinfo_cur/avg 或计数器</desc>
