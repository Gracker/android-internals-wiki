<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">ksoftirqd 的调度时间可包住 SoftIRQ Slice</title>
<desc id="desc">ksoftirqd 是可调度线程，其内部 SoftIRQ 事件可能已包含在外层 Running 中。 同一份执行不能按 Running 与内部 SoftIRQ 两次累加；条长仅作机制示意。 可调度线程内执行softirq处理；相同执行在不同表有不同视图</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="620" fill="white"/>
<path d="M 365 100 L 450 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 94 L 450 100 L 440 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 100 L 835 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 94 L 835 100 L 825 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 45 Q 215.0 44.4 361 45 Q 365 45 365 49 L 365 151 Q 365 155 361 155 Q 215.0 155.6 69 155 Q 65 155 65 151 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">ksoftirqd/&lt;cpu&gt;</tspan>
<tspan x="215.0" dy="34.0">实际调度在 CPU 上</tspan>
</text>
<path d="M 454 45 Q 600.0 44.6 746 45 Q 750 45 750 49 L 750 151 Q 750 155 746 155 Q 600.0 155.3 454 155 Q 450 155 450 151 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">内部 SoftIRQ Slice</tspan>
<tspan x="600.0" dy="34.0">同 CPU 执行</tspan>
</text>
<path d="M 839 45 Q 985.0 44.8 1131 45 Q 1135 45 1135 49 L 1135 151 Q 1135 155 1131 155 Q 985.0 155.3 839 155 Q 835 155 835 151 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">按明确口径统计</tspan>
<tspan x="985.0" dy="34.0">先核对包含与重叠</tspan>
</text>
<text x="241" y="283" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">调度外层</tspan>
</text>
<path d="M 255 299 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 259 260 Q 655.0 260.1 1051 260 Q 1055 260 1055 264 L 1055 293 Q 1055 297 1051 297 Q 655.0 297.3 259 297 Q 255 297 255 293 L 255 264 Q 255 260 259 260" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="655.0" y="286" text-anchor="middle" style="font-size:21px">
<tspan x="655.0" dy="0">ksoftirqd Running</tspan>
</text>
<text x="241" y="388" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">事件内层</tspan>
</text>
<path d="M 255 404 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 479 365 Q 650.0 365.4 821 365 Q 825 365 825 369 L 825 398 Q 825 402 821 402 Q 650.0 401.7 479 402 Q 475 402 475 398 L 475 369 Q 475 365 479 365" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="650.0" y="391" text-anchor="middle" style="font-size:21px">
<tspan x="650.0" dy="0">SoftIRQ Slice</tspan>
</text>
</svg>
