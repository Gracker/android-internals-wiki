<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">结果频率要与放置、约束和效率交叉核对</title>
<desc id="desc">先定位任务放置，再核对利用率约束、policy、热约束和执行效率。 频率曲线本身不能唯一反推出EAS、uclamp或thermal根因。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 79 50 Q 310.0 50.6 541 50 Q 545 50 545 54 L 545 196 Q 545 200 541 200 Q 310.0 199.4 79 200 Q 75 200 75 196 L 75 54 Q 75 50 79 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">任务放置</tspan>
<tspan x="310.0" dy="34.0">ucpu、capacity、迁核、同核竞争</tspan>
</text>
<path d="M 659 50 Q 890.0 49.9 1121 50 Q 1125 50 1125 54 L 1125 196 Q 1125 200 1121 200 Q 890.0 200.5 659 200 Q 655 200 655 196 L 655 54 Q 655 50 659 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">调频输入与policy</tspan>
<tspan x="890.0" dy="34.0">uclamp、hint、governor、min/max</tspan>
</text>
<path d="M 79 315 Q 310.0 315.7 541 315 Q 545 315 545 319 L 545 461 Q 545 465 541 465 Q 310.0 465.2 79 465 Q 75 465 75 461 L 75 319 Q 75 315 79 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">设备约束</tspan>
<tspan x="310.0" dy="34.0">thermal、节电、PowerHAL、持续负载</tspan>
</text>
<path d="M 659 315 Q 890.0 314.3 1121 315 Q 1125 315 1125 319 L 1125 461 Q 1125 465 1121 465 Q 890.0 465.5 659 465 Q 655 465 655 461 L 655 319 Q 655 315 659 315" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="890.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">执行效率</tspan>
<tspan x="890.0" dy="34.0">栈热点、PMU/AMU、缓存与内存停顿</tspan>
</text>
</svg>
