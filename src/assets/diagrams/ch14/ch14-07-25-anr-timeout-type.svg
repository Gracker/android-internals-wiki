<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ANR 默认值不能代替现场规则</title>
<desc id="desc">ANR 超时由类型、前后台、平台版本及设备配置共同决定。 10 秒回看和 1 秒后看是分析参数，输入常见 5 秒也不是所有 ANR 的统一阈值。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
