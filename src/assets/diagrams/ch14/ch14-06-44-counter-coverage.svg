<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">时间加权 Counter 先还原有效区间</title>
<desc id="desc">按 track_id 还原阶梯值区间，并裁到场景、进程和 Trace 边界后加权。 首值前未知，末值保持是外推假设，缺口不能当连续观测。 保持值是分析模型；只对有效区间加权</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 365 95 L 450 95" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 89 L 450 95 L 440 101" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 95 L 835 95" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 89 L 835 95 L 825 101" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 40 Q 215.0 40.7 361 40 Q 365 40 365 44 L 365 146 Q 365 150 361 150 Q 215.0 150.4 69 150 Q 65 150 65 146 L 65 44 Q 65 40 69 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">同轨道采样序列</tspan>
<tspan x="215.0" dy="34.0">保留实例与 counter ID</tspan>
</text>
<path d="M 454 40 Q 600.0 40.6 746 40 Q 750 40 750 44 L 750 146 Q 750 150 746 150 Q 600.0 149.7 454 150 Q 450 150 450 146 L 450 44 Q 450 40 454 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">[ts,next_ts) 保持值</tspan>
<tspan x="600.0" dy="34.0">按边界裁剪有效时长</tspan>
</text>
<path d="M 839 40 Q 985.0 39.3 1131 40 Q 1135 40 1135 44 L 1135 146 Q 1135 150 1131 150 Q 985.0 150.4 839 150 Q 835 150 835 146 L 835 44 Q 835 40 839 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">Σ(value × dur) / Σdur</tspan>
<tspan x="985.0" dy="34.0">同时报告覆盖与外推</tspan>
</text>
<text x="241" y="323" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">阶梯区间示意</tspan>
</text>
