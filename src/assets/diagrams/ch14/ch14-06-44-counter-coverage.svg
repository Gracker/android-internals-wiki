<text x="450.0" y="326" text-anchor="middle" style="font-size:21px">
<tspan x="450.0" dy="0">值 A 保持</tspan>
</text>
<path d="M 589 300 Q 765.0 299.7 941 300 Q 945 300 945 304 L 945 333 Q 945 337 941 337 Q 765.0 336.9 589 337 Q 585 337 585 333 L 585 304 Q 585 300 589 300" fill="white" stroke="#E8913A" stroke-width="3"/>
