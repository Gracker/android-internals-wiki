<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">同步 Slice 的墙钟时长包含等待</title>
<desc id="desc">同步区间的 ts 与 dur 表示线程时间轴上的跨度，需调度表拆分运行和等待。 Slice wall duration 不等于 CPU time，重叠子区间也不能简单再累加。 区间跨度包含线程未运行时间；回到同一线程闭合</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="650" fill="white"/>
<path d="M 365 100 L 450 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 94 L 450 100 L 440 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 100 L 835 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 94 L 835 100 L 825 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 45 Q 215.0 45.4 361 45 Q 365 45 365 49 L 365 151 Q 365 155 361 155 Q 215.0 155.1 69 155 Q 65 155 65 151 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">同线程 beginSection</tspan>
<tspan x="215.0" dy="34.0">压入当前同步栈</tspan>
</text>
<path d="M 454 45 Q 600.0 45.2 746 45 Q 750 45 750 49 L 750 151 Q 750 155 746 155 Q 600.0 155.5 454 155 Q 450 155 450 151 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="91.84" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">业务执行 + 被抢占 / 阻塞</tspan>
<tspan x="600.0" dy="32.64">现实时间继续推进</tspan>
</text>
<path d="M 839 45 Q 985.0 45.1 1131 45 Q 1135 45 1135 49 L 1135 151 Q 1135 155 1131 155 Q 985.0 155.3 839 155 Q 835 155 835 151 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">finally 中 endSection</tspan>
<tspan x="985.0" dy="34.0">结束当前栈顶</tspan>
</text>
<text x="241" y="293" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">业务 Slice</tspan>
</text>
<path d="M 255 309 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 279 270 Q 650.0 269.8 1021 270 Q 1025 270 1025 274 L 1025 303 Q 1025 307 1021 307 Q 650.0 307.1 279 307 Q 275 307 275 303 L 275 274 Q 275 270 279 270" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="650.0" y="296" text-anchor="middle" style="font-size:21px">
<tspan x="650.0" dy="0">整个 wall duration</tspan>
</text>
<text x="241" y="413" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">运行状态示意</tspan>
</text>
<path d="M 255 429 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 279 390 Q 380.0 390.3 481 390 Q 485 390 485 394 L 485 423 Q 485 427 481 427 Q 380.0 427.1 279 427 Q 275 427 275 423 L 275 394 Q 275 390 279 390" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="380.0" y="416" text-anchor="middle" style="font-size:21px">
<tspan x="380.0" dy="0">Running</tspan>
</text>
<path d="M 489 390 Q 645.0 389.5 801 390 Q 805 390 805 394 L 805 423 Q 805 427 801 427 Q 645.0 427.8 489 427 Q 485 427 485 423 L 485 394 Q 485 390 489 390" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="645.0" y="416" text-anchor="middle" style="font-size:21px">
<tspan x="645.0" dy="0">等待 / 被抢占</tspan>
</text>
<path d="M 809 390 Q 915.0 389.9 1021 390 Q 1025 390 1025 394 L 1025 423 Q 1025 427 1021 427 Q 915.0 426.3 809 427 Q 805 427 805 423 L 805 394 Q 805 390 809 390" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="915.0" y="416" text-anchor="middle" style="font-size:21px">
<tspan x="915.0" dy="0">Running</tspan>
</text>
</svg>
