<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">区间相交与后续帧都是候选规则</title>
<desc id="desc">同线程输入与 doFrame 相交时取规则匹配，否则取随后帧并标推测。 exact 只是区间关系，不能证明该帧包含业务反馈。 有相交区间；无相交区间</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 600 150 L 600 225 L 310 225 L 310 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 280 L 310 290 L 316 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 150 L 600 225 L 890 225 L 890 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 280 L 890 290 L 896 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 40 Q 600.0 39.8 811 40 Q 815 40 815 44 L 815 146 Q 815 150 811 150 Q 600.0 149.9 389 150 Q 385 150 385 146 L 385 44 Q 385 40 389 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">deliverInputEvent</tspan>
<tspan x="600.0" dy="34.0">同一应用线程</tspan>
</text>
<path d="M 79 290 Q 310.0 289.6 541 290 Q 545 290 545 294 L 545 416 Q 545 420 541 420 Q 310.0 420.3 79 420 Q 75 420 75 416 L 75 294 Q 75 290 79 290" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="346.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">与 doFrame 区间相交</tspan>
<tspan x="310.0" dy="34.0">is_speculative_frame = 0</tspan>
</text>
<path d="M 659 290 Q 890.0 289.3 1121 290 Q 1125 290 1125 294 L 1125 416 Q 1125 420 1121 420 Q 890.0 420.1 659 420 Q 655 420 655 416 L 655 294 Q 655 290 659 290" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="346.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">没有交集，选择随后帧</tspan>
<tspan x="890.0" dy="34.0">is_speculative_frame = 1</tspan>
</text>
<text x="241" y="508" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">输入区间示意</tspan>
</text>
<path d="M 255 524 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 439 485 Q 545.0 485.3 651 485 Q 655 485 655 489 L 655 518 Q 655 522 651 522 Q 545.0 521.5 439 522 Q 435 522 435 518 L 435 489 Q 435 485 439 485" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="545.0" y="511" text-anchor="middle" style="font-size:21px">
<tspan x="545.0" dy="0">deliverInputEvent</tspan>
</text>
</svg>
