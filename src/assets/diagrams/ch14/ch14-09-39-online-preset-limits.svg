<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ProfilingManager system trace 没有补齐DVFS源</title>
<desc id="desc">固定配置有compact sched、进程、应用atrace与FrameTimeline，可条件附加栈采样。 可选linux.perf不补freq/idle/sys_stats/system_info；结果还受redaction和请求rate limiter限制。 受限参数与 rate limiter
KEY / flag可选栈采样 → 平台 Configs 生成 trace
sched、进程、atrace、FT；平台 Configs 生成 trace
sched、进程、atrace、FT → 系统 trace 结果 redaction
完成后才交付应用；系统 trace 结果 redaction
完成后才交付应用 → 交付后核对实际轨道
可选perf仍不补齐DVFS</desc>
