<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">跨启动边界的 Binder 只按交集计窗口时间</title>
<desc id="desc">完整事务跨度和启动窗口内交集要分列，且并发事务可能重复覆盖。 两种时长之和都不等于启动独占阻塞；后台和异步事务需再核对依赖。 startup_id → upid 映射
限定目标事务实例 → 完整 Binder client span
可能跨过启动边界；完整 Binder client span
可能跨过启动边界 → 交集裁剪到启动窗口
再区分同步与异步</desc>
