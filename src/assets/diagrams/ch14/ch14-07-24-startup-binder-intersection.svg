<tspan x="215.0" dy="0">startup_id → upid 映射</tspan>
<tspan x="215.0" dy="34.0">限定目标事务实例</tspan>
</text>
<path d="M 454 60 Q 600.0 60.2 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.2 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">完整 Binder client span</tspan>
<tspan x="600.0" dy="34.0">可能跨过启动边界</tspan>
</text>
