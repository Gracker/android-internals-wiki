<text x="890.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">同步栈错位</tspan>
<tspan x="890.0" dy="34.0">同线程、嵌套、异常与挂起</tspan>
</text>
<path d="M 79 315 Q 310.0 315.4 541 315 Q 545 315 545 319 L 545 461 Q 545 465 541 465 Q 310.0 465.0 79 465 Q 75 465 75 461 L 75 319 Q 75 315 79 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
