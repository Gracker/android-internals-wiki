<text x="310.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">切片完全不出现</tspan>
<tspan x="310.0" dy="34.0">包名、启用状态、窗口与覆盖</tspan>
</text>
