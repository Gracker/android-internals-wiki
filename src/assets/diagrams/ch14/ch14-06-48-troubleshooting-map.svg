<tspan x="310.0" dy="34.0">名称 / cookie、取消与未闭合</tspan>
</text>
<path d="M 659 315 Q 890.0 314.4 1121 315 Q 1125 315 1125 319 L 1125 461 Q 1125 465 1121 465 Q 890.0 465.1 659 465 Q 655 465 655 461 L 655 319 Q 655 315 659 315" fill="white" stroke="#E8913A" stroke-width="3"/>
