<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">分区只让同一实体的区间求交</title>
<desc id="desc">两侧按相同整数分区键匹配，互不相关的实体不会相交。 列类型相同不代表业务含义相同；HASH 字符串也不能创建真实关联。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 215 180 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 180 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.7 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.2 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">分区 1 的左侧区间</tspan>
<tspan x="215.0" dy="34.0">对应实体 1</tspan>
</text>
<path d="M 454 60 Q 600.0 60.5 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.1 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">分区 2 的左侧区间</tspan>
<tspan x="600.0" dy="34.0">对应实体 2</tspan>
</text>
<path d="M 839 60 Q 985.0 59.9 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.6 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">错误分区键</tspan>
<tspan x="985.0" dy="34.0">只是数值恰好相同</tspan>
</text>
<path d="M 69 340 Q 215.0 340.0 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.1 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">仅与右侧分区 1 求交</tspan>
<tspan x="215.0" dy="34.0">保留该分区身份</tspan>
</text>
<path d="M 454 340 Q 600.0 340.5 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.6 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">仅与右侧分区 2 求交</tspan>
<tspan x="600.0" dy="34.0">不与实体 1 混合</tspan>
</text>
<path d="M 839 340 Q 985.0 339.6 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.6 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">先修复模型含义</tspan>
<tspan x="985.0" dy="34.0">不能靠 HASH 强行关联</tspan>
</text>
</svg>
