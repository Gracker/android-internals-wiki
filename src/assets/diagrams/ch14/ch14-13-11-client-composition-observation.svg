<title id="title">CLIENT判定同时影响两种观测</title>
<desc id="desc">同一output layer的CLIENT判定关联gpu_composition与FallbackComposition。 两个数据源开关独立；事件只说明进入CLIENT，不提供GPU时长或overlay资源耗尽原因。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
