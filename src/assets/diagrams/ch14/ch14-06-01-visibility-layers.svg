<title id="title">轨道缺失沿完整数据路径排查</title>
<desc id="desc">把事件存在、配置启用、传输保留与解析派生分层核对。 SQL 无结果不能独立区分采集缺失、覆盖或尚无领域解析。 事件点与设备能力
目标事件实际存在 → 会话与类别启用
进程 / tag / tracefs；会话与类别启用
进程 / tag / tracefs → 缓冲与传输保留
内核 / SMB / 中央；缓冲与传输保留
内核 / SMB / 中央 → 导入与领域表
原始事件 → 派生语义</desc>
