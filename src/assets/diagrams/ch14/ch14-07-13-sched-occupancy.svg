<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">按窗口内 sched 计算单核口径占比</title>
<desc id="desc">把选定线程的 sched 裁到窗口后累加，再除以同一窗口时长。 开放调度区间使用假设终点时要报告数量；高占用仍不能直接落到函数。 选定 upid 与 utid
给出有效窗口 → 每段 sched 求窗口交集
标记开放终点假设；每段 sched 求窗口交集
标记开放终点假设 → Σ运行时长 ÷ 窗口
得到单核口径占比；Σ运行时长 ÷ 窗口
得到单核口径占比 → 保留线程实例与样本
再用采样定位函数</desc>
