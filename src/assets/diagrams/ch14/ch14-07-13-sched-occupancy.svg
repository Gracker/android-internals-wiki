<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">每段 sched 求窗口交集</tspan>
<tspan x="890.0" dy="34.0">标记开放终点假设</tspan>
</text>
