<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">API33回调只复制有效期内的标量</title>
<desc id="desc">在绑定Looper线程的一次性VsyncCallback中读取preferred计划并复制标量。 FrameData/FrameTimeline回调外访问可抛异常；长度动态，连续观测需再次注册并控制记录开销。 Looper线程注册一次callback
绑定Choreographer → onVsync读取实际候选
使用平台preferred项；onVsync读取实际候选
使用平台preferred项 → 复制frameTime / id / deadline
expectedPresent等long值；复制frameTime / id / deadline
expectedPresent等long值 → 回调结束后只用副本
需要下一次则再次注册</desc>
