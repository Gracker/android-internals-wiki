<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">多核 CPU 时间与墙上时间</title>
<desc id="desc">不同 CPU 上并行执行的线程时间可以相加。 采用正文假设例说明 2 秒 CPU 时间与 1 秒重叠窗口；无设备实测，利用率分母还需明确。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="590" fill="white"/>
<path d="M 69 45 Q 215.0 44.6 361 45 Q 365 45 365 49 L 365 151 Q 365 155 361 155 Q 215.0 154.4 69 155 Q 65 155 65 151 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">线程 A 在 CPU 0</tspan>
<tspan x="215.0" dy="34.0">正文示例：运行 1 秒</tspan>
</text>
<path d="M 454 45 Q 600.0 45.6 746 45 Q 750 45 750 49 L 750 151 Q 750 155 746 155 Q 600.0 155.6 454 155 Q 450 155 450 151 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">线程 B 在 CPU 1</tspan>
<tspan x="600.0" dy="34.0">同时运行 1 秒</tspan>
</text>
<path d="M 839 45 Q 985.0 45.3 1131 45 Q 1135 45 1135 49 L 1135 151 Q 1135 155 1131 155 Q 985.0 155.2 839 155 Q 835 155 835 151 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">SUM(sched.dur)</tspan>
<tspan x="985.0" dy="34.0">合计 CPU 时间 2 秒</tspan>
</text>
<text x="600" y="545" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">按进程实例聚合；未知归属与明确进程实例要区分</tspan>
</text>
<text x="241" y="273" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">CPU 0 / A</tspan>
</text>
<path d="M 255 289 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 359 250 Q 680.0 249.2 1001 250 Q 1005 250 1005 254 L 1005 283 Q 1005 287 1001 287 Q 680.0 287.8 359 287 Q 355 287 355 283 L 355 254 Q 355 250 359 250" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="680.0" y="276" text-anchor="middle" style="font-size:21px">
<tspan x="680.0" dy="0">1 秒 Running</tspan>
</text>
<text x="241" y="378" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">CPU 1 / B</tspan>
</text>
<path d="M 255 394 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 359 355 Q 680.0 355.6 1001 355 Q 1005 355 1005 359 L 1005 388 Q 1005 392 1001 392 Q 680.0 392.6 359 392 Q 355 392 355 388 L 355 359 Q 355 355 359 355" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="680.0" y="381" text-anchor="middle" style="font-size:21px">
<tspan x="680.0" dy="0">同一墙上窗口内 1 秒 Running</tspan>
</text>
</svg>
