<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">输入身份、业务窗口与终点</title>
<desc id="desc">先固定投递身份、业务时间窗与延迟终点，再选择可核验的数据。 通道内序号和包名都不足以独立标识一次投递。 实例 + 通道 + 序号
保留原始消息时间 → 业务窗口 [start, end)
起止纳秒与筛选口径；业务窗口 [start, end)
起止纳秒与筛选口径 → 终点明确
FINISHED 或候选 present</desc>
