<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Simpleperf 进程名可为空，先枚举内部身份</title>
<desc id="desc">先列出 upid、utid、PID/TID 与样本范围，再核对原始采集目标。 MetaInfo 中的包名不自动生成 process.name；按包名过滤可能漏掉全部样本。 Thread 元数据
记录 TID 与所属 PID → 导入建立 utid / upid
process.name 可能 NULL；导入建立 utid / upid
process.name 可能 NULL → SQL 先枚举身份与覆盖
不要先按包名排除；SQL 先枚举身份与覆盖
不要先按包名排除 → 对照原始采集记录
选定实际实例再分析</desc>
