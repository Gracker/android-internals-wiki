<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">R+ 的归因从同 CPU 后继任务开始</title>
<desc id="desc">从切出标志追到同 CPU 竞争者，再判断是否影响业务截止。 次数或占比高不能独立证明优先级配置错误。 R+ 切出边界
记录原线程与 CPU → 同 CPU 随后运行者
调度类、优先级与 IRQ；同 CPU 随后运行者
调度类、优先级与 IRQ → 原线程允许集合
是否可能迁移或受限；原线程允许集合
是否可能迁移或受限 → 等待与业务 deadline
是否处在关键路径</desc>
