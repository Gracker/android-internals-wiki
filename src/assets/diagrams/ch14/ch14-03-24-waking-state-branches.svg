<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">固定导入器对 waking 的不同分支</title>
<desc id="desc">首次观察打开 R；已有 Running 或恰好 R 时保留当前状态并记录重复唤醒。 该 tag 对 R+ 的处理另有例外，不能泛化为所有 Runnable 均不变。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
