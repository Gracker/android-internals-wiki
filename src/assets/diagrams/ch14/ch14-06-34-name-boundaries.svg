<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">平台、JNI、AndroidX 与 marker 的长度边界</title>
<desc id="desc">平台同步名按 UTF-16 检查 127，AndroidX 1.3.0 统一截标签，JNI 与 marker 另有限制。 不同长度单位不能混算；名称截断还可能把不同标签变成同名。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 79 50 Q 310.0 49.3 541 50 Q 545 50 545 54 L 545 196 Q 545 200 541 200 Q 310.0 200.6 79 200 Q 75 200 75 196 L 75 54 Q 75 50 79 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">平台 beginSection</tspan>
<tspan x="310.0" dy="34.0">启用时检查 ≤127 UTF-16 单元</tspan>
</text>
<path d="M 659 50 Q 890.0 50.1 1121 50 Q 1125 50 1125 54 L 1125 196 Q 1125 200 1121 200 Q 890.0 199.7 659 200 Q 655 200 655 196 L 655 54 Q 655 50 659 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">AndroidX 1.3.0</tspan>
<tspan x="890.0" dy="34.0">同步 / async / Counter 均截到 127</tspan>
</text>
<path d="M 79 315 Q 310.0 315.1 541 315 Q 545 315 545 319 L 545 461 Q 545 465 541 465 Q 310.0 465.7 79 465 Q 75 465 75 461 L 75 319 Q 75 315 79 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">JNI withString</tspan>
<tspan x="310.0" dy="34.0">至多取 1024 UTF-16 单元并清理</tspan>
</text>
<path d="M 659 315 Q 890.0 315.4 1121 315 Q 1125 315 1125 319 L 1125 461 Q 1125 465 1121 465 Q 890.0 465.7 659 465 Q 655 465 655 461 L 655 319 Q 655 315 659 315" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="890.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">libcutils marker</tspan>
<tspan x="890.0" dy="34.0">总缓冲 1024 字节，含前缀和值</tspan>
</text>
</svg>
