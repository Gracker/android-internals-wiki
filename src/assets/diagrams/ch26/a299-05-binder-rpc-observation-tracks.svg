<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Binder RPC 要拼多侧区间，单次 ioctl 不代表往返时长</title>
<desc id="desc">展示客户端、驱动、服务端与回复的独立观察边界。 无量纲示意，无设备测量；oneway不等回复，WDBind v1不解码reply。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<text x="600" y="560" text-anchor="middle" style="font-size:22px">
<tspan x="600" dy="0">保留transaction身份、进程实例、线程与时钟；缺端点只报告已观察区间</tspan>
</text>
<text x="206" y="113" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">客户端</tspan>
</text>
<path d="M 220 129 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 234 90 Q 655.0 90.6 1076 90 Q 1080 90 1080 94 L 1080 123 Q 1080 127 1076 127 Q 655.0 127.3 234 127 Q 230 127 230 123 L 230 94 Q 230 90 234 90" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="655.0" y="116" text-anchor="middle" style="font-size:21px">
<tspan x="655.0" dy="0">应用调用slice：客户端可见总区间</tspan>
</text>
<text x="206" y="228" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">驱动/排队</tspan>
</text>
<path d="M 220 244 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 404 205 Q 520.0 205.5 636 205 Q 640 205 640 209 L 640 238 Q 640 242 636 242 Q 520.0 242.6 404 242 Q 400 242 400 238 L 400 209 Q 400 205 404 205" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="520.0" y="231" text-anchor="middle" style="font-size:21px">
<tspan x="520.0" dy="0">request → received</tspan>
</text>
<text x="206" y="343" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">服务端</tspan>
</text>
<path d="M 220 359 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 654 320 Q 780.0 319.6 906 320 Q 910 320 910 324 L 910 353 Q 910 357 906 357 Q 780.0 357.3 654 357 Q 650 357 650 353 L 650 324 Q 650 320 654 320" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="780.0" y="346" text-anchor="middle" style="font-size:21px">
<tspan x="780.0" dy="0">服务执行slice</tspan>
</text>
<text x="206" y="458" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">同步回复</tspan>
</text>
<path d="M 220 474 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 924 435 Q 995.0 435.8 1066 435 Q 1070 435 1070 439 L 1070 468 Q 1070 472 1066 472 Q 995.0 472.3 924 472 Q 920 472 920 468 L 920 439 Q 920 435 924 435" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="995.0" y="461" text-anchor="middle" style="font-size:21px">
<tspan x="995.0" dy="0">reply</tspan>
</text>
</svg>
