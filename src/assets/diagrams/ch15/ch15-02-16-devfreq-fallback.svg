<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="935" viewBox="0 0 1200 935" role="img" aria-labelledby="title desc">
<title id="title">devfreq 与供应商计数器后备路径</title>
<desc id="desc">按源码条件临时切换 governor，未找到时才尝试供应商 pmu_lib 后备路径。 这些 magic 值不是通用 PMU API；SIGKILL/崩溃可能跳过恢复，正常退出后也应核对实际状态。 root检查通过后才操作配置；找到mem_latency时切换并保存路径；没有对应governor才尝试供应商后备节点；析构尝试恢复已切换的governor；仅成功禁用供应商节点后才记录恢复动作</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="935" fill="white"/>
<path d="M 600 145 L 600 240" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 230 L 600 240 L 606 230" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 350 L 600 405 L 285 405 L 285 460" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 279 450 L 285 460 L 291 450" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 350 L 600 405 L 915 405 L 915 460" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 909 450 L 915 460 L 921 450" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 285 580 L 285 645 L 600 645 L 600 700" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 690 L 600 700 L 606 690" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 915 580 L 915 645 L 600 645 L 600 700" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 690 L 600 700 L 606 690" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 40 Q 600.0 40.5 746 40 Q 750 40 750 44 L 750 141 Q 750 145 746 145 Q 600.0 144.9 454 145 Q 450 145 450 141 L 450 44 Q 450 40 454 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="84.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">显式启用 devfreq 选项</tspan>
<tspan x="600.0" dy="34.0">先检查 root 权限</tspan>
</text>
<path d="M 454 240 Q 600.0 240.0 746 240 Q 750 240 750 244 L 750 346 Q 750 350 746 350 Q 600.0 350.1 454 350 Q 450 350 450 346 L 450 244 Q 450 240 454 240" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="286.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">扫描 devfreq governor</tspan>
<tspan x="600.0" dy="34.0">寻找 mem_latency</tspan>
</text>
<path d="M 59 460 Q 285.0 459.4 511 460 Q 515 460 515 464 L 515 576 Q 515 580 511 580 Q 285.0 580.5 59 580 Q 55 580 55 576 L 55 464 Q 55 460 59 460" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="285.0" y="511.5" text-anchor="middle" style="font-size:25px">
<tspan x="285.0" dy="0">找到：临时改为 performance</tspan>
<tspan x="285.0" dy="34.0">记录待恢复 governor 路径</tspan>
</text>
<path d="M 689 460 Q 915.0 460.6 1141 460 Q 1145 460 1145 464 L 1145 576 Q 1145 580 1141 580 Q 915.0 580.4 689 580 Q 685 580 685 576 L 685 464 Q 685 460 689 460" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="915.0" y="511.5" text-anchor="middle" style="font-size:25px">
<tspan x="915.0" dy="0">未找到：检查 pmu_lib 节点</tspan>
<tspan x="915.0" dy="34.0">值为 1 时写 DEADBEEF</tspan>
</text>
<path d="M 354 700 Q 600.0 699.5 846 700 Q 850 700 850 704 L 850 816 Q 850 820 846 820 Q 600.0 820.5 354 820 Q 350 820 350 816 L 350 704 Q 350 700 354 700" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="734.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">正常析构尝试恢复</tspan>
<tspan x="600.0" dy="34.0">governor → mem_latency</tspan>
<tspan x="600.0" dy="34.0">pmu_lib → BEEFDEAD</tspan>
</text>
</svg>
