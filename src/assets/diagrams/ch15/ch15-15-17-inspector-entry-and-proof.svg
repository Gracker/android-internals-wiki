<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Inspector 从可调试进程到节点证据</title>
<desc id="desc">连接正确的前台debuggable进程，用组件树、属性和snapshot保存错误现场。 内部节点存在不能证明最终像素可见或输入抵达，跨窗口与独立buffer另查。 Running Devices目标设备
物理设备先启用mirroring → 前台debuggable进程
确认构建、用户与连接；前台debuggable进程
确认构建、用户与连接 → Deep Inspect / Component Tree
读bounds、属性与父子关系；Deep Inspect / Component Tree
读bounds、属性与父子关系 → 错误状态导出snapshot
记录节点路径与后续trace</desc>
