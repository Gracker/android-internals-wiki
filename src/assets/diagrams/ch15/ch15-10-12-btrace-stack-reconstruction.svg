<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">btrace 3.x 的同步回溯与时间重建</title>
<desc id="desc">动态触发点同步取栈，先保存方法地址，再符号化和重建 Trace。 缺少触发点的执行会形成空洞；相邻栈样本重建不是逐方法进入/退出精确计时，分配监控排除 Android 15+。 叶子或阻塞触发点
分配 / 锁 / 等待 / GC
ShadowHook 等动态插桩 → 当前线程同步遍历 ART 栈
保存 method pointer 与时间；当前线程同步遍历 ART 栈
保存 method pointer 与时间 → 批量符号化、样本重建
wall time
thread CPU time</desc>
