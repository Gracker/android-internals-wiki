<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">冷启动准备与 TTID、TTFD 两个终点</title>
<desc id="desc">COLD 由库在 setup 后停止进程并处理缓存；TTID 与 TTFD 使用同一起点和不同显示终点。 轨道仅表示边界，长度不是测量值；TTFD 依赖正确 fully drawn 信号，API 29 之前可能不可用。 先准备再由库执行冷启动处理；目标进程已停止后启动测量</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="680" fill="white"/>
<path d="M 365 110 L 450 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 104 L 450 110 L 440 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 110 L 835 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 104 L 835 110 L 825 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 45 Q 215.0 45.1 361 45 Q 365 45 365 49 L 365 171 Q 365 175 361 175 Q 215.0 175.5 69 175 Q 65 175 65 171 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">setupBlock</tspan>
<tspan x="215.0" dy="34.0">pressHome 等入口准备</tspan>
</text>
<path d="M 454 45 Q 600.0 44.3 746 45 Q 750 45 750 49 L 750 171 Q 750 175 746 175 Q 600.0 174.5 454 175 Q 450 175 450 171 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">COLD：清 shader / kill</tspan>
<tspan x="600.0" dy="34.0">请求清理 page cache</tspan>
</text>
<path d="M 839 45 Q 985.0 44.6 1131 45 Q 1135 45 1135 49 L 1135 171 Q 1135 175 1131 175 Q 985.0 175.2 839 175 Q 835 175 835 171 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">measureBlock 启动</tspan>
<tspan x="985.0" dy="34.0">首帧与 fully drawn 信号</tspan>
</text>
<text x="226" y="353" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">TTID</tspan>
</text>
<path d="M 240 369 H 1100" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 330 Q 490.0 329.9 736 330 Q 740 330 740 334 L 740 363 Q 740 367 736 367 Q 490.0 367.3 244 367 Q 240 367 240 363 L 240 334 Q 240 330 244 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="490.0" y="356" text-anchor="middle" style="font-size:21px">
<tspan x="490.0" dy="0">系统收到启动 Intent → 目标首帧</tspan>
</text>
<text x="226" y="463" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">TTFD</tspan>
</text>
<path d="M 240 479 H 1100" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 440 Q 640.0 440.8 1036 440 Q 1040 440 1040 444 L 1040 473 Q 1040 477 1036 477 Q 640.0 476.9 244 477 Q 240 477 240 473 L 240 444 Q 240 440 244 440" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="640.0" y="466" text-anchor="middle" style="font-size:21px">
<tspan x="640.0" dy="0">同一起点 → fully drawn 信号所在或之后完整帧结束</tspan>
</text>
</svg>
