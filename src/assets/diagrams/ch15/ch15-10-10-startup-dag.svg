<path d="M 985 410 L 985 520" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 510 L 985 520 L 991 510" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 50 Q 215.0 50.7 361 50 Q 365 50 365 54 L 365 156 Q 365 160 361 160 Q 215.0 160.6 69 160 Q 65 160 65 156 L 65 54 Q 65 50 69 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">任务 A</tspan>
<tspan x="215.0" dy="34.0">满足依赖后可执行</tspan>
</text>
<path d="M 454 50 Q 600.0 49.4 746 50 Q 750 50 750 54 L 750 156 Q 750 160 746 160 Q 600.0 160.1 454 160 Q 450 160 450 156 L 450 54 Q 450 50 454 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">任务 B</tspan>
<tspan x="600.0" dy="34.0">独立后台任务</tspan>
</text>
<path d="M 69 300 Q 215.0 299.2 361 300 Q 365 300 365 304 L 365 406 Q 365 410 361 410 Q 215.0 410.2 69 410 Q 65 410 65 406 L 65 304 Q 65 300 69 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="346.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">任务 C</tspan>
<tspan x="215.0" dy="34.0">依赖 A 完成</tspan>
</text>
<path d="M 839 300 Q 985.0 299.9 1131 300 Q 1135 300 1135 304 L 1135 406 Q 1135 410 1131 410 Q 985.0 409.8 839 410 Q 835 410 835 406 L 835 304 Q 835 300 839 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="346.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">首帧必需节点 D</tspan>
<tspan x="985.0" dy="34.0">依赖 B 与 C</tspan>
</text>
<path d="M 839 520 Q 985.0 519.7 1131 520 Q 1135 520 1135 524 L 1135 626 Q 1135 630 1131 630 Q 985.0 630.7 839 630 Q 835 630 835 626 L 835 524 Q 835 520 839 520" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="566.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">锚点等待 D 完成后</tspan>
<tspan x="985.0" dy="34.0">放行主线程</tspan>
</text>
</svg>
