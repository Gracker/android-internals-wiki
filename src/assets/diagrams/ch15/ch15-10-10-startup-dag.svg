<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">启动 DAG、并发约束与锚点等待</title>
<desc id="desc">依赖完成才释放后继，主线程锚点等待会进入启动关键路径。 图中任务是假设示例，不表示实测时长；App Startup 本身不提供通用后台并行调度器。 A完成释放C；B完成满足D的一个依赖；C完成后D的两个依赖均满足才可执行；若锚点指定D则主线程等待D完成</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
