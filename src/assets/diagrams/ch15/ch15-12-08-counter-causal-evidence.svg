<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">GPU counter span</tspan>
<tspan x="215.0" dy="34.0">先固定 GPU 与采样语义</tspan>
</text>
<path d="M 454 60 Q 600.0 59.9 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.9 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="112.52" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">submission / buffer / fence</tspan>
<tspan x="600.0" dy="29.92">关联实际 Producer 工作</tspan>
</text>
