<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="865" viewBox="0 0 1200 865" role="img" aria-labelledby="title desc">
<title id="title">dma-buf 的 fd、映射与跨进程去重</title>
<desc id="desc">进程可以通过 fd 或映射持有同一个 dma-buf，VMA 只覆盖已映射的地址空间。 同一时点的系统唯一总量按 inode 去重；各进程统计可能重复显示同一共享缓冲区。 进程A的fd和映射持有同一内核buffer；进程B仅fd也可持有相同buffer；已映射部分可进入VMA观察范围；fd持有不要求同进程CPU映射</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="865" fill="white"/>
<path d="M 280 320 L 280 245 L 600 245 L 600 160" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 170 L 600 160 L 606 170" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 920 320 L 920 245 L 600 245 L 600 160" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 170 L 600 160 L 606 170" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 280 440 L 280 610" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 274 600 L 280 610 L 286 600" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 920 440 L 920 610" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 914 600 L 920 610 L 926 600" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 424 40 Q 600.0 39.2 776 40 Q 780 40 780 44 L 780 156 Q 780 160 776 160 Q 600.0 160.0 424 160 Q 420 160 420 156 L 420 44 Q 420 40 424 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">同一时点的 dma-buf</tspan>
<tspan x="600.0" dy="34.0">inode X，唯一内核对象</tspan>
</text>
<path d="M 69 320 Q 280.0 319.5 491 320 Q 495 320 495 324 L 495 436 Q 495 440 491 440 Q 280.0 439.9 69 440 Q 65 440 65 436 L 65 324 Q 65 320 69 320" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="280.0" y="371.5" text-anchor="middle" style="font-size:25px">
<tspan x="280.0" dy="0">进程 A</tspan>
<tspan x="280.0" dy="34.0">持有 fd，并建立 CPU 映射</tspan>
</text>
<path d="M 709 320 Q 920.0 320.6 1131 320 Q 1135 320 1135 324 L 1135 436 Q 1135 440 1131 440 Q 920.0 439.8 709 440 Q 705 440 705 436 L 705 324 Q 705 320 709 320" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="920.0" y="371.5" text-anchor="middle" style="font-size:25px">
<tspan x="920.0" dy="0">进程 B</tspan>
<tspan x="920.0" dy="34.0">仅持有 fd，尚未映射</tspan>
</text>
<path d="M 69 610 Q 280.0 610.6 491 610 Q 495 610 495 614 L 495 726 Q 495 730 491 730 Q 280.0 730.4 69 730 Q 65 730 65 726 L 65 614 Q 65 610 69 610" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="280.0" y="661.5" text-anchor="middle" style="font-size:25px">
<tspan x="280.0" dy="0">showmap 可见映射 VMA</tspan>
<tspan x="280.0" dy="34.0">再结合 memtrack / fd 统计</tspan>
</text>
<path d="M 709 610 Q 920.0 610.6 1131 610 Q 1135 610 1135 614 L 1135 726 Q 1135 730 1131 730 Q 920.0 730.1 709 730 Q 705 730 705 726 L 705 614 Q 705 610 709 610" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="920.0" y="661.5" text-anchor="middle" style="font-size:25px">
<tspan x="920.0" dy="0">没有相应 VMA 也可持有缓冲</tspan>
<tspan x="920.0" dy="34.0">需要 dma-buf 的 fd / 引用证据</tspan>
</text>
</svg>
