<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">帧的经过时间与 deadline 超期</title>
<desc id="desc">frameDurationCpuMs 跨 UI 起点与 RT 终点；frameOverrunMs 使用实际与预期帧的结束边界。 按固定源码公式绘制；条长仅为示意。经过时间可含阻塞与调度等待，不是实际占核时间相加，也不是直接的 FPS。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="830" fill="white"/>
<path d="M 84 40 Q 325.0 40.7 566 40 Q 570 40 570 44 L 570 161 Q 570 165 566 165 Q 325.0 164.5 84 165 Q 80 165 80 161 L 80 44 Q 80 40 84 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="325.0" y="78.02" text-anchor="middle" style="font-size:24px">
<tspan x="325.0" dy="0">frameDurationCpuMs</tspan>
<tspan x="325.0" dy="32.64">UI doFrame 起点 → RT DrawFrame 终点</tspan>
<tspan x="325.0" dy="32.64">纳秒差 ÷ 10⁶ 得到 ms</tspan>
</text>
<path d="M 634 40 Q 875.0 40.1 1116 40 Q 1120 40 1120 44 L 1120 161 Q 1120 165 1116 165 Q 875.0 165.5 634 165 Q 630 165 630 161 L 630 44 Q 630 40 634 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="875.0" y="78.02" text-anchor="middle" style="font-size:24px">
<tspan x="875.0" dy="0">API 31+ frameOverrunMs</tspan>
<tspan x="875.0" dy="32.64">max(actual.end, RT.end) − expected.end</tspan>
<tspan x="875.0" dy="32.64">纳秒差 ÷ 10⁶ 得到 ms</tspan>
</text>
<text x="226" y="323" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">UI 线程</tspan>
</text>
<path d="M 240 339 H 1100" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 300 Q 410.0 299.8 576 300 Q 580 300 580 304 L 580 333 Q 580 337 576 337 Q 410.0 336.5 244 337 Q 240 337 240 333 L 240 304 Q 240 300 244 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="410.0" y="326" text-anchor="middle" style="font-size:21px">
<tspan x="410.0" dy="0">doFrame</tspan>
</text>
<text x="226" y="428" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">RenderThread</tspan>
</text>
