<path d="M 474 405 Q 635.0 405.8 796 405 Q 800 405 800 409 L 800 438 Q 800 442 796 442 Q 635.0 441.8 474 442 Q 470 442 470 438 L 470 409 Q 470 405 474 405" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="635.0" y="431" text-anchor="middle" style="font-size:21px">
<tspan x="635.0" dy="0">DrawFrame</tspan>
</text>
<text x="226" y="533" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">Expected</tspan>
</text>
<path d="M 240 549 H 1100" stroke="#777777" stroke-width="1.5"/>
