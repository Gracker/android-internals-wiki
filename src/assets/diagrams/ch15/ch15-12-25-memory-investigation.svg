<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从增长进程到具体 buffer 的排查</title>
<desc id="desc">先取有效PID和总量，再核对root与新PID，最后结合对象引用和Layer上下文缩小范围。 Bash示例只在PID和root校验通过后继续；SurfaceFlinger没有本基线的--bufferstats选项。 有效目标PID
GpuMem总量 + meminfo分类 → userdebug / eng与root
等待adbd并重新确认PID；userdebug / eng与root
等待adbd并重新确认PID → dmabuf_dump PID / -b
inode、exporter与进程引用；dmabuf_dump PID / -b
inode、exporter与进程引用 → SF --list / 默认dump
关联Layer与当前合成状态</desc>
