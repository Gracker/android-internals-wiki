<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">GOT 改写前后与调用方范围</title>
<desc id="desc">PLT Hook 替换调用方自己的槽；原函数实现和其他调用方的槽仍各自独立。 上下两行是安装前后两种状态；内部直调、其他槽、已保存指针或 dlsym 直接调用可能绕过该槽。 安装前调用进入A的动态槽；安装前槽指向原malloc；安装后调用仍经过A的动态槽；安装后槽目标替换为代理入口；代理按框架链规则继续前驱或原实现</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
