<path d="M 1000 450 L 1000 560" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 994 550 L 1000 560 L 1006 550" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 54 50 Q 200.0 49.9 346 50 Q 350 50 350 54 L 350 156 Q 350 160 346 160 Q 200.0 160.2 54 160 Q 50 160 50 156 L 50 54 Q 50 50 54 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="200.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="200.0" dy="0">安装前：调用方 A</tspan>
<tspan x="200.0" dy="34.0">经 malloc@plt</tspan>
</text>
<path d="M 449 50 Q 600.0 50.7 751 50 Q 755 50 755 54 L 755 156 Q 755 160 751 160 Q 600.0 160.3 449 160 Q 445 160 445 156 L 445 54 Q 445 50 449 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">A 的 GOT 槽</tspan>
<tspan x="600.0" dy="34.0">原目标地址</tspan>
</text>
<path d="M 854 50 Q 1000.0 50.8 1146 50 Q 1150 50 1150 54 L 1150 156 Q 1150 160 1146 160 Q 1000.0 159.5 854 160 Q 850 160 850 156 L 850 54 Q 850 50 854 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1000.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="1000.0" dy="0">libc malloc 实现</tspan>
<tspan x="1000.0" dy="34.0">函数指令未改</tspan>
</text>
<path d="M 54 340 Q 200.0 340.5 346 340 Q 350 340 350 344 L 350 446 Q 350 450 346 450 Q 200.0 450.3 54 450 Q 50 450 50 446 L 50 344 Q 50 340 54 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="200.0" y="386.5" text-anchor="middle" style="font-size:25px">
<tspan x="200.0" dy="0">安装后：调用方 A</tspan>
<tspan x="200.0" dy="34.0">仍经 malloc@plt</tspan>
</text>
<path d="M 449 340 Q 600.0 340.3 751 340 Q 755 340 755 344 L 755 446 Q 755 450 751 450 Q 600.0 450.7 449 450 Q 445 450 445 446 L 445 344 Q 445 340 449 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="386.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">A 的 GOT 槽</tspan>
<tspan x="600.0" dy="34.0">替换为代理地址</tspan>
</text>
<path d="M 854 340 Q 1000.0 339.7 1146 340 Q 1150 340 1150 344 L 1150 446 Q 1150 450 1146 450 Q 1000.0 450.7 854 450 Q 850 450 850 446 L 850 344 Q 850 340 854 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1000.0" y="386.5" text-anchor="middle" style="font-size:25px">
