<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">设备产出与桌面查询的分工</title>
<desc id="desc">App、framework与内核提供事件，设备Perfetto协调并保存，APA取回展示和查询。 同一时间轴不能自动补齐未采集数据或把相邻事件变成因果。 App / framework / kernel
业务标记、帧与调度事件 → 设备 producer / data source
声明能力并写 trace packet；设备 producer / data source
声明能力并写 trace packet → Perfetto service / buffer
按 TraceConfig 协调录制；Perfetto service / buffer
按 TraceConfig 协调录制 → APA 桌面
取回文件、轨道与SQL分析</desc>
