<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HPROF 的头部、记录与交叉引用</title>
<desc id="desc">HPROF 通过带 tag 与长度的记录保存类、对象、root 和数组引用。 固定 A17 magic 为 JAVA PROFILE 1.0.3、对象 ID 为 4 B；示意顺序不能替代扩展 tag、分段和引用完整性校验。 Header
magic、ID 宽度与时间 → 字符串、类与栈等元数据
供后续 ID 引用；字符串、类与栈等元数据
供后续 ID 引用 → HEAP_DUMP_SEGMENT
root / class / instance / array；HEAP_DUMP_SEGMENT
root / class / instance / array → HEAP_DUMP_END
按长度与 ID 关系检查解析</desc>
