<title id="title">Camera 诊断配置与实际设备数据</title>
<desc id="desc">先记录场景和stream配置，再检查数据源能力、事件覆盖与trace丢失。 FrameTimeline实际源名为android.surfaceflinger.frametimeline；vendor ISP与SOF等需另外采集。 固定camera / outputs / fps
carrier、ZSL与设备热状态 → camera ATrace
调度 / Binder
FrameTimeline；camera ATrace
调度 / Binder
FrameTimeline → 核对ring buffer覆盖
确认目标事件存在与未丢失</desc>
