<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Camera 启动的六个测量边界</title>
<desc id="desc">从业务触发到首次可见预览按六段定位，应用标记补齐系统看不到的起点。 first full buffer是入队尝试前标记，首帧显示仍需按实际carrier追踪；open统计不能替代端到端。 业务触发 / App marker
到openCamera或Binder → service connectHelper
权限、仲裁与HAL open；service connectHelper
权限、仲裁与HAL open → session configure
协商outputs与pipeline；session configure
协商outputs与pipeline → 首次request提交
App控制与RequestThread；首次request提交
App控制与RequestThread → first full buffer标记
首次有效buffer入队尝试前；first full buffer标记
首次有效buffer入队尝试前 → 首次可见预览
carrier、latch与present</desc>
