<title id="title">launch mode 与录制触发条件</title>
<desc id="desc">先选是否由APA启动App，再按启动或稳态问题选择录制触发。 Record a running app只允许Manual起始；结束触发另选Manual或Duration。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
