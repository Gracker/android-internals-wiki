<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">百分比升高与绝对成本下降可以同时发生</title>
<desc id="desc">同一 CPU 的 Backend Bound 比例升高时，绝对 stall slot 仍可能减少。 归一化数字只作公式示意，非设备测量；实际验收还要比较相同工作量的墙钟时延。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 215 180 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 180 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.9 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 180.5 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">示例 A：cycles = 100</tspan>
<tspan x="215.0" dy="32.64">总 slot = 8 × 100 = 800</tspan>
</text>
<path d="M 454 60 Q 600.0 60.8 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.4 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">示例 B：cycles = 60</tspan>
<tspan x="600.0" dy="34.0">总 slot = 8 × 60 = 480</tspan>
</text>
<path d="M 839 60 Q 985.0 59.2 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.5 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">保留多个尺度</tspan>
<tspan x="985.0" dy="34.0">避免只按百分比判断</tspan>
</text>
<path d="M 69 340 Q 215.0 340.8 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.0 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">Backend = 40%</tspan>
<tspan x="215.0" dy="34.0">对应 320 stall slot</tspan>
</text>
<path d="M 454 340 Q 600.0 340.4 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.6 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Backend = 50%</tspan>
<tspan x="600.0" dy="34.0">对应 240 stall slot</tspan>
</text>
<path d="M 839 340 Q 985.0 340.4 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.2 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">绝对 slot：320 → 240</tspan>
<tspan x="985.0" dy="34.0">比例：40% → 50%</tspan>
</text>
<text x="600" y="570" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">前提：同核、同公式、同统计范围；百分比分母随总 cycles 变化</tspan>
</text>
</svg>
