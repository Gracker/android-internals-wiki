<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">黑白屏先确认状态还是像素问题</title>
<desc id="desc">从异常画面定位窗口与内容buffer，再检查遮挡、保护策略和Producer像素。 有layer、有buffer、WM visible三者都不能单独证明用户看到了正确内容。 录像异常帧与Display
对照starting window / splash → 确认正确的内容layer
buffer、frame、parent与区域；确认正确的内容layer
buffer、frame、parent与区域 → 区分遮挡 / 黑像素 / protected
不能只凭录像断定没出帧；区分遮挡 / 黑像素 / protected
不能只凭录像断定没出帧 → 状态错追transaction
迟到或像素错转对应工具</desc>
