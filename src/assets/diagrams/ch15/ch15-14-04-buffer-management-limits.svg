<title id="title">HAL 管理、framework 管理与 App 持有上限</title>
<desc id="desc">分清buffer申请时机、HAL每流持有上限和App acquire上限。 maxBuffers、maxImages与总分配量不是同一数；consumer、缓存及vendor池另算。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
