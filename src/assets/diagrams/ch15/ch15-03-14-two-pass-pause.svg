<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">第一遍：计数输出器</tspan>
<tspan x="890.0" dy="34.0">计算总量与最大 record</tspan>
</text>
<path d="M 679 340 Q 890.0 340.3 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.1 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">清理遍历状态再正式输出</tspan>
<tspan x="890.0" dy="34.0">文件 / DDMS 及 I/O</tspan>
</text>
<path d="M 99 340 Q 310.0 340.2 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.0 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">结束作用域</tspan>
<tspan x="310.0" dy="34.0">恢复其他托管线程</tspan>
