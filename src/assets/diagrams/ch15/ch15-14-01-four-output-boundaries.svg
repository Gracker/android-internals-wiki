<title id="title">同一 session 的四种输出边界</title>
<desc id="desc">按输出流区分预览、录像、分析和拍照，各自追踪consumer与完成条件。 实际request只选择部分或全部配置输出；共享ISP与带宽可使回压跨流传导。 按相应输出或工作域分别追踪；按相应输出或工作域分别追踪；按相应输出或工作域分别追踪；按相应输出或工作域分别追踪</desc>
