<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">LEAD 区间与末行边界</title>
<desc id="desc">按 track 排序后用下一时间戳计算区间长度，末行延伸到 trace_end。 合成示例沿用上图；SQL不会修复占位值，也不能按 value=0 删除所有真实零值。 当前 row
ts / track_id / value → LEAD(ts, trace_end) - ts
同track计算 dur；LEAD(ts, trace_end) - ts
同track计算 dur → 按边界语义决定聚合
末行占位需单独审查</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
