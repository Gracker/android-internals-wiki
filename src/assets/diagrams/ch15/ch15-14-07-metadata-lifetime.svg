<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Java 结果引用与 native metadata 生存期</title>
<desc id="desc">长期保留完整CaptureResult会同时延长其native metadata生存期。 VMRuntime登记帮助GC感知native分配，finalize不提供确定释放时刻；dma-buf与vendor池另行核算。 业务缓存 / 跨线程消息
持有完整CaptureResult → CameraMetadataNative
mMetadataPtr仍可达；CameraMetadataNative
mMetadataPtr仍可达 → native metadata继续存活
提取必要字段并限制队列</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="420" fill="white"/>
<path d="M 365 120.0 L 450 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.1 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.5 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">业务缓存 / 跨线程消息</tspan>
<tspan x="215.0" dy="34.0">持有完整CaptureResult</tspan>
</text>
<path d="M 454 60 Q 600.0 60.5 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.7 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">CameraMetadataNative</tspan>
<tspan x="600.0" dy="34.0">mMetadataPtr仍可达</tspan>
</text>
<path d="M 839 60 Q 985.0 59.8 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.3 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="985.0" dy="0">native metadata继续存活</tspan>
<tspan x="985.0" dy="32.64">提取必要字段并限制队列</tspan>
</text>
</svg>
