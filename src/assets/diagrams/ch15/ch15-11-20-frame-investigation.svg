<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从重 pass 到资源与 shader</title>
<desc id="desc">先定位帧内工作，再逐层检查 attachment、状态、资源和 shader，最后回到系统验证。 相邻时间区间不自动证明因果；图中的分析顺序不承诺任意设备都支持相同 counter。 Commands / timeline
选目标 pass 或 draw → Framebuffer / attachment
尺寸、格式、load / store；Framebuffer / attachment
尺寸、格式、load / store → Pipeline / descriptor / texture
核对状态与资源；Pipeline / descriptor / texture
核对状态与资源 → Shader / 厂商 counter
提出并验证单变量改动；Shader / 厂商 counter
提出并验证单变量改动 → 回正常运行系统时间线
复核同帧 fence 与 present</desc>
