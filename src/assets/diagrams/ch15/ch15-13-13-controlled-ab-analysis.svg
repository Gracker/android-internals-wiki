<title id="title">视觉对齐与固定查询的 A/B 对照</title>
<desc id="desc">先固定采集与场景，再用同一查询或benchmark指标比较修复前后。 分栏对齐方便复盘；定量结论仍要同单位、同窗口与可复查的指标定义。 固定版本、构建与场景
保存同一TraceConfig → 录基线与改动trace
定位异常帧和反例；录基线与改动trace
定位异常帧和反例 → 同SQL / benchmark指标
保留查询、原始数据与解释</desc>
