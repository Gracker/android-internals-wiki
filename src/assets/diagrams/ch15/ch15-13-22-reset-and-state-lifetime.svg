<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">run、目标方法与候选路径的重置范围</title>
<desc id="desc">按run起始、方法处理和候选路径三个层次记录生命周期与初始状态。 候选路径间启动主Activity不等于完整冷启动；缺包安装的-r -g也会改变权限条件。 run单目标 / 全目标分支
遍历目标前restart_app一次 → 每个_process_method
可Frida spawn或启动App；每个_process_method
可Frida spawn或启动App → 每条非intent候选路径
重新启动主Activity；每条非intent候选路径
重新启动主Activity → 方法处理结束force-stop
状态、数据与缓存分别核对</desc>
