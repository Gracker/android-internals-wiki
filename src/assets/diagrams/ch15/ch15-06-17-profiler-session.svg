<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">CLI 系统 Trace 的会话生命周期</title>
<desc id="desc">prepare 设置 profiling 状态，start 录制片段，stop 拉取文件；daemon 连接分开的命令并负责会话恢复。 prepare 可选；keep-session 保留会话供下一片段，卡住可 terminate。实际 GPU / Vulkan 数据依设备与配置，不自动建立回归统计。 可选 prepare
设置设备 / App profiling 状态 → start
启动本段系统 Trace；start
启动本段系统 Trace → daemon 保持会话
执行目标交互；daemon 保持会话
执行目标交互 → stop
停止并拉取产物；stop
停止并拉取产物 → 结束时恢复设备和 App
或 keep-session 继续下一段</desc>
