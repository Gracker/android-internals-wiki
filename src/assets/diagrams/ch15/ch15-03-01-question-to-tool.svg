<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">先定位内存类别，再选归因证据</title>
<desc id="desc">把进程记账、对象保留、分配调用栈和非法访问分开，再按问题取证。 单次曲线或快照只给线索；整机压力需结合 PSS、LMKD 与 PSI，不能直接归成 Java 泄漏。 按Java 对象选择证据；按native 分配选择证据；按Graphics / dma-buf选择证据；按非法内存访问选择证据</desc>
