<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">计数器 ID、语义与对照条件</title>
<desc id="desc">按 descriptor 作用域选 ID，再按同一设备的指标定义和同条件基线比较。 OEM 全局 ID 与序列内 interned ID 分别处理；统一传输不能产生通用阈值。 ID / descriptor
全局或 trusted sequence → 厂商定义
单位、分母、窗口与等待；厂商定义
单位、分母、窗口与等待 → 同设备 A/B
同画质、热状态与版本</desc>
