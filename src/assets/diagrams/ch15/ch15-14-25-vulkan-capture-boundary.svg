<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">GFXReconstruct 在 Camera 链上的位置</title>
<desc id="desc">图形capture从App的Vulkan调用观察导入、同步和采样，外部Camera像素另行验证。 不覆盖sensor、ISP或SurfaceView直送内部；捕获层会改变性能，先保留无layer基线。 Camera外部producer
AHardwareBuffer与同步 → App Vulkan调用边界
导入 / layout / barrier
检查draw与compute；App Vulkan调用边界
导入 / layout / barrier
检查draw与compute → GFXR capture / replay
按捕获内容与格式
验证驱动支持</desc>
