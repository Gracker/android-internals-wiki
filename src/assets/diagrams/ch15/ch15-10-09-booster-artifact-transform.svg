<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Booster 构建改写与运行结果</title>
<desc id="desc">Android Components 注册产物转换，模块改写 class，运行期再验证实际行为。 Scoped Artifacts 不是旧 AGP Transform；改写可增加运行成本，发布产物版本需与 AGP 精确匹配。 androidComponents.onVariants
选择构建变体 → variant.artifacts / Scope.ALL
转换 CLASSES 产物；variant.artifacts / Scope.ALL
转换 CLASSES 产物 → 模块检查或替换调用
线程 / R 常量 / Toast；模块检查或替换调用
线程 / R 常量 / Toast → 构建报告 + 最终 APK/AAB
再核对运行语义与成本</desc>
