<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">布局坐标、父层变换与输入区域</title>
<desc id="desc">从局部layout与translation逐层换算到窗口和Display，再单独验证输入目标。 VISIBLE、alpha和clickable属性均不是最终可见或事件已送达的证明。 layout bounds / x,y
x,y还包含translation → 父层scroll / matrix / clip
局部坐标不等于屏幕坐标；父层scroll / matrix / clip
局部坐标不等于屏幕坐标 → Window / Insets / Display
尺寸、density与原点分别记录；Window / Insets / Display
尺寸、density与原点分别记录 → 触摸区域、拦截与target
应用内结构与系统派发分查</desc>
