<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">power_rails 的向后差值与前向平均功率</title>
<desc id="desc">标准库 energy_delta 相对前值，而 average_power 使用下一读数；前向区间能量要显式用 end 减 start。 图为合成示例；57.2/58.2 真实导入均复现该区别，不能把两列直接当作同一区间。 前一个区间；当前行的前向区间；标准库energy_delta向后看；average_power向前看</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="760" fill="white"/>
<path d="M 375 115 L 440 115" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 430 109 L 440 115 L 430 121" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 760 115 L 825 115" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 815 109 L 825 115 L 815 121" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 170 L 600 300 L 275 300 L 275 440" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 269 430 L 275 440 L 281 430" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 170 L 600 300 L 925 300 L 925 440" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 919 430 L 925 440 L 931 430" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 59 60 Q 215.0 59.8 371 60 Q 375 60 375 64 L 375 166 Q 375 170 371 170 Q 215.0 170.6 59 170 Q 55 170 55 166 L 55 64 Q 55 60 59 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="106.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">t = 1 s</tspan>
<tspan x="215.0" dy="34.0">E = 1,000 µWs</tspan>
</text>
<path d="M 444 60 Q 600.0 60.5 756 60 Q 760 60 760 64 L 760 166 Q 760 170 756 170 Q 600.0 170.2 444 170 Q 440 170 440 166 L 440 64 Q 440 60 444 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="106.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">t = 2 s</tspan>
<tspan x="600.0" dy="34.0">E = 3,000 µWs</tspan>
</text>
<path d="M 829 60 Q 985.0 60.3 1141 60 Q 1145 60 1145 64 L 1145 166 Q 1145 170 1141 170 Q 985.0 170.1 829 170 Q 825 170 825 166 L 825 64 Q 825 60 829 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="106.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">t = 3 s</tspan>
<tspan x="985.0" dy="34.0">E = 8,000 µWs</tspan>
</text>
<path d="M 59 440 Q 275.0 439.6 491 440 Q 495 440 495 444 L 495 586 Q 495 590 491 590 Q 275.0 590.1 59 590 Q 55 590 55 586 L 55 444 Q 55 440 59 440" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="275.0" y="489.5" text-anchor="middle" style="font-size:25px">
<tspan x="275.0" dy="0">t = 2 s 行的 energy_delta</tspan>
<tspan x="275.0" dy="34.0">向后：3,000 − 1,000</tspan>
<tspan x="275.0" dy="34.0">= 2,000 µWs</tspan>
</text>
<path d="M 709 440 Q 925.0 440.6 1141 440 Q 1145 440 1145 444 L 1145 586 Q 1145 590 1141 590 Q 925.0 589.9 709 590 Q 705 590 705 586 L 705 444 Q 705 440 709 440" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="925.0" y="489.5" text-anchor="middle" style="font-size:25px">
<tspan x="925.0" dy="0">t = 2 s 的前向 [2,3) 区间</tspan>
<tspan x="925.0" dy="34.0">向前：8,000 − 3,000</tspan>
<tspan x="925.0" dy="34.0">= 5,000 µWs，平均 5 mW</tspan>
</text>
</svg>
