<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">转场与事务的稳定标识关联</title>
<desc id="desc">用transition、start/finish transaction、目标window/layer等身份关联两侧状态。 system_server记录创建/发送/完成等，Shell记录分派/合并/中止；finish不是显示正确证明。 transition id
对应server与Shell日志 → start / finish transaction id
再定位SF状态变化；start / finish transaction id
再定位SF状态变化 → window id / leash layer id
确认WM容器与内容对象；window id / leash layer id
确认WM容器与内容对象 → entry ts / 共享vsync_id
不冒充每笔客户端提交时刻</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
