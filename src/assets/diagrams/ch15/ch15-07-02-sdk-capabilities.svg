<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">API 35、36、36.1 与 37 的能力分层</title>
<desc id="desc">显式请求从 API 35 开始，trigger 注册及新增类型继续按完整 SDK 版本分层。 36.1 用 SDK_INT_FULL 判断；API 35 回调不调用 API 36 才加入的 getTriggerType，Mainline 与设备能力仍需验证。 API 35
四种显式请求与结果回调 → API 36
trigger 注册、ANR / fully drawn
结果新增 triggerType；API 36
trigger 注册、ANR / fully drawn
结果新增 triggerType → version 36.1
request running / all triggers
多种用户停止触发器；version 36.1
request running / all triggers
多种用户停止触发器 → API 37
OOM / COLD_START 等新增
按实际 trigger 能力接入</desc>
