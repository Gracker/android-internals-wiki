<path d="M 464 340 L 470 350 L 476 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890 180 L 890 260 L 730 260 L 730 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 724 340 L 730 350 L 736 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 280.0 60.6 491 60 Q 495 60 495 64 L 495 176 Q 495 180 491 180 Q 280.0 180.2 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="280.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="280.0" dy="0">分配 / 释放 PLT Hook</tspan>
<tspan x="280.0" dy="34.0">维护仍未释放块的地址、大小、栈</tspan>
</text>
<path d="M 679 60 Q 890.0 60.4 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.6 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">libmemunreachable</tspan>
<tspan x="890.0" dy="34.0">保守扫描取得不可达区间</tspan>
</text>
<path d="M 389 350 Q 600.0 349.4 811 350 Q 815 350 815 354 L 815 466 Q 815 470 811 470 Q 600.0 470.6 389 470 Q 385 470 385 466 L 385 354 Q 385 350 389 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
