<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">通用 cs-etm 与显式 ETR 的 sink 选择</title>
<desc id="desc">先发现可用 sink，再区分显式 ETR 配置与通用事件的按 CPU 选择。 config2 为 0 还要核对该 CPU 的 TRBE 支持集合；不存在可用 sink 或权限不足时采集仍会失败。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 600 180 L 600 255 L 215 255 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 255 L 985 255 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 59.3 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.6 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">ETM / ETE 控制流源</tspan>
<tspan x="600.0" dy="34.0">先核对可用事件与 sink</tspan>
</text>
<path d="M 69 340 Q 215.0 340.3 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.2 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">显式 cs-etm/@ETR/</tspan>
<tspan x="215.0" dy="34.0">config2 指向指定 ETR</tspan>
</text>
<path d="M 454 340 Q 600.0 340.5 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.2 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="374.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">通用 cs-etm + TRBE</tspan>
<tspan x="600.0" dy="34.0">config2 = 0</tspan>
<tspan x="600.0" dy="34.0">内核按 CPU 选择</tspan>
</text>
<path d="M 839 340 Q 985.0 340.1 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.4 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">通用 cs-etm，无 TRBE</tspan>
<tspan x="985.0" dy="34.0">选择可用 ETR 的配置</tspan>
</text>
</svg>
