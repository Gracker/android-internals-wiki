<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">durationMillis 的真正起点和终点</title>
<desc id="desc">durationMillis 是违规记录到队列前置回调执行时的 uptime 差，可能包含后续同步工作和调度等待。 条长为机制示意；不是 syscall 或网络请求精确耗时，也不保证队列已 idle。无 Looper 或 death-only 快捷路径为 -1，每批待处理记录有上限。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="680" fill="white"/>
<path d="M 69 40 Q 320.0 40.0 571 40 Q 575 40 575 44 L 575 156 Q 575 160 571 160 Q 320.0 160.1 69 160 Q 65 160 65 156 L 65 44 Q 65 40 69 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">记录 violation 的 uptime</tspan>
<tspan x="320.0" dy="34.0">检查点执行时刻</tspan>
</text>
<path d="M 629 40 Q 880.0 39.7 1131 40 Q 1135 40 1135 44 L 1135 156 Q 1135 160 1131 160 Q 880.0 160.7 629 160 Q 625 160 625 156 L 625 44 Q 625 40 629 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="880.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="880.0" dy="0">队列前置 Runnable 执行</tspan>
<tspan x="880.0" dy="34.0">取 uptime 并计算差值</tspan>
</text>
<text x="236" y="313" text-anchor="end" style="font-size:23px">
<tspan x="236" dy="0">当前消息</tspan>
</text>
<path d="M 250 329 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 254 290 Q 570.0 289.7 886 290 Q 890 290 890 294 L 890 323 Q 890 327 886 327 Q 570.0 326.2 254 327 Q 250 327 250 323 L 250 294 Q 250 290 254 290" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="570.0" y="316" text-anchor="middle" style="font-size:21px">
<tspan x="570.0" dy="0">违规后仍可能执行其他同步代码</tspan>
</text>
<text x="236" y="403" text-anchor="end" style="font-size:23px">
<tspan x="236" dy="0">前置 Runnable</tspan>
</text>
<path d="M 250 419 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 1004 380 Q 1060.0 379.7 1116 380 Q 1120 380 1120 384 L 1120 413 Q 1120 417 1116 417 Q 1060.0 417.2 1004 417 Q 1000 417 1000 413 L 1000 384 Q 1000 380 1004 380" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1060.0" y="406" text-anchor="middle" style="font-size:21px">
<tspan x="1060.0" dy="0">取结束时间</tspan>
</text>
<text x="236" y="493" text-anchor="end" style="font-size:23px">
<tspan x="236" dy="0">duration</tspan>
</text>
<path d="M 250 509 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 474 470 Q 735.0 469.4 996 470 Q 1000 470 1000 474 L 1000 503 Q 1000 507 996 507 Q 735.0 506.7 474 507 Q 470 507 470 503 L 470 474 Q 470 470 474 470" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="735.0" y="496" text-anchor="middle" style="font-size:21px">
<tspan x="735.0" dy="0">违规记录 → 前置回调取时</tspan>
</text>
</svg>
