<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">启动请求、phase 延迟与追加采集间隔</title>
<desc id="desc">该配置计划在启动时请求一次，再按 phase 与 interval 追加请求。 下列时间均相对数据源启动，表示请求计划；实际图的时间、成功率和完整性以记录与日志为准。 t = 0
启动时 SendSignal → t = 30 s
phase 后第一次追加；t = 30 s
phase 后第一次追加 → t = 90 s
再间隔 60 s 追加；t = 90 s
再间隔 60 s 追加 → t = 150 s
再间隔 60 s 追加；t = 150 s
再间隔 60 s 追加 → t = 180 s
示例会话到期停止</desc>
