<title id="title">数据源能力、容量与保留窗口</title>
<desc id="desc">从界面生成TraceConfig后，核对设备能力、buffer与目标窗口是否被保留。 采样和layer会扰动负载；长trace全开数据源并不保证证据更完整。 查询设备数据源与事件
确认App marker确实产生 → 保存GUI生成TraceConfig
buffer / fill policy / 周期；保存GUI生成TraceConfig
buffer / fill policy / 周期 → 检查覆盖、flush与停止时刻
验证目标窗口和丢失状态</desc>
