<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">从线上信号到可复现诊断</title>
<desc id="desc">线上探针保留异常与会话线索，平台聚合后用可复现场景继续诊断。 采样缺失和探针覆盖要明示，单条慢方法记录不能解释跨进程因果。 App 探针
选定操作与异常线索 → 受控上传与会话关联
采样、预算和版本维度；受控上传与会话关联
采样、预算和版本维度 → Perfetto / dump / 源码
复现场景、验证原因</desc>
