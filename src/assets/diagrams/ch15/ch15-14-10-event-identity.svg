<title id="title">先找事件身份，再解释预览帧率</title>
<desc id="desc">先发现track与精确事件名，再核对进程、stream、layer和每帧一事件约束。 请求提交频率、preview交付频率和显示频率分别回答不同问题。 发现查询
track id / name / 样本数 → 归属与对象身份
process / stream / layer
另记原始时间窗；归属与对象身份
process / stream / layer
另记原始时间窗 → 确认每目标帧一条事件
再统计gap与分布</desc>
