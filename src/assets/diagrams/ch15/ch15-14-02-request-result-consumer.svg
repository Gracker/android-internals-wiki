<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">请求、结果与每路 consumer 的公共路径</title>
<desc id="desc">App请求经cameraserver和HAL处理，返回的buffer再由framework路由到对应consumer。 metadata、shutter与各路buffer可分批返回，多帧也可重叠；此图只展开一笔请求的逻辑路径。 App / CameraX
frame number
目标Surface → cameraserver / RequestThread
settings与buffer准备；cameraserver / RequestThread
settings与buffer准备 → HAL / sensor / ISP
异步执行与多路输出；HAL / sensor / ISP
异步执行与多路输出 → shutter / metadata / buffer
分别按接口规则回传；shutter / metadata / buffer
分别按接口规则回传 → framework输出路由
按stream归还buffer和fence；framework输出路由
按stream归还buffer和fence → 对应consumer处理
preview / record
analysis / still</desc>
