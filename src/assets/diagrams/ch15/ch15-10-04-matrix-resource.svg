<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Activity 留存观察与可选堆处理</title>
<desc id="desc">Activity 销毁进入观察队列，重试后仍留存的对象按配置交给处理器。 弱引用仍存活是尚未回收的证据；是否 dump、裁剪、fork 或分析由 DumpMode 决定。 onActivityDestroyed
记录待检查对象 → 后台重试与 GC / 存活检查
去重并排除暂时留存；后台重试与 GC / 存活检查
去重并排除暂时留存 → 按 DumpMode 选择处理器
仅报告 / dump / 分析</desc>
