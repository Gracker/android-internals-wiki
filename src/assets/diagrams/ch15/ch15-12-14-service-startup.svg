<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">两条初始化线程与 tracer 生命周期</title>
<desc id="desc">GpuMem 与 tracer 在同一初始化线程内先后执行，GpuWork 在另一线程独立初始化。 析构stop并join两条初始化线程；tracer常驻工作线程已detach，不能当作通用可反复销毁组件。 memory初始化从构造线程分离；GpuWork是另一条并行初始化线程；同一线程内先GpuMem，后GpuMemTracer</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="850" fill="white"/>
<path d="M 500 180 L 500 260 L 280 260 L 280 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 274 330 L 280 340 L 286 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 180 L 700 260 L 890 260 L 890 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 330 L 890 340 L 896 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 280 460 L 280 590" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 274 580 L 280 590 L 286 580" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 59.3 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.2 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">GpuService 构造</tspan>
<tspan x="600.0" dy="34.0">同步创建核心对象</tspan>
</text>
<path d="M 69 340 Q 280.0 340.3 491 340 Q 495 340 495 344 L 495 456 Q 495 460 491 460 Q 280.0 460.7 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="280.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="280.0" dy="0">初始化线程A</tspan>
<tspan x="280.0" dy="34.0">GpuMem.initialize</tspan>
</text>
<path d="M 679 340 Q 890.0 339.6 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.9 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">初始化线程B</tspan>
<tspan x="890.0" dy="34.0">GpuWork.initialize</tspan>
</text>
<path d="M 69 590 Q 280.0 589.4 491 590 Q 495 590 495 594 L 495 706 Q 495 710 491 710 Q 280.0 710.1 69 710 Q 65 710 65 706 L 65 594 Q 65 590 69 590" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="280.0" y="641.5" text-anchor="middle" style="font-size:25px">
<tspan x="280.0" dy="0">GpuMemTracer.initialize</tspan>
<tspan x="280.0" dy="34.0">先检查GpuMem已成功</tspan>
</text>
</svg>
