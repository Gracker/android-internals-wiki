<title id="title">从系统异常窗口深入到帧内资源</title>
<desc id="desc">先在系统时间线找到异常帧，再用对照实验和命令资源证据解释原因。 捕获单帧可能改变时序，GPU counter 的解释仍需设备与厂商文档。 系统时间线
CPU / GPU / SF / HWC → 单变量实验
分辨率、pass、shader；单变量实验
分辨率、pass、shader → 帧捕获与厂商证据
命令、资源、微架构</desc>
