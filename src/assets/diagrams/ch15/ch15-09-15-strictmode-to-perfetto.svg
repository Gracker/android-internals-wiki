<text x="215.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">StrictMode 发现可疑路径</tspan>
<tspan x="215.0" dy="32.64">操作类别与调用栈线索</tspan>
</text>
<path d="M 454 60 Q 600.0 59.6 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.6 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="97.56" text-anchor="middle" style="font-size:22px">
