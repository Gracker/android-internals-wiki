<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">从操作违规定位到真实时序调查</title>
<desc id="desc">StrictMode 给出可疑操作类别和调用栈，再用 Trace section 与实际时间轴判断工作或等待。 Trace.beginSection 不启动采集；只分析实际启用并覆盖该窗口的数据源。近似 violation duration 不等于 CPU、I/O 或 Binder 的独立耗时。 StrictMode 发现可疑路径
操作类别与调用栈线索 → 为同步路径加 Trace section
begin / finally end 配对；为同步路径加 Trace section
begin / finally end 配对 → Perfetto 对齐 slice
线程状态与跨线程依赖</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
