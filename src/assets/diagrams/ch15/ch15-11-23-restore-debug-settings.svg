<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">采集前快照与采集后恢复</title>
<desc id="desc">采集前保存共享配置，结束后按原值恢复，再重启 App 检查实际后端。 删除示例仅适用于原本未设置且无其他任务使用；空属性值必须保留到设备 shell。 采集前保存 global / 属性
确认无冲突采集任务 → 结束后恢复旧值
原本未设置才按前提删除；结束后恢复旧值
原本未设置才按前提删除 → 重启 App 并查询验证
settings / getprop / driver</desc>
