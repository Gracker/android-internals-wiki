<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">从短采集测量 trace 生成速率</title>
<desc id="desc">先用短采集测量实际 bytes/s，再按目标时长与采样配置估算 buffer。 counter数×频率×时长只是样本数估计；整数varint、double、descriptor与packet都有不同开销。 选择counter与采样周期
先检查block与设备支持 → 短时录制
测bytes/s、丢失与实际字段；短时录制
测bytes/s、丢失与实际字段 → 目标时长 / buffer规划
再验证全长采集是否丢失</desc>
