<text x="600.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">key 高32位 = GPU ID</tspan>
<tspan x="600.0" dy="32.64">低32位 = PID；value总量</tspan>
</text>
<path d="M 69 340 Q 215.0 340.1 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.6 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">size == 0</tspan>
<tspan x="215.0" dy="34.0">删除该组合的entry</tspan>
</text>
<path d="M 454 340 Q 600.0 340.8 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.6 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.84000000000003" text-anchor="middle" style="font-size:24px">
