<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从 Project 到可分析的 trace</title>
<desc id="desc">配置录制并执行固定操作，结束取回trace后保存本次条件与分析产物。 进入同一Project不代表设备、温度、构建或采样配置相同。 Project / Record Trace
选择设备与launch mode → 配置trigger与data sources
固定输入和环境；配置trigger与data sources
固定输入和环境 → 执行 → Stop / Duration
取回trace并打开Trace View；执行 → Stop / Duration
取回trace并打开Trace View → 保留配置与原始trace
再标记帧、查询与结论</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
