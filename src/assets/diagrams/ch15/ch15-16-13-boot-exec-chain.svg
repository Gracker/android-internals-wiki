<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">启动加载链沿 execve 传递控制</title>
<desc id="desc">init同步等待同一加载进程依次完成模块、平台和vendor阶段。 UprobeStats loader为条件步骤；成功execve替换进程而保留PID，最终done不证明每项对象成功。 init挂载bpffs
post-fs-data后触发加载 → netbpfload
加载Connectivity对象；netbpfload
加载Connectivity对象 → 可选uprobestatsbpfload
存在且exec成功时接力；可选uprobestatsbpfload
存在且exec成功时接力 → Rust平台bpfloader
按注册清单加载system对象；Rust平台bpfloader
按注册清单加载system对象 → vendorBpfLoader
兼容vendor目录旧式.o；vendorBpfLoader
兼容vendor目录旧式.o → netbpfload done
置完成属性，再允许启动netd</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
