<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">缓冲区满时保留开头还是近期活动</title>
<desc id="desc">RING 保存靠近停止点的近期活动，DISCARD 优先保留采集开头。 条长为示意；策略不扩展允许的数据源，也不保证请求 buffer / 时长原值生效，服务还会按范围裁剪。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="650" fill="white"/>
<path d="M 84 45 Q 310.0 44.7 536 45 Q 540 45 540 49 L 540 166 Q 540 170 536 170 Q 310.0 169.4 84 170 Q 80 170 80 166 L 80 49 Q 80 45 84 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="99.0" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">RING_BUFFER</tspan>
<tspan x="310.0" dy="34.0">写满后覆盖最旧事件</tspan>
</text>
<path d="M 664 45 Q 890.0 45.6 1116 45 Q 1120 45 1120 49 L 1120 166 Q 1120 170 1116 170 Q 890.0 169.9 664 170 Q 660 170 660 166 L 660 49 Q 660 45 664 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="99.0" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">DISCARD</tspan>
<tspan x="890.0" dy="34.0">写满后丢弃新事件</tspan>
</text>
<text x="226" y="353" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">RING 保留</tspan>
</text>
<path d="M 240 369 H 1110" stroke="#777777" stroke-width="1.5"/>
<path d="M 694 330 Q 885.0 330.1 1076 330 Q 1080 330 1080 334 L 1080 363 Q 1080 367 1076 367 Q 885.0 366.5 694 367 Q 690 367 690 363 L 690 334 Q 690 330 694 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="885.0" y="356" text-anchor="middle" style="font-size:21px">
<tspan x="885.0" dy="0">较新的近期活动</tspan>
</text>
<text x="226" y="463" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">DISCARD 保留</tspan>
</text>
<path d="M 240 479 H 1110" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 440 Q 435.0 440.2 626 440 Q 630 440 630 444 L 630 473 Q 630 477 626 477 Q 435.0 476.8 244 477 Q 240 477 240 473 L 240 444 Q 240 440 244 440" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="435.0" y="466" text-anchor="middle" style="font-size:21px">
<tspan x="435.0" dy="0">采集开始的早期活动</tspan>
</text>
</svg>
