<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">目标授权、运行器与事件权限的三道门</title>
<desc id="desc">应用采样先核对构建授权，再由版本分支选择运行器，最后实际打开事件。 A17 在 Android 16+ 优先内置 runner；NDK 脚本版本、设备程序和内核权限必须分别保存。 确认目标构建与 UID
profileable / debuggable / root → RunInAppContext
按版本尝试可用运行器；RunInAppContext
按版本尝试可用运行器 → 内置 runner 或 run-as
后者要求 debuggable；内置 runner 或 run-as
后者要求 debuggable → 打开实际 perf 事件
核对 PMU / 内核 / SELinux</desc>
