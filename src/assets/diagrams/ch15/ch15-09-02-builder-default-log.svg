<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">listener-only 与默认日志补充条件</title>
<desc id="desc">没有 listener、mask 非零且四种通用 penalty 都没有时，固定 r1 才自动补日志。 listener-only 不自动 log；flash 或 death-on-network 没有单独满足这组通用 penalty 条件，仍可能补 log。 按Builder实际状态选择默认log处理；按Builder实际状态选择默认log处理；按Builder实际状态选择默认log处理</desc>
