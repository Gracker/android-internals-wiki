<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">配置请求到实际 GPU 轨道</title>
<desc id="desc">查询能力、请求字段并检查实际数据，三步都通过才有可用轨道。 low_overhead 默认关闭；单 workload stage 是支持该选项的 producer 的执行请求。 查询 data-source descriptor
名称 / producer / 权限 → TraceConfig 请求
采样、buffer 与可选合并；TraceConfig 请求
采样、buffer 与可选合并 → 录制并检查结果
轨道、丢失、字段与单位</desc>
