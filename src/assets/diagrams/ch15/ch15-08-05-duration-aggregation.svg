<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">SUM 的重叠合并与 MAX_SPARSE 的结束归属</title>
<desc id="desc">同一 SUM tracker 的重叠活动只累计一次；MAX_SPARSE 选结束在该 bucket 的完整累计活动时长最大值。 示例假设条件恒真且无丢事件，时间单位相同；MAX_SPARSE 本例为 4，未结束区间可跨 bucket 保留，不能只裁剪为本 bucket 重叠长度。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="650" fill="white"/>
<path d="M 69 40 Q 320.0 40.1 571 40 Q 575 40 575 44 L 575 156 Q 575 160 571 160 Q 320.0 159.6 69 160 Q 65 160 65 156 L 65 44 Q 65 40 69 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">SUM：同一 tracker 内</tspan>
<tspan x="320.0" dy="34.0">活动区间取并集，重叠只计一次</tspan>
</text>
<path d="M 629 40 Q 880.0 39.7 1131 40 Q 1135 40 1135 44 L 1135 156 Q 1135 160 1131 160 Q 880.0 160.3 629 160 Q 625 160 625 156 L 625 44 Q 625 40 629 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="880.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="880.0" dy="0">MAX_SPARSE：区间结束时</tspan>
<tspan x="880.0" dy="34.0">完整累计活动时长参与最大值</tspan>
</text>
<text x="246" y="293" text-anchor="end" style="font-size:23px">
<tspan x="246" dy="0">示例活动 A</tspan>
</text>
<path d="M 260 309 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 364 270 Q 560.0 270.6 756 270 Q 760 270 760 274 L 760 303 Q 760 307 756 307 Q 560.0 306.4 364 307 Q 360 307 360 303 L 360 274 Q 360 270 364 270" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="560.0" y="296" text-anchor="middle" style="font-size:21px">
<tspan x="560.0" dy="0">t=1 → 5，持续 4</tspan>
</text>
<text x="246" y="378" text-anchor="end" style="font-size:23px">
<tspan x="246" dy="0">示例活动 B</tspan>
</text>
<path d="M 260 394 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 564 355 Q 760.0 354.3 956 355 Q 960 355 960 359 L 960 388 Q 960 392 956 392 Q 760.0 391.3 564 392 Q 560 392 560 388 L 560 359 Q 560 355 564 355" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="760.0" y="381" text-anchor="middle" style="font-size:21px">
<tspan x="760.0" dy="0">t=3 → 7，持续 4</tspan>
</text>
<text x="246" y="463" text-anchor="end" style="font-size:23px">
<tspan x="246" dy="0">SUM 并集</tspan>
</text>
<path d="M 260 479 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 364 440 Q 660.0 439.6 956 440 Q 960 440 960 444 L 960 473 Q 960 477 956 477 Q 660.0 477.7 364 477 Q 360 477 360 473 L 360 444 Q 360 440 364 440" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="660.0" y="466" text-anchor="middle" style="font-size:21px">
<tspan x="660.0" dy="0">t=1 → 7：合计 6，不是 8</tspan>
</text>
</svg>
