<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">错误码与文件路径的双重守卫</title>
<desc id="desc">先用 errorCode 判成功，再检查路径及文件可读性；失败记录使用自己的请求身份。 固定 r1 部分失败回调可能把 null 拼入路径字符串；路径非空不能证明成功，tag + 错误码也不是独立失败的唯一键。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
