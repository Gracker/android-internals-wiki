<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">replay opcode</tspan>
<tspan x="215.0" dy="34.0">引用目标资源 ID</tspan>
</text>
<path d="M 454 60 Q 600.0 60.5 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.6 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">GAPIR 请求 / cache 命中</tspan>
<tspan x="600.0" dy="32.64">缺失资源经 GAPIS 传输</tspan>
</text>
<path d="M 839 60 Q 985.0 59.4 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.1 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="985.0" dy="0">设备重建 buffer / texture</tspan>
<tspan x="985.0" dy="32.64">仍受实际内存预算约束</tspan>
</text>
</svg>
