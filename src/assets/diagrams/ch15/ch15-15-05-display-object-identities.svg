<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从 Display 到实际内容对象</title>
<desc id="desc">按Display、Window/Task、layer/leash和Producer建立对象映射。 同名layer、同一进程或相近present时间都不足以证明对象相同；多个Display分别对齐。 目标Display / 时间点
刷新率、窗口与显示配置 → Window / Task / token
区分宿主pane与独立窗口；Window / Task / token
区分宿主pane与独立窗口 → layer id / parent / owner
区分container、内容与旧实例；layer id / parent / owner
区分container、内容与旧实例 → 实际Producer与buffer流
frame number与同步证据</desc>
