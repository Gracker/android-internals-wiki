<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">先关联对象，再解释 counter</title>
<desc id="desc">从异常显示帧反查 Producer 与同步链，最后解释属于该区间的 counter。 跨设备、热状态或counter组合改变后不能直接比较绝对值。 显示帧 / layer / present
固定异常窗口与对象 → Producer / queue / submission
对应 buffer 和 fence；Producer / queue / submission
对应 buffer 和 fence → 同归属 GPU 区间的 counter
核对单位、周期与block；同归属 GPU 区间的 counter
核对单位、周期与block → 相同条件基线与改动
记录推断和对照结果</desc>
