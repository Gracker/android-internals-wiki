<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ProtoPack 的类型、对象与父子关系</title>
<desc id="desc">gfxtrace 由 ProtoPack v2 组织类型描述与对象，父回指保存消息组关系。 16字节 magic 后并非单个 protobuf；容器结构本身不保证压缩、随机访问或损坏恢复。 16 字节 ProtoPack magic
识别容器版本 → 类型定义可与对象交错
先于对应对象 / descriptor；类型定义可与对象交错
先于对应对象 / descriptor → 对象 / 消息组
父回指、类型 ID、数据；对象 / 消息组
父回指、类型 ID、数据 → 初始状态、command、资源
由 GAPIS 解释内容</desc>
