<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">两个启动 trigger 的不同时间窗口</title>
<desc id="desc">APP_FULLY_DRAWN 取已有记录的近期窗口，COLD_START 尝试为本次启动新开采集并保留早期事件。 条长不是实测；两者都可能有延迟。冷启动默认时长约 5 秒且可配置，不保证覆盖启动最早指令，两种样本分开统计。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="680" fill="white"/>
<path d="M 84 45 Q 310.0 45.3 536 45 Q 540 45 540 49 L 540 186 Q 540 190 536 190 Q 310.0 190.8 84 190 Q 80 190 80 186 L 80 49 Q 80 45 84 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="109.0" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">APP_FULLY_DRAWN</tspan>
<tspan x="310.0" dy="34.0">冷启动完整绘制后请求已有 trace 快照</tspan>
</text>
<path d="M 664 45 Q 890.0 45.5 1116 45 Q 1120 45 1120 49 L 1120 186 Q 1120 190 1116 190 Q 890.0 189.5 664 190 Q 660 190 660 186 L 660 49 Q 660 45 664 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="109.0" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">COLD_START：API 37</tspan>
<tspan x="890.0" dy="34.0">冷启动时新开 system trace + stack</tspan>
</text>
<text x="226" y="373" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">已有后台 Trace</tspan>
</text>
<path d="M 240 389 H 1110" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 350 Q 565.0 349.6 886 350 Q 890 350 890 354 L 890 383 Q 890 387 886 387 Q 565.0 386.7 244 387 Q 240 387 240 383 L 240 354 Q 240 350 244 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="565.0" y="376" text-anchor="middle" style="font-size:21px">
<tspan x="565.0" dy="0">近期历史；事件后异步请求快照</tspan>
</text>
<text x="226" y="483" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">新 COLD_START</tspan>
</text>
<path d="M 240 499 H 1110" stroke="#777777" stroke-width="1.5"/>
<path d="M 344 460 Q 700.0 460.5 1056 460 Q 1060 460 1060 464 L 1060 493 Q 1060 497 1056 497 Q 700.0 496.2 344 497 Q 340 497 340 493 L 340 464 Q 340 460 344 460" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="700.0" y="486" text-anchor="middle" style="font-size:21px">
<tspan x="700.0" dy="0">异步开录 → fully drawn 或配置时长结束</tspan>
</text>
</svg>
