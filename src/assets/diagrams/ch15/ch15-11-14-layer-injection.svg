<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从全局选择到进程内拦截</title>
<desc id="desc">global settings 选包与 layer，进程内 loader 发现 wrapper，再装载真正的拦截库。 Android ABI 与注入条件先核对；JSON 中 gapid 导出映射与 Android wrapper 名称分开读。 四个 global keys
启用、App、提供 APK、layer → 目标 App Vulkan loader
检查权限与匹配 ABI；目标 App Vulkan loader
检查权限与匹配 ABI → GraphicsSpy wrapper
libVkLayer_GraphicsSpy.so；GraphicsSpy wrapper
libVkLayer_GraphicsSpy.so → dlopen 同目录 libgapii.so
转发 gapid_ 地址查询</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
