<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">Snapshot fast path 与本轮合成的分离</title>
<desc id="desc">Content/Buffer 条件只是 fast path 的一部分，还要满足 caller 的配置门槛才能省去完整重算。 frontend_caching_v0 会改变 forceUpdate 和 manager 配置；跳过 hierarchy 遍历不表示本帧不合成。 检查全局变化和配置；满足caller全部门槛；不满足提前返回条件；重算范围不决定是否合成；合成依据独立判断</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1080" fill="white"/>
<path d="M 600 160 L 600 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 260 L 600 270 L 606 260" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 385 L 600 455 L 275 455 L 275 535" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 269 525 L 275 535 L 281 525" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 385 L 600 455 L 925 455 L 925 535" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 919 525 L 925 535 L 931 525" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 275 665 L 275 745 L 600 745 L 600 830" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 820 L 600 830 L 606 820" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 925 665 L 925 745 L 600 745 L 600 830" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 820 L 600 830 L 606 820" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 424 40 Q 600.0 39.4 776 40 Q 780 40 780 44 L 780 156 Q 780 160 776 160 Q 600.0 160.3 424 160 Q 420 160 420 156 L 420 44 Q 420 40 424 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">变化与 force / display 配置</tspan>
<tspan x="600.0" dy="34.0">先进入 tryFastUpdate</tspan>
</text>
<path d="M 424 270 Q 600.0 270.5 776 270 Q 780 270 780 274 L 780 381 Q 780 385 776 385 Q 600.0 385.3 424 385 Q 420 385 420 381 L 420 274 Q 420 270 424 270" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="319.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">按配置 merge snapshot</tspan>
<tspan x="600.0" dy="34.0">判断能否使用 fast path</tspan>
</text>
<path d="M 59 535 Q 275.0 534.6 491 535 Q 495 535 495 539 L 495 661 Q 495 665 491 665 Q 275.0 665.7 59 665 Q 55 665 55 661 L 55 539 Q 55 535 59 535" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="275.0" y="574.5" text-anchor="middle" style="font-size:25px">
<tspan x="275.0" dy="0">tryFastUpdate 返回 true</tspan>
<tspan x="275.0" dy="34.0">且 mergeable manager 为空</tspan>
<tspan x="275.0" dy="34.0">跳过完整 hierarchy 重算</tspan>
</text>
<path d="M 709 535 Q 925.0 535.1 1141 535 Q 1145 535 1145 539 L 1145 661 Q 1145 665 1141 665 Q 925.0 664.3 709 665 Q 705 665 705 661 L 705 539 Q 705 535 709 535" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="925.0" y="574.5" text-anchor="middle" style="font-size:25px">
<tspan x="925.0" dy="0">force / display 或其他变化</tspan>
<tspan x="925.0" dy="34.0">或 mergeable manager 非空</tspan>
<tspan x="925.0" dy="34.0">进入 updateSnapshots</tspan>
</text>
<path d="M 364 830 Q 600.0 830.7 836 830 Q 840 830 840 834 L 840 946 Q 840 950 836 950 Q 600.0 950.8 364 950 Q 360 950 360 946 L 360 834 Q 360 830 364 830" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="881.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">另行判断是否合成</tspan>
<tspan x="600.0" dy="34.0">Content / Buffer 仍可推动合成</tspan>
</text>
</svg>
