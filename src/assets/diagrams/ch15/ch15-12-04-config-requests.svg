<title id="title">采集能力、配置与测量条件</title>
<desc id="desc">先核对 descriptor 能力，再选择周期与 ID，并标明插桩和固定频率的条件。 instrumented_sampling 和 fix_gpu_clock 是请求；实际执行受 producer 支持限制。 descriptor能力
周期范围、block、插桩支持 → GpuCounterConfig
周期 / IDs / 插桩 / 固定频率；GpuCounterConfig
周期 / IDs / 插桩 / 固定频率 → 实际采集与结果核对
运行条件、单位和采集缺失</desc>
