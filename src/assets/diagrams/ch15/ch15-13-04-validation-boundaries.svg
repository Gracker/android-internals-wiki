<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">主机、设备与数据源逐层验证</title>
<desc id="desc">先满足主机与设备要求，再通过设备验证并确认目标数据源实际可用。 Android12+只是最低条件；空GPU轨道只表明未获得该证据，不能判定没有GPU工作。 主机 SDK 配置
ANDROID_HOME
Mac:12+ / Apple Silicon → Android12+ / USB / adb
首次设备validation；Android12+ / USB / adb
首次设备validation → 实际 producer / driver支持
再核对所需轨道与字段</desc>
