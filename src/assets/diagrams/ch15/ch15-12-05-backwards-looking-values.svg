<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">当前报告回填上一行的 GPU counter</title>
<desc id="desc">每次先在当前时间戳放0，再把当前报告值写到上一行。 示例时刻和数值是合成输入；首条报告缺少左边界，末行0也可能只是占位。 当前t20报告回填此前t10行；当前t35报告回填此前t20行；t35同时建立新的零占位行</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 600 180 L 600 250 L 215 250 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 180 L 985 285 L 600 285 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1080 180 L 1080 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1074 330 L 1080 340 L 1086 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.5 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.7 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">t=10，报告90</tspan>
<tspan x="215.0" dy="34.0">此前无上一行，舍弃90</tspan>
</text>
<path d="M 454 60 Q 600.0 59.9 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.7 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">t=20，报告4</tspan>
<tspan x="600.0" dy="34.0">回填 t=10 的样本</tspan>
</text>
<path d="M 839 60 Q 985.0 60.1 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.7 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">t=35，报告8</tspan>
<tspan x="985.0" dy="34.0">回填 t=20 的样本</tspan>
</text>
<path d="M 69 340 Q 215.0 339.7 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.3 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">最终 row：t=10，值4</tspan>
<tspan x="215.0" dy="34.0">对应区间 [10,20)</tspan>
</text>
<path d="M 454 340 Q 600.0 340.2 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.6 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">最终 row：t=20，值8</tspan>
<tspan x="600.0" dy="34.0">对应区间 [20,35)</tspan>
</text>
<path d="M 839 340 Q 985.0 339.4 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.9 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">最终 row：t=35，值0</tspan>
<tspan x="985.0" dy="34.0">新建的末行占位</tspan>
</text>
</svg>
