<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">应用抓帧与系统显示证据的接点</title>
<desc id="desc">应用图形捕获解释 Producer 工作；同一显示周期还需连接 buffer、latch、合成与 present。 vkQueuePresentKHR 返回不代表 GPU 或显示已完成；acquire fence 同步依赖并非强制位于 queue 前。 AGI App API / resources
包含应用侧 present 调用 → buffer / frame 标识关联
queue 与 acquire fence；buffer / frame 标识关联
queue 与 acquire fence → SF / HWC / RenderEngine
readiness、latch 与合成；SF / HWC / RenderEngine
readiness、latch 与合成 → display present 反馈
面板光学响应另测</desc>
