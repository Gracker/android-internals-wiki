<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">BPF 初始化的重试与成功条件</title>
<desc id="desc">等待加载、获取程序、attach成功并打开只读map后，GpuMem才标记初始化完成。 attach失败时才检查stop与重试上限；约30秒后停止该实例初始化，tracer不会在失败时注册。 waitForProgsLoaded
取得 pinned program fd → attach gpu_mem_total
失败：stop / 超时 / 1秒重试；attach gpu_mem_total
失败：stop / 超时 / 1秒重试 → BpfMapRO打开有效map
设置 mInitialized=true；BpfMapRO打开有效map
设置 mInitialized=true → 注册android.gpu.memory
启动tracer常驻线程</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 525 120.0 L 675 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 665 114.0 L 675 120.0 L 665 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 60.0 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 180.4 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">waitForProgsLoaded</tspan>
<tspan x="310.0" dy="34.0">取得 pinned program fd</tspan>
</text>
<path d="M 679 60 Q 890.0 60.2 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.5 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">attach gpu_mem_total</tspan>
<tspan x="890.0" dy="34.0">失败：stop / 超时 / 1秒重试</tspan>
</text>
<path d="M 679 340 Q 890.0 339.4 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.9 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">BpfMapRO打开有效map</tspan>
<tspan x="890.0" dy="34.0">设置 mInitialized=true</tspan>
</text>
<path d="M 99 340 Q 310.0 340.4 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 459.8 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">注册android.gpu.memory</tspan>
<tspan x="310.0" dy="34.0">启动tracer常驻线程</tspan>
</text>
<rect x="554.0" y="75.0" width="92.0" height="36.3" fill="white"/>
<text x="600" y="100" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">fd 有效</tspan>
</text>
<rect x="820.0" y="245.0" width="140.0" height="36.3" fill="white"/>
<text x="890" y="270" text-anchor="middle" style="font-size:23px">
<tspan x="890" dy="0">attach 成功</tspan>
</text>
</svg>
