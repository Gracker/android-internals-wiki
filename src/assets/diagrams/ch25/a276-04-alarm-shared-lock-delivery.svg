<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="855" viewBox="0 0 1200 855" role="img" aria-labelledby="title desc">
<title id="title">Alarm投递完成与共享锁释放分别记账</title>
<desc id="desc">显示普通广播、goAsync和Listener两类完成协议及超时，避免把onReceive返回当所有路径终点。 固定17r1；系统共享锁可能同时保护多笔投递；接收器与Listener都有有界时限。 广播投递进入完成协议；Listener投递进入完成协议；广播最终完成后更新计数；Listener完成或超时更新计数；没有其他在途投递才物理释放</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="855" fill="white"/>
<path d="M 480 130 L 480 210 L 295 210 L 295 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 289 270 L 295 280 L 301 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 720 130 L 720 210 L 905 210 L 905 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 899 270 L 905 280 L 911 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 295 375 L 295 440 L 480 440 L 480 500" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 474 490 L 480 500 L 486 490" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 905 375 L 905 440 L 720 440 L 720 500" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 714 490 L 720 500 L 726 490" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 595 L 600 700" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 690 L 600 700 L 606 690" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 364 35 Q 600.0 34.8 836 35 Q 840 35 840 39 L 840 126 Q 840 130 836 130 Q 600.0 129.7 364 130 Q 360 130 360 126 L 360 39 Q 360 35 364 35" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="74.68" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">投递前 acquire共享WakeLock</tspan>
<tspan x="600.0" dy="31.28">增加在途投递计数</tspan>
</text>
<path d="M 44 280 Q 295.0 280.6 546 280 Q 550 280 550 284 L 550 371 Q 550 375 546 375 Q 295.0 375.0 44 375 Q 40 375 40 371 L 40 284 Q 40 280 44 280" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="295.0" y="319.68" text-anchor="middle" style="font-size:23px">
<tspan x="295.0" dy="0">PendingIntent广播</tspan>
<tspan x="295.0" dy="31.28">同步onReceive / goAsync+finish</tspan>
</text>
<path d="M 654 280 Q 905.0 280.4 1156 280 Q 1160 280 1160 284 L 1160 371 Q 1160 375 1156 375 Q 905.0 374.5 654 375 Q 650 375 650 371 L 650 284 Q 650 280 654 280" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="905.0" y="319.68" text-anchor="middle" style="font-size:23px">
<tspan x="905.0" dy="0">OnAlarmListener</tspan>
<tspan x="905.0" dy="31.28">onAlarm finally → alarmComplete</tspan>
</text>
<path d="M 364 500 Q 600.0 499.5 836 500 Q 840 500 840 504 L 840 591 Q 840 595 836 595 Q 600.0 594.3 364 595 Q 360 595 360 591 L 360 504 Q 360 500 364 500" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="539.6800000000001" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">onSendFinished / 完成或超时</tspan>
<tspan x="600.0" dy="31.28">移除本笔in-flight并减少计数</tspan>
</text>
<path d="M 364 700 Q 600.0 700.5 836 700 Q 840 700 840 704 L 840 791 Q 840 795 836 795 Q 600.0 795.2 364 795 Q 360 795 360 791 L 360 704 Q 360 700 364 700" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="739.6800000000001" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">最后一笔计数归零</tspan>
<tspan x="600.0" dy="31.28">release共享锁</tspan>
</text>
</svg>
