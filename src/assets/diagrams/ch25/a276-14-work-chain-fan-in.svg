<tspan x="990.0" dy="0">Upload</tspan>
<tspan x="990.0" dy="31.28">Merge成功后才运行</tspan>
</text>
<text x="600" y="565" text-anchor="middle" style="font-size:21px">
<tspan x="600" dy="0">默认Overwriting合并不依赖覆盖顺序；Data≤10KiB，大对象用持久主键或URI</tspan>
