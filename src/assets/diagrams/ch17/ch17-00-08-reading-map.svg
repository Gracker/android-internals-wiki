<title id="title">从工具入口走向采集机制与端侧集成</title>
<desc id="desc">按工具选型、机制定位与端侧集成三个层次阅读，避免重复接入功能重叠的 SDK。 章节路径是本书的组织方式，具体接入仍按固定版本、能力与开销验收。 17.1–17.7
工具选型与实验协议 → 17.8–17.11
网络 / 退出 / 资源 / 混合栈；17.8–17.11
网络 / 退出 / 资源 / 混合栈 → 17.12
有界准入、可恢复存储与上传</desc>
