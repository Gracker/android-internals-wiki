<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">异步跨度与实际提交终点</title>
<desc id="desc">异步跨度覆盖请求、线程切换和提交接口返回，线程内工作另作同步标记。 submitList返回不等于diff完成或画面可见；关闭点须覆盖成功、失败、取消和拒绝。 生成同名并发唯一cookie
开始async span → I/O线程
同步标记请求调用；I/O线程
同步标记请求调用 → 主线程
同步标记submitList调用；主线程
同步标记submitList调用 → finally结束async span
这里只到提交返回；finally结束async span
这里只到提交返回 → 若要测提交完成或可见
另定义完成信号和生命周期</desc>
