<title id="title">Flutter Android 线程模型的版本边界</title>
<desc id="desc">分别按固定 tag 核对默认线程关系与旧 opt-out 配置的处理。 3.44—3.47 旧 metadata key 只要存在就被拒绝，写 false 也不能代替删除。 3.27.0
默认分离，可manifest启用 → 3.29–3.35
默认合并，仍可旧key退出；3.29–3.35
默认合并，仍可旧key退出 → 3.38–3.41
旧退出key为true即异常；3.38–3.41
旧退出key为true即异常 → 3.44–3.47.0
旧key存在即拒绝</desc>
