<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">文档、发布物与仓库的四条时间线</title>
<desc id="desc">README、Android发布物和跨平台仓库分别固定，发布版行为由同版制品确认。 iOS release不代表Android新版；master未发布版本不能覆盖3.7.11结论。 </desc>
