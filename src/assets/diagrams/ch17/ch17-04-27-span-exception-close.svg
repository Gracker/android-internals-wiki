<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">父子span在成功与失败路径都收尾</title>
<desc id="desc">令牌化子span和支付父span分别设置状态，各自finally结束，异常继续交还业务层。 nullable builder或采样可能没有数据；只结束父span不能替代子span收尾。 开始支付父span
稳定名称与受控属性 → builder.setParent
开始令牌化子span；builder.setParent
开始令牌化子span → 令牌化成功/失败设状态
子finally.end；子步骤成功后才继续提交订单；继续提交订单
父span记录checkpoint → 外层成功/失败设状态
父finally.end；子步骤失败直接进入外层catch并finally结束父span</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
