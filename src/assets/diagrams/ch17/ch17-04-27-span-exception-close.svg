<path d="M 985.0 180 L 985.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979.0 330 L 985.0 340 L 991.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 835 400.0 L 750 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 760 394.0 L 750 400.0 L 760 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 180 L 985 255 L 600 255 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.3 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.8 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">开始支付父span</tspan>
<tspan x="215.0" dy="34.0">稳定名称与受控属性</tspan>
</text>
<path d="M 454 60 Q 600.0 59.6 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.2 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">builder.setParent</tspan>
<tspan x="600.0" dy="34.0">开始令牌化子span</tspan>
</text>
<path d="M 839 60 Q 985.0 60.6 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.9 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">令牌化成功/失败设状态</tspan>
<tspan x="985.0" dy="34.0">子finally.end</tspan>
</text>
<path d="M 839 340 Q 985.0 340.1 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.6 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">子步骤成功才提交订单</tspan>
<tspan x="985.0" dy="34.0">父span记录checkpoint</tspan>
</text>
<path d="M 454 340 Q 600.0 339.6 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.0 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">外层成功/失败设状态</tspan>
<tspan x="600.0" dy="34.0">父finally.end</tspan>
</text>
<rect x="1059.0" y="260.0" width="62.0" height="36.3" fill="white"/>
