<tspan x="1090" dy="0">成功</tspan>
</text>
<rect x="729.0" y="210.0" width="62.0" height="36.3" fill="white"/>
<text x="760" y="235" text-anchor="middle" style="font-size:23px">
<tspan x="760" dy="0">异常</tspan>
</text>
</svg>
