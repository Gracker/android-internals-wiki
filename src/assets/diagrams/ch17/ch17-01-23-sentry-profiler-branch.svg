<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Sentry固定8.53的profiling分支</title>
<desc id="desc">固定8.53.0的UI/continuous profiling在API35+请求系统调用栈采样，旧系统走有条件的legacy profiler。 Perfetto格式不等于完整system trace；SDK core min21不表示profiling支持API21。 系统限流，命中SDK采样仍可能无文件；enableLegacyProfiling=false可关闭此回退；core可接入不等于可启动profiler</desc>
