<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Activity rule 两侧的检查对象不同</title>
<desc id="desc">规则嵌套决定断言在Activity teardown之前或之后；包装helper可覆盖两侧。 仅成功测试主体触发检查；跨测试清理记录用于隔离，不能代替业务解绑。 测试主体成功完成
开始规则收尾 → Activity销毁前检查
finally清此轮旧记录；Activity销毁前检查
finally清此轮旧记录 → Activity rule teardown
结束当前Activity；Activity rule teardown
结束当前Activity → Activity销毁后检查
覆盖Activity保留；Activity销毁后检查
覆盖Activity保留 → 内外规则各有finally
各自清记录以隔离测试</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 365 120.0 L 450 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
