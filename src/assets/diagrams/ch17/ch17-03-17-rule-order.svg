<path d="M 985.0 180 L 985.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979.0 330 L 985.0 340 L 991.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 835 400.0 L 750 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 760 394.0 L 750 400.0 L 760 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.1 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 180.5 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">测试主体成功完成</tspan>
<tspan x="215.0" dy="34.0">开始规则收尾</tspan>
</text>
<path d="M 454 60 Q 600.0 60.6 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.5 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Activity销毁前检查</tspan>
<tspan x="600.0" dy="34.0">finally清此轮旧记录</tspan>
</text>
<path d="M 839 60 Q 985.0 60.0 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.5 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">Activity rule teardown</tspan>
<tspan x="985.0" dy="34.0">结束当前Activity</tspan>
</text>
<path d="M 839 340 Q 985.0 340.6 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.7 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">Activity销毁后检查</tspan>
<tspan x="985.0" dy="34.0">覆盖Activity保留</tspan>
</text>
<path d="M 454 340 Q 600.0 340.2 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.2 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">内外规则各有finally</tspan>
<tspan x="600.0" dy="34.0">各自清记录以隔离测试</tspan>
</text>
</svg>
