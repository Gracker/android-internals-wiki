<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">响应回调在读取 Header block 之后</title>
<desc id="desc">本文版本先完成一次 header block 读取，再触发 responseHeadersStart。 首次 block 可能是临时响应；这个回调不能提供精确首字节时间。 开始读取响应
状态行与header内容 → 完整header block可用
readResponseHeaders返回；完整header block可用
readResponseHeaders返回 → 触发headers start
可能对应100或103；触发headers start
可能对应100或103 → 若为临时响应则跳过
继续读取最终header；若为临时响应则跳过
继续读取最终header → 触发headers end
最终状态或101升级</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
