<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">指标、样本、深证据与上下文的关系</title>
<desc id="desc">四类证据分别支持趋势、现场、依赖和可比性判断。 它们互相补足；深采集也受权限、采样和完整性约束。 上下文规定指标的可比范围；上下文关联个例与构建；上下文限定深证据的执行条件</desc>
