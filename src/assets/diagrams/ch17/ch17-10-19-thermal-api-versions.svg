<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Thermal 公共能力的四阶段演进</title>
<desc id="desc">热状态、headroom、阈值与 headroom listener 分别检查 API 版本。 API 存在不保证设备支持全部预测和阈值，NaN 与缺项分别处理。 API29
系统热状态与状态listener → API30
当前 / 0–60秒headroom；API30
当前 / 0–60秒headroom → API35
读取设备给出的状态阈值；API35
读取设备给出的状态阈值 → API36–37
headroom listener与可变阈值</desc>
