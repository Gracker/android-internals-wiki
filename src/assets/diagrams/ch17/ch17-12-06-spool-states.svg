<path d="M 835 400.0 L 750 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 760 394.0 L 750 400.0 L 760 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.3 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 180.4 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">IN_MEMORY</tspan>
<tspan x="215.0" dy="34.0">仅驻留内存</tspan>
</text>
<path d="M 454 60 Q 600.0 59.4 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.3 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">ACTIVE</tspan>
<tspan x="600.0" dy="34.0">单写者持续追加</tspan>
</text>
<path d="M 839 60 Q 985.0 59.6 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.8 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">SEALED</tspan>
<tspan x="985.0" dy="34.0">提交完成，不再修改</tspan>
</text>
<path d="M 839 340 Q 985.0 340.3 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.6 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">UPLOADING</tspan>
<tspan x="985.0" dy="34.0">持久claim与attempt</tspan>
</text>
<path d="M 454 340 Q 600.0 339.7 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.8 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">ACKED → DELETED</tspan>
<tspan x="600.0" dy="34.0">完整内容确认后清理</tspan>
</text>
