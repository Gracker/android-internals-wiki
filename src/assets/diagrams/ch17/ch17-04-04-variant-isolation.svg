<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">允许变体、空实现与最终产物</title>
<desc id="desc">调试能力经变体依赖和注册点进入，正式变体使用空实现并核验最终产物。 no-op降低引用成本；依赖声明不能覆盖本地重打包或隐藏入口。 列出允许的组合
Debug / QA等明确授权 → 调试source set
业务入口集中注册；调试source set
业务入口集中注册 → Release使用no-op
业务registry注入空实现；Release使用no-op
业务registry注入空实现 → 解析依赖与最终包
验证入口、数据与行为</desc>
