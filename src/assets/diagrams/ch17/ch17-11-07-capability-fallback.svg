<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">provider 能力与缺失值的回退</title>
<desc id="desc">随样本记录 provider 和支持条目，按能力选择浏览器指标与业务信号。 unsupported、not_observed 与 inconclusive 含义不同，缺失值不填0。 保存provider / Chromium
AndroidX与系统版本 → 检查supportedEntryTypes
和WebViewFeature；检查supportedEntryTypes
和WebViewFeature → 按实际能力收FCP / LCP
或业务ready / DOM / 像素；按实际能力收FCP / LCP
或业务ready / DOM / 像素 → 保留来源与缺失原因
查询端按能力分组</desc>
