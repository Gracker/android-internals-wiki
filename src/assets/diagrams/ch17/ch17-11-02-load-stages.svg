<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">一次文档加载的五个观察阶段</title>
<desc id="desc">把容器、导航、文档状态、内容绘制与业务可用依序关联。 这些观察区间可能重叠，图中顺序不表示可把各段耗时直接相加。 Native容器创建
session / surface → main-frame导航
navigation / timeOrigin；main-frame导航
navigation / timeOrigin → 文档生命周期
DOM与load事件；文档生命周期
DOM与load事件 → 内容出现的指标
FCP / LCP候选；内容出现的指标
FCP / LCP候选 → 业务app_ready
路由、数据和交互可用</desc>
