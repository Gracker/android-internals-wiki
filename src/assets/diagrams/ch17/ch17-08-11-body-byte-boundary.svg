<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Gzip、缓冲与应用消费的计数边界</title>
<desc id="desc">内部 body source 计数在透明 gzip 解压之前，缓冲预读又早于业务逐字节消费。 回调字节不是 IP/TLS 总字节，也不等于业务已消费量；不得提前读取 body 采样。 协议codec读取body
不含IP / TLS总开销 → Exchange body source
回调计数字节；Exchange body source
回调计数字节 → Bridge透明gzip解压
解码后长度可能增大；Bridge透明gzip解压
解码后长度可能增大 → 上层缓冲和业务读取
预读可先完成内部body</desc>
