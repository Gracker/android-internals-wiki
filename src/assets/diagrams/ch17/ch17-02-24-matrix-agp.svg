<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Matrix旧Transform与task模式的依赖</title>
<desc id="desc">固定inject先注册透明Transform，再选择后续注入模式，task模式仍依赖已删除API。 AGP8移除了Transform；现代迁移还需保持过滤、映射、增量与variant产物合同。 MatrixPlugin
强转旧AppExtension → inject()无条件注册
透明MatrixTraceTransform；inject()无条件注册
透明MatrixTraceTransform → afterEvaluate
选择task / transform注入；afterEvaluate
选择task / transform注入 → 旧Transform及内部API
AGP8+兼容性障碍；旧Transform及内部API
AGP8+兼容性障碍 → 迁移Instrumentation等API
完整回归映射与构建产物</desc>
