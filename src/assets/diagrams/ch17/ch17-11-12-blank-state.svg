<tspan x="990.0" dy="0">confirmed_blank</tspan>
<tspan x="990.0" dy="34.0">间隔仍空且排除已知例外</tspan>
</text>
<path d="M 259 360 Q 465.0 360.0 671 360 Q 675 360 675 364 L 675 476 Q 675 480 671 480 Q 465.0 480.4 259 480 Q 255 480 255 476 L 255 364 Q 255 360 259 360" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="465.0" y="411.5" text-anchor="middle" style="font-size:25px">
<tspan x="465.0" dy="0">inconclusive</tspan>
<tspan x="465.0" dy="34.0">后台、复制失败、无效或冲突信号</tspan>
</text>
