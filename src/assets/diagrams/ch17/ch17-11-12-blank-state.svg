<path d="M 459 350 L 465 360 L 471 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 900 180 L 900 270 L 720 270 L 720 420 L 675 420" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 685 414 L 675 420 L 685 426" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 64 60 Q 210.0 59.4 356 60 Q 360 60 360 64 L 360 176 Q 360 180 356 180 Q 210.0 180.1 64 180 Q 60 180 60 176 L 60 64 Q 60 60 64 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="210.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="210.0" dy="0">loading</tspan>
<tspan x="210.0" dy="34.0">main-frame导航开始</tspan>
</text>
<path d="M 454 60 Q 600.0 59.9 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.5 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">visual_committed</tspan>
<tspan x="600.0" dy="34.0">旧内容退出，等待draw</tspan>
</text>
<path d="M 844 60 Q 990.0 59.9 1136 60 Q 1140 60 1140 64 L 1140 176 Q 1140 180 1136 180 Q 990.0 179.7 844 180 Q 840 180 840 176 L 840 64 Q 840 60 844 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="990.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="990.0" dy="0">suspected_blank</tspan>
<tspan x="990.0" dy="34.0">ready超时且初次信号空</tspan>
</text>
<path d="M 844 360 Q 990.0 359.9 1136 360 Q 1140 360 1140 364 L 1140 476 Q 1140 480 1136 480 Q 990.0 480.5 844 480 Q 840 480 840 476 L 840 364 Q 840 360 844 360" fill="white" stroke="#4A90D9" stroke-width="3"/>
