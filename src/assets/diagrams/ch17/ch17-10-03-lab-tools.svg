<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">应用事件与实验工具交叉验证</title>
<desc id="desc">开发阶段用系统统计、trace 与受支持功耗工具校验端侧事件。 Battery Historian 已不积极维护，电源轨与 PowerMetric 也受设备支持限制。 端侧有限资源事件
保留任务与时间口径 → batterystats / system trace
核对UID与系统活动；batterystats / system trace
核对UID与系统活动 → 支持的Power Profiler
或PowerMetric / 外接仪器；支持的Power Profiler
或PowerMetric / 外接仪器 → 同设备同条件比较
保存基线与工具限制</desc>
