<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Application 与 Provider 自动安装顺序</title>
<desc id="desc">系统先创建Application，Provider安装watcher，随后调用Application.onCreate。 依赖只进入指定Debug/QA变体；Provider与Startup替代组件按上游约定择一。 创建Application实例
尚未调用onCreate → 初始化私有Provider
取applicationContext；初始化私有Provider
取applicationContext → AppWatcher.manualInstall
主进程安装watcher；AppWatcher.manualInstall
主进程安装watcher → Application.onCreate
避免重复手动安装</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 525 120.0 L 675 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 665 114.0 L 675 120.0 L 665 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 59.4 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 180.3 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">创建Application实例</tspan>
<tspan x="310.0" dy="34.0">尚未调用onCreate</tspan>
</text>
<path d="M 679 60 Q 890.0 59.3 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 180.7 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">初始化私有Provider</tspan>
<tspan x="890.0" dy="34.0">取applicationContext</tspan>
</text>
<path d="M 679 340 Q 890.0 339.2 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.3 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">AppWatcher.manualInstall</tspan>
<tspan x="890.0" dy="34.0">主进程安装watcher</tspan>
</text>
<path d="M 99 340 Q 310.0 339.6 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.1 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">Application.onCreate</tspan>
<tspan x="310.0" dy="34.0">避免重复手动安装</tspan>
</text>
</svg>
