<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Flow 的 STARTED 区间与 view 销毁</title>
<desc id="desc">Flow收集绑定view owner，在低于STARTED时取消，恢复时重启，到DESTROYED终止scope。 Lifecycle.State无STOPPED枚举；取消需协作，外部callback与阻塞工作仍要解绑。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 215 180 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 180 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.2 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.6 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">view达到STARTED</tspan>
<tspan x="215.0" dy="34.0">首次或再次进入</tspan>
</text>
<path d="M 454 60 Q 600.0 60.1 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.8 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">view低于STARTED</tspan>
<tspan x="600.0" dy="34.0">例如收到ON_STOP后</tspan>
</text>
<path d="M 839 60 Q 985.0 59.9 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.8 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">view到DESTROYED</tspan>
<tspan x="985.0" dy="34.0">生命周期终止</tspan>
</text>
<path d="M 69 340 Q 215.0 339.7 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.2 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="392.18" text-anchor="middle" style="font-size:23px">
<tspan x="215.0" dy="0">启动 / 重启collection</tspan>
<tspan x="215.0" dy="31.28">外层scope属于view owner</tspan>
</text>
<path d="M 454 340 Q 600.0 340.6 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.7 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">取消当前collection</tspan>
<tspan x="600.0" dy="34.0">等待下一次STARTED</tspan>
</text>
<path d="M 839 340 Q 985.0 339.7 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.8 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">取消外层lifecycleScope</tspan>
<tspan x="985.0" dy="34.0">此owner不再重启</tspan>
</text>
</svg>
