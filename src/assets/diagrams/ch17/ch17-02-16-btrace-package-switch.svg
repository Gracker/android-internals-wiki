<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">真实库、noop与初始化范围</title>
<desc id="desc">构建选择真实或noop实现，真实初始化按主进程和单次入口组织。 官方入口跳过remote进程且没有重复初始化保护；noop API存在不代表采集已开启。 构建属性enableBtrace
选择真实或noop AAR → 真实库：主进程
attachBaseContext单次init；真实库：主进程
attachBaseContext单次init → 读取启动采集属性
按配置开始采样；读取启动采集属性
按配置开始采样 → 启动App内HTTP server
PC前台控制与文件下载</desc>
