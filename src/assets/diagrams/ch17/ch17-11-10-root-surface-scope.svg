<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Window 根 Surface 与屏幕最终合成的区别</title>
<desc id="desc">Window 形式的 PixelCopy 固定从 ViewRootImpl 的根 Surface 复制受控区域。 独立 SurfaceView、IME、其他 Window 与硬件合成结果不能从这份快照反推。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 600 180 L 600 255 L 215 255 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 255 L 985 255 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 60.1 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.9 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="97.56" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">PixelCopy Window</tspan>
<tspan x="600.0" dy="29.92">读取ViewRootImpl</tspan>
<tspan x="600.0" dy="29.92">根Surface</tspan>
</text>
<path d="M 69 340 Q 215.0 340.2 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.3 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">根Surface里的宿主内容</tspan>
<tspan x="215.0" dy="32.64">按Rect裁剪并缩放Bitmap</tspan>
</text>
<path d="M 454 340 Q 600.0 339.4 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.7 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">独立SurfaceView / video</tspan>
<tspan x="600.0" dy="32.64">不自动并入这份根拷贝</tspan>
</text>
<path d="M 839 340 Q 985.0 340.4 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.7 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="985.0" y="391.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="985.0" dy="0">IME / 其他Window / HWC</tspan>
<tspan x="985.0" dy="32.64">不是最终屏幕合成截图</tspan>
</text>
</svg>
