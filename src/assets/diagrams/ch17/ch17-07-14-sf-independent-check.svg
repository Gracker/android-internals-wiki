<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">SurfaceFlinger 的独立帧核验</title>
<desc id="desc">--latency 沿 dumpStats、Layer 与 timeline 导出帧列，作为独立系统核验。 这不证明 PerfDog 内部使用该路径，gfxinfo 也不能覆盖所有独立图形 Producer。 --list确认完整layer名
记录目标与生命周期 → --latency分派dumpStats
先输出节奏周期；--latency分派dumpStats
先输出节奏周期 → 匹配Layer
dumpFrameStats；匹配Layer
dumpFrameStats → Layer timeline生成三列
desired / actual / ready；Layer timeline生成三列
desired / actual / ready → FrameTimeline补充时序
不是直接读取FrameTracer</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
