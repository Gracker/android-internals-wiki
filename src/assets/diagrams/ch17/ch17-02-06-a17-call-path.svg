<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Android17经典Trace调用链</title>
<desc id="desc">固定A17把经典同步标记从AndroidX经平台JNI交给tracing_perfetto。 图表示调用关系，没有声明每次直接write(trace_marker)或固定纳秒开销。 AndroidX trace {}
finally与名称处理 → android.os.Trace
检查TRACE_TAG_APP；android.os.Trace
检查TRACE_TAG_APP → nativeTraceBegin
平台JNI入口；nativeTraceBegin
平台JNI入口 → tracing_perfetto::traceBegin
A17固定实现路径</desc>
