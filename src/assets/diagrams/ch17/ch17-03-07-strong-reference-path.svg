<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从静态 owner 到已销毁 Fragment view</title>
<desc id="desc">按持有方向追踪静态集合、callback、Fragment和binding，修复生命周期错配的边。 这是压缩示例；~~~是可疑引用，Root类型不是必须修改的位置。 GC Root：system class
AnalyticsDispatcher → static callbacks集合
仍保留callback；static callbacks集合
仍保留callback → callback.this$0
仍保留HomeFragment；callback.this$0
仍保留HomeFragment → Fragment.binding
仍保留binding；Fragment.binding
仍保留binding → binding.rootView
已过onDestroyView；binding.rootView
已过onDestroyView → 修复对应owner的边
注销callback并清binding</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
