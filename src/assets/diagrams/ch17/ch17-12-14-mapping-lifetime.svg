<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">映射生命周期与小型 journal 复用</title>
<desc id="desc">长期小 journal 可在 worker 复制已提交块为普通 sealed 文件，再受控复用。 关闭 FileChannel 不使已有 mapping 立即失效；纯 Java 不依赖同步 unmap 或提前截短复用。 小active journal
单写者受控映射 → 提交有效block
force并更新提交元数据；提交有效block
force并更新提交元数据 → worker复制到普通sealed
同步、封口和发布；worker复制到普通sealed
同步、封口和发布 → 确认复制提交成功后
按代次复用journal空间</desc>
