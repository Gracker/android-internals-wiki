<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">第14至17章如何共同组织证据</title>
<desc id="desc">APM 聚合线索经受控复现进入系统 trace 与专项工具，再用方法论组织结论和回归。 btrace3.0提供 Hook 现场的栈候选，JankStats提供帧状态，二者都不自动解释唯一根因。 第17章
线上采集与代表性线索 → 第16章
复现条件、假设和证据组织；第16章
复现条件、假设和证据组织 → 第14 / 15章
Perfetto全局与专项工具；第14 / 15章
Perfetto全局与专项工具 → 修复与回归
对照证据和线上成本</desc>
