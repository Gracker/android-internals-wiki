<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">断路器的冷却与有限探测</title>
<desc id="desc">持续超成本或失败后熔断，冷却到期只放少量探测，成功后恢复。 冷却有上限且跨重启保存；服务端失联不解除本地硬限制，P0保留容量仍有限。 持续失败或超成本则熔断；冷却截止后少量探测；探测成功且成本恢复，关闭断路器；探测失败则增加但限制冷却，回OPEN</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 365 120 L 835 120" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114 L 835 120 L 825 126" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 180 L 985 265 L 600 265 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 450 400 L 215 400 L 215 180" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 190 L 215 180 L 221 190" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 400 L 1120 400 L 1120 180" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1114 190 L 1120 180 L 1126 190" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.2 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 180.8 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">CLOSED</tspan>
<tspan x="215.0" dy="34.0">正常按预算放行</tspan>
</text>
<path d="M 839 60 Q 985.0 59.5 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.5 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">OPEN</tspan>
<tspan x="985.0" dy="34.0">持久冷却，拒低价值工作</tspan>
</text>
<path d="M 454 340 Q 600.0 339.6 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.3 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">HALF_OPEN</tspan>
<tspan x="600.0" dy="34.0">仅放少量有成本上限探测</tspan>
</text>
<rect x="500.0" y="75.0" width="200.0" height="36.3" fill="white"/>
<text x="600" y="100" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">连续失败或超预算</tspan>
</text>
<rect x="811.0" y="220.0" width="108.0" height="36.3" fill="white"/>
<text x="865" y="245" text-anchor="middle" style="font-size:23px">
<tspan x="865" dy="0">冷却到期</tspan>
</text>
<rect x="226.5" y="350.0" width="177.0" height="36.3" fill="white"/>
<text x="315" y="375" text-anchor="middle" style="font-size:23px">
<tspan x="315" dy="0">成功且成本恢复</tspan>
</text>
<rect x="848.5" y="350.0" width="223.0" height="36.3" fill="white"/>
<text x="960" y="375" text-anchor="middle" style="font-size:23px">
<tspan x="960" dy="0">失败则有限延长冷却</tspan>
</text>
</svg>
