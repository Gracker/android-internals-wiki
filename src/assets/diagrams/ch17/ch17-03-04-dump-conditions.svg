<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">可见、不可见与用户请求的触发条件</title>
<desc id="desc">GC复检后的数量、应用可见状态和用户请求共同决定下一步。 前台少于5不证明无泄漏；还需通过开关、调试器、冷却与文件检查。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
