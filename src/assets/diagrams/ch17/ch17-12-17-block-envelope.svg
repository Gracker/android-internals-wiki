<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">压缩、AEAD 与可认证的 envelope</title>
<desc id="desc">把有界事件批次压缩后用 AES-GCM 加密，规范化头字段作为 AAD。 同 key 下 IV 不重用，跨重启不从0重置；重传复用原密文，密钥建立另有协议。 多个有界事件
length-delimited编码 → 受控压缩
记录格式与真实长度；受控压缩
记录格式与真实长度 → AES-GCM加密和认证
同key使用唯一IV；AES-GCM加密和认证
同key使用唯一IV → envelope带AAD与密文
版本 / 长度 / key ID / 序号</desc>
