<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">暂停测量与恢复可变输入</title>
<desc id="desc">每轮在暂停区复制数组，取回泛型返回值，再计量排序与完整结果消费。 暂停不撤销分配、GC、缓存或热状态副作用。 进入本轮循环
原fixture保持不变 → 暂停measurement
复制原数组；暂停measurement
复制原数组 → block返回数组副本
恢复measurement；block返回数组副本
恢复measurement → 原地排序working
消费完整数组结果；原地排序working
消费完整数组结果 → 下一轮重新复制
不把已排序输入复用</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 365 120.0 L 450 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985.0 180 L 985.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979.0 330 L 985.0 340 L 991.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 835 400.0 L 750 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 760 394.0 L 750 400.0 L 760 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.5 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.6 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">进入本轮循环</tspan>
<tspan x="215.0" dy="34.0">原fixture保持不变</tspan>
</text>
<path d="M 454 60 Q 600.0 60.3 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.2 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">暂停measurement</tspan>
<tspan x="600.0" dy="34.0">复制原数组</tspan>
</text>
<path d="M 839 60 Q 985.0 60.0 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.8 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">block返回数组副本</tspan>
<tspan x="985.0" dy="34.0">恢复measurement</tspan>
</text>
<path d="M 839 340 Q 985.0 339.9 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.1 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">原地排序working</tspan>
<tspan x="985.0" dy="34.0">消费完整数组结果</tspan>
</text>
<path d="M 454 340 Q 600.0 339.7 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.4 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">下一轮重新复制</tspan>
<tspan x="600.0" dy="34.0">不把已排序输入复用</tspan>
</text>
</svg>
