<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从业务入口到慢副作用的线程边界</title>
<desc id="desc">业务入口只做最小事件和有界准入，编码、同步和网络交给受控 worker。 非挂起不等于 wait-free，也不保证固定纳秒上限；所有分配、队列和工作区均需预算。 业务线程 / callback
固定字段与低基数ID → 有界准入
P0保留容量 / P1P2队列；有界准入
P0保留容量 / P1P2队列 → 单写者worker
编码、压缩与提交；单写者worker
编码、压缩与提交 → 上传worker
约束、claim和幂等确认</desc>
