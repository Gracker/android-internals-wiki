<path d="M 979.0 330 L 985.0 340 L 991.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 835 400.0 L 750 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 760 394.0 L 750 400.0 L 760 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.0 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.7 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">每次onViewCreated</tspan>
<tspan x="215.0" dy="34.0">新建FeedAdapter</tspan>
</text>
