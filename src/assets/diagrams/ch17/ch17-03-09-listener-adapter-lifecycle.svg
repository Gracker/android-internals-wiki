<text x="600.0" y="112.18" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">dispatcher注册listener</tspan>
<tspan x="600.0" dy="31.28">listener可反向持有adapter</tspan>
</text>
<path d="M 839 60 Q 985.0 59.3 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.6 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">使用中的RecyclerView</tspan>
<tspan x="985.0" dy="34.0">注册数据observer</tspan>
</text>
<path d="M 839 340 Q 985.0 340.2 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.1 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">onDestroyView</tspan>
<tspan x="985.0" dy="34.0">adapter=null + dispose</tspan>
</text>
<path d="M 454 340 Q 600.0 340.3 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.4 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="392.52000000000004" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">清空feedAdapter与binding</tspan>
<tspan x="600.0" dy="29.92">下一次创建重新注册</tspan>
</text>
