<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">每轮 view 生命周期重新建立 adapter 注册</title>
<desc id="desc">view创建时新建并注册页面adapter，销毁时拆绑定、注销listener并清空实例。 临时detach不一定是永久销毁；dispatcher须遵守主线程回调合同。 每次onViewCreated
新建FeedAdapter → dispatcher注册listener
listener可反向持有adapter；dispatcher注册listener
listener可反向持有adapter → 使用中的RecyclerView
注册数据observer；使用中的RecyclerView
注册数据observer → onDestroyView
adapter=null + dispose；onDestroyView
adapter=null + dispose → 清空feedAdapter与binding
下一次创建重新注册</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
