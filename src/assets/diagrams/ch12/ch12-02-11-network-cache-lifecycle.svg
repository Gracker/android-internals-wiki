<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Network 与 Resolver 缓存的创建销毁</title>
<desc id="desc">同一netId由两个服务分别管理网络对象与DNS缓存。 固定r1正常路径，分别处理异常而非原子事务；销毁两次调用之间还有地址/socket清理。原Mermaid源码保留在下方。 正常创建先netd网络对象；随后创建同netId解析缓存；销毁先调用netd；中间清理后销毁解析缓存</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="650" fill="white"/>
<path d="M 365 110 L 450 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 104 L 450 110 L 440 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 110 L 835 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 104 L 835 110 L 825 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 365 405 L 450 405" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 399 L 450 405 L 440 411" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 405 L 835 405" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 399 L 835 405 L 825 411" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 55 Q 215.0 54.6 361 55 Q 365 55 365 59 L 365 161 Q 365 165 361 165 Q 215.0 164.7 69 165 Q 65 165 65 161 L 65 59 Q 65 55 69 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">ConnectivityService</tspan>
<tspan x="215.0" dy="34.0">创建 native Network</tspan>
</text>
<path d="M 454 55 Q 600.0 55.1 746 55 Q 750 55 750 59 L 750 161 Q 750 165 746 165 Q 600.0 165.3 454 165 Q 450 165 450 161 L 450 59 Q 450 55 454 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">netd.networkCreate</tspan>
<tspan x="600.0" dy="34.0">网络对象与权限</tspan>
</text>
<path d="M 839 55 Q 985.0 55.6 1131 55 Q 1135 55 1135 59 L 1135 161 Q 1135 165 1131 165 Q 985.0 165.5 839 165 Q 835 165 835 161 L 835 59 Q 835 55 839 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">createNetworkCache</tspan>
<tspan x="985.0" dy="34.0">相同 netId 的缓存</tspan>
</text>
<path d="M 69 350 Q 215.0 349.3 361 350 Q 365 350 365 354 L 365 456 Q 365 460 361 460 Q 215.0 460.5 69 460 Q 65 460 65 456 L 65 354 Q 65 350 69 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="396.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">ConnectivityService</tspan>
<tspan x="215.0" dy="34.0">销毁 native Network</tspan>
</text>
<path d="M 454 350 Q 600.0 349.5 746 350 Q 750 350 750 354 L 750 456 Q 750 460 746 460 Q 600.0 460.5 454 460 Q 450 460 450 456 L 450 354 Q 450 350 454 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="396.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">netd.networkDestroy</tspan>
<tspan x="600.0" dy="34.0">之后还会清理 socket</tspan>
</text>
<path d="M 839 350 Q 985.0 349.6 1131 350 Q 1135 350 1135 354 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.3 839 460 Q 835 460 835 456 L 835 354 Q 835 350 839 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="396.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="985.0" dy="0">destroyNetworkCache</tspan>
<tspan x="985.0" dy="32.64">再清理 DnsManager 状态</tspan>
</text>
</svg>
