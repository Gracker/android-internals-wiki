<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">ECH 当前文档与固定 r1 默认策略差异</title>
<desc id="desc">明确记录文档默认enabled与r1内部OPPORTUNISTIC的不同分支。 固定源码默认需兼容性变更和flag开启；OPPORTUNISTIC不发GREASE，显式XML enabled才映射ENABLED，不能合并承诺。 公开enabled语义由显式配置实现；r1开关开启时为opportunistic否则disabled；显式配置也要验证真实连接；默认实现不能仅凭版本号推断</desc>
