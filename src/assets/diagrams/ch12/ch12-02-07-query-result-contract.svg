<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">query、rawQuery 与组合查询的返回类型</title>
<desc id="desc">按返回类型与rcode/异常一起解释结果，不用回调名代替成功判定。 普通地址query也有rcode；A/AAAA聚合成功可遮盖另一项失败，空结果与非零rcode都须保留。 地址结果也提供响应码；原始查询同样可能失败；组合结果还需检查可用地址</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="650" fill="white"/>
<path d="M 215 165 L 215 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 340 L 215 350 L 221 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 165 L 600 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 340 L 600 350 L 606 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 165 L 985 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 340 L 985 350 L 991 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 55 Q 215.0 55.3 361 55 Q 365 55 365 59 L 365 161 Q 365 165 361 165 Q 215.0 165.8 69 165 Q 65 165 65 161 L 65 59 Q 65 55 69 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">地址 query</tspan>
<tspan x="215.0" dy="34.0">List&lt;InetAddress&gt;</tspan>
</text>
<path d="M 454 55 Q 600.0 54.4 746 55 Q 750 55 750 59 L 750 161 Q 750 165 746 165 Q 600.0 165.8 454 165 Q 450 165 450 161 L 450 59 Q 450 55 454 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">rawQuery</tspan>
<tspan x="600.0" dy="34.0">原始 byte[] 应答</tspan>
</text>
<path d="M 839 55 Q 985.0 55.6 1131 55 Q 1135 55 1135 59 L 1135 161 Q 1135 165 1131 165 Q 985.0 164.2 839 165 Q 835 165 835 161 L 835 59 Q 835 55 839 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">A/AAAA/HTTPS query</tspan>
<tspan x="985.0" dy="34.0">HttpsEndpoint</tspan>
</text>
<path d="M 69 350 Q 215.0 349.7 361 350 Q 365 350 365 354 L 365 456 Q 365 460 361 460 Q 215.0 459.7 69 460 Q 65 460 65 456 L 65 354 Q 65 350 69 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="396.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">共同：onAnswer + rcode</tspan>
<tspan x="215.0" dy="32.64">也可能空结果 / 非零响应</tspan>
</text>
<path d="M 454 350 Q 600.0 350.5 746 350 Q 750 350 750 354 L 750 456 Q 750 460 746 460 Q 600.0 460.6 454 460 Q 450 460 450 456 L 450 354 Q 450 350 454 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="396.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">共同：onError</tspan>
<tspan x="600.0" dy="34.0">DnsException 与原因</tspan>
</text>
<path d="M 839 350 Q 985.0 350.3 1131 350 Q 1135 350 1135 354 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.2 839 460 Q 835 460 835 456 L 835 354 Q 835 350 839 350" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="396.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="985.0" dy="0">结果与 connect 联合判断</tspan>
<tspan x="985.0" dy="32.64">onAnswer 不保证可连接</tspan>
</text>
</svg>
