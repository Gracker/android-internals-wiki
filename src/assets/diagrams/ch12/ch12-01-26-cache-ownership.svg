<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">磁盘 Cache 的唯一拥有者与派生 client</title>
<desc id="desc">同一目录由一个Cache实例独占，该实例可被多个client共享。 不能为同一目录反复创建并发Cache实例；容量、清理和关闭由拥有者统一管理。 Cache独占目录；clientA共享实例；clientB共享实例；拥有者负责目录与实例生命周期</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="670" fill="white"/>
<path d="M 600 155 L 600 260" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 250 L 600 260 L 606 250" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 450 312 L 215 312 L 215 490" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 480 L 215 490 L 221 480" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 365 L 600 490" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 480 L 600 490 L 606 480" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 312 L 985 312 L 985 490" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 480 L 985 490 L 991 480" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 50 Q 600.0 50.3 746 50 Q 750 50 750 54 L 750 151 Q 750 155 746 155 Q 600.0 154.9 454 155 Q 450 155 450 151 L 450 54 Q 450 50 454 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="94.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">一个磁盘目录</tspan>
<tspan x="600.0" dy="34.0">目录生命周期与容量</tspan>
</text>
<path d="M 454 260 Q 600.0 259.8 746 260 Q 750 260 750 264 L 750 361 Q 750 365 746 365 Q 600.0 365.3 454 365 Q 450 365 450 361 L 450 264 Q 450 260 454 260" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="304.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">唯一 Cache 实例</tspan>
<tspan x="600.0" dy="34.0">独占目录状态</tspan>
</text>
<path d="M 69 490 Q 215.0 490.4 361 490 Q 365 490 365 494 L 365 591 Q 365 595 361 595 Q 215.0 595.5 69 595 Q 65 595 65 591 L 65 494 Q 65 490 69 490" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="534.0" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">派生 client A</tspan>
<tspan x="215.0" dy="34.0">引用 sharedCache</tspan>
</text>
<path d="M 454 490 Q 600.0 490.1 746 490 Q 750 490 750 494 L 750 591 Q 750 595 746 595 Q 600.0 594.3 454 595 Q 450 595 450 591 L 450 494 Q 450 490 454 490" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="534.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">派生 client B</tspan>
<tspan x="600.0" dy="34.0">引用同一 sharedCache</tspan>
</text>
<path d="M 839 490 Q 985.0 489.9 1131 490 Q 1135 490 1135 494 L 1135 591 Q 1135 595 1131 595 Q 985.0 595.7 839 595 Q 835 595 835 591 L 835 494 Q 835 490 839 490" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="534.0" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">统一清理与关闭</tspan>
<tspan x="985.0" dy="34.0">避免使用者互相破坏</tspan>
</text>
</svg>
