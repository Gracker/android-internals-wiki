<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">DM 分类只说明 ZIP 条目存在</title>
<desc id="desc">DM 读取与 config 解析先处理错误，getType 再按两个 ZIP 条目的存在性分类。 PROFILE/VDEX 类型不证明条目内容可用；缺 config 用默认值，缺文件与读取失败也不能混成一种状态。 文件不存在与其他I/O或config解析失败分别处理；归档读取成功后按条目分类；分别只有一个条目时返回对应类型；同时存在或都不存在返回另外两类</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 365 115 L 450 115" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 109 L 450 115 L 440 121" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 215 175 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 365 400 L 450 400" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 394 L 450 400 L 440 406" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 365 400 L 405 400 L 405 270 L 985 270 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 55 Q 215.0 55.0 361 55 Q 365 55 365 59 L 365 171 Q 365 175 361 175 Q 215.0 175.1 69 175 Q 65 175 65 171 L 65 59 Q 65 55 69 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="106.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">getDexMetadataInfo</tspan>
<tspan x="215.0" dy="34.0">打开DM / 解析config.pb</tspan>
</text>
<path d="M 454 55 Q 600.0 54.3 746 55 Q 750 55 750 59 L 750 171 Q 750 175 746 175 Q 600.0 175.5 454 175 Q 450 175 450 171 L 450 59 Q 450 55 454 55" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="92.56" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">文件缺失 → NONE</tspan>
<tspan x="600.0" dy="29.92">其他读 / 解析错误 →</tspan>
<tspan x="600.0" dy="29.92">ERROR</tspan>
</text>
<path d="M 69 340 Q 215.0 339.4 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.7 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">归档可读：getType</tspan>
<tspan x="215.0" dy="34.0">只检查两个条目是否存在</tspan>
</text>
<path d="M 454 340 Q 600.0 340.1 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.5 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="392.52000000000004" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">仅primary.prof → PROFILE</tspan>
<tspan x="600.0" dy="29.92">仅primary.vdex → VDEX</tspan>
</text>
<path d="M 839 340 Q 985.0 340.3 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.4 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="374.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">两条目 → 合并类型</tspan>
<tspan x="985.0" dy="34.0">PROFILE_AND_VDEX</tspan>
<tspan x="985.0" dy="34.0">都没有 → NONE</tspan>
</text>
</svg>
