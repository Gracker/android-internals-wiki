<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">设备memory-limiter status</tspan>
<tspan x="310.0" dy="34.0">确认启用与进程上限</tspan>
</text>
<path d="M 679 60 Q 890.0 59.7 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 180.2 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">受测负载触发限制</tspan>
<tspan x="890.0" dy="34.0">manual / ignore只作测试</tspan>
</text>
<path d="M 679 340 Q 890.0 339.7 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.0 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">读取ApplicationExitInfo</tspan>
<tspan x="890.0" dy="34.0">REASON_OTHER与description</tspan>
</text>
<path d="M 99 340 Q 310.0 339.7 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 459.7 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">匹配MemoryLimiter:AnonSwap</tspan>
<tspan x="310.0" dy="34.0">结合heap线索，独立分类</tspan>
