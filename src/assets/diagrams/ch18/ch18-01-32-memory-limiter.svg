<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">App 内存限制的现场识别与复现</title>
<desc id="desc">先读取设备限制状态，再用退出 reason 与原始 description 标记识别具体限制。 限制只在部分设备实施；REASON_OTHER 不专属于此机制，不能与 LMKD 的低内存退出混算。 设备memory-limiter status
确认启用与进程上限 → 受测负载触发限制
manual / ignore只作测试；受测负载触发限制
manual / ignore只作测试 → 读取ApplicationExitInfo
REASON_OTHER与description；读取ApplicationExitInfo
REASON_OTHER与description → 匹配MemoryLimiter:AnonSwap
结合heap线索，独立分类</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
