<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">APK、DM、SDM 和安装重命名必须对应</title>
<desc id="desc">DM 与 APK 同基名，SDM 还带目标 ISA，安装器要在重命名时同步维护映射。 伴随文件需在对应目录；正常协调的重命名可接受，错误映射和不支持的 native ISA 会失败。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
