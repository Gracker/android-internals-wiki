<title id="title">按最终使用者选择 Rust 与 FFI 产物</title>
<desc id="desc">Rust 依赖、C/C++ 静态 FFI 和动态 JNI 需要不同的 Soong 产物路径。 r1 rust_ffi_static 生成 rlib 留给最终 C/C++ 链接，不能当通用 staticlib；显式模块名与自动 rustlibs linkage 分开。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
