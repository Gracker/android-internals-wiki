<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">system_server 的 4 MiB 是 producer 共享内存</title>
<desc id="desc">SystemServer 显式配置 producer shared-memory，事件随后进入 Perfetto 的数据流与中央 buffer。 4 MiB 只约束这里的 producer；中央 buffer、采集事件、落盘和丢数据分别检查，不能推出固定 CPU 开销。 SystemServer初始化
Producer.init：4 * 1024 KiB → producer共享内存
服务该producer写事件；producer共享内存
服务该producer写事件 → tracing service中央buffer
按TraceConfig单独设置；tracing service中央buffer
按TraceConfig单独设置 → 输出trace与损失检查
确认采集范围和观察扰动</desc>
