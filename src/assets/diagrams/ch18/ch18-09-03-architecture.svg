<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">四层研究架构依赖 Android 兼容生态</title>
<desc id="desc">兼容生态承接应用和硬件，交互层归一化调用，能力层组织状态与技能，组合层生成任务入口。 箭头表达层间依赖，非固定运行时顺序；架构中的 system memory 也不是物理内存，稳定 API 与实现完整性另查。 Android兼容生态
应用 / Binder / Display / 文件 → 统一交互接口
API / CLI / SUI / GUI；统一交互接口
API / CLI / SUI / GUI → AOHP能力层
状态记忆 / skills / UI工具；AOHP能力层
状态记忆 / skills / UI工具 → 任务服务组合层
输入契约 / 服务图 / 呈现</desc>
