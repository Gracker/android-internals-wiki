<path d="M 985 180 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.0 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 180.7 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">AppFunctionService</tspan>
<tspan x="215.0" dy="32.64">service property引用XML</tspan>
</text>
<path d="M 454 60 Q 600.0 60.5 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.4 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">runtime global</tspan>
<tspan x="600.0" dy="34.0">XML在application下声明</tspan>
</text>
<path d="M 839 60 Q 985.0 59.7 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.8 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">runtime activity scope</tspan>
<tspan x="985.0" dy="34.0">指定Activity实例</tspan>
</text>
<path d="M 69 340 Q 215.0 340.1 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.5 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="392.18" text-anchor="middle" style="font-size:23px">
<tspan x="215.0" dy="0">BIND权限与service action</tspan>
<tspan x="215.0" dy="31.28">系统按需绑定服务</tspan>
</text>
<path d="M 454 340 Q 600.0 339.7 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.9 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="377.56" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">Activity/Service</tspan>
<tspan x="600.0" dy="29.92">context注册</tspan>
<tspan x="600.0" dy="29.92">同名global实现受约束</tspan>
</text>
<path d="M 839 340 Q 985.0 339.5 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.9 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">只能Activity注册</tspan>
<tspan x="985.0" dy="34.0">按activity ID区分实现</tspan>
</text>
</svg>
