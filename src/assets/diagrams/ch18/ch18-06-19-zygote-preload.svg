<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Zygote preload 提前支付成本并共享初始化状态</title>
<desc id="desc">primary Zygote 在 fork SystemServer 前完成配置要求的 preload，后续进程共享已初始化状态。 HAL/graphics/HttpEngine 有自身条件；WebViewFactory 共享准备不等于专用 Zygote 已创建，删改须回归首个应用和内存。 classes / classloader缓存
资源、库与字体等预加载 → 条件性HAL / graphics等
WebViewFactory / JCA准备；条件性HAL / graphics等
WebViewFactory / JCA准备 → 完成preload后fork
primary派生SystemServer；完成preload后fork
primary派生SystemServer → 后续进程复用共享页
同时测boot、首App与PSS</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
