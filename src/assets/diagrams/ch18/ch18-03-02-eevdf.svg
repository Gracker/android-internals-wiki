<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">EEVDF 从 eligibility 到虚拟截止时间</title>
<desc id="desc">EEVDF 先看 lag 是否具备资格，再从 eligible 集合中选择虚拟截止时间最早的实体。 图示表达选取原则；nice、uclamp、CPU 放置和热约束仍影响结果，UI 语义不直接参与这一步。 runnable实体
权重 / slice / vruntime → 计算相对公平份额的lag
lag≥0具备eligibility；计算相对公平份额的lag
lag≥0具备eligibility → eligible候选集合
比较virtual deadline；eligible候选集合
比较virtual deadline → 选择最早虚拟deadline
后续仍受调度核心约束</desc>
