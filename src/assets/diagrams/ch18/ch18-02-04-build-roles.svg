<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Soong 与 Kati 生成图，Ninja 执行</title>
<desc id="desc">Soong 与 Kati 负责各自规则，平台入口组合依赖图，再由 Ninja 执行具体 action。 m nothing 只验证结构，不替代编译和链接；Android 17 的生成产物应写构建输出目录。 Soong部分构建图进入平台组合流程；Kati转换遗留Make规则并组合；Ninja根据依赖执行具体命令</desc>
