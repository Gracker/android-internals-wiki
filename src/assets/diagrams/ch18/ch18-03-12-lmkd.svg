<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">页面回收通过压力中间量影响 lmkd</title>
<desc id="desc">MGLRU 先改变页面回收，再通过 PSI、refault、swap 和可用内存等信号影响 lmkd 决策。 固定 r1 lmkd 未直接读取 generation；lmkd 退出、内核 OOM 和其他退出原因分开统计。 MGLRU页面选择与回收
kswapd / direct reclaim → 压力中间量变化
PSI / refault / swap / 水位；压力中间量变化
PSI / refault / swap / 水位 → r1 lmkd按压力与优先级
结合oom_score_adj选候选；r1 lmkd按压力与优先级
结合oom_score_adj选候选 → 记录退出原因和用户结果
不能预设kill次数必下降</desc>
