<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">指令轨迹源、sink 与 perf 软件接口</title>
<desc id="desc">区分 ETM/ETE 轨迹源、ETR/TRBE sink 和 simpleperf 的 cs-etm 接口。 连接图表示文档允许的候选路径；固件授权、设备树、驱动和 CPU 勘误决定目标设备实际可用组合。 传统ETM示例经ETR写内存；r1 Pixel8示例ETE经ETR，不能泛化所有设备；具备并允许使用TRBE的ETE设备可走相应sink；ETR轨迹经perf接口暴露给采集工具；TRBE通过perf框架提供AUX轨迹</desc>
