<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">本机编译后按目标与 ISA 清理云端产物</title>
<desc id="desc">本机 dexopt 已执行且不是 pre-reboot 时，PrimaryDexopter 尽早删除该目标的 SDM/SDC。 清理范围按 primary dex 与 ISA 对应；单个 ABI 成功不能外推整个包，其他失效文件由 GC 再判断。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
