<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">分代 CMC 的 young、mid、old 与跨代引用</title>
<desc id="desc">r1 中新对象先进入 young，连续两轮存活后经 mid 晋升 old，young GC 同时处理 young 与 mid。 图为分代关系；full GC 覆盖更大范围，young GC 仍需根和 old-to-young 引用，不是完全忽略 old。 上次GC后新分配
young区域 → 存活一次GC
压缩后进入mid；存活一次GC
压缩后进入mid → 再经young GC存活
mid压缩晋升old；年轻代回收仍需跨代引用与根的可达性信息</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 365 120.0 L 450 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 310 L 600 180" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 190 L 600 180 L 606 190" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.6 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.3 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">上次GC后新分配</tspan>
<tspan x="215.0" dy="34.0">young区域</tspan>
</text>
<path d="M 454 60 Q 600.0 60.4 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.2 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">存活一次GC</tspan>
<tspan x="600.0" dy="34.0">压缩后进入mid</tspan>
</text>
<path d="M 839 60 Q 985.0 59.2 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.5 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">再经young GC存活</tspan>
<tspan x="985.0" dy="34.0">mid压缩晋升old</tspan>
</text>
<path d="M 454 310 Q 600.0 310.5 746 310 Q 750 310 750 314 L 750 436 Q 750 440 746 440 Q 600.0 440.6 454 440 Q 450 440 450 436 L 450 314 Q 450 310 454 310" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="366.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">old到年轻区的引用</tspan>
<tspan x="600.0" dy="34.0">card table与根仍需处理</tspan>
</text>
</svg>
