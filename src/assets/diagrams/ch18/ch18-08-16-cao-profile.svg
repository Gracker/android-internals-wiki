<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">CachedAppOptimizer 的请求 profile 会再次解析</title>
<desc id="desc">r1 命名上的 file/anon 请求还要经过 profile 解析、节流和取消，freezer 则控制进程调度与 Binder。 r1 关闭 shared/code compaction：SOME→NONE，FULL→ANON；FULL 在空闲swap&lt;20%时先降SOME，最终NONE。这些不实现 AppFlow 热集保护。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 215 180 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 180 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.2 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.8 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">请求SOME</tspan>
<tspan x="215.0" dy="34.0">命名为file compaction</tspan>
</text>
<path d="M 454 60 Q 600.0 59.4 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.7 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">请求FULL</tspan>
<tspan x="600.0" dy="34.0">名义file + anon</tspan>
</text>
<path d="M 839 60 Q 985.0 60.4 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.7 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">cached freezer</tspan>
<tspan x="985.0" dy="34.0">检查并冻结Binder / 进程</tspan>
</text>
<path d="M 69 340 Q 215.0 339.3 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.7 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">r1文件compaction禁用</tspan>
<tspan x="215.0" dy="34.0">解析后NONE</tspan>
</text>
<path d="M 454 340 Q 600.0 340.1 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.0 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">swap低：SOME→NONE</tspan>
<tspan x="600.0" dy="34.0">否则解析为ANON</tspan>
</text>
<path d="M 839 340 Q 985.0 339.9 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.3 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">恢复时配套解冻</tspan>
<tspan x="985.0" dy="34.0">未提供启动文件页清单</tspan>
</text>
</svg>
