<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">F2FS checkpoint merge 的条件与等待</title>
<desc id="desc">只有满足合并条件的 CP_SYNC 请求才入 checkpoint 队列，并由线程完成后唤醒调用方。 一次 fsync 不必产生完整 checkpoint；合并线程不是提交即返回，也不免除存储持久化成本。 逐项检查合并条件；不满足条件或线程缺失时走同步路径；满足全部条件且线程存在才入队；线程完成处理后通知等待的调用方</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 365 110 L 450 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 104 L 450 110 L 440 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 110 L 835 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 104 L 835 110 L 825 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 170 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 400 L 835 400" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 394 L 835 400 L 825 406" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 50 Q 215.0 50.5 361 50 Q 365 50 365 54 L 365 166 Q 365 170 361 170 Q 215.0 170.4 69 170 Q 65 170 65 166 L 65 54 Q 65 50 69 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">F2FS checkpoint请求</tspan>
<tspan x="215.0" dy="34.0">f2fs_issue_checkpoint</tspan>
</text>
<path d="M 454 50 Q 600.0 50.5 746 50 Q 750 50 750 54 L 750 166 Q 750 170 746 170 Q 600.0 169.9 454 170 Q 450 170 450 166 L 450 54 Q 450 50 454 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">merge开启 + CP_SYNC</tspan>
<tspan x="600.0" dy="34.0">不是当前卸载锁持有者</tspan>
</text>
<path d="M 839 50 Q 985.0 50.6 1131 50 Q 1135 50 1135 54 L 1135 166 Q 1135 170 1131 170 Q 985.0 170.7 839 170 Q 835 170 835 166 L 835 54 Q 835 50 839 50" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="985.0" y="84.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">条件不满足</tspan>
<tspan x="985.0" dy="34.0">或合并线程不存在</tspan>
<tspan x="985.0" dy="34.0">同步执行checkpoint</tspan>
</text>
<path d="M 454 340 Q 600.0 339.7 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.1 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="374.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">线程存在：issue_list</tspan>
<tspan x="600.0" dy="34.0">入队 / queued_ckpt++</tspan>
<tspan x="600.0" dy="34.0">唤醒checkpoint线程</tspan>
</text>
<path d="M 839 340 Q 985.0 340.0 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.7 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">线程合并批次并执行</tspan>
<tspan x="985.0" dy="34.0">调用方等待completion</tspan>
</text>
</svg>
