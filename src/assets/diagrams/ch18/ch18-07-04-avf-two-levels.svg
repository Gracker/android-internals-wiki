<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">Java AVF包装层</tspan>
<tspan x="215.0" dy="34.0">nativeSpawn拉起virtmgr</tspan>
</text>
<path d="M 454 60 Q 600.0 60.1 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.3 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="112.52" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">独立Rust virtmgr</tspan>
<tspan x="600.0" dy="29.92">公开AIDL / UDS RpcBinder</tspan>
</text>
<path d="M 839 60 Q 985.0 59.5 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.1 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">crosvm子进程与VM</tspan>
<tspan x="985.0" dy="34.0">由virtmgr管理生命周期</tspan>
</text>
<path d="M 389 350 Q 600.0 349.3 811 350 Q 815 350 815 354 L 815 466 Q 815 470 811 470 Q 600.0 470.7 389 470 Q 385 470 385 466 L 385 354 Q 385 350 389 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="384.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">全局Rust lazy Binder服务</tspan>
<tspan x="600.0" dy="34.0">VirtualizationServiceInternal</tspan>
<tspan x="600.0" dy="34.0">kernel Binder管理CID等资源</tspan>
