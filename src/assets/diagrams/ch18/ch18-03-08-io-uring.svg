<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">io_uring 从内核能力到应用采用</title>
<desc id="desc">io_uring 是否产生应用收益，要依次核对内核实现、沙箱可达性和真实调用。 liburing 构建规则不是 Java 库采用证明；NO_MMAP 描述 ring 内存，不能单独证明数据零拷贝。 固定内核实现与opcode
各功能有独立flag和条件 → 检查syscall / 沙箱策略
seccomp / SELinux等；检查syscall / 沙箱策略
seccomp / SELinux等 → 确认应用真实使用
setup / enter / opcode；确认应用真实使用
setup / enter / opcode → 追完成与fallback
同业务输入比较延迟成本</desc>
