<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">四组证据闭合后才报告优化收益</title>
<desc id="desc">将工作负载、原始二进制、实际构建采用和当前产品 A/B 结果对应，形成可复核记录。 选项打开、文件存在或构建成功只覆盖其中一环；代码、负载和 Profile 更新后要重新核实适用范围。 Profile采集了什么
CUJ输入 / 权重 / 状态 → 对应哪个采集binary
build ID / ELF / DWARF；对应哪个采集binary
build ID / ELF / DWARF → 由哪条规则真实采用
Profile摘要 / flags / 产物；由哪条规则真实采用
Profile摘要 / flags / 产物 → 当前设备收益是否成立
多轮A/B / 回退 / 稳定性</desc>
