<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">文本计数与 DWARF 合成 LLVM 采样 Profile</title>
<desc id="desc">create_llvm_prof 将文件偏移计数与配套 ELF 的 DWARF 结合，输出 LLVM extbinary Profile。 test -s 只检查文件非空；还要用 llvm-profdata 解析并核对目标函数、行号及非零样本。 kernel.autofdo
单binary的偏移与计数 → 同一采集vmlinux
DWARF / 内联 / discriminator；同一采集vmlinux
DWARF / 内联 / discriminator → create_llvm_prof处理归因
text输入 → extbinary输出；create_llvm_prof处理归因
text输入 → extbinary输出 → llvm-profdata解析验收
目标函数、位置与非零样本</desc>
