<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">SystemConfig 的并发点与类锁等待分别观察</title>
<desc id="desc">早期提交 SystemConfig 可以与其他初始化重叠，consumer 是否等待取决于单例创建是否完成。 ReadingSystemConfig 提交 slice 不覆盖完整后台扫描；consumer 通过 SystemConfig 类锁等待，不必出现 Future.get。 主线提交SystemConfig任务
ReadingSystemConfig提交slice → 后台getInstance获取类锁
单例扫描与构造；后台getInstance获取类锁
单例扫描与构造 → consumer调用getInstance
若后台占锁则等待；consumer调用getInstance
若后台占锁则等待 → 构造完成释放类锁
consumer取得同一单例</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
