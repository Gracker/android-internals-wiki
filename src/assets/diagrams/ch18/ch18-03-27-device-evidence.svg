<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">设备构建、启动、能力和进程状态分别读</title>
<desc id="desc">最终配置、启动参数、能力位和线程映射状态各自保存，并绑定同一个目标构建。 配置不可读或节点缺失保留未知；cpuinfo 与漏洞状态节点不能替代进程 auxiliary vector 或执行覆盖证据。 最终.config
保留y与is not set → cmdline与可用bootconfig
结合漏洞节点报告；cmdline与可用bootconfig
结合漏洞节点报告 → 目标进程auxvec
各项HWCAP分开核对；目标进程auxvec
各项HWCAP分开核对 → 二进制 / 映射 / 线程状态
验证采用范围与实际路径</desc>
