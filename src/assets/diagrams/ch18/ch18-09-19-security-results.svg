<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">五项历史 Pass 还需在目标 commit 逐条复测</title>
<desc id="desc">论文在标注支付应用报告五类 case 通过，当前版本仍需按具体入口与例外重新验证。 论文未将结果绑定本文检查的commit；号码规则、Toast、截图、tap旁路、用途审计和跨用户/重启边界不由历史五例证明。 论文标注支付应用
五类case报告Pass → 固定当前framework commit
逐项定位真实入口与规则；固定当前framework commit
逐项定位真实入口与规则 → 加入未标注与例外场景
Toast / tap / token / 多用户；加入未标注与例外场景
Toast / tap / token / 多用户 → 分别报告实测与未测范围
不能迁移历史Pass为全覆盖</desc>
