<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">GCS 的用户态线程启用与返回检查</title>
<desc id="desc">GCS 从 CPU 和内核 ABI 到线程启用，再建立受保护返回地址记录。 应在运行库或加载器的合适早期时点接入；新线程继承而 exec 关闭，smaps 的 ss 不能独立证明线程开启。 内核CONFIG_ARM64_GCS
CPU实现相应特性 → 目标AArch64进程探测
AT_HWCAP的HWCAP_GCS；目标AArch64进程探测
AT_HWCAP的HWCAP_GCS → 早期运行库按线程启用
PR_SET_SHADOW_STACK_STATUS；早期运行库按线程启用
PR_SET_SHADOW_STACK_STATUS → 调用与返回维护硬件栈
控制保护错误可报CPERR</desc>
