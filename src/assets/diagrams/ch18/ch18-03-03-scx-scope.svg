<path d="M 600 180 L 600 255 L 215 255 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 255 L 985 255 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 60.3 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.6 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="112.18" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">BPF scheduler已加载运行</tspan>
<tspan x="600.0" dy="31.28">检查SWITCH_PARTIAL</tspan>
</text>
<path d="M 69 340 Q 215.0 339.5 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.4 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="376.54" text-anchor="middle" style="font-size:23px">
<tspan x="215.0" dy="0">未设PARTIAL</tspan>
<tspan x="215.0" dy="31.28">NORMAL / BATCH / IDLE</tspan>
<tspan x="215.0" dy="31.28">与SCHED_EXT可转入</tspan>
</text>
<path d="M 454 340 Q 600.0 340.7 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.5 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
