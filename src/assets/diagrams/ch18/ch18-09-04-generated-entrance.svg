<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">任务入口从输入契约到可验证结果</title>
<desc id="desc">任务入口连接输入、能力依赖、呈现与完成条件，既有应用可通过适配后的 UI 路径参与。 这是研究设计；并行读取、付款确认等是工程约束，任意页面尚不能自动变成可靠函数。 task schema
目标、输入与完成条件 → service graph
连接API、CLI或适配UI；service graph
连接API、CLI或适配UI → 副作用与策略边界
确认、失败与幂等约束；副作用与策略边界
确认、失败与幂等约束 → presentation policy
呈现结果并验证目标状态</desc>
