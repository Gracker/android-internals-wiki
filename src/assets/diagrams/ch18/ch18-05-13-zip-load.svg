<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">运行时组合 SDM、DM、SDC 和 APK</title>
<desc id="desc">运行时从 SDM ZIP 打开 ODEX，从 DM 取 VDEX，并用 SDC 与 APK/依赖完成检查。 入口 trace 早于 DM 存在检查；缺任何必要输入都可能失败，图中输入关系不表示并行调用或保证成功映射。 首先检查DM存在；缺失可在打开SDM前失败；从ZIP路径打开ODEX而非安装时解包到oat；加载器读取SDC并检查SDM时间戳；配套VDEX参与后续验证和Setup；SDM中ODEX进入实际加载与字段解析；SDC上下文参与兼容性判断</desc>
