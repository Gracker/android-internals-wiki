<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">class_start 只有分组语义与明确的禁用门</title>
<desc id="desc">class_start 先看整组禁用，再遍历服务调用 StartIfNotDisabled。 disabled 不随 class 自动启动，某个启动失败会记录后继续；class 不提供服务依赖拓扑。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
