<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
<title id="title">被 A 引用不等于被 A 支配，其他根路径仍可保留 C</title>
<desc id="desc">这是对象引用图：A不可达时C仍可经Root2→B到达，因此C不属于A的retained set。 支配关系要求每条根路径经过同一对象；支配树边不一定是对象直接引用。 第一条根路径到A；第二条根路径到B；A引用C；B也引用C</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="680" fill="white"/>
<path d="M 260 180 L 260 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 254 270 L 260 280 L 266 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1140 180 L 1140 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1134 270 L 1140 280 L 1146 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 260 380 L 260 515 L 540 515" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 530 509 L 540 515 L 530 521" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1140 380 L 1140 515 L 860 515" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 870 509 L 860 515 L 870 521" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 104 80 Q 260.0 80.2 416 80 Q 420 80 420 84 L 420 176 Q 420 180 416 180 Q 260.0 180.8 104 180 Q 100 180 100 176 L 100 84 Q 100 80 104 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="260.0" y="138.5" text-anchor="middle" style="font-size:25px">
<tspan x="260.0" dy="0">GC Root 1</tspan>
</text>
<path d="M 984 80 Q 1140.0 79.2 1296 80 Q 1300 80 1300 84 L 1300 176 Q 1300 180 1296 180 Q 1140.0 180.8 984 180 Q 980 180 980 176 L 980 84 Q 980 80 984 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1140.0" y="138.5" text-anchor="middle" style="font-size:25px">
<tspan x="1140.0" dy="0">GC Root 2</tspan>
</text>
<path d="M 104 280 Q 260.0 280.2 416 280 Q 420 280 420 284 L 420 376 Q 420 380 416 380 Q 260.0 380.7 104 380 Q 100 380 100 376 L 100 284 Q 100 280 104 280" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="260.0" y="338.5" text-anchor="middle" style="font-size:25px">
<tspan x="260.0" dy="0">SDK 对象 A</tspan>
</text>
<path d="M 984 280 Q 1140.0 279.4 1296 280 Q 1300 280 1300 284 L 1300 376 Q 1300 380 1296 380 Q 1140.0 380.2 984 380 Q 980 380 980 376 L 980 284 Q 980 280 984 280" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1140.0" y="338.5" text-anchor="middle" style="font-size:25px">
<tspan x="1140.0" dy="0">宿主缓存 B</tspan>
</text>
<path d="M 544 460 Q 700.0 460.8 856 460 Q 860 460 860 464 L 860 566 Q 860 570 856 570 Q 700.0 569.5 544 570 Q 540 570 540 566 L 540 464 Q 540 460 544 460" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="700.0" y="507.18" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">对象 C</tspan>
<tspan x="700.0" dy="31.28">两条根路径均可到达</tspan>
</text>
<text x="700.0" y="635" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">支配关系要求每条根路径经过同一对象；支配树边不一定是对象直接引用。</tspan>
</text>
</svg>
