<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">观察期去重不能替换成每日百分比平均</title>
<desc id="desc">同一合成例子中，逐日平均是 50%，整个观察期的去重结果是 0%；它们回答不同问题。 纯算术演示，不是产品实测或推荐目标。 演示第 1 日：A、B 活跃，A 崩溃 → 当天无崩溃安装实例率 = 50%；演示第 2 日：A、B 活跃，B 崩溃 → 当天无崩溃安装实例率 = 50%；合并两日：A 与 B 都发生过崩溃 → 观察期 Crash-Free Users = 0%</desc>
