<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">Play 的三种 ANR 比率采用相同日活口径</title>
<desc id="desc">2026-10-25复核：全局阈值0.47%，单设备型号8%；用户设备按天计数，不能与事件数或会话率直接比较。 API isUserPerceptible 以系统对话框定义，与 Play 当前只计输入分发的口径不同。 当天至少一次任意 ANR → ANR rate：受影响活跃用户设备 / DAU；当天至少一次 input dispatch ANR → User-perceived：当前 Play 核心 ANR 指标；当天至少两次 ANR → Multiple：至少两次的活跃用户设备 / DAU</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
