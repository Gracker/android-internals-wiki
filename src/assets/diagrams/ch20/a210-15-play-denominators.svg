<text x="1025.0" y="145.32" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">ANR rate：受影响活跃用户设备 / DAU</tspan>
</text>
<path d="M 134 240 Q 375.0 239.4 616 240 Q 620 240 620 244 L 620 351 Q 620 355 616 355 Q 375.0 354.3 134 355 Q 130 355 130 351 L 130 244 Q 130 240 134 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="375.0" y="305.32" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">当天至少一次 input dispatch ANR</tspan>
</text>
<path d="M 784 240 Q 1025.0 240.6 1266 240 Q 1270 240 1270 244 L 1270 351 Q 1270 355 1266 355 Q 1025.0 354.7 784 355 Q 780 355 780 351 L 780 244 Q 780 240 784 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1025.0" y="305.32" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">User-perceived：当前 Play 核心 ANR 指标</tspan>
</text>
<path d="M 134 400 Q 375.0 400.5 616 400 Q 620 400 620 404 L 620 511 Q 620 515 616 515 Q 375.0 515.1 134 515 Q 130 515 130 511 L 130 404 Q 130 400 134 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="375.0" y="465.32" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">当天至少两次 ANR</tspan>
</text>
<path d="M 784 400 Q 1025.0 400.1 1266 400 Q 1270 400 1270 404 L 1270 511 Q 1270 515 1266 515 Q 1025.0 514.2 784 515 Q 780 515 780 511 L 780 404 Q 780 400 784 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1025.0" y="465.32" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">Multiple：至少两次的活跃用户设备 / DAU</tspan>
</text>
<text x="700" y="610" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">API isUserPerceptible 以系统对话框定义，与 Play 当前只计输入分发的口径不同。</tspan>
