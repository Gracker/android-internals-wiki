<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">用 Job 完成契约覆盖未执行协程体的取消</title>
<desc id="desc">只在协程体finally调用finish会漏掉体未开始的取消；完成处理器仅结束广播，不做额外重活。 若工作进入不可取消阻塞，Job 无法及时完成；内部超时不保证 finish 一定赶上系统期限。 Job进入任一种终态；完成处理器执行一次</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="410" fill="white"/>
<path d="M 430 165 L 540 165" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 530 159 L 540 165 L 530 171" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 940 165 L 1030 165" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1020 159 L 1030 165 L 1020 171" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 110 Q 250.0 110.3 426 110 Q 430 110 430 114 L 430 216 Q 430 220 426 220 Q 250.0 219.2 74 220 Q 70 220 70 216 L 70 114 Q 70 110 74 110" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="250.0" y="156.5" text-anchor="middle" style="font-size:25px">
<tspan x="250.0" dy="0">launch 返回 Job</tspan>
<tspan x="250.0" dy="34.0">注册完成处理器</tspan>
</text>
<path d="M 544 110 Q 740.0 109.6 936 110 Q 940 110 940 114 L 940 216 Q 940 220 936 220 Q 740.0 220.0 544 220 Q 540 220 540 216 L 540 114 Q 540 110 544 110" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="740.0" y="156.5" text-anchor="middle" style="font-size:25px">
<tspan x="740.0" dy="0">启动前取消 / 任务失败</tspan>
<tspan x="740.0" dy="34.0">或任务成功完成</tspan>
</text>
<path d="M 1034 110 Q 1180.0 109.4 1326 110 Q 1330 110 1330 114 L 1330 216 Q 1330 220 1326 220 Q 1180.0 219.3 1034 220 Q 1030 220 1030 216 L 1030 114 Q 1030 110 1034 110" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1180.0" y="156.5" text-anchor="middle" style="font-size:25px">
<tspan x="1180.0" dy="0">invokeOnCompletion</tspan>
<tspan x="1180.0" dy="34.0">唯一 finish 调用</tspan>
</text>
<text x="700.0" y="365" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">若工作进入不可取消阻塞，Job 无法及时完成；内部超时不保证 finish 一定赶上系统期限。</tspan>
</text>
</svg>
