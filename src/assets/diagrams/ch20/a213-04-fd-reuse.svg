<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="title desc">
<title id="title">晚到的第二次 close 可能关闭另一所有者的新资源</title>
<desc id="desc">A关闭g1后编号可被B复用；A再次按旧整数close时，可能操作B的g2，造成关闭后使用或数据损坏。 编号与区间均为教学示意，无时间刻度；generation 属监控账本，不是内核 FD 编号的一部分。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="590" fill="white"/>
<text x="700" y="75" text-anchor="middle" style="font-size:25px">
<tspan x="700" dy="0">同一整数编号，不同资源生命周期。</tspan>
</text>
<text x="700" y="535" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">把旧的 123 和新的 123 分开记账，丢事件时仍须标记 unknown。</tspan>
</text>
<text x="246" y="153" text-anchor="end" style="font-size:23px">
<tspan x="246" dy="0">编号 123</tspan>
</text>
<path d="M 260 169 H 1310" stroke="#777777" stroke-width="1.5"/>
<path d="M 314 130 Q 460.0 130.7 606 130 Q 610 130 610 134 L 610 163 Q 610 167 606 167 Q 460.0 167.1 314 167 Q 310 167 310 163 L 310 134 Q 310 130 314 130" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="460.0" y="156" text-anchor="middle" style="font-size:21px">
<tspan x="460.0" dy="0">generation 1</tspan>
</text>
<path d="M 764 130 Q 960.0 129.9 1156 130 Q 1160 130 1160 134 L 1160 163 Q 1160 167 1156 167 Q 960.0 167.0 764 167 Q 760 167 760 163 L 760 134 Q 760 130 764 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="960.0" y="156" text-anchor="middle" style="font-size:21px">
<tspan x="960.0" dy="0">generation 2</tspan>
</text>
<text x="246" y="278" text-anchor="end" style="font-size:23px">
<tspan x="246" dy="0">owner A</tspan>
</text>
<path d="M 260 294 H 1310" stroke="#777777" stroke-width="1.5"/>
<path d="M 314 255 Q 375.0 255.1 436 255 Q 440 255 440 259 L 440 288 Q 440 292 436 292 Q 375.0 291.2 314 292 Q 310 292 310 288 L 310 259 Q 310 255 314 255" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="375.0" y="281" text-anchor="middle" style="font-size:21px">
<tspan x="375.0" dy="0">创建</tspan>
</text>
<path d="M 614 255 Q 680.0 255.0 746 255 Q 750 255 750 259 L 750 288 Q 750 292 746 292 Q 680.0 291.5 614 292 Q 610 292 610 288 L 610 259 Q 610 255 614 255" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="680.0" y="281" text-anchor="middle" style="font-size:21px">
<tspan x="680.0" dy="0">关闭 g1</tspan>
</text>
<path d="M 1164 255 Q 1225.0 254.5 1286 255 Q 1290 255 1290 259 L 1290 288 Q 1290 292 1286 292 Q 1225.0 291.2 1164 292 Q 1160 292 1160 288 L 1160 259 Q 1160 255 1164 255" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1225.0" y="281" text-anchor="middle" style="font-size:21px">
<tspan x="1225.0" dy="0">误关 g2</tspan>
</text>
<text x="246" y="403" text-anchor="end" style="font-size:23px">
<tspan x="246" dy="0">owner B</tspan>
</text>
<path d="M 260 419 H 1310" stroke="#777777" stroke-width="1.5"/>
<path d="M 764 380 Q 960.0 379.5 1156 380 Q 1160 380 1160 384 L 1160 413 Q 1160 417 1156 417 Q 960.0 416.3 764 417 Q 760 417 760 413 L 760 384 Q 760 380 764 380" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="960.0" y="406" text-anchor="middle" style="font-size:21px">
<tspan x="960.0" dy="0">重新分配到 123，持有 g2</tspan>
</text>
</svg>
