<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
<title id="title">可见性取消当轮 children，销毁结束外层 View scope</title>
<desc id="desc">每次STARTED重建收集轮次，STOP取消这一轮；两个长期Flow需要不同child并行collect。 区间为状态示意，无耗时比例；repeatOnLifecycle 等待上一轮清理后再重启。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="570" fill="white"/>
<text x="700.0" y="525" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">区间为状态示意，无耗时比例；repeatOnLifecycle 等待上一轮清理后再重启。</tspan>
</text>
<text x="266" y="153" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">View lifecycle</tspan>
</text>
<path d="M 280 169 H 1280" stroke="#777777" stroke-width="1.5"/>
<path d="M 284 130 Q 420.0 130.7 556 130 Q 560 130 560 134 L 560 163 Q 560 167 556 167 Q 420.0 167.7 284 167 Q 280 167 280 163 L 280 134 Q 280 130 284 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="420.0" y="156" text-anchor="middle" style="font-size:21px">
<tspan x="420.0" dy="0">STARTED</tspan>
</text>
<path d="M 564 130 Q 660.0 129.5 756 130 Q 760 130 760 134 L 760 163 Q 760 167 756 167 Q 660.0 167.7 564 167 Q 560 167 560 163 L 560 134 Q 560 130 564 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="660.0" y="156" text-anchor="middle" style="font-size:21px">
<tspan x="660.0" dy="0">STOPPED</tspan>
</text>
<path d="M 764 130 Q 900.0 129.3 1036 130 Q 1040 130 1040 134 L 1040 163 Q 1040 167 1036 167 Q 900.0 166.8 764 167 Q 760 167 760 163 L 760 134 Q 760 130 764 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="900.0" y="156" text-anchor="middle" style="font-size:21px">
<tspan x="900.0" dy="0">STARTED</tspan>
</text>
<path d="M 1044 130 Q 1150.0 129.8 1256 130 Q 1260 130 1260 134 L 1260 163 Q 1260 167 1256 167 Q 1150.0 166.4 1044 167 Q 1040 167 1040 163 L 1040 134 Q 1040 130 1044 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1150.0" y="156" text-anchor="middle" style="font-size:21px">
<tspan x="1150.0" dy="0">DESTROYED</tspan>
</text>
<text x="266" y="273" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">collector children</tspan>
</text>
<path d="M 280 289 H 1280" stroke="#777777" stroke-width="1.5"/>
<path d="M 284 250 Q 420.0 249.6 556 250 Q 560 250 560 254 L 560 283 Q 560 287 556 287 Q 420.0 287.3 284 287 Q 280 287 280 283 L 280 254 Q 280 250 284 250" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="420.0" y="276" text-anchor="middle" style="font-size:21px">
<tspan x="420.0" dy="0">第一轮并行收集</tspan>
</text>
<path d="M 764 250 Q 900.0 249.6 1036 250 Q 1040 250 1040 254 L 1040 283 Q 1040 287 1036 287 Q 900.0 287.0 764 287 Q 760 287 760 283 L 760 254 Q 760 250 764 250" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="900.0" y="276" text-anchor="middle" style="font-size:21px">
<tspan x="900.0" dy="0">新一轮并行收集</tspan>
</text>
<text x="266" y="393" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">外层 View scope</tspan>
</text>
<path d="M 280 409 H 1280" stroke="#777777" stroke-width="1.5"/>
<path d="M 284 370 Q 660.0 370.0 1036 370 Q 1040 370 1040 374 L 1040 403 Q 1040 407 1036 407 Q 660.0 406.5 284 407 Q 280 407 280 403 L 280 374 Q 280 370 284 370" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="660.0" y="396" text-anchor="middle" style="font-size:21px">
<tspan x="660.0" dy="0">存活至 View DESTROYED，等待与重启收集轮次</tspan>
</text>
</svg>
