<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">系统阶段、全局属性与应用 Receiver 完成是不同里程碑</title>
<desc id="desc">固定AMS在属性后调用UserController.onBootComplete；属性已置位不能证明某SDK Receiver已成功执行。 按 user、system_server 实例、进程 PID 和任务 ID 对齐；Direct Boot 与 stopped 状态另核。 phase 600 / 可启动第三方应用 → finishBooting / phase 1000；finishBooting / phase 1000 → sys.boot_completed=1 / 进入用户启动完成流程；sys.boot_completed=1 / 进入用户启动完成流程 → 用户 Receiver / Job / 逐进程保存结果</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
