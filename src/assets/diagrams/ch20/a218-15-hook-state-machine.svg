<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">状态显式表达解析、安装失败与安全停用</title>
<desc id="desc">重复通知、动态装载和关闭都需有明确状态；ACTIVE不是任意一个槽写入成功就成立。 工程状态模型；不是 Android 公开 Hook API 或框架统一枚举。 声明后解析；校验后安装；安装失败保留错误；安装成功发布ACTIVE；关闭入口进入停用；完成协议后停用</desc>
