<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">ANR 类型决定要追哪条线程</title>
<desc id="desc">主线程nativePollOnce只说明采样时空闲；广播worker、焦点或晚采样仍可能解释ANR。 栈快照不是完整时间线；先类型，再线程，再等待所有者。 input dispatch / executing service → 主线程、启动路径、焦点或同步等待；broadcast / goAsync → receiver 线程、工作线程与 finish；provider not responding → 发布线程、Binder 入口与调用方</desc>
