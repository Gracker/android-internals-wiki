<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
<title id="title">监督改变失败传播，owner 取消仍向所有 child 传播</title>
<desc id="desc">普通child失败影响普通parent与siblings；SupervisorJob隔离child失败，但任何parent取消仍传播给children。 不要向 launch / async 直接传新 Job 破坏原 scope 的父子关系。 普通子任务失败使parent失败；Supervisor拥有子任务，子任务失败不会反向取消它</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="570" fill="white"/>
<path d="M 365 290 L 365 200" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 359 210 L 365 200 L 371 210" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1035 200 L 1035 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1029 280 L 1035 290 L 1041 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 134 110 Q 365.0 110.2 596 110 Q 600 110 600 114 L 600 196 Q 600 200 596 200 Q 365.0 199.6 134 200 Q 130 200 130 196 L 130 114 Q 130 110 134 110" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="365.0" y="163.5" text-anchor="middle" style="font-size:25px">
<tspan x="365.0" dy="0">普通 parent Job</tspan>
</text>
<path d="M 134 290 Q 365.0 290.1 596 290 Q 600 290 600 294 L 600 376 Q 600 380 596 380 Q 365.0 379.5 134 380 Q 130 380 130 376 L 130 294 Q 130 290 134 290" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="365.0" y="343.5" text-anchor="middle" style="font-size:25px">
<tspan x="365.0" dy="0">child 非取消失败</tspan>
</text>
<path d="M 804 110 Q 1035.0 109.6 1266 110 Q 1270 110 1270 114 L 1270 196 Q 1270 200 1266 200 Q 1035.0 199.4 804 200 Q 800 200 800 196 L 800 114 Q 800 110 804 110" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1035.0" y="163.5" text-anchor="middle" style="font-size:25px">
<tspan x="1035.0" dy="0">SupervisorJob</tspan>
</text>
<path d="M 804 290 Q 1035.0 289.5 1266 290 Q 1270 290 1270 294 L 1270 376 Q 1270 380 1266 380 Q 1035.0 379.7 804 380 Q 800 380 800 376 L 800 294 Q 800 290 804 290" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1035.0" y="343.5" text-anchor="middle" style="font-size:25px">
<tspan x="1035.0" dy="0">某个 child 失败</tspan>
</text>
<rect x="411.0" y="220.0" width="108.0" height="36.3" fill="white"/>
<text x="465" y="245" text-anchor="middle" style="font-size:23px">
<tspan x="465" dy="0">失败向上</tspan>
</text>
<rect x="1081.0" y="220.0" width="108.0" height="36.3" fill="white"/>
<text x="1135" y="245" text-anchor="middle" style="font-size:23px">
<tspan x="1135" dy="0">父子关系</tspan>
</text>
<text x="365" y="435" text-anchor="middle" style="font-size:23px">
<tspan x="365" dy="0">失败传播 → parent 失败与 siblings 取消</tspan>
</text>
<text x="1035" y="435" text-anchor="middle" style="font-size:23px">
<tspan x="1035" dy="0">失败隔离 → siblings 可继续</tspan>
</text>
<text x="700" y="515" text-anchor="middle" style="font-size:24px">
<tspan x="700" dy="0">两边 owner 主动取消 parent 时，所有 children 都会收到取消。</tspan>
</text>
</svg>
