<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
<title id="title">同步嵌套回调可以重入原等待线程</title>
<desc id="desc">Binder允许递归同步调用；不能仅凭A等待B且B回调A就断言死锁，还要证明锁、执行线程与等待链。 Java monitor 可重入；其他线程或跨进程锁等待仍需完整因果证据。 A同步调用B；B同步嵌套回调A可复用原等待线程；原A线程重入自身调用栈</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="610" fill="white"/>
<path d="M 600 185 L 800 185" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 790 179 L 800 185 L 790 191" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1035 240 L 1035 405 L 600 405" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 610 399 L 600 405 L 610 411" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 365 350 L 365 240" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 359 250 L 365 240 L 371 250" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 134 130 Q 365.0 129.6 596 130 Q 600 130 600 134 L 600 236 Q 600 240 596 240 Q 365.0 239.4 134 240 Q 130 240 130 236 L 130 134 Q 130 130 134 130" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="365.0" y="176.5" text-anchor="middle" style="font-size:25px">
<tspan x="365.0" dy="0">A 调用线程</tspan>
<tspan x="365.0" dy="34.0">可持有业务状态</tspan>
</text>
<path d="M 804 130 Q 1035.0 129.9 1266 130 Q 1270 130 1270 134 L 1270 236 Q 1270 240 1266 240 Q 1035.0 240.2 804 240 Q 800 240 800 236 L 800 134 Q 800 130 804 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1035.0" y="176.5" text-anchor="middle" style="font-size:25px">
<tspan x="1035.0" dy="0">B Binder worker</tspan>
<tspan x="1035.0" dy="34.0">处理同步请求</tspan>
</text>
<path d="M 134 350 Q 365.0 350.4 596 350 Q 600 350 600 354 L 600 456 Q 600 460 596 460 Q 365.0 460.3 134 460 Q 130 460 130 456 L 130 354 Q 130 350 134 350" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="365.0" y="396.5" text-anchor="middle" style="font-size:25px">
<tspan x="365.0" dy="0">A 原等待线程</tspan>
<tspan x="365.0" dy="34.0">可被复用处理嵌套回调</tspan>
</text>
<rect x="646.0" y="120.0" width="108.0" height="36.3" fill="white"/>
<text x="700" y="145" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">同步请求</tspan>
</text>
<rect x="1106.0" y="300.0" width="108.0" height="36.3" fill="white"/>
<text x="1160" y="325" text-anchor="middle" style="font-size:23px">
<tspan x="1160" dy="0">嵌套回调</tspan>
</text>
<text x="700.0" y="565" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">Java monitor 可重入；其他线程或跨进程锁等待仍需完整因果证据。</tspan>
</text>
</svg>
