<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">移除一个自动入口不保证共享依赖完全不再执行</title>
<desc id="desc">手动initializeComponent会按依赖图初始化；App Startup统一入口与顺序，不会自动把create移出主线程。 虚线表示 A 的自动根已关闭；B 的实线依赖仍可到达 C。 A的依赖关系仍在，移除自动根不等于删依赖；B的活跃依赖路径仍可初始化C</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="560" fill="white"/>
<path d="M 260 210 L 260 385 L 520 385" stroke="#202020" stroke-width="2.8" fill="none" stroke-dasharray="7 6"/>
<path d="M 510 379 L 520 385 L 510 391" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1140 210 L 1140 385 L 880 385" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890 379 L 880 385 L 890 391" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 84 100 Q 260.0 99.7 436 100 Q 440 100 440 104 L 440 206 Q 440 210 436 210 Q 260.0 209.8 84 210 Q 80 210 80 206 L 80 104 Q 80 100 84 100" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="260.0" y="146.5" text-anchor="middle" style="font-size:25px">
<tspan x="260.0" dy="0">Initializer A</tspan>
<tspan x="260.0" dy="34.0">移除自动入口</tspan>
</text>
<path d="M 964 100 Q 1140.0 100.5 1316 100 Q 1320 100 1320 104 L 1320 206 Q 1320 210 1316 210 Q 1140.0 210.4 964 210 Q 960 210 960 206 L 960 104 Q 960 100 964 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1140.0" y="146.5" text-anchor="middle" style="font-size:25px">
<tspan x="1140.0" dy="0">Initializer B</tspan>
<tspan x="1140.0" dy="34.0">仍有 Manifest 入口</tspan>
</text>
<path d="M 524 330 Q 700.0 329.8 876 330 Q 880 330 880 334 L 880 436 Q 880 440 876 440 Q 700.0 439.8 524 440 Q 520 440 520 436 L 520 334 Q 520 330 524 330" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="700.0" y="376.5" text-anchor="middle" style="font-size:25px">
<tspan x="700.0" dy="0">依赖 C</tspan>
<tspan x="700.0" dy="34.0">B 仍可自动初始化它</tspan>
</text>
<text x="700.0" y="515" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">虚线表示 A 的自动根已关闭；B 的实线依赖仍可到达 C。</tspan>
</text>
</svg>
