<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Linux task 退出后，joinable 映射还可能保留</title>
<desc id="desc">创建后必须明确detach或一次join；历史trace可保留线程实体，但它不表示用户空间映射仍被持有。 教学区间，无耗时刻度；默认 Java platform thread 由 ART 设为 detached。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="560" fill="white"/>
<text x="700.0" y="515" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">教学区间，无耗时刻度；默认 Java platform thread 由 ART 设为 detached。</tspan>
</text>
<text x="266" y="153" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">joinable worker</tspan>
</text>
<path d="M 280 169 H 1280" stroke="#777777" stroke-width="1.5"/>
<path d="M 284 130 Q 420.0 130.6 556 130 Q 560 130 560 134 L 560 163 Q 560 167 556 167 Q 420.0 166.6 284 167 Q 280 167 280 163 L 280 134 Q 280 130 284 130" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="420.0" y="156" text-anchor="middle" style="font-size:21px">
<tspan x="420.0" dy="0">运行 task</tspan>
</text>
<text x="266" y="273" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">主映射 / 回收信息</tspan>
</text>
<path d="M 280 289 H 1280" stroke="#777777" stroke-width="1.5"/>
<path d="M 284 250 Q 420.0 249.8 556 250 Q 560 250 560 254 L 560 283 Q 560 287 556 287 Q 420.0 287.6 284 287 Q 280 287 280 283 L 280 254 Q 280 250 284 250" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="420.0" y="276" text-anchor="middle" style="font-size:21px">
<tspan x="420.0" dy="0">运行时持有</tspan>
</text>
<path d="M 564 250 Q 770.0 250.1 976 250 Q 980 250 980 254 L 980 283 Q 980 287 976 287 Q 770.0 287.4 564 287 Q 560 287 560 283 L 560 254 Q 560 250 564 250" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="770.0" y="276" text-anchor="middle" style="font-size:21px">
<tspan x="770.0" dy="0">已退出，仍等待 join / detach</tspan>
</text>
<text x="266" y="393" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">owner</tspan>
</text>
<path d="M 280 409 H 1280" stroke="#777777" stroke-width="1.5"/>
<path d="M 984 370 Q 1105.0 369.9 1226 370 Q 1230 370 1230 374 L 1230 403 Q 1230 407 1226 407 Q 1105.0 407.6 984 407 Q 980 407 980 403 L 980 374 Q 980 370 984 370" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1105.0" y="396" text-anchor="middle" style="font-size:21px">
<tspan x="1105.0" dy="0">join 完成后释放</tspan>
</text>
</svg>
