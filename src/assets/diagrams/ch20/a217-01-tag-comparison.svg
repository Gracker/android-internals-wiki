<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
<title id="title">CPU 比较指针标签与内存粒度标签</title>
<desc id="desc">标签不匹配按有效模式报告；同粒度内越界、相同标签碰撞和未受保护映射仍可能漏掉。 标签示例 A / B 仅为符号；4bit 碰撞不是全部缺陷的统一漏检概率。 指针逻辑标签参与检查；映射内存标签参与检查</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
