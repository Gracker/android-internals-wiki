<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">只把有 owner 的等待关系加入 monitor 图</title>
<desc id="desc">held by thread 23 对应同一份 dump 的 Java tid，sysTid 才是 Linux 线程 ID；等待 B 的通知不能凭猜测生成另一条 owner 边。 A、B 为本例对象标签；跨样本或 GC 后对象地址不能当永久锁标识。 同一份 ART dump 显示 main 正在等待持有 A 的 tid23；writer 当前还在 Object.wait(B)，只是状态说明，不是已知 owner 边</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="650" fill="white"/>
<path d="M 440 205 L 820 205" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 810 199 L 820 205 L 810 211" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1045 270 L 1045 420" stroke="#202020" stroke-width="2.8" fill="none" stroke-dasharray="7 6"/>
<path d="M 1039 410 L 1045 420 L 1051 410" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 84 140 Q 260.0 140.0 436 140 Q 440 140 440 144 L 440 266 Q 440 270 436 270 Q 260.0 270.4 84 270 Q 80 270 80 266 L 80 144 Q 80 140 84 140" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="260.0" y="196.5" text-anchor="middle" style="font-size:25px">
<tspan x="260.0" dy="0">main：Java tid=1</tspan>
<tspan x="260.0" dy="34.0">waiting to lock A</tspan>
</text>
<path d="M 824 140 Q 1045.0 139.9 1266 140 Q 1270 140 1270 144 L 1270 266 Q 1270 270 1266 270 Q 1045.0 270.0 824 270 Q 820 270 820 266 L 820 144 Q 820 140 824 140" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1045.0" y="196.5" text-anchor="middle" style="font-size:25px">
<tspan x="1045.0" dy="0">cache-writer：tid=23</tspan>
<tspan x="1045.0" dy="34.0">locked A</tspan>
</text>
<path d="M 824 420 Q 1045.0 419.5 1266 420 Q 1270 420 1270 424 L 1270 546 Q 1270 550 1266 550 Q 1045.0 550.5 824 550 Q 820 550 820 546 L 820 424 Q 820 420 824 420" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1045.0" y="476.5" text-anchor="middle" style="font-size:25px">
<tspan x="1045.0" dy="0">Object.wait(B)</tspan>
<tspan x="1045.0" dy="34.0">已释放 B；唤醒责任未知</tspan>
</text>
<rect x="546.6" y="150.0" width="166.7" height="36.3" fill="white"/>
<text x="630" y="175" text-anchor="middle" style="font-size:23px">
<tspan x="630" dy="0">有 owner 证据</tspan>
</text>
<rect x="991.0" y="330.0" width="108.0" height="36.3" fill="white"/>
<text x="1045" y="355" text-anchor="middle" style="font-size:23px">
<tspan x="1045" dy="0">状态说明</tspan>
</text>
<text x="700.0" y="605" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">A、B 为本例对象标签；跨样本或 GC 后对象地址不能当永久锁标识。</tspan>
</text>
</svg>
