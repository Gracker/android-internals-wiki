<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">bionic 接口别名与当前 allocator 实现共同决定统计</title>
<desc id="desc">当前malloc dispatch、sanitizer与profiler会影响可用性与语义；零值和无数据必须区分。 这是固定 bionic / Scudo 映射；跨 allocator 不能假定全部字段具有相同精确语义。 mallinfo2 → __RENAME(mallinfo) → Android 字段已是 size_t；不同于 glibc 历史；Debug allocated / size / free → 分别读 uordblks / usmblks / fordblks；Scudo wrapper 填充主要字段 → allocated / mapped / free；不等于 RSS/PSS</desc>
