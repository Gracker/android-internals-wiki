<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
<title id="title">SYNC 的访问现场与 ASYNC 的报告点不同</title>
<desc id="desc">SYNC常见SEGV_MTESERR，可用当前PC与地址定位；ASYNC常见MTEAERR，当前栈可能是延迟报告点。 教学区间，无时间测量；常规终止配置之外还有平台 Permissive 诊断例外。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="570" fill="white"/>
<text x="700.0" y="525" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">教学区间，无时间测量；常规终止配置之外还有平台 Permissive 诊断例外。</tspan>
</text>
<text x="266" y="153" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">错误访问</tspan>
</text>
<path d="M 280 169 H 1280" stroke="#777777" stroke-width="1.5"/>
<path d="M 364 130 Q 470.0 130.2 576 130 Q 580 130 580 134 L 580 163 Q 580 167 576 167 Q 470.0 167.2 364 167 Q 360 167 360 163 L 360 134 Q 360 130 364 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="470.0" y="156" text-anchor="middle" style="font-size:21px">
<tspan x="470.0" dy="0">标签不匹配</tspan>
</text>
<text x="266" y="273" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">SYNC</tspan>
</text>
<path d="M 280 289 H 1280" stroke="#777777" stroke-width="1.5"/>
<path d="M 364 250 Q 470.0 250.2 576 250 Q 580 250 580 254 L 580 283 Q 580 287 576 287 Q 470.0 286.6 364 287 Q 360 287 360 283 L 360 254 Q 360 250 364 250" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="470.0" y="276" text-anchor="middle" style="font-size:21px">
<tspan x="470.0" dy="0">现场报告</tspan>
</text>
<text x="266" y="393" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">ASYNC</tspan>
</text>
<path d="M 280 409 H 1280" stroke="#777777" stroke-width="1.5"/>
<path d="M 364 370 Q 630.0 369.5 896 370 Q 900 370 900 374 L 900 403 Q 900 407 896 407 Q 630.0 406.7 364 407 Q 360 407 360 403 L 360 374 Q 360 370 364 370" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="630.0" y="396" text-anchor="middle" style="font-size:21px">
<tspan x="630.0" dy="0">可能暂时继续执行</tspan>
</text>
<path d="M 904 370 Q 1065.0 370.7 1226 370 Q 1230 370 1230 374 L 1230 403 Q 1230 407 1226 407 Q 1065.0 407.3 904 407 Q 900 407 900 403 L 900 374 Q 900 370 904 370" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1065.0" y="396" text-anchor="middle" style="font-size:21px">
<tspan x="1065.0" dy="0">后续进入内核时报告</tspan>
</text>
</svg>
