<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">错误预算的单位跟随 SLI 分母</title>
<desc id="desc">预算按受影响会话消耗；同一会话的重复 Crash 记录仍只消耗一个会话单位，短长窗口联合观察燃烧速度。 99.8%、3000 万与 0.6% 均为演示值，不是行业门槛。 演示 SLO\n30 天无崩溃 ≥99.8% → 允许坏会话比例\n1 − 99.8% = 0.2%；允许坏会话比例\n1 − 99.8% = 0.2% → 3000 万有效会话\n允许 6 万坏会话；3000 万有效会话\n允许 6 万坏会话 → 最近 1 h 坏会话 0.6%\nburn rate = 3</desc>
