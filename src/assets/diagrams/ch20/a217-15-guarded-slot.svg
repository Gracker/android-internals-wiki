<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
<title id="title">保护页与释放后隔离暴露抽样对象的非法访问</title>
<desc id="desc">越界跨入guard page或访问已释放隔离槽可触发；仍在可访问区域内的越界、未抽中对象或槽复用可能漏掉。 页面和槽位宽度为结构示意，不按字节比例；16KB 页不自动令槽数或采样率变成四分之一。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="470" fill="white"/>
<path d="M 114 130 Q 240.0 129.5 366 130 Q 370 130 370 134 L 370 276 Q 370 280 366 280 Q 240.0 280.6 114 280 Q 110 280 110 276 L 110 134 Q 110 130 114 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="240.0" y="196.5" text-anchor="middle" style="font-size:25px">
<tspan x="240.0" dy="0">guard page</tspan>
<tspan x="240.0" dy="34.0">不可访问</tspan>
</text>
<path d="M 374 130 Q 700.0 130.7 1026 130 Q 1030 130 1030 134 L 1030 276 Q 1030 280 1026 280 Q 700.0 279.6 374 280 Q 370 280 370 276 L 370 134 Q 370 130 374 130" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="700.0" y="196.5" text-anchor="middle" style="font-size:25px">
<tspan x="700.0" dy="0">抽样对象所在槽</tspan>
<tspan x="700.0" dy="34.0">可访问区域</tspan>
</text>
<path d="M 1034 130 Q 1160.0 130.1 1286 130 Q 1290 130 1290 134 L 1290 276 Q 1290 280 1286 280 Q 1160.0 279.5 1034 280 Q 1030 280 1030 276 L 1030 134 Q 1030 130 1034 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1160.0" y="196.5" text-anchor="middle" style="font-size:25px">
<tspan x="1160.0" dy="0">guard page</tspan>
<tspan x="1160.0" dy="34.0">不可访问</tspan>
</text>
<text x="700" y="350" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">free 后：该槽进入不可访问 / 隔离状态，旧指针再访问可暴露错误。</tspan>
</text>
<text x="700" y="420" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">直接 mmap、自研 arena、stack / globals、GPU buffer 不属于同一分配路径。</tspan>
</text>
</svg>
