<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="550" viewBox="0 0 1400 550" role="img" aria-labelledby="title desc">
<title id="title">沿同一 trace 的 flow 关联请求、处理、回复与调度</title>
<desc id="desc">客户端停在transactNative只能证明等待；服务端是否在运行、等CPU、锁或下游，需两端slice与sched证据。 教学轨道，无测量数值；业务 request ID 跨会话，trace debug ID 只在本 trace 关联。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="550" fill="white"/>
<text x="700.0" y="505" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">教学轨道，无测量数值；业务 request ID 跨会话，trace debug ID 只在本 trace 关联。</tspan>
</text>
<text x="266" y="143" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">客户端</tspan>
</text>
<path d="M 280 159 H 1280" stroke="#777777" stroke-width="1.5"/>
<path d="M 284 120 Q 755.0 119.3 1226 120 Q 1230 120 1230 124 L 1230 153 Q 1230 157 1226 157 Q 755.0 156.7 284 157 Q 280 157 280 153 L 280 124 Q 280 120 284 120" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="755.0" y="146" text-anchor="middle" style="font-size:21px">
<tspan x="755.0" dy="0">同步调用端到端等待</tspan>
</text>
<text x="266" y="263" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">服务端 Binder</tspan>
</text>
<path d="M 280 279 H 1280" stroke="#777777" stroke-width="1.5"/>
<path d="M 444 240 Q 545.0 240.7 646 240 Q 650 240 650 244 L 650 273 Q 650 277 646 277 Q 545.0 277.1 444 277 Q 440 277 440 273 L 440 244 Q 440 240 444 240" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="545.0" y="266" text-anchor="middle" style="font-size:21px">
<tspan x="545.0" dy="0">排队 / 调度</tspan>
</text>
<path d="M 654 240 Q 840.0 240.4 1026 240 Q 1030 240 1030 244 L 1030 273 Q 1030 277 1026 277 Q 840.0 277.0 654 277 Q 650 277 650 273 L 650 244 Q 650 240 654 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
