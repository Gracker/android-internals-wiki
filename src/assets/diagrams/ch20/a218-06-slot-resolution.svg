<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">从调用方动态表逐步定位目标重定位槽</title>
<desc id="desc">JUMP_SLOT、GLOB_DAT、ABS64按实际表项区分；同名字符串或附近地址不能直接用作改写证据。 Android packed relocations 需要正确解码；回调后的元数据还受 ELF 生命周期约束。 调用方 ELF / PT_DYNAMIC → dynsym / strtab / 符号与 relocation type；dynsym / strtab / 符号与 relocation type → load_bias + r_offset / 得到 runtime_slot；load_bias + r_offset / 得到 runtime_slot → 核对旧值与 ABI / 确认函数入口</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
