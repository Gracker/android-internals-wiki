<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
<title id="title">getAllStackTraces 逐线程取得多时刻快照</title>
<desc id="desc">先枚举活动线程，再分别 getStackTrace；线程仍能运行、创建或退出，各条栈不是同一时刻的全局快照。 示意采样顺序，无时间刻度；不表示实测时长或完整线程覆盖。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="540" fill="white"/>
<text x="700" y="90" text-anchor="middle" style="font-size:25px">
<tspan x="700" dy="0">先取得线程列表，再逐个取栈；每次取栈仍可能分配 Java 对象。</tspan>
</text>
<text x="700" y="490" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">示意采样顺序，无时间刻度；不能据此建立严格同时的死锁证明。</tspan>
</text>
<text x="226" y="183" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">线程 A</tspan>
</text>
<path d="M 240 199 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 274 160 Q 370.0 160.2 466 160 Q 470 160 470 164 L 470 193 Q 470 197 466 197 Q 370.0 197.5 274 197 Q 270 197 270 193 L 270 164 Q 270 160 274 160" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="370.0" y="186" text-anchor="middle" style="font-size:21px">
<tspan x="370.0" dy="0">取 A 的栈</tspan>
</text>
<text x="226" y="283" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">线程 B</tspan>
</text>
<path d="M 240 299 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 604 260 Q 700.0 259.9 796 260 Q 800 260 800 264 L 800 293 Q 800 297 796 297 Q 700.0 297.1 604 297 Q 600 297 600 293 L 600 264 Q 600 260 604 260" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="700.0" y="286" text-anchor="middle" style="font-size:21px">
<tspan x="700.0" dy="0">取 B 的栈</tspan>
</text>
<text x="226" y="383" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">线程 C</tspan>
</text>
<path d="M 240 399 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 944 360 Q 1040.0 359.9 1136 360 Q 1140 360 1140 364 L 1140 393 Q 1140 397 1136 397 Q 1040.0 397.7 944 397 Q 940 397 940 393 L 940 364 Q 940 360 944 360" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1040.0" y="386" text-anchor="middle" style="font-size:21px">
<tspan x="1040.0" dy="0">取 C 的栈</tspan>
</text>
</svg>
