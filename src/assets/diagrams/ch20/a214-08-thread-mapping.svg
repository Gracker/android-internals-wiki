<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">bionic 主映射与实际驻留成本分别观察</title>
<desc id="desc">示意固定bionic映射组成；备用信号栈、shadow call stack等附属区域另计，ART还会按Xss及保护区调整。 布局为结构示意，宽度不代表字节比例；虚拟预留不等于 RSS。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="410" fill="white"/>
<path d="M 144 140 Q 225.0 139.9 306 140 Q 310 140 310 144 L 310 286 Q 310 290 306 290 Q 225.0 289.6 144 290 Q 140 290 140 286 L 140 144 Q 140 140 144 140" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="225.0" y="223.5" text-anchor="middle" style="font-size:25px">
<tspan x="225.0" dy="0">guard</tspan>
</text>
<path d="M 314 140 Q 565.0 140.1 816 140 Q 820 140 820 144 L 820 286 Q 820 290 816 290 Q 565.0 289.9 314 290 Q 310 290 310 286 L 310 144 Q 310 140 314 140" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="565.0" y="223.5" text-anchor="middle" style="font-size:25px">
<tspan x="565.0" dy="0">stack / static TLS</tspan>
</text>
<path d="M 824 140 Q 955.0 140.7 1086 140 Q 1090 140 1090 144 L 1090 286 Q 1090 290 1086 290 Q 955.0 290.7 824 290 Q 820 290 820 286 L 820 144 Q 820 140 824 140" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="955.0" y="223.5" text-anchor="middle" style="font-size:25px">
<tspan x="955.0" dy="0">libgen buffers</tspan>
</text>
<path d="M 1094 140 Q 1175.0 140.8 1256 140 Q 1260 140 1260 144 L 1260 286 Q 1260 290 1256 290 Q 1175.0 290.1 1094 290 Q 1090 290 1090 286 L 1090 144 Q 1090 140 1094 140" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1175.0" y="223.5" text-anchor="middle" style="font-size:25px">
<tspan x="1175.0" dy="0">guard</tspan>
</text>
<text x="700" y="85" text-anchor="middle" style="font-size:24px">
<tspan x="700" dy="0">MAP_NORESERVE 主映射；按页大小、ABI 与运行时规则布局。</tspan>
</text>
<text x="700" y="350" text-anchor="middle" style="font-size:24px">
<tspan x="700" dy="0">不能用“线程数 × 1 MiB”推算物理内存，也不能推算 FD 数。</tspan>
</text>
</svg>
