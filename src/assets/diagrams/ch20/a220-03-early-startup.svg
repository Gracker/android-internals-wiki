<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">Provider 自动入口先于 Application.onCreate 执行</title>
<desc id="desc">固定非受限备份启动路径：Provider和App Startup初始化可能发生在业务Application.onCreate之前。 Application 对象已先创建；restrictedBackupMode 可能跳过 Provider 安装。 创建 Application / 普通 bindApplication → 安装 Providers / 类加载 / onCreate；安装 Providers / 类加载 / onCreate → Application.onCreate / 只打这里会漏前段；Application.onCreate / 只打这里会漏前段 → 首屏与首次交互 / 检查后台竞争</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
