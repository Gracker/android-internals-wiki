<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">事件上报次数与激活次数分别累计</title>
<desc id="desc">两条箭头表示同次上报的不同统计环节，不是互斥分支。wakeup_count 也可包含导致挂起中止的事件，不能当作成功恢复次数。 两条箭头表示同次上报的不同统计环节，不是互斥分支。wakeup_count 也可包含导致挂起中止的事件，不能当作成功恢复次数。 分支：每次上报 / event_count 增加 / 检查窗口内 wakeup_count 近似增加；分支：仅此前 inactive / 转为 active / active_count 增加 / 记录激活 trace 与开始时间</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="620" fill="white"/>
<path d="M 450 150 L 450 230 L 320.0 230 L 320.0 315" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 314.0 305 L 320.0 315 L 326.0 305" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 150 L 750 230 L 900.0 230 L 900.0 315" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 894.0 305 L 900.0 315 L 906.0 305" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114 40 Q 600.0 39.8 1086 40 Q 1090 40 1090 44 L 1090 146 Q 1090 150 1086 150 Q 600.0 150.1 114 150 Q 110 150 110 146 L 110 44 Q 110 40 114 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="103.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">wakeup_source_report_event(ws)：一个上报可能更新不同统计</tspan>
</text>
<path d="M 74 315 Q 320.0 314.6 566 315 Q 570 315 570 319 L 570 476 Q 570 480 566 480 Q 320.0 479.6 74 480 Q 70 480 70 476 L 70 319 Q 70 315 74 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="373.02000000000004" text-anchor="middle" style="font-size:24px">
<tspan x="320.0" dy="0">每次上报</tspan>
<tspan x="320.0" dy="32.64">event_count 增加</tspan>
<tspan x="320.0" dy="32.64">检查窗口内 wakeup_count 近似增加</tspan>
</text>
<path d="M 654 315 Q 900.0 314.2 1146 315 Q 1150 315 1150 319 L 1150 476 Q 1150 480 1146 480 Q 900.0 480.3 654 480 Q 650 480 650 476 L 650 319 Q 650 315 654 315" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="373.02000000000004" text-anchor="middle" style="font-size:24px">
<tspan x="900.0" dy="0">仅此前 inactive</tspan>
<tspan x="900.0" dy="32.64">转为 active / active_count 增加</tspan>
<tspan x="900.0" dy="32.64">记录激活 trace 与开始时间</tspan>
</text>
</svg>
