<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">主线程与代次检查共同限定 UI 回调</title>
<desc id="desc">取消注册之外还防已经排队的事件。生命周期和回调都在主线程；onAvailable 只表示网络出现，互联网 validated 状态需后续 capabilities。 取消注册之外还防已经排队的事件。生命周期和回调都在主线程；onAvailable 只表示网络出现，互联网 validated 状态需后续 capabilities。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="580" fill="white"/>
<path d="M 114 35 Q 600.0 35.7 1086 35 Q 1090 35 1090 39 L 1090 141 Q 1090 145 1086 145 Q 600.0 145.2 114 145 Q 110 145 110 141 L 110 39 Q 110 35 114 35" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="98.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">API 26+ 指定 main Handler；每轮 onStart 创建新 callback</tspan>
</text>
<path d="M 114 435 Q 600.0 434.6 1086 435 Q 1090 435 1090 439 L 1090 536 Q 1090 540 1086 540 Q 600.0 539.4 114 540 Q 110 540 110 536 L 110 439 Q 110 435 114 435" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="496.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">onStop 先使代次失效再注销；旧事件不能更新新页面会话</tspan>
</text>
<text x="226" y="233" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">会话一</tspan>
</text>
<path d="M 240 249 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 210 Q 375.0 210.4 506 210 Q 510 210 510 214 L 510 243 Q 510 247 506 247 Q 375.0 246.7 244 247 Q 240 247 240 243 L 240 214 Q 240 210 244 210" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="375.0" y="236" text-anchor="middle" style="font-size:21px">
<tspan x="375.0" dy="0">注册 token 1</tspan>
</text>
<path d="M 544 210 Q 645.0 210.0 746 210 Q 750 210 750 214 L 750 243 Q 750 247 746 247 Q 645.0 246.9 544 247 Q 540 247 540 243 L 540 214 Q 540 210 544 210" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="645.0" y="236" text-anchor="middle" style="font-size:21px">
<tspan x="645.0" dy="0">停止 / 注销</tspan>
</text>
<path d="M 794 210 Q 925.0 209.8 1056 210 Q 1060 210 1060 214 L 1060 243 Q 1060 247 1056 247 Q 925.0 247.5 794 247 Q 790 247 790 243 L 790 214 Q 790 210 794 210" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="925.0" y="236" text-anchor="middle" style="font-size:21px">
<tspan x="925.0" dy="0">旧事件拒绝</tspan>
</text>
<text x="226" y="328" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">会话二</tspan>
</text>
<path d="M 240 344 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 794 305 Q 925.0 305.4 1056 305 Q 1060 305 1060 309 L 1060 338 Q 1060 342 1056 342 Q 925.0 342.2 794 342 Q 790 342 790 338 L 790 309 Q 790 305 794 305" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="925.0" y="331" text-anchor="middle" style="font-size:21px">
<tspan x="925.0" dy="0">token 2 才有效</tspan>
</text>
