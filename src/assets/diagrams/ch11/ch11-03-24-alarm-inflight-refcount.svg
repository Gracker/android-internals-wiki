<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Alarm 投递共享锁等最后一项完成</title>
<desc id="desc">示意只针对广播投递完成路径；不是每个 Receiver 返回都释放全局共享锁。direct listener 有自己的完成通知与超时跟踪；持久工作应交给合适调度 API。 示意只针对广播投递完成路径；不是每个 Receiver 返回都释放全局共享锁。direct listener 有自己的完成通知与超时跟踪；持久工作应交给合适调度 API。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="675" fill="white"/>
<path d="M 114 35 Q 600.0 34.7 1086 35 Q 1090 35 1090 39 L 1090 141 Q 1090 145 1086 145 Q 600.0 144.9 114 145 Q 110 145 110 141 L 110 39 Q 110 35 114 35" fill="white" stroke="#4A90D9" stroke-width="3"/>
