<tspan x="600.0" dy="0">DeliveryTracker：in-flight 引用计数管理共享的 *alarm* 锁</tspan>
</text>
<path d="M 114 530 Q 600.0 530.8 1086 530 Q 1090 530 1090 534 L 1090 631 Q 1090 635 1086 635 Q 600.0 634.5 114 635 Q 110 635 110 631 L 110 534 Q 110 530 114 530" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="591.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">goAsync 用 PendingResult.finish 完成；任意异步线程不自动受保护</tspan>
</text>
