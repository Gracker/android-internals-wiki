<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title desc">
<title id="title">屏幕总量与 UID 分配分两步完成</title>
<desc id="desc">硬件 screen energy consumer 不是每 App 的独立屏幕电表。图对应固定 r1 的设备估算与 UID 分配顺序，不继承旧 calculator 的 10 分钟门槛。 硬件 screen energy consumer 不是每 App 的独立屏幕电表。图对应固定 r1 的设备估算与 UID 分配顺序，不继承旧 calculator 的 10 分钟门槛。 下一环节：只在亮屏聚合范围按 top Activity duration 分配 / UID 占比 = 该 UID top 时长 / 总 top 时长；下一环节：总 top 时长为 0 时跳过 UID 分配 / 亮屏成本与 doze 显示成本分开处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="495" fill="white"/>
<path d="M 600 145 L 600 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 185 L 600 195 L 606 185" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 300 L 600 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 340 L 600 350 L 606 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114 40 Q 600.0 39.4 1086 40 Q 1090 40 1090 44 L 1090 141 Q 1090 145 1086 145 Q 600.0 144.8 114 145 Q 110 145 110 141 L 110 44 Q 110 40 114 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="84.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">设备屏幕总量</tspan>
<tspan x="600.0" dy="34.0">有 energy consumer 则用能量；否则用状态时长 + profile</tspan>
</text>
<path d="M 114 195 Q 600.0 194.6 1086 195 Q 1090 195 1090 199 L 1090 296 Q 1090 300 1086 300 Q 600.0 300.6 114 300 Q 110 300 110 296 L 110 199 Q 110 195 114 195" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="239.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">计算亮屏聚合范围内的总 top Activity duration</tspan>
<tspan x="600.0" dy="34.0">总和为 0：跳过 UID 分配</tspan>
</text>
<path d="M 114 350 Q 600.0 350.7 1086 350 Q 1090 350 1090 354 L 1090 451 Q 1090 455 1086 455 Q 600.0 455.4 114 455 Q 110 455 110 451 L 110 354 Q 110 350 114 350" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="394.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">总和 &gt; 0：按各 UID top 时长 / 总 top 时长分配</tspan>
<tspan x="600.0" dy="34.0">亮屏成本与 doze 显示成本分开处理</tspan>
</text>
</svg>
