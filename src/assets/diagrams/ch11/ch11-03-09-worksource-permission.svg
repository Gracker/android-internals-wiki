<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">持有者与被归因方可能不同</title>
<desc id="desc">普通 App 不能靠伪造 WorkSource 任意转移成本。固定 r1 会把空对象归一为 null；持锁方、native 调用 PID 和 BatteryStats 归因 UID 不能混作一个标识。 普通 App 不能靠伪造 WorkSource 任意转移成本。固定 r1 会把空对象归一为 null；持锁方、native 调用 PID 和 BatteryStats 归因 UID 不能混作一个标识。 分支：无归因内容 / null / 空 WorkSource / 按普通 owner 路径处理；分支：含 UID 归因内容 / 校验 UPDATE_DEVICE_STATS / 供系统代执行与记账</desc>
