<tspan x="600.0" dy="34.0">且不支持 time-in-state；还需底层支持</tspan>
</text>
<path d="M 114 195 Q 600.0 194.7 1086 195 Q 1090 195 1090 199 L 1090 296 Q 1090 300 1086 300 Q 600.0 300.2 114 300 Q 110 300 110 296 L 110 199 Q 110 195 114 195" fill="white" stroke="#4CAF50" stroke-width="3"/>
