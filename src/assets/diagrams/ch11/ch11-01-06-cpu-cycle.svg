</text>
<path d="M 114 350 Q 600.0 350.5 1086 350 Q 1090 350 1090 354 L 1090 451 Q 1090 455 1086 455 Q 600.0 454.5 114 455 Q 110 455 110 451 L 110 354 Q 110 350 114 350" fill="white" stroke="#E8913A" stroke-width="3"/>
