<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title desc">
<title id="title">x86 cycle 路径先归因，再由 processor 换单位</title>
<desc id="desc">这条路径的 UID 分配发生在采集侧，不再走常规 profile/bracket 分配。结果仍是共享 package 成本的活动比例归因。 这条路径的 UID 分配发生在采集侧，不再走常规 profile/bracket 分配。结果仍是共享 package 成本的活动比例归因。 下一环节：采集侧：RAPL CPU package 能量 / 按 UID CPU cycle 占比分配；下一环节：结合有效电压将已分配能量转为 µC / processor fast path 将设备 / UID µC 转为 mAh</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
