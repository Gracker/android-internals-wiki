<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">旧扫描回调不能影响新会话</title>
<desc id="desc">轨道仅示意排队关系。删除本地定时任务不会撤回所有已在 Binder/Handler 队列中的事件；同样的对象/会话隔离适用于 GATT 连接。 轨道仅示意排队关系。删除本地定时任务不会撤回所有已在 Binder/Handler 队列中的事件；同样的对象/会话隔离适用于 GATT 连接。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="675" fill="white"/>
<path d="M 114 35 Q 600.0 35.2 1086 35 Q 1090 35 1090 39 L 1090 141 Q 1090 145 1086 145 Q 600.0 145.5 114 145 Q 110 145 110 141 L 110 39 Q 110 35 114 35" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="98.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">每次新会话使用新 callback；业务动作先检查 session 身份</tspan>
</text>
<path d="M 114 530 Q 600.0 529.5 1086 530 Q 1090 530 1090 534 L 1090 631 Q 1090 635 1086 635 Q 600.0 635.4 114 635 Q 110 635 110 631 L 110 534 Q 110 530 114 530" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="591.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">旧事件已排队时，stop 后的新会话仍保持独立</tspan>
</text>
<text x="226" y="233" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">会话 A</tspan>
</text>
<path d="M 240 249 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 210 Q 375.0 210.2 506 210 Q 510 210 510 214 L 510 243 Q 510 247 506 247 Q 375.0 246.9 244 247 Q 240 247 240 243 L 240 214 Q 240 210 244 210" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="375.0" y="236" text-anchor="middle" style="font-size:21px">
<tspan x="375.0" dy="0">start / 旧回调入队</tspan>
</text>
<path d="M 554 210 Q 635.0 210.1 716 210 Q 720 210 720 214 L 720 243 Q 720 247 716 247 Q 635.0 247.7 554 247 Q 550 247 550 243 L 550 214 Q 550 210 554 210" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="635.0" y="236" text-anchor="middle" style="font-size:21px">
<tspan x="635.0" dy="0">stop</tspan>
</text>
<text x="226" y="328" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">会话 B</tspan>
</text>
<path d="M 240 344 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 744 305 Q 895.0 304.7 1046 305 Q 1050 305 1050 309 L 1050 338 Q 1050 342 1046 342 Q 895.0 342.6 744 342 Q 740 342 740 338 L 740 309 Q 740 305 744 305" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="895.0" y="331" text-anchor="middle" style="font-size:21px">
<tspan x="895.0" dy="0">新 start / 新 callback</tspan>
</text>
<text x="226" y="423" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">迟到事件</tspan>
</text>
<path d="M 240 439 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 794 400 Q 920.0 399.3 1046 400 Q 1050 400 1050 404 L 1050 433 Q 1050 437 1046 437 Q 920.0 436.4 794 437 Q 790 437 790 433 L 790 404 Q 790 400 794 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="920.0" y="426" text-anchor="middle" style="font-size:21px">
<tspan x="920.0" dy="0">A 事件：身份不符丢弃</tspan>
</text>
</svg>
