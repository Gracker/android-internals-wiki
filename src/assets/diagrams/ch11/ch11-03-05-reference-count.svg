<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">引用计数锁要平衡每个所有者的申请</title>
<desc id="desc">轨道限定没有自动超时介入的普通引用计数路径。引用计数锁释放过多可触发 under-lock；图不把“锁已不 held”当成所有 owner 的配对都已完成。 轨道限定没有自动超时介入的普通引用计数路径。引用计数锁释放过多可触发 under-lock；图不把“锁已不 held”当成所有 owner 的配对都已完成。 </desc>
