<title id="title">事件通知与统计按 owner 和 WorkSource 组织</title>
<desc id="desc">逻辑启停也可能更新统计，不能只数应用直接 release 次数。系统服务代持不自动意味着能耗计在系统服务名下；归因记录也不是硬件电表。 逻辑启停也可能更新统计，不能只数应用直接 release 次数。系统服务代持不自动意味着能耗计在系统服务名下；归因记录也不是硬件电表。 下一步：Notifier 收到 acquire / release / change / 发监听、日志与相应统计通知；下一步：BatteryStats 等记录 UID / tag 活动 / 结合业务时间线解释归因</desc>
