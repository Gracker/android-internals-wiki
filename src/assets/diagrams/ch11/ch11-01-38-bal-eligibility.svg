<tspan x="320.0" dy="0">发送方路径</tspan>
<tspan x="320.0" dy="32.64">按 target 与 sender mode 检查</tspan>
<tspan x="320.0" dy="32.64">IntentSender 的覆盖规则也要核对</tspan>
</text>
<path d="M 654 315 Q 900.0 314.7 1146 315 Q 1150 315 1150 319 L 1150 476 Q 1150 480 1146 480 Q 900.0 480.1 654 480 Q 650 480 650 476 L 650 319 Q 650 315 654 315" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="373.02000000000004" text-anchor="middle" style="font-size:24px">
<tspan x="900.0" dy="0">创建方路径</tspan>
<tspan x="900.0" dy="32.64">按 target 与 creator mode 检查</tspan>
<tspan x="900.0" dy="32.64">创建 token 不自动转交启动资格</tspan>
</text>
<text x="600" y="570" text-anchor="middle" style="font-size:24px">
