<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">BAL opt-in 必须依附实际已有的资格</title>
<desc id="desc">mode 不会凭空产生后台启动资格。按具体调用链分别核对 sender、creator、IntentSender 和平台例外，不能把双方开关简单当作通用双重授权公式。 mode 不会凭空产生后台启动资格。按具体调用链分别核对 sender、creator、IntentSender 和平台例外，不能把双方开关简单当作通用双重授权公式。 分支：发送方路径 / 按 target 与 sender mode 检查 / IntentSender 的覆盖规则也要核对；分支：创建方路径 / 按 target 与 creator mode 检查 / 创建 token 不自动转交启动资格</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
