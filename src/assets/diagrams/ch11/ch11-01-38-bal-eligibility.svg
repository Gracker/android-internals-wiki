<text x="600.0" y="103.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">这次 PendingIntent 启动依赖哪一方的既有 BAL 资格？</tspan>
</text>
<path d="M 74 315 Q 320.0 314.3 566 315 Q 570 315 570 319 L 570 476 Q 570 480 566 480 Q 320.0 480.3 74 480 Q 70 480 70 476 L 70 319 Q 70 315 74 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
