<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">指标豁免依实际 API 路径，标签不能授予豁免</title>
<desc id="desc">豁免是当前质量指标的计算范围，不能推出零能耗、无限后台执行或 Doze/LPS 豁免。具体锁仍应按业务结束、资源释放和线上实际分类排查。 豁免是当前质量指标的计算范围，不能推出零能耗、无限后台执行或 Doze/LPS 豁免。具体锁仍应按业务结束、资源释放和线上实际分类排查。 分支：当前列明的系统 API 来源 / audio / location / JobScheduler user-initiated；分支：应用 / SDK 普通手工锁 / 或普通调度代持 / 不能凭名字自认豁免</desc>
