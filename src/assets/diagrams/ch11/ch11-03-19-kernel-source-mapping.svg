<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">App 标签和内核唤醒源没有逐把映射</title>
<desc id="desc">输入、USB、modem、alarmtimer 等来源不能仅凭名字映射到 App。默认计数路径、兼容按名接口与驱动事件分别解释，需用统一时间线建立关联。 输入、USB、modem、alarmtimer 等来源不能仅凭名字映射到 App。默认计数路径、兼容按名接口与驱动事件分别解释，需用统一时间线建立关联。 分支：PMS 聚合 / native / 默认用户态 counter / 短时 userspace-abort 辅助；分支：设备驱动 / 兼容接口 / 各自 kernel source / 需按真实实现识别</desc>
