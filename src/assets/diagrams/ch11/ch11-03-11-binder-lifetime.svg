<path d="M 314.0 305 L 320.0 315 L 326.0 305" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 150 L 750 230 L 900.0 230 L 900.0 315" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 894.0 305 L 900.0 315 L 906.0 305" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114 40 Q 600.0 40.3 1086 40 Q 1090 40 1090 44 L 1090 146 Q 1090 150 1086 150 Q 600.0 149.2 114 150 Q 110 150 110 146 L 110 44 Q 110 40 114 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="103.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">WakeLock 的 Binder token 标识 PMS 中的持锁记录</tspan>
</text>
<path d="M 74 315 Q 320.0 315.6 566 315 Q 570 315 570 319 L 570 476 Q 570 480 566 480 Q 320.0 480.3 74 480 Q 70 480 70 476 L 70 319 Q 70 315 74 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="373.02000000000004" text-anchor="middle" style="font-size:24px">
<tspan x="320.0" dy="0">业务正常结束</tspan>
<tspan x="320.0" dy="32.64">owner 主动 release</tspan>
<tspan x="320.0" dy="32.64">服务端移除并重算</tspan>
</text>
<path d="M 654 315 Q 900.0 314.9 1146 315 Q 1150 315 1150 319 L 1150 476 Q 1150 480 1146 480 Q 900.0 480.6 654 480 Q 650 480 650 476 L 650 319 Q 650 315 654 315" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="373.02000000000004" text-anchor="middle" style="font-size:24px">
<tspan x="900.0" dy="0">客户端进程死亡</tspan>
<tspan x="900.0" dy="32.64">Binder death 清理</tspan>
<tspan x="900.0" dy="32.64">防止死亡进程遗留锁</tspan>
</text>
</svg>
