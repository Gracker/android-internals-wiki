<text x="600.0" y="98.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">API 37+：main Executor / OnAlarmListener / elapsedRealtime 时钟</tspan>
</text>
<path d="M 114 435 Q 600.0 435.6 1086 435 Q 1090 435 1090 439 L 1090 536 Q 1090 540 1086 540 Q 600.0 540.2 114 540 Q 110 540 110 536 L 110 439 Q 110 435 114 435" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="496.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">取消使代次失效；跨进程提醒要改用合适 PendingIntent</tspan>
</text>
<text x="226" y="233" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">有效组件</tspan>
</text>
