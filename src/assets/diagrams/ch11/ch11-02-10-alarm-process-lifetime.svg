<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">精确 Alarm 的形式决定交付寿命</title>
<desc id="desc">Listener 的 setExact 不要求 SCHEDULE_EXACT_ALARM，但依赖存活组件。PendingIntent 交付也仍受重启、权限、平台与业务恢复设计约束，不代表任意环境绝不丢失。 Listener 的 setExact 不要求 SCHEDULE_EXACT_ALARM，但依赖存活组件。PendingIntent 交付也仍受重启、权限、平台与业务恢复设计约束，不代表任意环境绝不丢失。 分支：仅存活期内回调 / OnAlarmListener 例外 / 进程退出不重建 App；分支：进程外用户提醒 / 合适的 PendingIntent / 检查精确权限及政策</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
