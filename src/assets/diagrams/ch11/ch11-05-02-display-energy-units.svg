<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">显示能量从 HAL 到 BatteryStats 的换算</title>
<desc id="desc">把累计能量、窗口电荷与最终电量的单位逐级对齐。 固定 r1：helper 取能量增量并用两次电压均值换算；首次建立基线。显示处理器读取 consumer0，不能推断多计量项自动求和。 累计值相减；能量除以电压得到电荷；电压参与电荷换算；电荷量进入布局后换算为mAh</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="650" fill="white"/>
<path d="M 370 125 L 450 125" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 119 L 450 125 L 440 131" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 125 L 830 125" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 820 119 L 830 125 L 820 131" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 350 L 800 350 L 800 210 L 915 210 L 915 180" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 909 190 L 915 180 L 921 190" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 980 180 L 980 480" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 974 470 L 980 480 L 986 470" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 70 Q 220.0 70.7 366 70 Q 370 70 370 74 L 370 176 Q 370 180 366 180 Q 220.0 179.7 74 180 Q 70 180 70 176 L 70 74 Q 70 70 74 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="220.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="220.0" dy="0">HAL 累计 energyUWs</tspan>
<tspan x="220.0" dy="34.0">µWs = µJ</tspan>
</text>
<path d="M 454 70 Q 600.0 70.6 746 70 Q 750 70 750 74 L 750 176 Q 750 180 746 180 Q 600.0 179.7 454 180 Q 450 180 450 176 L 450 74 Q 450 70 454 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">相邻读数之差</tspan>
<tspan x="600.0" dy="34.0">ΔE，单位 µJ</tspan>
</text>
<path d="M 834 70 Q 980.0 70.0 1126 70 Q 1130 70 1130 74 L 1130 176 Q 1130 180 1126 180 Q 980.0 179.2 834 180 Q 830 180 830 176 L 830 74 Q 830 70 834 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="980.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="980.0" dy="0">ConsumedEnergyHelper</tspan>
<tspan x="980.0" dy="34.0">ΔQ = ΔE / 平均电压</tspan>
</text>
<path d="M 454 300 Q 600.0 300.6 746 300 Q 750 300 750 304 L 750 396 Q 750 400 746 400 Q 600.0 400.5 454 400 Q 450 400 450 396 L 450 304 Q 450 300 454 300" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="341.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">本次与上次电压</tspan>
<tspan x="600.0" dy="34.0">平均值，换算为 V</tspan>
</text>
<path d="M 834 480 Q 980.0 479.8 1126 480 Q 1130 480 1130 484 L 1130 581 Q 1130 585 1126 585 Q 980.0 584.6 834 585 Q 830 585 830 581 L 830 484 Q 830 480 834 480" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="980.0" y="524.6800000000001" text-anchor="middle" style="font-size:23px">
<tspan x="980.0" dy="0">显示 processor</tspan>
<tspan x="980.0" dy="31.28">µC ÷ 3,600,000 → mAh</tspan>
</text>
<text x="440" y="555" text-anchor="middle" style="font-size:23px">
<tspan x="440" dy="0">电量 mAh ≠ 能量 J；比较能量还需同口径电压</tspan>
</text>
</svg>
