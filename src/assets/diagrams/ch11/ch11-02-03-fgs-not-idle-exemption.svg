<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">前台服务和 Job 的准入各自判断</title>
<desc id="desc">轨道只示意独立判断，无固定维护窗口或等待长度。FGS 不自动豁免 Doze；Android 16 起与 FGS 并发的相关 Job 也受 runtime quota。 轨道只示意独立判断，无固定维护窗口或等待长度。FGS 不自动豁免 Doze；Android 16 起与 FGS 并发的相关 Job 也受 runtime quota。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="580" fill="white"/>
<path d="M 114 35 Q 600.0 34.4 1086 35 Q 1090 35 1090 39 L 1090 141 Q 1090 145 1086 145 Q 600.0 145.7 114 145 Q 110 145 110 141 L 110 39 Q 110 35 114 35" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="98.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">同一 App 有 FGS，不自动让普通 Job 或网络穿过 Doze</tspan>
</text>
<path d="M 114 435 Q 600.0 434.4 1086 435 Q 1090 435 1090 439 L 1090 536 Q 1090 540 1086 540 Q 600.0 540.8 114 540 Q 110 540 110 536 L 110 439 Q 110 435 114 435" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="496.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">先确认设备状态、任务约束与对应豁免，再解释等待</tspan>
</text>
<text x="226" y="233" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">业务 FGS</tspan>
</text>
<path d="M 240 249 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 210 Q 645.0 210.3 1046 210 Q 1050 210 1050 214 L 1050 243 Q 1050 247 1046 247 Q 645.0 247.8 244 247 Q 240 247 240 243 L 240 214 Q 240 210 244 210" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="645.0" y="236" text-anchor="middle" style="font-size:21px">
<tspan x="645.0" dy="0">用户可见的持续任务</tspan>
</text>
<text x="226" y="328" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">普通 Job</tspan>
</text>
<path d="M 240 344 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 305 Q 470.0 305.0 696 305 Q 700 305 700 309 L 700 338 Q 700 342 696 342 Q 470.0 342.7 244 342 Q 240 342 240 338 L 240 309 Q 240 305 244 305" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="470.0" y="331" text-anchor="middle" style="font-size:21px">
<tspan x="470.0" dy="0">Doze / 约束等待</tspan>
</text>
<path d="M 754 305 Q 900.0 304.9 1046 305 Q 1050 305 1050 309 L 1050 338 Q 1050 342 1046 342 Q 900.0 341.6 754 342 Q 750 342 750 338 L 750 309 Q 750 305 754 305" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="900.0" y="331" text-anchor="middle" style="font-size:21px">
<tspan x="900.0" dy="0">允许后执行</tspan>
</text>
</svg>
