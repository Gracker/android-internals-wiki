<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">长扫描的旧超时只覆盖适用常规路径</title>
<desc id="desc">batch / auto-batch 批量分支不设置这项计时器；启用 allowance flag 后跳过旧 timeout。实际 isFiltered 语义还取决于空 filter 的 feature flag。 batch / auto-batch 批量分支不设置这项计时器；启用 allowance flag 后跳过旧 timeout。实际 isFiltered 语义还取决于空 filter 的 feature flag。 分支：无过滤的适用 client / 降为 opportunistic / 不自行驱动扫描；分支：有过滤的适用 client / mode 上限降为 LOW_POWER / 不等于终止逻辑请求</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
