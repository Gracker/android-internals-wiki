<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title desc">
<title id="title">组件电荷校准不等于逐 App 独立计量</title>
<desc id="desc">固定 r1 的 collector/processor 支持硬件总量校准，UID 仍经模型归因。旧文档关于 batch 计入 Bluetooth App 的口径，不能覆盖当前全部路径。 固定 r1 的 collector/processor 支持硬件总量校准，UID 仍经模型归因。旧文档关于 batch 计入 Bluetooth App 的口径，不能覆盖当前全部路径。 下一步：有硬件 energy consumer 时 / 可用总电荷调整组件总量；下一步：按 UID scan time 或收发字节等分摊 / 保留系统模型与批量版本差异</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="495" fill="white"/>
<path d="M 600 145 L 600 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 185 L 600 195 L 606 185" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 300 L 600 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 340 L 600 350 L 606 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114 40 Q 600.0 40.3 1086 40 Q 1090 40 1090 44 L 1090 141 Q 1090 145 1086 145 Q 600.0 145.7 114 145 Q 110 145 110 141 L 110 44 Q 110 40 114 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="84.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">controller idle / rx / tx 时间 × power profile</tspan>
<tspan x="600.0" dy="34.0">得到组件基础估算</tspan>
</text>
<path d="M 114 195 Q 600.0 195.2 1086 195 Q 1090 195 1090 199 L 1090 296 Q 1090 300 1086 300 Q 600.0 300.0 114 300 Q 110 300 110 296 L 110 199 Q 110 195 114 195" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="239.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">有硬件 energy consumer 时</tspan>
<tspan x="600.0" dy="34.0">可用总电荷调整组件总量</tspan>
</text>
<path d="M 114 350 Q 600.0 350.6 1086 350 Q 1090 350 1090 354 L 1090 451 Q 1090 455 1086 455 Q 600.0 455.0 114 455 Q 110 455 110 451 L 110 354 Q 110 350 114 350" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="394.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">按 UID scan time 或收发字节等分摊</tspan>
<tspan x="600.0" dy="34.0">保留系统模型与批量版本差异</tspan>
</text>
