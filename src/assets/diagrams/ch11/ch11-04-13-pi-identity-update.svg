<text x="600.0" y="103.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">ScanController 按 PendingIntent 身份检查已有 scanner</tspan>
</text>
<path d="M 74 315 Q 320.0 314.9 566 315 Q 570 315 570 319 L 570 476 Q 570 480 566 480 Q 320.0 480.3 74 480 Q 70 480 70 476 L 70 319 Q 70 315 74 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="373.02000000000004" text-anchor="middle" style="font-size:24px">
<tspan x="320.0" dy="0">同 PI 已注册</tspan>
<tspan x="320.0" dy="32.64">直接忽略新的 start</tspan>
<tspan x="320.0" dy="32.64">旧 filter / settings 仍有效</tspan>
</text>
<path d="M 654 315 Q 900.0 315.3 1146 315 Q 1150 315 1150 319 L 1150 476 Q 1150 480 1146 480 Q 900.0 479.6 654 480 Q 650 480 650 476 L 650 319 Q 650 315 654 315" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="373.02000000000004" text-anchor="middle" style="font-size:24px">
<tspan x="900.0" dy="0">确需更换请求</tspan>
<tspan x="900.0" dy="32.64">结束旧扫描及其 token</tspan>
<tspan x="900.0" dy="32.64">单一 owner 再建新请求</tspan>
</text>
</svg>
