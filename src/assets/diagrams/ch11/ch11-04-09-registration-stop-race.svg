<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">固定 r1 注册中的 stop 存在取消边界</title>
<desc id="desc">来自固定 r1 的实际方法控制流；不能用应用本地状态已清理证明远端扫描已结束。应按目标平台修订和 dump 核对，图不承诺该竞态在所有版本相同。 来自固定 r1 的实际方法控制流；不能用应用本地状态已清理证明远端扫描已结束。应按目标平台修订和 dump 核对，图不承诺该竞态在所有版本相同。 分支：已收到注册结果 / mScannerId &gt; 0 / 远端 stop + unregister；分支：尚未收到注册结果 / mScannerId &lt;= 0 → 返回 / 迟到成功缺少取消检查</desc>
