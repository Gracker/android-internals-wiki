<title id="title">只有有效定位请求参与当前 provider 合并</title>
<desc id="desc">图按固定 r1 LocationProviderManager 解释 active 与 merge。当前 UID 没回调不能证明整机 GNSS 关闭；权限、间隔节流和旁路豁免需分别读具体分支。 图按固定 r1 LocationProviderManager 解释 active 与 merge。当前 UID 没回调不能证明整机 GNSS 关闭；权限、间隔节流和旁路豁免需分别读具体分支。 分支：通过且 active / 参与 provider 聚合 / 影响间隔与质量等请求；分支：未通过或 inactive / 不驱动该合并请求 / 其他客户端仍可驱动</desc>
