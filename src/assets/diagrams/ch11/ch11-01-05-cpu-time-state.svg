<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">常规 CPU 路径用模型组织与分配能量</title>
<desc id="desc">硬件能量改善组件总量，UID 分配仍依赖活动比例。固定实现若有 WakeLock 聚合，还会在 CPU 设备与 UID 估算中扣除对应项并限制为非负。 硬件能量改善组件总量，UID 分配仍依赖活动比例。固定实现若有 WakeLock 聚合，还会在 CPU 设备与 UID 估算中扣除对应项并限制为非负。 分支：无 CPU energy consumer / profile 形成设备侧估算 / 再按 UID bracket 活动分配；分支：有 CPU energy consumer / 校正 bracket 能量分布 / 再按 UID bracket 活动分配</desc>
