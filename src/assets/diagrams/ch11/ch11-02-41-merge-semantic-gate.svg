<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">后台任务合并先核对业务语义</title>
<desc id="desc">合并不是单纯减少 Job 数；同一批任务需能接受相同网络、充电和恢复策略。合并后仍有数量、频率、standby 和 runtime quota 限制。 合并不是单纯减少 Job 数；同一批任务需能接受相同网络、充电和恢复策略。合并后仍有数量、频率、standby 和 runtime quota 限制。 分支：条件与契约相同 / 稳定 JobInfo / 队列 / 批量处理可延迟工作；分支：条件或时限不同 / 保留独立调度 / 避免一方拖延另一方</desc>
