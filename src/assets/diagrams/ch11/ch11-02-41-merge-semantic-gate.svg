</text>
<path d="M 654 315 Q 900.0 315.7 1146 315 Q 1150 315 1150 319 L 1150 476 Q 1150 480 1146 480 Q 900.0 480.1 654 480 Q 650 480 650 476 L 650 319 Q 650 315 654 315" fill="white" stroke="#E8913A" stroke-width="3"/>
