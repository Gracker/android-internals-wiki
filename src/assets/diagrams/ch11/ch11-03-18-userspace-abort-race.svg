<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">临时 userspace-abort 覆盖申请锁时的竞态</title>
<desc id="desc">图只说明执行先后，不按时长比例；临时 abort 不代表每个 App tag 都在 kernel 有长期同名 source。关闭 counter 路径时才按名称走兼容 wake_lock 接口。 图只说明执行先后，不按时长比例；临时 abort 不代表每个 App tag 都在 kernel 有长期同名 source。关闭 counter 路径时才按名称走兼容 wake_lock 接口。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="580" fill="white"/>
<path d="M 114 35 Q 600.0 35.5 1086 35 Q 1090 35 1090 39 L 1090 141 Q 1090 145 1086 145 Q 600.0 144.9 114 145 Q 110 145 110 141 L 110 39 Q 110 35 114 35" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="98.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">incSuspendCounter：先请求 userspace-abort，再获取挂起互斥锁</tspan>
</text>
<path d="M 114 435 Q 600.0 435.3 1086 435 Q 1090 435 1090 439 L 1090 536 Q 1090 540 1086 540 Q 600.0 539.9 114 540 Q 110 540 110 536 L 110 439 Q 110 435 114 435" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="496.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">取得互斥锁并增加计数后，才解除临时 userspace-abort</tspan>
</text>
<text x="226" y="233" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">临时内核项</tspan>
</text>
<path d="M 240 249 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 210 Q 545.0 209.7 846 210 Q 850 210 850 214 L 850 243 Q 850 247 846 247 Q 545.0 246.5 244 247 Q 240 247 240 243 L 240 214 Q 240 210 244 210" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="545.0" y="236" text-anchor="middle" style="font-size:21px">
<tspan x="545.0" dy="0">覆盖互斥等待与计数更新</tspan>
</text>
<path d="M 894 210 Q 980.0 210.3 1066 210 Q 1070 210 1070 214 L 1070 243 Q 1070 247 1066 247 Q 980.0 246.5 894 247 Q 890 247 890 243 L 890 214 Q 890 210 894 210" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="980.0" y="236" text-anchor="middle" style="font-size:21px">
<tspan x="980.0" dy="0">解除</tspan>
</text>
<text x="226" y="328" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">用户态计数</tspan>
</text>
<path d="M 240 344 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 704 305 Q 885.0 305.2 1066 305 Q 1070 305 1070 309 L 1070 338 Q 1070 342 1066 342 Q 885.0 342.7 704 342 Q 700 342 700 338 L 700 309 Q 700 305 704 305" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="885.0" y="331" text-anchor="middle" style="font-size:21px">
<tspan x="885.0" dy="0">本次锁计数已增加</tspan>
</text>
</svg>
