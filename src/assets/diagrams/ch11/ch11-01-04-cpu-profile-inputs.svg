<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">CPU 模型分开记录三类活动成本</title>
<desc id="desc">固定 r1 处理器具备整体、policy 与频点成本项，但 CpuTimeInStateCollector 尚未填入 time-in-cluster，不能把模型参数存在等同于该项已被采集。power bracket 与硬件能量输入还会改变后续分配。 固定 r1 处理器具备整体、policy 与频点成本项，但 CpuTimeInStateCollector 尚未填入 time-in-cluster，不能把模型参数存在等同于该项已被采集。power bracket 与硬件能量输入还会改变后续分配。 </desc>
