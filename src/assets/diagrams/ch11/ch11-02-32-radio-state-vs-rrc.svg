<title id="title">Android 无线电开关状态与 RRC 驻留分层观察</title>
<desc id="desc">不能把 RadioState.ON 当 RRC_CONNECTED，也不能通过 App 看到的一次网络请求推出固定 tail。优化批量后，要用设备 modem / rail / 仪表检查真实变化。 不能把 RadioState.ON 当 RRC_CONNECTED，也不能通过 App 看到的一次网络请求推出固定 tail。优化批量后，要用设备 modem / rail / 仪表检查真实变化。 分支：Android Radio HAL / RadioState / setRadioPower / 无线电可用与开关能力；分支：modem + 网络侧 / RRC / DRX 等状态 / 协议、信号与实现决定</desc>
