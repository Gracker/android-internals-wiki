<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">功耗章的三种量纲</title>
<desc id="desc">电量先结合电压换成能量，再按同一窗口计算平均功率。 mAh 不是 J；电压变化时应按时间积分。电池电量百分比还受容量、估算精度和状态影响，不能直接归因到 App。 同口径电量结合电压换算能量；能量除以窗口时长得到平均功率；电压参与Q到E转换；窗口时长参与E到P转换</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="650" fill="white"/>
<path d="M 365 120 L 450 120" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114 L 450 120 L 440 126" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120 L 835 120" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114 L 835 120 L 825 126" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 400 345 L 400 245 L 600 245 L 600 175" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 185 L 600 175 L 606 185" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 800 345 L 800 245 L 985 245 L 985 175" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 185 L 985 175 L 991 185" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 65 Q 215.0 64.6 361 65 Q 365 65 365 69 L 365 171 Q 365 175 361 175 Q 215.0 174.9 69 175 Q 65 175 65 171 L 65 69 Q 65 65 69 65" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">电量 Q</tspan>
<tspan x="215.0" dy="34.0">mAh / µAh</tspan>
</text>
<path d="M 454 65 Q 600.0 64.9 746 65 Q 750 65 750 69 L 750 171 Q 750 175 746 175 Q 600.0 174.9 454 175 Q 450 175 450 171 L 450 69 Q 450 65 454 65" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">能量 E</tspan>
<tspan x="600.0" dy="34.0">J / Wh</tspan>
</text>
<path d="M 839 65 Q 985.0 64.6 1131 65 Q 1135 65 1135 69 L 1135 171 Q 1135 175 1131 175 Q 985.0 174.3 839 175 Q 835 175 835 171 L 835 69 Q 835 65 839 65" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">平均功率 P = E / Δt</tspan>
<tspan x="985.0" dy="34.0">W = J/s</tspan>
</text>
<path d="M 254 345 Q 400.0 344.3 546 345 Q 550 345 550 349 L 550 451 Q 550 455 546 455 Q 400.0 454.8 254 455 Q 250 455 250 451 L 250 349 Q 250 345 254 345" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="400.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="400.0" dy="0">同一窗口的电压</tspan>
<tspan x="400.0" dy="34.0">近似稳定时：E = Q × V</tspan>
</text>
<path d="M 654 345 Q 800.0 345.8 946 345 Q 950 345 950 349 L 950 451 Q 950 455 946 455 Q 800.0 454.9 654 455 Q 650 455 650 451 L 650 349 Q 650 345 654 345" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="800.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="800.0" dy="0">一致的采样窗口 Δt</tspan>
<tspan x="800.0" dy="34.0">区分任务和累计统计</tspan>
</text>
<text x="600" y="575" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">单位换算要完整：mAh × V × 3.6 = J；Wh × 3600 = J</tspan>
</text>
</svg>
