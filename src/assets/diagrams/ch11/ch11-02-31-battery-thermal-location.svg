<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Battery Saver 策略与 App 热适配来自不同输入</title>
<desc id="desc">平台没有把 Thermal 状态自动换算成某个 location power-save mode 的公开通用链。厂商额外策略要有设备或源码证据；应用避免高频轮询热状态。 平台没有把 Thermal 状态自动换算成某个 location power-save mode 的公开通用链。厂商额外策略要有设备或源码证据；应用避免高频轮询热状态。 分支：系统省电路径 / PowerManager 位置模式 / location service 更新请求；分支：应用自适应路径 / 监听热状态 / headroom / 按产品容差调整请求</desc>
