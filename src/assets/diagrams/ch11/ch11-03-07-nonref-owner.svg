<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">非引用计数锁不能被重叠任务共享</title>
<desc id="desc">轨道说明共享所有权的风险，不表示特定线程时序。isHeld 检查不能修复所有者错误；引用计数配对、业务取消与服务端有效性仍需分别管理。 轨道说明共享所有权的风险，不表示特定线程时序。isHeld 检查不能修复所有者错误；引用计数配对、业务取消与服务端有效性仍需分别管理。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="580" fill="white"/>
<path d="M 114 35 Q 600.0 35.5 1086 35 Q 1090 35 1090 39 L 1090 141 Q 1090 145 1086 145 Q 600.0 144.8 114 145 Q 110 145 110 141 L 110 39 Q 110 35 114 35" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="98.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">故障示意：两个任务共用同一 non-ref 锁，任意 release 可解除全部</tspan>
</text>
<path d="M 114 435 Q 600.0 434.6 1086 435 Q 1090 435 1090 439 L 1090 536 Q 1090 540 1086 540 Q 600.0 540.1 114 540 Q 110 540 110 536 L 110 439 Q 110 435 114 435" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="496.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">本例局部锁只由本次调用拥有；超时也不会取消业务</tspan>
</text>
<text x="226" y="233" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">任务 A</tspan>
</text>
<path d="M 240 249 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 210 Q 370.0 210.0 496 210 Q 500 210 500 214 L 500 243 Q 500 247 496 247 Q 370.0 247.7 244 247 Q 240 247 240 243 L 240 214 Q 240 210 244 210" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="370.0" y="236" text-anchor="middle" style="font-size:21px">
<tspan x="370.0" dy="0">acquire / 工作</tspan>
</text>
<path d="M 544 210 Q 645.0 210.0 746 210 Q 750 210 750 214 L 750 243 Q 750 247 746 247 Q 645.0 246.6 544 247 Q 540 247 540 243 L 540 214 Q 540 210 544 210" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="645.0" y="236" text-anchor="middle" style="font-size:21px">
<tspan x="645.0" dy="0">release</tspan>
</text>
<text x="226" y="328" text-anchor="end" style="font-size:23px">
<tspan x="226" dy="0">任务 B</tspan>
</text>
<path d="M 240 344 H 1090" stroke="#777777" stroke-width="1.5"/>
<path d="M 424 305 Q 585.0 304.4 746 305 Q 750 305 750 309 L 750 338 Q 750 342 746 342 Q 585.0 341.3 424 342 Q 420 342 420 338 L 420 309 Q 420 305 424 305" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="585.0" y="331" text-anchor="middle" style="font-size:21px">
<tspan x="585.0" dy="0">另一次 acquire</tspan>
</text>
<path d="M 794 305 Q 920.0 304.8 1046 305 Q 1050 305 1050 309 L 1050 338 Q 1050 342 1046 342 Q 920.0 342.1 794 342 Q 790 342 790 338 L 790 309 Q 790 305 794 305" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="920.0" y="331" text-anchor="middle" style="font-size:21px">
<tspan x="920.0" dy="0">仍工作却失去锁</tspan>
</text>
</svg>
