<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Listener Alarm 的生存期与持久提醒分开</title>
<desc id="desc">listener 例外不需要 SCHEDULE_EXACT_ALARM，也不提供进程退出后的重建交付；它不是保活通道。允许 idle 交付仍不免除限频，唤醒还取决于 alarm type。 listener 例外不需要 SCHEDULE_EXACT_ALARM，也不提供进程退出后的重建交付；它不是保活通道。允许 idle 交付仍不免除限频，唤醒还取决于 alarm type。 分支：当前组件内的回调 / 依赖调用进程存活 / 组件结束主动 cancel；分支：进程外用户提醒 / 合适 PendingIntent / 另核对 exact 资格</desc>
