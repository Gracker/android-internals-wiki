<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">isUnoptimized 的 background 是回调类型</title>
<desc id="desc">这三个条件参与系统记账分类，不能直接推出 RF 活动或某个 App 的能量。WorkSource 上报是受权限保护的系统入口。 这三个条件参与系统记账分类，不能直接推出 RF 活动或某个 App 的能量。WorkSource 上报是受权限保护的系统入口。 分支：isFilterScan / 逻辑过滤分类 / 部分受空 filter flag 影响；分支：isBackgroundScan / 含 FIRST_MATCH 回调位 / 不是 Activity 可见性；分支：isOpportunisticScan / 请求为机会式 mode / 不是主动/被动 scan type</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
