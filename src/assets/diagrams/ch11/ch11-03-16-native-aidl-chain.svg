<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">当前 native 桥接路径使用 AIDL</title>
<desc id="desc">图限定 android-17.0.0_r1 的这条路径。官方历史 HIDL 示例不能替代当前 AIDL；native 这里的调用 PID 是 system_server，不是每个原始应用 UID。计数增减限定默认 counter 路径，关闭此路径后按名称使用内核兼容接口。 图限定 android-17.0.0_r1 的这条路径。官方历史 HIDL 示例不能替代当前 AIDL；native 这里的调用 PID 是 system_server，不是每个原始应用 UID。计数增减限定默认 counter 路径，关闭此路径后按名称使用内核兼容接口。 下一步：libpower acquire_wake_lock(name) / 按名称缓存 native IWakeLock；下一步：AIDL ISystemSuspend → SystemSuspendAidl::acquireWakeLock / 创建 native WakeLock，记录调用 PID；下一步：SystemSuspend::incSuspendCounter / releaseOnce / 析构负责成对减少</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="650" fill="white"/>
<path d="M 600 145 L 600 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 185 L 600 195 L 606 185" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 300 L 600 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 340 L 600 350 L 606 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 455 L 600 505" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 495 L 600 505 L 606 495" stroke="#202020" stroke-width="2.8" fill="none"/>
