<text x="600.0" y="84.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">PMS SuspendBlocker → JNI nativeAcquireSuspendBlocker</tspan>
<tspan x="600.0" dy="34.0">名称 PowerManagerService.WakeLocks</tspan>
</text>
<path d="M 114 195 Q 600.0 194.9 1086 195 Q 1090 195 1090 199 L 1090 296 Q 1090 300 1086 300 Q 600.0 300.4 114 300 Q 110 300 110 296 L 110 199 Q 110 195 114 195" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="239.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">libpower acquire_wake_lock(name)</tspan>
<tspan x="600.0" dy="34.0">按名称缓存 native IWakeLock</tspan>
</text>
<path d="M 114 350 Q 600.0 349.3 1086 350 Q 1090 350 1090 354 L 1090 451 Q 1090 455 1086 455 Q 600.0 454.3 114 455 Q 110 455 110 451 L 110 354 Q 110 350 114 350" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="394.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">AIDL ISystemSuspend → SystemSuspendAidl::acquireWakeLock</tspan>
<tspan x="600.0" dy="34.0">创建 native WakeLock，记录调用 PID</tspan>
</text>
<path d="M 114 505 Q 600.0 505.4 1086 505 Q 1090 505 1090 509 L 1090 606 Q 1090 610 1086 610 Q 600.0 609.3 114 610 Q 110 610 110 606 L 110 509 Q 110 505 114 505" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="549.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">SystemSuspend::incSuspendCounter</tspan>
<tspan x="600.0" dy="34.0">releaseOnce / 析构负责成对减少</tspan>
</text>
</svg>
