<text x="600.0" y="103.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">先判断是否驱动扫描，再区分链路层收发行为</tspan>
</text>
<path d="M 54 315 Q 220.0 315.1 386 315 Q 390 315 390 319 L 390 476 Q 390 480 386 480 Q 220.0 480.0 54 480 Q 50 480 50 476 L 50 319 Q 50 315 54 315" fill="white" stroke="#4A90D9" stroke-width="3"/>
