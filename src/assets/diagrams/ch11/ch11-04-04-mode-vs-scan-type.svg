<tspan x="220.0" dy="0">OPPORTUNISTIC mode</tspan>
<tspan x="220.0" dy="32.64">不单独开启扫描</tspan>
<tspan x="220.0" dy="32.64">依赖其他 scanner</tspan>
</text>
<path d="M 434 315 Q 600.0 315.8 766 315 Q 770 315 770 319 L 770 476 Q 770 480 766 480 Q 600.0 479.5 434 480 Q 430 480 430 476 L 430 319 Q 430 315 434 315" fill="white" stroke="#E8913A" stroke-width="3"/>
