<tspan x="600.0" dy="0">PASSIVE scan type</tspan>
<tspan x="600.0" dy="32.64">接收广播</tspan>
<tspan x="600.0" dy="32.64">不发送 scan request</tspan>
</text>
<path d="M 814 315 Q 980.0 314.5 1146 315 Q 1150 315 1150 319 L 1150 476 Q 1150 480 1146 480 Q 980.0 480.1 814 480 Q 810 480 810 476 L 810 319 Q 810 315 814 315" fill="white" stroke="#4CAF50" stroke-width="3"/>
