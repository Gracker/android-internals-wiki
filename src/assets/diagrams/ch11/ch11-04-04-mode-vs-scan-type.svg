<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">驱动扫描的 mode 与主动被动类型是两维</title>
<desc id="desc">机会式不等于被动类型；后二者是实际扫描收发方式。API 36.1 setScanType 默认 active，改为 passive 还需确认业务字段不依赖 scan response。 机会式不等于被动类型；后二者是实际扫描收发方式。API 36.1 setScanType 默认 active，改为 passive 还需确认业务字段不依赖 scan response。 分支：OPPORTUNISTIC mode / 不单独开启扫描 / 依赖其他 scanner；分支：PASSIVE scan type / 接收广播 / 不发送 scan request；分支：ACTIVE scan type / 可向可扫描广播发请求 / 等待 scan response</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
