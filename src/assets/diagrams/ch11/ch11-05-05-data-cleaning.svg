<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">公开数据的行数与过滤流程</title>
<desc id="desc">用固定 CSV 和 notebook 条件解释最终 12,649 条记录的来源。 固定提交 f12c27c5487e；这是公开数据清点，不是新实验。155 条标记排除与 381 条功率阈值排除不能合并称作同一种异常检验。 按标记过滤；检查记录时长；计算功率并应用阈值；得到最终分析数据</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="650" fill="white"/>
<path d="M 370 130 L 450 130" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 124 L 450 130 L 440 136" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 130 L 830 130" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 820 124 L 830 130 L 820 136" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 980 180 L 980 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 974 330 L 980 340 L 986 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 830 390 L 750 390" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 760 384 L 750 390 L 760 396" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 80 Q 220.0 79.7 366 80 Q 370 80 370 84 L 370 176 Q 370 180 366 180 Q 220.0 179.4 74 180 Q 70 180 70 176 L 70 84 Q 70 80 74 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="220.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="220.0" dy="0">原始 CSV</tspan>
<tspan x="220.0" dy="34.0">13,185 = 879 × 15</tspan>
</text>
<path d="M 454 80 Q 600.0 80.7 746 80 Q 750 80 750 84 L 750 176 Q 750 180 746 180 Q 600.0 180.1 454 180 Q 450 180 450 176 L 450 84 Q 450 80 454 80" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">排除 is_outlier=True</tspan>
<tspan x="600.0" dy="34.0">移除 155 → 13,030</tspan>
</text>
<path d="M 834 80 Q 980.0 79.6 1126 80 Q 1130 80 1130 84 L 1130 176 Q 1130 180 1126 180 Q 980.0 180.1 834 180 Q 830 180 830 176 L 830 84 Q 830 80 834 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="980.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="980.0" dy="0">要求 duration_ms &gt; 0</tspan>
<tspan x="980.0" dy="34.0">额外移除 0</tspan>
</text>
<path d="M 834 340 Q 980.0 340.5 1126 340 Q 1130 340 1130 344 L 1130 436 Q 1130 440 1126 440 Q 980.0 439.7 834 440 Q 830 440 830 436 L 830 344 Q 830 340 834 340" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="980.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="980.0" dy="0">要求功率 &gt; 0.05 W</tspan>
<tspan x="980.0" dy="34.0">再移除 381</tspan>
</text>
<path d="M 454 340 Q 600.0 339.7 746 340 Q 750 340 750 344 L 750 436 Q 750 440 746 440 Q 600.0 439.5 454 440 Q 450 440 450 436 L 450 344 Q 450 340 454 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">最终 12,649 条</tspan>
<tspan x="600.0" dy="34.0">共移除 536</tspan>
</text>
<text x="370" y="555" text-anchor="middle" style="font-size:23px">
<tspan x="370" dy="0">论文正文写 13,184；与公开 CSV 相差 1 条</tspan>
</text>
</svg>
