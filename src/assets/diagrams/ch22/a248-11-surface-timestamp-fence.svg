<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">时间戳与fence是不同约束</title>
<desc id="desc">±1秒是时间戳合理性保护范围，不是播放器晚帧门槛。 acquire可返回未signal fence；latch-unsignaled也不代表像素可任意消费 Media3计划release / codec 请求交付Surface → queue(buffer, timestamp) / 携带acquire fence；queue(buffer, timestamp) / 携带acquire fence → consumer 依据 / expectedPresent / 未来可PRESENT_LATER；consumer 依据 / expectedPresent / 未来可PRESENT_LATER → 后续消费满足fence依赖 / SF/HWC决定显示</desc>
