<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">TextureView回调到RenderThread更新</title>
<desc id="desc">UI的onSurfaceTextureUpdated不能证明RT已取得输入、GPU完成或present。 固定实现取最新输入；已 queue 的中间帧不保证被采样 frame-available / 投递 ViewRoot 线程 → updateLayer / invalidate / UI 提交 TextureLayer 更新；updateLayer / invalidate / UI 提交 TextureLayer 更新 → pending layer update / RenderThread apply；pending layer update / RenderThread apply → AHardwareBuffer / SkImage / GPU 采样后 host queue</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
