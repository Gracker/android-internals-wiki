<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">效果链路必须画出输入与输出两个Surface</title>
<desc id="desc">增加处理图会改变buffer、带宽、颜色与节奏，必须逐段量成本。 需要media3-effect依赖；中间面不是压缩码流输入Surface decoder输出 / graph输入 / queue与acquire fence → 纹理导入 / GL处理图 / 一个或多个shader pass；纹理导入 / GL处理图 / 一个或多个shader pass → graph输出 / 显示Surface / queue及输出fence；graph输出 / 显示Surface / queue及输出fence → SF layer与系统合成 / HWC / present</desc>
