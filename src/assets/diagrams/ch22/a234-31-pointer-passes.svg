<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">指针分发与消费有明确协议</title>
<desc id="desc">回调返回 Unit；在相应 PointerInputChange 上 consume 才表达消费，消费不自动终止所有分发。 复杂手势优先使用 pointerInput 与 Foundation 检测器 Initial pass / 按协作需要观察 → Main pass / 处理手势与消费；Main pass / 处理手势与消费 → Final pass / 检查最终协作结果</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="410" fill="white"/>
<path d="M 474.0 195 L 518.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 508.0 189 L 518.0 195 L 508.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 882.0 195 L 926.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 916.0 189 L 926.0 195 L 916.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114.0 130 Q 292.0 130.6 470.0 130 Q 474.0 130 474.0 134 L 474.0 256 Q 474.0 260 470.0 260 Q 292.0 260.2 114.0 260 Q 110.0 260 110.0 256 L 110.0 134 Q 110.0 130 114.0 130" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="292.0" y="187.18" text-anchor="middle" style="font-size:23px">
<tspan x="292.0" dy="0">Initial pass</tspan>
<tspan x="292.0" dy="31.28">按协作需要观察</tspan>
</text>
<path d="M 522.0 130 Q 700.0 129.8 878.0 130 Q 882.0 130 882.0 134 L 882.0 256 Q 882.0 260 878.0 260 Q 700.0 259.3 522.0 260 Q 518.0 260 518.0 256 L 518.0 134 Q 518.0 130 522.0 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="700.0" y="187.18" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">Main pass</tspan>
<tspan x="700.0" dy="31.28">处理手势与消费</tspan>
</text>
<path d="M 930.0 130 Q 1108.0 130.8 1286.0 130 Q 1290.0 130 1290.0 134 L 1290.0 256 Q 1290.0 260 1286.0 260 Q 1108.0 260.1 930.0 260 Q 926.0 260 926.0 256 L 926.0 134 Q 926.0 130 930.0 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1108.0" y="187.18" text-anchor="middle" style="font-size:23px">
<tspan x="1108.0" dy="0">Final pass</tspan>
<tspan x="1108.0" dy="31.28">检查最终协作结果</tspan>
</text>
<text x="700" y="338" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">复杂手势优先使用 pointerInput 与 Foundation 检测器</tspan>
</text>
</svg>
