<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="title desc">
<title id="title">Fragment 消息可在 doFrame 前推迟渲染</title>
<desc id="desc">事务是主线程普通消息；生命周期与View创建可能先占住主线程，使后续doFrame开始推迟。 示意时间轴，无比例尺；不是性能测量 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="590" fill="white"/>
<text x="700" y="535" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">示意区间，无比例尺；最终显示还需 RenderThread 与系统侧证据</tspan>
</text>
<text x="206" y="128" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">Main</tspan>
</text>
<path d="M 220 144 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 105 Q 455.0 105.7 666 105 Q 670 105 670 109 L 670 138 Q 670 142 666 142 Q 455.0 141.9 244 142 Q 240 142 240 138 L 240 109 Q 240 105 244 105" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="455.0" y="131" text-anchor="middle" style="font-size:21px">
<tspan x="455.0" dy="0">execPendingActions / 创建 View</tspan>
</text>
<path d="M 714 105 Q 920.0 104.6 1126 105 Q 1130 105 1130 109 L 1130 138 Q 1130 142 1126 142 Q 920.0 141.4 714 142 Q 710 142 710 138 L 710 109 Q 710 105 714 105" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="920.0" y="131" text-anchor="middle" style="font-size:21px">
<tspan x="920.0" dy="0">doFrame / traversal / draw</tspan>
</text>
<text x="206" y="263" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">RenderThread</tspan>
</text>
<path d="M 220 279 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 924 240 Q 1040.0 240.2 1156 240 Q 1160 240 1160 244 L 1160 273 Q 1160 277 1156 277 Q 1040.0 277.1 924 277 Q 920 277 920 273 L 920 244 Q 920 240 924 240" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1040.0" y="266" text-anchor="middle" style="font-size:21px">
<tspan x="1040.0" dy="0">sync / buffer submit</tspan>
</text>
<text x="206" y="398" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">Display</tspan>
</text>
<path d="M 220 414 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 1194 375 Q 1245.0 374.9 1296 375 Q 1300 375 1300 379 L 1300 408 Q 1300 412 1296 412 Q 1245.0 411.8 1194 412 Q 1190 412 1190 408 L 1190 379 Q 1190 375 1194 375" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="1245.0" y="401" text-anchor="middle" style="font-size:21px">
<tspan x="1245.0" dy="0">后续呈现</tspan>
</text>
</svg>
