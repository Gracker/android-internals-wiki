<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">Snapshot 提交到实际显示的责任链</title>
<desc id="desc">Snapshot apply 完成、缓冲区提交与实际呈现是不同终点。 GPU执行与buffer提交可重叠；箭头不表示GPU先完成再queue 版本提交 / 域失效与重组 → 布局／绘制 / 宿主HWUI与RT；布局／绘制 / 宿主HWUI与RT → 应用窗口buffer / BLAST事务提交；应用窗口buffer / BLAST事务提交 → SurfaceFlinger／HWC / 合成与实际present</desc>
