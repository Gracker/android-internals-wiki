<text x="700.0" y="113.5" text-anchor="middle" style="font-size:25px">
<tspan x="700.0" dy="0">宿主 bounds layer</tspan>
</text>
<path d="M 464 230 Q 700.0 229.7 936 230 Q 940 230 940 234 L 940 326 Q 940 330 936 330 Q 700.0 329.7 464 330 Q 460 330 460 326 L 460 234 Q 460 230 464 230" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="700.0" y="271.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="700.0" dy="0">SurfaceView container</tspan>
<tspan x="700.0" dy="32.64">位置 / crop / 相对层级</tspan>
</text>
<path d="M 124 430 Q 360.0 429.8 596 430 Q 600 430 600 434 L 600 536 Q 600 540 596 540 Q 360.0 540.0 124 540 Q 120 540 120 536 L 120 434 Q 120 430 124 430" fill="white" stroke="#E8913A" stroke-width="3"/>
