<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">SurfaceView的container与内容子层</title>
<desc id="desc">SurfaceHolder暴露Producer侧Surface；container和背景并不都是承载内容的buffer layer。 内部 layer 树示意；公开 getSurfaceControl 主要只用于挂接自建子层 bounds parents SurfaceView container；container parents BLAST content；container parents color background</desc>
