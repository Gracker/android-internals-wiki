<text x="1040.0" y="476.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="1040.0" dy="0">background color layer</tspan>
<tspan x="1040.0" dy="32.64">按条件显示背景</tspan>
</text>
<text x="700.0" y="605" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">内部 layer 树示意；公开 getSurfaceControl 主要只用于挂接自建子层</tspan>
