<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">内部票型保留不同请求语义</title>
<desc id="desc">ExplicitDefault包含显式数值请求，不能理解为“没有任何偏好”。 内部票型不是 public API 类别常量的一一同名映射 ExplicitDefault / Gte → DEFAULT 数值请求 / 不低于给定值；ExactOrMultiple / Exact → 精确或整数倍 / 精确匹配；ExplicitCategory / Heuristic → 类别请求 / 历史推断</desc>
