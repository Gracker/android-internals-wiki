<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">队列槽位与三类栅栏</title>
<desc id="desc">transaction状态原子应用不等于像素已就绪；latch也可能早于acquire fence信号。 present fence 不等于面板光学响应已经完成 slot：复用缓冲区的槽位 → 不保证固定双缓冲或三缓冲；acquire fence → 生产写入完成，消费读入需遵守；release fence / present fence → 旧 buffer 可复用 / 显示提交完成</desc>
