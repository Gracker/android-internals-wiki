<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">宿主与内容各自提交</title>
<desc id="desc">多次present保持同一视频buffer可以正常；两路提交应按业务时刻核对。 示意各自职责；箭头不表示内容 Producer 必须等待宿主 buffer host UI generates host buffer；content buffer participates in composition；host window and independent content both contribute to compositor</desc>
