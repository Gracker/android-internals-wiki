<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">Fragment commit 返回只完成排队这一站</title>
<desc id="desc">事务排队、目标内容创建和最终显示属于不同时间段，调用点快不代表页面切换快。 固定 AndroidX commit；平台 Fragment 不作为新工程优化基线 点击 / 导航调用 / transaction.commit() → enqueueAction / 加入 mPendingActions；enqueueAction / 加入 mPendingActions → Handler.post / execPendingActions；Handler.post / execPendingActions → 生命周期与 View 创建 / 再等待 traversal 出图</desc>
