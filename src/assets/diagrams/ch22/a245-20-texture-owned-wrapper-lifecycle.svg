<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">TextureView与应用Surface包装的释放方</title>
<desc id="desc">包装Surface始终由应用释放；返回false还要自行管理SurfaceTexture的后续release。 每实例保存所有权；设置 listener 不补发已发生的 available 回调 available 创建包装 / 应用持有 Surface → 连接 Producer / 失败时停止并释放包装；连接 Producer / 失败时停止并释放包装 → destroyed 停止访问 / 应用 release 包装；destroyed 停止访问 / 应用 release 包装 → 返回 true：View 释放 ST / 返回 false：调用方接管</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
