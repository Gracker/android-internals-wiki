<text x="241.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="241.0" dy="0">available 创建包装</tspan>
<tspan x="241.0" dy="29.92">应用持有 Surface</tspan>
</text>
<path d="M 420.0 130 Q 547.0 129.9 674.0 130 Q 678.0 130 678.0 134 L 678.0 256 Q 678.0 260 674.0 260 Q 547.0 259.8 420.0 260 Q 416.0 260 416.0 256 L 416.0 134 Q 416.0 130 420.0 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="547.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="547.0" dy="0">连接 Producer</tspan>
<tspan x="547.0" dy="29.92">失败时停止并释放包装</tspan>
</text>
<path d="M 726.0 130 Q 853.0 130.4 980.0 130 Q 984.0 130 984.0 134 L 984.0 256 Q 984.0 260 980.0 260 Q 853.0 259.8 726.0 260 Q 722.0 260 722.0 256 L 722.0 134 Q 722.0 130 726.0 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="853.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="853.0" dy="0">destroyed 停止访问</tspan>
<tspan x="853.0" dy="29.92">应用 release 包装</tspan>
</text>
<path d="M 1032.0 130 Q 1159.0 129.5 1286.0 130 Q 1290.0 130 1290.0 134 L 1290.0 256 Q 1290.0 260 1286.0 260 Q 1159.0 259.5 1032.0 260 Q 1028.0 260 1028.0 256 L 1028.0 134 Q 1028.0 130 1032.0 130" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="1159.0" y="188.20000000000002" text-anchor="middle" style="font-size:20px">
<tspan x="1159.0" dy="0">返回 true：View 释放 ST</tspan>
<tspan x="1159.0" dy="27.200000000000003">返回 false：调用方接管</tspan>
</text>
