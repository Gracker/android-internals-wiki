<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
<title id="title">宽度五档与高度三档要一起判断</title>
<desc id="desc">宽度适合决定上层信息密度，高度Compact的横屏或矮窗口仍需单独布局策略。 区间采用连续 dp 边界；图中中间档以整数 dp 标注 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="470" fill="white"/>
<path d="M 64 110 Q 180.0 110.6 296 110 Q 300 110 300 114 L 300 241 Q 300 245 296 245 Q 180.0 244.9 64 245 Q 60 245 60 241 L 60 114 Q 60 110 64 110" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="180.0" y="169.68" text-anchor="middle" style="font-size:23px">
<tspan x="180.0" dy="0">Compact</tspan>
<tspan x="180.0" dy="31.28">&lt; 600dp</tspan>
</text>
<path d="M 324 110 Q 440.0 109.6 556 110 Q 560 110 560 114 L 560 241 Q 560 245 556 245 Q 440.0 245.6 324 245 Q 320 245 320 241 L 320 114 Q 320 110 324 110" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="440.0" y="169.68" text-anchor="middle" style="font-size:23px">
<tspan x="440.0" dy="0">Medium</tspan>
<tspan x="440.0" dy="31.28">600≤w&lt;840dp</tspan>
</text>
<path d="M 584 110 Q 700.0 109.3 816 110 Q 820 110 820 114 L 820 241 Q 820 245 816 245 Q 700.0 245.2 584 245 Q 580 245 580 241 L 580 114 Q 580 110 584 110" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="700.0" y="169.68" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">Expanded</tspan>
<tspan x="700.0" dy="31.28">840≤w&lt;1200dp</tspan>
</text>
<path d="M 844 110 Q 960.0 110.2 1076 110 Q 1080 110 1080 114 L 1080 241 Q 1080 245 1076 245 Q 960.0 244.2 844 245 Q 840 245 840 241 L 840 114 Q 840 110 844 110" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="960.0" y="169.68" text-anchor="middle" style="font-size:23px">
<tspan x="960.0" dy="0">Large</tspan>
<tspan x="960.0" dy="31.28">1200≤w&lt;1600dp</tspan>
</text>
<path d="M 1104 110 Q 1220.0 109.3 1336 110 Q 1340 110 1340 114 L 1340 241 Q 1340 245 1336 245 Q 1220.0 245.4 1104 245 Q 1100 245 1100 241 L 1100 114 Q 1100 110 1104 110" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1220.0" y="169.68" text-anchor="middle" style="font-size:23px">
<tspan x="1220.0" dy="0">Extra-large</tspan>
<tspan x="1220.0" dy="31.28">≥ 1600dp</tspan>
</text>
<text x="700" y="350" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">高度：Compact h&lt;480dp；Medium 480≤h&lt;900dp；Expanded h≥900dp</tspan>
</text>
<text x="700" y="410" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">Adaptive1.2.0 须显式开启 Large / Extra-large 分类</tspan>
</text>
</svg>
