<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="530" viewBox="0 0 1400 530" role="img" aria-labelledby="title desc">
<title id="title">状态按帧时间区间关联，而非回调到达时读取</title>
<desc id="desc">状态在时间轴上与帧区间求交；同key多次变化时保留最近加入的一项，延迟回调不能读取当前路由补标签。 示意区间，无比例尺；API24+ frameEnd 使用六项 UI duration 之和 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="530" fill="white"/>
<text x="700" y="475" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">示意时间轴，无比例尺；回调按原始状态区间关联</tspan>
</text>
<text x="206" y="123" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">状态 A</tspan>
</text>
<path d="M 220 139 H 1220" stroke="#777777" stroke-width="1.5"/>
<path d="M 264 100 Q 520.0 100.2 776 100 Q 780 100 780 104 L 780 133 Q 780 137 776 137 Q 520.0 137.2 264 137 Q 260 137 260 133 L 260 104 Q 260 100 264 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="520.0" y="126" text-anchor="middle" style="font-size:21px">
<tspan x="520.0" dy="0">screen = Home</tspan>
</text>
<text x="206" y="243" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">帧区间</tspan>
</text>
<path d="M 220 259 H 1220" stroke="#777777" stroke-width="1.5"/>
<path d="M 474 220 Q 670.0 219.7 866 220 Q 870 220 870 224 L 870 253 Q 870 257 866 257 Q 670.0 257.3 474 257 Q 470 257 470 253 L 470 224 Q 470 220 474 220" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="670.0" y="246" text-anchor="middle" style="font-size:21px">
<tspan x="670.0" dy="0">frameStart → UI interval end</tspan>
</text>
<text x="206" y="363" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">状态 B</tspan>
</text>
<path d="M 220 379 H 1220" stroke="#777777" stroke-width="1.5"/>
<path d="M 784 340 Q 970.0 339.4 1156 340 Q 1160 340 1160 344 L 1160 373 Q 1160 377 1156 377 Q 970.0 377.2 784 377 Q 780 377 780 373 L 780 344 Q 780 340 784 340" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="970.0" y="366" text-anchor="middle" style="font-size:21px">
<tspan x="970.0" dy="0">screen = Detail</tspan>
</text>
</svg>
