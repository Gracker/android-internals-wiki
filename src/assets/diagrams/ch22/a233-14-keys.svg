<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">位置键会把状态留给错误实体</title>
<desc id="desc">稳定、唯一且可保存的业务键用于身份；默认位置键和显式整数键的对象类型不同。 稳定键不承诺普通 remember 永久保留 原位置 0 → 业务 A / 位置 1 → 业务 B → 头插 X 后位置 0 → X / 位置身份仍在，实体已变；稳定键 A → 业务 A / 稳定键 B → 业务 B → 头插 X 后 A／B 仍对应原实体 / 状态与滚动身份可跟随</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="500" fill="white"/>
<path d="M 620 137.5 L 780 137.5" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 770 131.5 L 780 137.5 L 770 143.5" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 620 297.5 L 780 297.5" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 770 291.5 L 780 297.5 L 770 303.5" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 134 80 Q 375.0 80.1 616 80 Q 620 80 620 84 L 620 191 Q 620 195 616 195 Q 375.0 195.7 134 195 Q 130 195 130 191 L 130 84 Q 130 80 134 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="375.0" y="129.68" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">原位置 0 → 业务 A</tspan>
<tspan x="375.0" dy="31.28">位置 1 → 业务 B</tspan>
</text>
<path d="M 784 80 Q 1025.0 80.8 1266 80 Q 1270 80 1270 84 L 1270 191 Q 1270 195 1266 195 Q 1025.0 195.1 784 195 Q 780 195 780 191 L 780 84 Q 780 80 784 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1025.0" y="129.68" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">头插 X 后位置 0 → X</tspan>
<tspan x="1025.0" dy="31.28">位置身份仍在，实体已变</tspan>
</text>
<path d="M 134 240 Q 375.0 239.9 616 240 Q 620 240 620 244 L 620 351 Q 620 355 616 355 Q 375.0 354.4 134 355 Q 130 355 130 351 L 130 244 Q 130 240 134 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="375.0" y="289.68" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">稳定键 A → 业务 A</tspan>
<tspan x="375.0" dy="31.28">稳定键 B → 业务 B</tspan>
</text>
<path d="M 784 240 Q 1025.0 240.5 1266 240 Q 1270 240 1270 244 L 1270 351 Q 1270 355 1266 355 Q 1025.0 354.4 784 355 Q 780 355 780 351 L 780 244 Q 780 240 784 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1025.0" y="289.68" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">头插 X 后 A／B 仍对应原实体</tspan>
<tspan x="1025.0" dy="31.28">状态与滚动身份可跟随</tspan>
</text>
<text x="700" y="450" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">稳定键不承诺普通 remember 永久保留</tspan>
</text>
</svg>
