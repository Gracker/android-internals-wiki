<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">无锁入队之后仍要等主线程执行</title>
<desc id="desc">Android 17、target 37 默认 DeliQueue 减少旧队列锁竞争，不能消除积压与长回调。 新实现 mMessages 始终 null；工具须适配 生产者入队 / Treiber stack／CAS → Looper 排序消费 / 独占 min-heap；Looper 排序消费 / 独占 min-heap → 前序消息与调度 / 决定何时执行；前序消息与调度 / 决定何时执行 → GapWorker / create／bind 成本仍在</desc>
