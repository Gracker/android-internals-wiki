<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">图形管线库的四个复用部分</title>
<desc id="desc">库复用可以减少重复创建，链接成本和GPU执行结果仍取决于feature、属性和是否进行LTO。 fastLinking 是只读属性，不是应用可启用的 feature vertex input library participates in link；pre-raster library participates in link；fragment shader library participates in link；fragment output library participates in link</desc>
