<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">InputRequest同时携带图像和源FrameInfo</title>
<desc id="desc">Image、FrameInfo的身份必须一致，内部类型错误按失败处理。 InputRequest不存在时才进入普通still模板分支 ZSL模板且未禁用 / 尝试dequeue候选 → 匹配CameraCaptureResult / 核实内部类型；匹配CameraCaptureResult / 核实内部类型 → AndroidImage包装 / 取出FrameInfo；AndroidImage包装 / 取出FrameInfo → InputRequest / 图像与原始metadata成对</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
