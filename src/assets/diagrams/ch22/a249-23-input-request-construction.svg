<text x="241.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="241.0" dy="0">ZSL模板且未禁用</tspan>
<tspan x="241.0" dy="29.92">尝试dequeue候选</tspan>
</text>
<path d="M 420.0 130 Q 547.0 129.3 674.0 130 Q 678.0 130 678.0 134 L 678.0 256 Q 678.0 260 674.0 260 Q 547.0 259.2 420.0 260 Q 416.0 260 416.0 256 L 416.0 134 Q 416.0 130 420.0 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
