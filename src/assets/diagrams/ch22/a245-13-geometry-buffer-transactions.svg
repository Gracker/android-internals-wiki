<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">几何事务和内容缓冲区分别流入</title>
<desc id="desc">同一transaction可带多项状态，但外部Producer的内容生产仍是独立工作。 公开容器 SurfaceControl 主要用于 parenting；不要覆盖内部管理属性 几何：position / matrix / crop → SurfaceView 管理的 Transaction；内容：Producer frame → BLAST child BufferQueue；host frame number / 目标 buffer → 受控合并，不能推断业务逻辑帧相同</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
