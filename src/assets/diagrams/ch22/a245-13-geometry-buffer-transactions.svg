<text x="375.0" y="145.32" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">几何：position / matrix / crop</tspan>
</text>
<path d="M 784 80 Q 1025.0 79.9 1266 80 Q 1270 80 1270 84 L 1270 191 Q 1270 195 1266 195 Q 1025.0 195.5 784 195 Q 780 195 780 191 L 780 84 Q 780 80 784 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1025.0" y="145.32" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">SurfaceView 管理的 Transaction</tspan>
</text>
<path d="M 134 240 Q 375.0 240.1 616 240 Q 620 240 620 244 L 620 351 Q 620 355 616 355 Q 375.0 354.6 134 355 Q 130 355 130 351 L 130 244 Q 130 240 134 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="375.0" y="305.32" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">内容：Producer frame</tspan>
</text>
<path d="M 784 240 Q 1025.0 239.8 1266 240 Q 1270 240 1270 244 L 1270 351 Q 1270 355 1266 355 Q 1025.0 355.5 784 355 Q 780 355 780 351 L 780 244 Q 780 240 784 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1025.0" y="305.32" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">BLAST child BufferQueue</tspan>
</text>
<path d="M 134 400 Q 375.0 400.6 616 400 Q 620 400 620 404 L 620 511 Q 620 515 616 515 Q 375.0 515.6 134 515 Q 130 515 130 511 L 130 404 Q 130 400 134 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="375.0" y="465.32" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">host frame number / 目标 buffer</tspan>
</text>
<path d="M 784 400 Q 1025.0 400.4 1266 400 Q 1270 400 1270 404 L 1270 511 Q 1270 515 1266 515 Q 1025.0 514.4 784 515 Q 780 515 780 511 L 780 404 Q 780 400 784 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1025.0" y="465.32" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">受控合并，不能推断业务逻辑帧相同</tspan>
</text>
<text x="700" y="610" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">公开容器 SurfaceControl 主要用于 parenting；不要覆盖内部管理属性</tspan>
</text>
</svg>
