<path d="M 524 70 Q 700.0 70.0 876 70 Q 880 70 880 74 L 880 156 Q 880 160 876 160 Q 700.0 160.4 524 160 Q 520 160 520 156 L 520 74 Q 520 70 524 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="700.0" y="123.84" text-anchor="middle" style="font-size:26px">
<tspan x="700.0" dy="0">BasicText 输入与能力</tspan>
</text>
<path d="M 104 290 Q 350.0 290.2 596 290 Q 600 290 600 294 L 600 406 Q 600 410 596 410 Q 350.0 410.5 104 410 Q 100 410 100 406 L 100 294 Q 100 290 104 290" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="350.0" y="341.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="350.0" dy="0">String 且无选择</tspan>
<tspan x="350.0" dy="32.64">无 onTextLayout／无 autoSize</tspan>
</text>
<path d="M 804 290 Q 1050.0 289.3 1296 290 Q 1300 290 1300 294 L 1300 406 Q 1300 410 1296 410 Q 1050.0 410.1 804 410 Q 800 410 800 406 L 800 294 Q 800 290 804 290" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1050.0" y="341.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="1050.0" dy="0">String 需要上述任一能力</tspan>
<tspan x="1050.0" dy="32.64">或使用 AnnotatedString 输入</tspan>
</text>
<path d="M 104 520 Q 350.0 519.6 596 520 Q 600 520 600 524 L 600 656 Q 600 660 596 660 Q 350.0 659.3 104 660 Q 100 660 100 656 L 100 524 Q 100 520 104 520" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="350.0" y="564.5" text-anchor="middle" style="font-size:25px">
