<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
<title id="title">String 简化节点有三个同时满足的条件</title>
<desc id="desc">回调、选择与自动字号有产品价值时保留；测试要记录具体节点路径，再追平台文本布局。 Text 不创建独立 Surface；两条分支最后共用宿主窗口显示链 满足String简化条件；需要完整文本能力或AnnotatedString；简化节点及段落缓存；完整节点及多段落缓存</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
