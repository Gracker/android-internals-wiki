<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">输出缓冲区的同步依赖随所有权传递</title>
<desc id="desc">Camera3OutputStream取到fd后可直接交HAL，不必先CPU等待。 fence命名相对当前接口；queue或latch本身不是像素可读证明 ANativeWindow dequeue / buffer + fence fd → 交HAL acquire_fence / 写入先满足依赖；交HAL acquire_fence / 写入先满足依赖 → HAL完成输出 / 返回release fence；HAL完成输出 / 返回release fence → queue给消费者 / 继续满足fence依赖</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="410" fill="white"/>
<path d="M 372.0 195 L 416.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 406.0 189 L 416.0 195 L 406.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 678.0 195 L 722.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 712.0 189 L 722.0 195 L 712.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 984.0 195 L 1028.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1018.0 189 L 1028.0 195 L 1018.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114.0 130 Q 241.0 129.2 368.0 130 Q 372.0 130 372.0 134 L 372.0 256 Q 372.0 260 368.0 260 Q 241.0 259.4 114.0 260 Q 110.0 260 110.0 256 L 110.0 134 Q 110.0 130 114.0 130" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="241.0" y="188.20000000000002" text-anchor="middle" style="font-size:20px">
<tspan x="241.0" dy="0">ANativeWindow dequeue</tspan>
<tspan x="241.0" dy="27.200000000000003">buffer + fence fd</tspan>
</text>
<path d="M 420.0 130 Q 547.0 129.6 674.0 130 Q 678.0 130 678.0 134 L 678.0 256 Q 678.0 260 674.0 260 Q 547.0 260.2 420.0 260 Q 416.0 260 416.0 256 L 416.0 134 Q 416.0 130 420.0 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="547.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="547.0" dy="0">交HAL acquire_fence</tspan>
<tspan x="547.0" dy="29.92">写入先满足依赖</tspan>
</text>
<path d="M 726.0 130 Q 853.0 130.7 980.0 130 Q 984.0 130 984.0 134 L 984.0 256 Q 984.0 260 980.0 260 Q 853.0 260.5 726.0 260 Q 722.0 260 722.0 256 L 722.0 134 Q 722.0 130 726.0 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="853.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="853.0" dy="0">HAL完成输出</tspan>
<tspan x="853.0" dy="29.92">返回release fence</tspan>
</text>
<path d="M 1032.0 130 Q 1159.0 129.3 1286.0 130 Q 1290.0 130 1290.0 134 L 1290.0 256 Q 1290.0 260 1286.0 260 Q 1159.0 259.2 1032.0 260 Q 1028.0 260 1028.0 256 L 1028.0 134 Q 1028.0 130 1032.0 130" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="1159.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="1159.0" dy="0">queue给消费者</tspan>
<tspan x="1159.0" dy="29.92">继续满足fence依赖</tspan>
</text>
<text x="700" y="338" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">fence命名相对当前接口；queue或latch本身不是像素可读证明</tspan>
</text>
</svg>
