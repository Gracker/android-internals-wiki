<title id="title">读取依赖分别连接到组合、测量、放置与绘制</title>
<desc id="desc">四条状态箭头表示不同读取位置；横向链是可能继续发生的阶段，不表示每次变化全部重跑。 Subcompose 可在测量时组合；组合也可由 Recomposer 帧时钟驱动 对应阶段读取该状态；记录依赖并失效；对应阶段读取该状态；记录依赖并失效；对应阶段读取该状态；记录依赖并失效；对应阶段读取该状态；记录依赖并失效；前一阶段输出或依赖变化时进入后续阶段；前一阶段输出或依赖变化时进入后续阶段；前一阶段输出或依赖变化时进入后续阶段</desc>
