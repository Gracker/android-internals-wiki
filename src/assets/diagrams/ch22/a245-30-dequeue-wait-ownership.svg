<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">四种等待必须记录所属队列</title>
<desc id="desc">同名dequeue等待可能来自完全不同队列，应保存layer、slot、frame number和fence归属。 不要把生产方、HWUI 输入和宿主窗口的释放信号混为一个 SV Producer dequeue / swap → 独立 child release、slot 和显示反压；TV Producer dequeue / swap → SurfaceTexture 的输入slot回收；TV RT acquire / host RT dequeue → 前者输入就绪；后者宿主窗口反压</desc>
