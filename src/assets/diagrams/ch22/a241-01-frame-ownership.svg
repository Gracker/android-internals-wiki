<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">帧监控沿应用到显示逐段取证</title>
<desc id="desc">FrameMetrics覆盖应用帧生产区间；入队、合成和最终显示要分别取证。 流水线可并行重叠；queueBuffer 返回不等于像素已显示 UI 与 RenderThread / 生产应用帧 → BLAST / BufferQueue / 提交并等待消费；BLAST / BufferQueue / 提交并等待消费 → SurfaceFlinger / HWC / 合成与显示调度；SurfaceFlinger / HWC / 合成与显示调度 → Display present / 实际显示结果</desc>
