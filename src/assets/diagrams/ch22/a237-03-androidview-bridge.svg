<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">AndroidView 的布局与绘制桥</title>
<desc id="desc">ViewFactoryHolder / AndroidViewHolder 把两个树的测量、放置和绘制连接起来。 没有把View转换成可组合函数或独立Surface Constraints与LP / 转换MeasureSpec → View.measure / 宽高反馈LayoutNode；View.measure / 宽高反馈LayoutNode → Compose放置 / 调用View.layout；Compose放置 / 调用View.layout → Handler／holder.draw / 记录宿主绘制指令</desc>
