<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">逐函数切片需要标记、运行时与采集会话</title>
<desc id="desc">API 30+ 按受支持采集方式启用；安装跟踪器只提供写入能力，不代表已录制。 切片名称属于具体版本；不能预设 Compose:measure 等固定组合 编译器注入标记 / info 带函数／位置 → AndroidX Startup / 安装 / CompositionTracer；AndroidX Startup / 安装 / CompositionTracer → PerfettoSdkTrace / beginSection(info)；PerfettoSdkTrace / beginSection(info) → 录制会话 / 订阅 track_event</desc>
