<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">列表速度只是刷新率策略的输入</title>
<desc id="desc">compileSdk 至少 35；系统决定最终刷新率，Adapter 参数不能保证固定 Hz。 fling／smooth scroll 路径；图不宣称实际刷新率收益 RecyclerView 1.4 / OverScroller 滚动 → API 35+ 速度上报 / FrameContentVelocity；API 35+ 速度上报 / FrameContentVelocity → 平台策略 / 面板／功耗／状态；平台策略 / 面板／功耗／状态 → 实际刷新率与帧 / 在设备上取证</desc>
