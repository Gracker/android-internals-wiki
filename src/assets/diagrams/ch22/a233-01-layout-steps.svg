</text>
<path d="M 930.0 130 Q 1108.0 129.3 1286.0 130 Q 1290.0 130 1290.0 134 L 1290.0 256 Q 1290.0 260 1286.0 260 Q 1108.0 260.0 930.0 260 Q 926.0 260 926.0 256 L 926.0 134 Q 926.0 130 930.0 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1108.0" y="171.54" text-anchor="middle" style="font-size:23px">
<tspan x="1108.0" dy="0">Step 3</tspan>
<tspan x="1108.0" dy="31.28">匹配 pre／post</tspan>
<tspan x="1108.0" dy="31.28">动画、回收、焦点</tspan>
</text>
<text x="700" y="338" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">AutoMeasure 可移动或重复 step2；不能只量 onLayout</tspan>
