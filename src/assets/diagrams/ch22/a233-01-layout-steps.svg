<tspan x="292.0" dy="31.28">更新／动画标记</tspan>
<tspan x="292.0" dy="31.28">记录 pre-layout</tspan>
</text>
<path d="M 522.0 130 Q 700.0 130.4 878.0 130 Q 882.0 130 882.0 134 L 882.0 256 Q 882.0 260 878.0 260 Q 700.0 260.3 522.0 260 Q 518.0 260 518.0 256 L 518.0 134 Q 518.0 130 522.0 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
