<path d="M 490 160 L 710 160" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 154 L 710 160 L 700 166" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 305 220 L 305 410 L 405 410" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 395 404 L 405 410 L 395 416" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 895 220 L 895 410 L 795 410" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 805 404 L 795 410 L 805 416" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 124 100 Q 305.0 100.1 486 100 Q 490 100 490 104 L 490 216 Q 490 220 486 220 Q 305.0 219.3 124 220 Q 120 220 120 216 L 120 104 Q 120 100 124 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="305.0" y="151.5" text-anchor="middle" style="font-size:25px">
<tspan x="305.0" dy="0">hardware 截图</tspan>
<tspan x="305.0" dy="34.0">W × H × 4 B</tspan>
</text>
<path d="M 714 100 Q 895.0 99.6 1076 100 Q 1080 100 1080 104 L 1080 216 Q 1080 220 1076 220 Q 895.0 220.6 714 220 Q 710 220 710 216 L 710 104 Q 710 100 714 100" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="895.0" y="151.5" text-anchor="middle" style="font-size:25px">
<tspan x="895.0" dy="0">software Bitmap</tspan>
<tspan x="895.0" dy="34.0">W × H × 4 B</tspan>
</text>
<path d="M 409 350 Q 600.0 349.6 791 350 Q 795 350 795 354 L 795 466 Q 795 470 791 470 Q 600.0 470.1 409 470 Q 405 470 405 466 L 405 354 Q 405 350 409 350" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="401.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">两份像素共存时</tspan>
<tspan x="600.0" dy="34.0">约 W × H × 8 B</tspan>
</text>
<rect x="546.0" y="110.0" width="108.0" height="36.3" fill="white"/>
<text x="600" y="135" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">全帧复制</tspan>
</text>
<text x="600" y="560" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">多 display：逐屏求和；准星移动复用 software 快照</tspan>
</text>
</svg>
