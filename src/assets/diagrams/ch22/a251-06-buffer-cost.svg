<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">取一个像素之前的全帧内存成本</title>
<desc id="desc">解释 hardware screenshot 和 software copy 共存的两份像素负载。 仅给像素字节数量级；忽略 stride、对齐、合成与纹理，不能替代峰值内存或 PSS 实测。 硬件 Bitmap 全帧 copy 为 CPU 可读像素；硬件像素计入同时存活估算；软件像素计入同时存活估算</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
