<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="title desc">
<title id="title">异步回调、输入排队与playback各司其职</title>
<desc id="desc">普通配置有callback与queueing线程；API36 crypto分支改同步enqueuer。 逻辑track无时间比例；完整renderer状态机仍由playback推进 </desc>
