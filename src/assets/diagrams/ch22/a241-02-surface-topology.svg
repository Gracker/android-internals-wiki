<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">宿主窗口正常仍可能有独立内容停顿</title>
<desc id="desc">先辨认谁向哪一个Surface提供缓冲区，避免用宿主窗口统计替代独立内容流。 独立 Surface 拓扑取决于实际实现；不按技术名称一概推断 宿主 Window / View / Compose 与控件 → JankStats / FrameMetrics / 观察宿主这一段；独立内容 Surface / Camera / 视频 / 引擎 → 目标 layer 时间线 / producer、fence 与 present</desc>
