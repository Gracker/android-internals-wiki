<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">公开 JankData 位掩码省略了部分原因</title>
<desc id="desc">公开分类是JNI的简化映射；精细的FrameTimeline原因和最终显示结果仍要回到目标图层核对。 位掩码可多原因同时命中；JANK_NONE 数值为 0 AppDeadlineMissed 等 → 映射 JANK_APPLICATION；SurfaceFlinger / HAL 等 → 映射 JANK_COMPOSER；BufferStuffing / Dropped 等 → 不设置公开原因位 / 不能据 JANK_NONE 推断流畅</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="660" fill="white"/>
<path d="M 620 137.5 L 780 137.5" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 770 131.5 L 780 137.5 L 770 143.5" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 620 297.5 L 780 297.5" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 770 291.5 L 780 297.5 L 770 303.5" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 620 457.5 L 780 457.5" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 770 451.5 L 780 457.5 L 770 463.5" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 134 80 Q 375.0 80.6 616 80 Q 620 80 620 84 L 620 191 Q 620 195 616 195 Q 375.0 195.1 134 195 Q 130 195 130 191 L 130 84 Q 130 80 134 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="375.0" y="145.32" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">AppDeadlineMissed 等</tspan>
</text>
<path d="M 784 80 Q 1025.0 79.7 1266 80 Q 1270 80 1270 84 L 1270 191 Q 1270 195 1266 195 Q 1025.0 194.8 784 195 Q 780 195 780 191 L 780 84 Q 780 80 784 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1025.0" y="145.32" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">映射 JANK_APPLICATION</tspan>
</text>
<path d="M 134 240 Q 375.0 239.9 616 240 Q 620 240 620 244 L 620 351 Q 620 355 616 355 Q 375.0 354.2 134 355 Q 130 355 130 351 L 130 244 Q 130 240 134 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="375.0" y="305.32" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">SurfaceFlinger / HAL 等</tspan>
</text>
<path d="M 784 240 Q 1025.0 239.8 1266 240 Q 1270 240 1270 244 L 1270 351 Q 1270 355 1266 355 Q 1025.0 355.6 784 355 Q 780 355 780 351 L 780 244 Q 780 240 784 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1025.0" y="305.32" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">映射 JANK_COMPOSER</tspan>
</text>
<path d="M 134 400 Q 375.0 400.0 616 400 Q 620 400 620 404 L 620 511 Q 620 515 616 515 Q 375.0 514.7 134 515 Q 130 515 130 511 L 130 404 Q 130 400 134 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="375.0" y="465.32" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">BufferStuffing / Dropped 等</tspan>
</text>
<path d="M 784 400 Q 1025.0 399.9 1266 400 Q 1270 400 1270 404 L 1270 511 Q 1270 515 1266 515 Q 1025.0 514.9 784 515 Q 780 515 780 511 L 780 404 Q 780 400 784 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1025.0" y="449.68" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">不设置公开原因位</tspan>
<tspan x="1025.0" dy="31.28">不能据 JANK_NONE 推断流畅</tspan>
</text>
<text x="700" y="610" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">位掩码可多原因同时命中；JANK_NONE 数值为 0</tspan>
</text>
</svg>
