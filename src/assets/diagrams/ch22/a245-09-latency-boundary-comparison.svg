<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">两条路径的额外等待点</title>
<desc id="desc">TextureView可能赶上同一宿主帧，也可能错过；无法统一声称固定多一帧。 定义输入起点和显示终点；present fence 不替代光学测量 SurfaceView 内容 → queue → BLAST → SF / HWC → present；TextureView 输入 → queue → callback → host frame → RT；TextureView 宿主输出 → 采样 → host queue → SF / HWC → present</desc>
