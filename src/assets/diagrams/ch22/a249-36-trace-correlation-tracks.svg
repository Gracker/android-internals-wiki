<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670" role="img" aria-labelledby="title desc">
<title id="title">Perfetto按生产、消费者和显示关联</title>
<desc id="desc">独立预览layer与应用窗口帧分开；以实际帧ID与时基映射关联。 逻辑track无时长比例；数据源与vendor可见性因设备而异 </desc>
