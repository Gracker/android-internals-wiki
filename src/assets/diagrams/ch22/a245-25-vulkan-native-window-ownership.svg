<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">Vulkan与ANativeWindow引用计数</title>
<desc id="desc">创建调用后释放本地引用合法；空window和创建失败分别处理，持有引用也不代表底层Surface永远可用。 同一 window 只能有一个 VkSurface；不能同时连接 EGLSurface fromSurface / 获取一份本地引用 → 创建 VkSurfaceKHR / 成功后 Vulkan 再持有引用；创建 VkSurfaceKHR / 成功后 Vulkan 再持有引用 → 释放本地 window 引用 / 检查 VkResult；释放本地 window 引用 / 检查 VkResult → swapchain 停用后 / 销毁 VkSurface 释放其引用</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="410" fill="white"/>
<path d="M 372.0 195 L 416.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 406.0 189 L 416.0 195 L 406.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 678.0 195 L 722.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 712.0 189 L 722.0 195 L 712.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 984.0 195 L 1028.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1018.0 189 L 1028.0 195 L 1018.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114.0 130 Q 241.0 130.8 368.0 130 Q 372.0 130 372.0 134 L 372.0 256 Q 372.0 260 368.0 260 Q 241.0 259.2 114.0 260 Q 110.0 260 110.0 256 L 110.0 134 Q 110.0 130 114.0 130" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="241.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="241.0" dy="0">fromSurface</tspan>
<tspan x="241.0" dy="29.92">获取一份本地引用</tspan>
</text>
<path d="M 420.0 130 Q 547.0 130.2 674.0 130 Q 678.0 130 678.0 134 L 678.0 256 Q 678.0 260 674.0 260 Q 547.0 259.7 420.0 260 Q 416.0 260 416.0 256 L 416.0 134 Q 416.0 130 420.0 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="547.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="547.0" dy="0">创建 VkSurfaceKHR</tspan>
<tspan x="547.0" dy="29.92">Vulkan 成功后再持有</tspan>
</text>
<path d="M 726.0 130 Q 853.0 129.5 980.0 130 Q 984.0 130 984.0 134 L 984.0 256 Q 984.0 260 980.0 260 Q 853.0 259.5 726.0 260 Q 722.0 260 722.0 256 L 722.0 134 Q 722.0 130 726.0 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="853.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="853.0" dy="0">释放本地 window 引用</tspan>
<tspan x="853.0" dy="29.92">检查 VkResult</tspan>
</text>
<path d="M 1032.0 130 Q 1159.0 129.7 1286.0 130 Q 1290.0 130 1290.0 134 L 1290.0 256 Q 1290.0 260 1286.0 260 Q 1159.0 259.5 1032.0 260 Q 1028.0 260 1028.0 256 L 1028.0 134 Q 1028.0 130 1032.0 130" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="1159.0" y="172.55999999999997" text-anchor="middle" style="font-size:22px">
<tspan x="1159.0" dy="0">swapchain 停用后</tspan>
<tspan x="1159.0" dy="29.92">销毁 VkSurface</tspan>
<tspan x="1159.0" dy="29.92">释放其持有引用</tspan>
</text>
<text x="700" y="338" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">同一 window 只能有一个 VkSurface；不能同时连接 EGLSurface</tspan>
</text>
