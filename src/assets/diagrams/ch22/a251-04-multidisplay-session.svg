<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">MainActivity 首次准备</tspan>
<tspan x="600.0" dy="34.0">枚举当前 display IDs</tspan>
</text>
<path d="M 104 240 Q 310.0 240.1 516 240 Q 520 240 520 244 L 520 326 Q 520 330 516 330 Q 310.0 330.0 104 330 Q 100 330 100 326 L 100 244 Q 100 240 104 240" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="276.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">display 0 快照</tspan>
<tspan x="310.0" dy="34.0">独立 overlay / ViewModel</tspan>
</text>
<path d="M 684 240 Q 890.0 240.5 1096 240 Q 1100 240 1100 244 L 1100 326 Q 1100 330 1096 330 Q 890.0 330.1 684 330 Q 680 330 680 326 L 680 244 Q 680 240 684 240" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="276.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">display 1 快照</tspan>
<tspan x="890.0" dy="34.0">独立 overlay / ViewModel</tspan>
</text>
<path d="M 404 430 Q 600.0 429.5 796 430 Q 800 430 800 434 L 800 516 Q 800 520 796 520 Q 600.0 519.8 404 520 Q 400 520 400 516 L 400 434 Q 400 430 404 430" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="466.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">ActiveDisplayTracker</tspan>
<tspan x="600.0" dy="34.0">切换当前准星所在屏</tspan>
</text>
<text x="600" y="605" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">display 增删 / configuration 变化 → 取消会话并清理 overlay</tspan>
