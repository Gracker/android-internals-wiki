<path d="M 680 150 L 680 190 L 890 190 L 890 240" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 230 L 890 240 L 896 230" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 310 330 L 310 475 L 400 475" stroke="#202020" stroke-width="2.8" fill="none"/>
