<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">TOTAL、GPU 与 swap 的边界不能简单相加</title>
<desc id="desc">FrameMetrics按里程碑取差；UI、RenderThread、GPU可并行且存在未单列间隙，TOTAL减阶段之和不具有固定归因。 示意轨道，无实测时长；公开 Window observer 不等待 present 时间 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="650" fill="white"/>
<text x="700" y="595" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">示意区间，无比例尺；FrameMetrics 可用 ≠ 已 present</tspan>
</text>
<text x="206" y="118" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">UI</tspan>
</text>
<path d="M 220 134 H 1220" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 95 Q 450.0 95.5 656 95 Q 660 95 660 99 L 660 128 Q 660 132 656 132 Q 450.0 132.3 244 132 Q 240 132 240 128 L 240 99 Q 240 95 244 95" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="450.0" y="121" text-anchor="middle" style="font-size:21px">
<tspan x="450.0" dy="0">UI 阶段（含等待）</tspan>
</text>
<text x="206" y="233" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">RenderThread</tspan>
</text>
<path d="M 220 249 H 1220" stroke="#777777" stroke-width="1.5"/>
<path d="M 594 210 Q 715.0 209.5 836 210 Q 840 210 840 214 L 840 243 Q 840 247 836 247 Q 715.0 247.0 594 247 Q 590 247 590 243 L 590 214 Q 590 210 594 210" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="715.0" y="236" text-anchor="middle" style="font-size:21px">
<tspan x="715.0" dy="0">sync / command / swap</tspan>
</text>
<text x="206" y="348" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">GPU</tspan>
</text>
<path d="M 220 364 H 1220" stroke="#777777" stroke-width="1.5"/>
<path d="M 774 325 Q 915.0 325.6 1056 325 Q 1060 325 1060 329 L 1060 358 Q 1060 362 1056 362 Q 915.0 362.4 774 362 Q 770 362 770 358 L 770 329 Q 770 325 774 325" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="915.0" y="351" text-anchor="middle" style="font-size:21px">
<tspan x="915.0" dy="0">submission → complete</tspan>
</text>
<text x="206" y="463" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">TOTAL</tspan>
</text>
<path d="M 220 479 H 1220" stroke="#777777" stroke-width="1.5"/>
<path d="M 244 440 Q 650.0 439.5 1056 440 Q 1060 440 1060 444 L 1060 473 Q 1060 477 1056 477 Q 650.0 477.1 244 477 Q 240 477 240 473 L 240 444 Q 240 440 244 440" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="650.0" y="466" text-anchor="middle" style="font-size:21px">
<tspan x="650.0" dy="0">intended VSync → frame completed</tspan>
</text>
</svg>
