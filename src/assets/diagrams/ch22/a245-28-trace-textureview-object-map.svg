<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">TextureView从外部输入追到宿主呈现</title>
<desc id="desc">SurfaceFlinger找不到独立TextureView输入layer是预期拓扑，要回溯应用与生产方轨迹。 输入 queue 不等于 sampled；latest 策略可能跳过中间输入 Producer queue / fence / 确认输入 frame number → ST callback / invalidate / 确认宿主安排更新；ST callback / invalidate / 确认宿主安排更新 → RT acquire latest / sample / 确认真正使用的输入；RT acquire latest / sample / 确认真正使用的输入 → host BLAST / DisplayFrame / 确认哪轮实际呈现</desc>
