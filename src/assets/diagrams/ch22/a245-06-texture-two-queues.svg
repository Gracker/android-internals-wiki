<text x="241.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="241.0" dy="0">外部 Producer</tspan>
<tspan x="241.0" dy="29.92">SurfaceTexture 队列</tspan>
</text>
