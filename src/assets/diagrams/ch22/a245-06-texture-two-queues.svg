<text x="853.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="853.0" dy="0">宿主 HWUI buffer</tspan>
<tspan x="853.0" dy="29.92">App Window BLAST</tspan>
</text>
