<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670" role="img" aria-labelledby="title desc">
<title id="title">异步 inflate 移动构造，回调仍需主线程与生命周期检查</title>
<desc id="desc">默认回调走 UI 线程，返回 View 未 attach；后台 RuntimeException 导致 UI 线程重做 inflate。 示意两条路径，无实测时长；executor 仅改变回调位置，不使 addView 可在后台执行 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="670" fill="white"/>
<text x="700.0" y="625" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">示意两条路径，无实测时长；executor 仅改变回调位置，不使 addView 可在后台执行</tspan>
</text>
<text x="286" y="118" text-anchor="end" style="font-size:23px">
<tspan x="286" dy="0">UI 调用 / 回调</tspan>
</text>
<path d="M 300 134 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 304 95 Q 380.0 95.2 456 95 Q 460 95 460 99 L 460 128 Q 460 132 456 132 Q 380.0 131.7 304 132 Q 300 132 300 128 L 300 99 Q 300 95 304 95" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="380.0" y="121" text-anchor="middle" style="font-size:21px">
<tspan x="380.0" dy="0">提交</tspan>
</text>
<path d="M 994 95 Q 1140.0 95.1 1286 95 Q 1290 95 1290 99 L 1290 128 Q 1290 132 1286 132 Q 1140.0 131.2 994 132 Q 990 132 990 128 L 990 99 Q 990 95 994 95" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1140.0" y="121" text-anchor="middle" style="font-size:21px">
<tspan x="1140.0" dy="0">检查 / attach / bind</tspan>
</text>
<text x="286" y="298" text-anchor="end" style="font-size:23px">
<tspan x="286" dy="0">InflateThread</tspan>
</text>
<path d="M 300 314 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 474 275 Q 710.0 274.9 946 275 Q 950 275 950 279 L 950 308 Q 950 312 946 312 Q 710.0 311.9 474 312 Q 470 312 470 308 L 470 279 Q 470 275 474 275" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="710.0" y="301" text-anchor="middle" style="font-size:21px">
<tspan x="710.0" dy="0">解析与构造，成功则回调</tspan>
</text>
<text x="286" y="478" text-anchor="end" style="font-size:23px">
<tspan x="286" dy="0">失败回退 UI</tspan>
</text>
<path d="M 300 494 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 474 455 Q 780.0 455.4 1086 455 Q 1090 455 1090 459 L 1090 488 Q 1090 492 1086 492 Q 780.0 492.5 474 492 Q 470 492 470 488 L 470 459 Q 470 455 474 455" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="780.0" y="481" text-anchor="middle" style="font-size:21px">
<tspan x="780.0" dy="0">后台失败后 UI 重做 inflate，再回调</tspan>
</text>
</svg>
