<text x="241.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="241.0" dy="0">Lookahead</tspan>
<tspan x="241.0" dy="29.92">记录目标 bounds</tspan>
</text>
<path d="M 420.0 130 Q 547.0 130.4 674.0 130 Q 678.0 130 678.0 134 L 678.0 256 Q 678.0 260 674.0 260 Q 547.0 259.8 420.0 260 Q 416.0 260 416.0 256 L 416.0 134 Q 416.0 130 420.0 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="547.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="547.0" dy="0">approach</tspan>
<tspan x="547.0" dy="29.92">计算当前动画 bounds</tspan>
</text>
