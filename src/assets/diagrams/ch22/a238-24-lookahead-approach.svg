<text x="853.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="853.0" dy="0">缩放稳定目标布局</tspan>
<tspan x="853.0" dy="29.92">或按 bounds 重测</tspan>
</text>
<path d="M 1032.0 130 Q 1159.0 130.3 1286.0 130 Q 1290.0 130 1290.0 134 L 1290.0 256 Q 1290.0 260 1286.0 260 Q 1159.0 260.2 1032.0 260 Q 1028.0 260 1028.0 256 L 1028.0 134 Q 1028.0 130 1032.0 130" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="1159.0" y="187.51999999999998" text-anchor="middle" style="font-size:22px">
<tspan x="1159.0" dy="0">draw / GraphicsLayer</tspan>
<tspan x="1159.0" dy="29.92">进入标准窗口渲染</tspan>
</text>
<text x="700" y="338" text-anchor="middle" style="font-size:23px">
