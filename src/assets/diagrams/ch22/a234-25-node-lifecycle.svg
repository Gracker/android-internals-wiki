<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">复用重置与解除附着的顺序</title>
<desc id="desc">onReset 只在相关可复用内容流程出现；同一 Node 之后可以重新附着服务另一实体。 普通离屏变化不保证 onReset；树的最终状态可用 sideEffect 延后看 create / 新 Node 尚未附着 → onAttach / 附着期 API 可用；onAttach / 附着期 API 可用 → 需要复用时 onReset / 仍附着，清理旧项状态；需要复用时 onReset / 仍附着，清理旧项状态 → onDetach / 返回后取消节点 scope</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="410" fill="white"/>
<path d="M 372.0 195 L 416.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 406.0 189 L 416.0 195 L 406.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 678.0 195 L 722.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 712.0 189 L 722.0 195 L 712.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 984.0 195 L 1028.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1018.0 189 L 1028.0 195 L 1018.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114.0 130 Q 241.0 130.7 368.0 130 Q 372.0 130 372.0 134 L 372.0 256 Q 372.0 260 368.0 260 Q 241.0 259.3 114.0 260 Q 110.0 260 110.0 256 L 110.0 134 Q 110.0 130 114.0 130" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="241.0" y="187.18" text-anchor="middle" style="font-size:23px">
<tspan x="241.0" dy="0">create</tspan>
<tspan x="241.0" dy="31.28">新 Node 尚未附着</tspan>
</text>
<path d="M 420.0 130 Q 547.0 130.7 674.0 130 Q 678.0 130 678.0 134 L 678.0 256 Q 678.0 260 674.0 260 Q 547.0 259.7 420.0 260 Q 416.0 260 416.0 256 L 416.0 134 Q 416.0 130 420.0 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="547.0" y="187.18" text-anchor="middle" style="font-size:23px">
<tspan x="547.0" dy="0">onAttach</tspan>
<tspan x="547.0" dy="31.28">附着期 API 可用</tspan>
</text>
<path d="M 726.0 130 Q 853.0 130.2 980.0 130 Q 984.0 130 984.0 134 L 984.0 256 Q 984.0 260 980.0 260 Q 853.0 260.0 726.0 260 Q 722.0 260 722.0 256 L 722.0 134 Q 722.0 130 726.0 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="853.0" y="187.18" text-anchor="middle" style="font-size:23px">
<tspan x="853.0" dy="0">需要复用时 onReset</tspan>
<tspan x="853.0" dy="31.28">仍附着，清理旧项状态</tspan>
</text>
<path d="M 1032.0 130 Q 1159.0 129.3 1286.0 130 Q 1290.0 130 1290.0 134 L 1290.0 256 Q 1290.0 260 1286.0 260 Q 1159.0 259.9 1032.0 260 Q 1028.0 260 1028.0 256 L 1028.0 134 Q 1028.0 130 1032.0 130" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="1159.0" y="187.18" text-anchor="middle" style="font-size:23px">
<tspan x="1159.0" dy="0">onDetach</tspan>
<tspan x="1159.0" dy="31.28">返回后取消节点 scope</tspan>
</text>
<text x="700" y="338" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">普通离屏变化不保证 onReset；树的最终状态可用 sideEffect 延后看</tspan>
</text>
</svg>
