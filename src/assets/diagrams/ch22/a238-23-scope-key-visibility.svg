<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">共享 scope 内以业务 key 和可见性匹配</title>
<desc id="desc">相同 key 负责跨端匹配，可见性 scope 负责进入/退出判定；重复进入候选会使匹配不明确。 SharedTransitionScope Composable 入口须把给出的 Modifier 放在最上层子节点 退出端注册相同key；进入端注册相同key；scope内集中匹配</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="520" fill="white"/>
<path d="M 510 342 L 555 342" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 545 336 L 555 342 L 545 348" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890 342 L 845 342" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 855 336 L 845 342 L 855 348" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 160 L 700 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 694 270 L 700 280 L 706 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 414 70 Q 700.0 69.4 986 70 Q 990 70 990 74 L 990 156 Q 990 160 986 160 Q 700.0 160.6 414 160 Q 410 160 410 156 L 410 74 Q 410 70 414 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="700.0" y="123.5" text-anchor="middle" style="font-size:25px">
<tspan x="700.0" dy="0">同一个 SharedTransitionScope</tspan>
</text>
<path d="M 104 280 Q 305.0 279.3 506 280 Q 510 280 510 284 L 510 401 Q 510 405 506 405 Q 305.0 404.9 104 405 Q 100 405 100 401 L 100 284 Q 100 280 104 280" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="305.0" y="334.0" text-anchor="middle" style="font-size:25px">
<tspan x="305.0" dy="0">退出端 entry</tspan>
<tspan x="305.0" dy="34.0">article-image:42</tspan>
</text>
<path d="M 894 280 Q 1095.0 279.6 1296 280 Q 1300 280 1300 284 L 1300 401 Q 1300 405 1296 405 Q 1095.0 405.3 894 405 Q 890 405 890 401 L 890 284 Q 890 280 894 280" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1095.0" y="334.0" text-anchor="middle" style="font-size:25px">
<tspan x="1095.0" dy="0">进入端 entry</tspan>
<tspan x="1095.0" dy="34.0">article-image:42</tspan>
</text>
<path d="M 559 280 Q 700.0 279.6 841 280 Q 845 280 845 284 L 845 401 Q 845 405 841 405 Q 700.0 404.9 559 405 Q 555 405 555 401 L 555 284 Q 555 280 559 280" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="700.0" y="334.68" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">相同业务 key</tspan>
<tspan x="700.0" dy="31.28">进入端给目标 bounds</tspan>
</text>
<text x="700.0" y="475" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">SharedTransitionScope Composable 入口须把给出的 Modifier 放在最上层子节点</tspan>
</text>
</svg>
