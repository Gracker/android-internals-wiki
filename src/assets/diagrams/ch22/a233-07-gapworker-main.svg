<tspan x="1159.0" dy="31.28">仍需 measure／layout</tspan>
</text>
<text x="700" y="338" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">预取不是后台线程布局，也不保证命中</tspan>
