<text x="700.0" y="505" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">以刷新周期为逻辑刻度，无设备测量值</tspan>
</text>
<text x="196" y="113" text-anchor="end" style="font-size:23px">
<tspan x="196" dy="0">刷新周期</tspan>
</text>
