<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="550" viewBox="0 0 1400 550" role="img" aria-labelledby="title desc">
<title id="title">60fps内容与120Hz刷新的均匀保持</title>
<desc id="desc">60fps内容在120Hz条件下可每帧保持两个刷新周期；此图仅示意均匀且按时呈现的情况。 以刷新周期为逻辑刻度，无设备测量值 </desc>
