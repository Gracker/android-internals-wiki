<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从固定manifest到项目commit记录</title>
<desc id="desc">初始化固定tag的manifest，按需要同步项目，再保存各项目revision与设备对应关系。 局部同步不保证可构建；签名验证还需对应项目和可信密钥，移动分支名不等于固定版本。 Repo init固定tag
manifest决定项目与revision → 按目标同步完整或局部项目
按环境与依赖调整并发；按目标同步完整或局部项目
按环境与依赖调整并发 → 核对项目与实际commit
repo list / git revision；核对项目与实际commit
repo list / git revision → 保存pinned manifest
签名、产物与设备证据另验收</desc>
