<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">同一设备的两个独立策略判断</title>
<desc id="desc">同一能力向量按内存与媒体两个独立分支生成负载策略，避免通用总分抹平差异。 192MB、MPC35和缓存比例都是演示规则；native/graphics预算与所需媒体特性仍要单独校准。 内存信号只映射本例的缓存和预取；媒体声明映射媒体预设，具体特性另查</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="560" fill="white"/>
<path d="M 315 180 L 315 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 309 290 L 315 300 L 321 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 885 180 L 885 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 879 290 L 885 300 L 891 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 315.0 59.4 561 60 Q 565 60 565 64 L 565 176 Q 565 180 561 180 Q 315.0 180.4 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="315.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">内存信号</tspan>
<tspan x="315.0" dy="34.0">low-RAM 或 heap &lt; 演示阈值</tspan>
</text>
<path d="M 639 60 Q 885.0 60.6 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 885.0 180.4 639 180 Q 635 180 635 176 L 635 64 Q 635 60 639 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="885.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">媒体信号</tspan>
<tspan x="885.0" dy="34.0">MPC达到演示等级</tspan>
</text>
<path d="M 69 300 Q 315.0 300.0 561 300 Q 565 300 565 304 L 565 416 Q 565 420 561 420 Q 315.0 420.6 69 420 Q 65 420 65 416 L 65 304 Q 65 300 69 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="315.0" y="351.5" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">内存规则</tspan>
<tspan x="315.0" dy="34.0">缓存比例与预取条数</tspan>
</text>
<path d="M 639 300 Q 885.0 299.2 1131 300 Q 1135 300 1135 304 L 1135 416 Q 1135 420 1131 420 Q 885.0 419.8 639 420 Q 635 420 635 416 L 635 304 Q 635 300 639 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="885.0" y="351.5" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">媒体规则</tspan>
<tspan x="885.0" dy="34.0">兼容 / CDD增强预设</tspan>
</text>
</svg>
