<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从同步电压电流积分到能量</title>
<desc id="desc">在明确测量点校准并同步电压电流，按场景积分总能量，再保留配对差值与区间。 mAh是电荷；测量点、USB供电和空闲基线修正会影响结果，原始总能量同时保留。 供电夹具与边界
采样、校准、测量点和USB → 同步采样V(t)与I(t)
按场景标记对齐时间窗；同步采样V(t)与I(t)
按场景标记对齐时间窗 → 计算P(t)=V(t)×I(t)
E=∫P(t)dt，统一能量单位；计算P(t)=V(t)×I(t)
E=∫P(t)dt，统一能量单位 → 同协议交错A/B
总能量、修正值与区间</desc>
