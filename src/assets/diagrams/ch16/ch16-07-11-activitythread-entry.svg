<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ActivityThread主入口与组件派发</title>
<desc id="desc">ActivityThread建立Java主线程运行环境并attach，随后由主Looper派发应用与组件工作。 main之前已有进程创建与运行时初始化；完整启动还跨system_server、ART、I/O和首帧。 ActivityThread.main
应用进程Java入口 → prepareMainLooper
创建主Looper环境；prepareMainLooper
创建主Looper环境 → new ActivityThread + attach
向ActivityManager注册应用线程；new ActivityThread + attach
向ActivityManager注册应用线程 → Looper.loop派发后续工作
bindApplication、组件与生命周期</desc>
