<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">traversal排定与消息屏障生命周期</title>
<desc id="desc">请求先更新状态，再按需排定traversal；执行时清标记、移除屏障并按状态遍历。 请求不会同步完成布局，也不保证每次新增VSync或每帧完整执行measure/layout/draw。 requestLayout / invalidate
状态变化与按需调度 → scheduleTraversals
排定标记、屏障和回调；scheduleTraversals
排定标记、屏障和回调 → doTraversal
清标记后先移除同步屏障；doTraversal
清标记后先移除同步屏障 → performTraversals
按窗口/脏状态执行所需阶段</desc>
