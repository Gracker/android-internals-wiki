<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">版本化基线与同机交错对照</title>
<desc id="desc">基线绑定构建、状态、工具和协议，在同机block中交错或随机运行基线与候选。 A/B/B/A是控制漂移的示例；它不自动消除所有热、缓存、网络和顺序效应。 版本化合同
SHA、APK、工具、设备与状态 → 同机配对block
A/B/B/A或预定随机顺序；同机配对block
A/B/B/A或预定随机顺序 → 保存两侧原始结果
环境、顺序、缺失与排除；保存两侧原始结果
环境、顺序、缺失与排除 → 先按设备层计算变化
再按预定权重汇总</desc>
