<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">合成调用链跨越多个封装层</title>
<desc id="desc">从SurfaceFlinger组装刷新参数，经CompositionEngine遍历输出，进入策略协商、合成与提交。 这是正常调用关系示意；client合成可选，HWC可提前present，offload等分支需要同帧证据。 SurfaceFlinger
composite组装刷新参数 → CompositionEngine
present遍历outputs；CompositionEngine
present遍历outputs → Output::present
更新状态、规划并准备帧；Output::present
更新状态、规划并准备帧 → Display策略协商
HWComposer获取合成变化；Display策略协商
HWComposer获取合成变化 → Output提交阶段
presentFrame与release；Output提交阶段
presentFrame与release → Display / HWComposer
提交display并取得fences</desc>
