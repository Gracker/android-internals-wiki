<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">观测、机制、干预与复现</title>
<desc id="desc">把时间上的共同出现，逐步推进到机制连接、受控干预和重复验证。 这是结论强度的检查顺序；未完成后续验证时仍保留假设，不写成确定根因。 观测
同窗变化与重叠 → 机制
调用 / 等待 / 资源路径；机制
调用 / 等待 / 资源路径 → 干预
预期中间量与结果变化；干预
预期中间量与结果变化 → 复现
多轮 / 对照 / 已覆盖总体</desc>
