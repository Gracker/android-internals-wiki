<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">正常绘制路径怎样回填TotalTime</title>
<desc id="desc">正常启动跟踪从shell等待进入窗口绘制报告，再将毫秒延迟写回WaitResult并唤醒等待者。 图中是正常跟踪路径；已有顶部Activity、超时或无有效跟踪需另分类，窗口报告不等于光学完成。 shell：start -W
调用startActivityAndWait → ActivityRecord
onWindowsDrawn窗口报告；ActivityRecord
onWindowsDrawn窗口报告 → ActivityMetricsLogger
uptime差 → windowsDrawnDelayMs；ActivityMetricsLogger
uptime差 → windowsDrawnDelayMs → ActivityTaskSupervisor
写WaitResult并notifyAll</desc>
