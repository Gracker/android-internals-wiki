<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Skipped日志是迟到区间的估算</title>
<desc id="desc">在已排定帧的相应分支，用原始帧时刻计算jitter，非零间隔下达到阈值才打印。 默认阈值30不等于设备属性值；日志既不是已提交坏帧计数，也不能独自区分运行与等待。 确认帧已排定与分支
原始frameTime与当前nanoTime → jitter = 当前 − 原始帧时刻
帧间隔非零才做整数除法；jitter = 当前 − 原始帧时刻
帧间隔非零才做整数除法 → skipped = jitter / interval
与实际warning阈值比较；skipped = jitter / interval
与实际warning阈值比较 → 达到阈值打印动态帧数
回到pid/tid与Trace调查迟到</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
