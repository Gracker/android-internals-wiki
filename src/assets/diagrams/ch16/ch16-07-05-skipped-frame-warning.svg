<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">jitter = 当前 − 原始帧时刻</tspan>
<tspan x="890.0" dy="34.0">帧间隔非零才做整数除法</tspan>
</text>
