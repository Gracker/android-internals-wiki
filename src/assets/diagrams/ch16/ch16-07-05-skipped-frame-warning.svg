<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">skipped = jitter / interval</tspan>
<tspan x="890.0" dy="34.0">与实际warning阈值比较</tspan>
</text>
