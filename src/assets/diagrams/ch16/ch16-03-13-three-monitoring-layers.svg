<text x="985.0" y="94.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">分析层</tspan>
<tspan x="985.0" dy="34.0">聚合信号与可用证据</tspan>
<tspan x="985.0" dy="34.0">告警 / 分群 / 样本回查</tspan>
</text>
