<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">信号、证据与分析的分工</title>
<desc id="desc">轻量信号记录事件，有限证据解释异常，分析层负责分母、分群与版本比较。 信号来源要区分系统、库启发式和业务规则；聚合曲线不能独自恢复完整现场。 按需触发有限的异常证据采集，不要求每个信号采重型证据；证据层
有界上下文、栈和trace → 分析层
权重、分布、告警与样本回查；基线信号也可以直接进入分析层，不经过重型证据采集</desc>
