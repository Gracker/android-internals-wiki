<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从帧关联到显示栈归因</title>
<desc id="desc">先关联目标Layer的SurfaceFrame与DisplayFrame，再把jank分类落实到同帧阶段证据。 SF Actual不等于线程持续占CPU；PredictionError也需区分，分类与颜色不能独自证明代码所有者。 目标Layer与应用帧
actual / expected / token → 关联SF DisplayFrame
同display的合成输入；关联SF DisplayFrame
同display的合成输入 → 核对分类和预测
CPU / GPU / HAL / prediction；核对分类和预测
CPU / GPU / HAL / prediction → 补同帧执行与等待证据
commit / composite / fence</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
