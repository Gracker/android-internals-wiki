<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">XML的CQ声明与组件参数</title>
<desc id="desc">静态声明与组件实际启用的 CQ 参数需要一起核对。 XML 写有 CQ 不足以证明特定录制配置可用。 静态 XML
VBR / CQ / quality0..100 → apv_software_codec_cq flag
控制 C2 bitrate-mode 参数；apv_software_codec_cq flag
控制 C2 bitrate-mode 参数 → 实际 EncoderCapabilities
查 CQ 与 quality range；实际 EncoderCapabilities
查 CQ 与 quality range → 真实 configure / prepare
验证所选模式与格式</desc>
