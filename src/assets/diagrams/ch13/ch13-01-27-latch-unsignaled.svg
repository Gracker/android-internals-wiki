<title id="title">latch 未完成 buffer 的条件与限制</title>
<desc id="desc">固定 r1 允许在受限条件下先采纳未 signal 的 buffer。 AutoSingleLayer 还检查 first transaction、非 early 配置与简单 buffer update；读取方仍遵守 fence。 按该条件分支处理；按该条件分支处理；先latch未完成buffer后，真正读取仍须遵守acquire fence</desc>
