<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">四条内容路径的责任交接</title>
<desc id="desc">从输出对象识别 runtime 接收内容的边界。 保留原概念文本；图是职责示意，未承诺固定进程或 GPU 完成顺序。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="570" fill="white"/>
<path d="M 79 55 Q 312.5 54.7 546 55 Q 550 55 550 59 L 550 196 Q 550 200 546 200 Q 312.5 200.7 79 200 Q 75 200 75 196 L 75 59 Q 75 55 79 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="312.5" y="119.0" text-anchor="middle" style="font-size:25px">
<tspan x="312.5" dy="0">2D UI → HWUI / Surface</tspan>
<tspan x="312.5" dy="34.0">→ XR 场景与显示</tspan>
</text>
<path d="M 654 55 Q 887.5 54.7 1121 55 Q 1125 55 1125 59 L 1125 196 Q 1125 200 1121 200 Q 887.5 200.4 654 200 Q 650 200 650 196 L 650 59 Q 650 55 654 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="887.5" y="119.0" text-anchor="middle" style="font-size:25px">
<tspan x="887.5" dy="0">状态 → Subspace / SceneCore</tspan>
<tspan x="887.5" dy="34.0">→ 资源与 XR 场景</tspan>
</text>
<path d="M 79 275 Q 312.5 275.5 546 275 Q 550 275 550 279 L 550 416 Q 550 420 546 420 Q 312.5 419.8 79 420 Q 75 420 75 416 L 75 279 Q 75 275 79 275" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="312.5" y="339.0" text-anchor="middle" style="font-size:25px">
<tspan x="312.5" dy="0">引擎 → OpenXR swapchain</tspan>
<tspan x="312.5" dy="34.0">→ xrEndFrame / runtime</tspan>
</text>
<path d="M 654 275 Q 887.5 274.4 1121 275 Q 1125 275 1125 279 L 1125 416 Q 1125 420 1121 420 Q 887.5 419.7 654 420 Q 650 420 650 416 L 650 279 Q 650 275 654 275" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="887.5" y="339.0" text-anchor="middle" style="font-size:25px">
<tspan x="887.5" dy="0">Host Activity → projected 链路</tspan>
<tspan x="887.5" dy="34.0">→ glasses 显示 / 输入</tspan>
</text>
<text x="600" y="525" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">职责与依赖示意；实现、能力与版本按正文范围核对</tspan>
</text>
</svg>
