<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">保留内容与丢弃内容的 layout 起点</title>
<desc id="desc">按内容保留需求选择实际旧 layout，渲染后转换到可 present 状态。 允许丢弃时 UNDEFINED 不限首次使用；transfer/compute/MSAA 等要补相应状态与依赖。 Acquire image
遵守 availability 依赖 → 保留：实际 PRESENT layout
丢弃：可依法用 UNDEFINED；保留：实际 PRESENT layout
丢弃：可依法用 UNDEFINED → 附件或其他真实用途
正确 stage / access / layout；附件或其他真实用途
正确 stage / access / layout → PRESENT_SRC_KHR
再按 semaphore 交给 present</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
