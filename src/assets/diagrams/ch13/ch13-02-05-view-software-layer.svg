<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">单个 software layer 如何进入宿主</title>
<desc id="desc">View 子树先栅格化为 Bitmap，再参与宿主硬件帧。 它不单独创建 SurfaceFlinger 可见 Layer；缓存失效时 CPU 与 GPU 成本可能并存。 View 子树
LAYER_TYPE_SOFTWARE → CPU Bitmap 缓存
按失效情况重建；CPU Bitmap 缓存
按失效情况重建 → 宿主 RenderNode
引用 Bitmap 绘制；宿主 RenderNode
引用 Bitmap 绘制 → RT / GPU 采样
写入 App Window buffer；RT / GPU 采样
写入 App Window buffer → SF 看到宿主 Layer
没有单独 software View Layer</desc>
