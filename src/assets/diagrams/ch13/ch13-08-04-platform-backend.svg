<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">普通 Compose 页面复用 HWUI 后端</title>
<desc id="desc">普通硬件加速窗口通过 AndroidComposeView 接入 HWUI 与系统显示链。 此处不包含独立 Surface Producer；queue 可以早于 GPU 完成。 AndroidComposeView
ViewGroup 宿主 → ViewRoot traversal
按需 measure / layout / draw；ViewRoot traversal
按需 measure / layout / draw → Main / HWUI recording
RenderNode 指令与属性；Main / HWUI recording
RenderNode 指令与属性 → RenderThread / GPU
同步、目标与提交；RenderThread / GPU
同步、目标与提交 → BLAST buffer transaction
附生产完成依赖；BLAST buffer transaction
附生产完成依赖 → SF / HWC
合成类型与 present</desc>
