<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ComposeView 的宿主与节点树</title>
<desc id="desc">ComposeView 管理 composition，内部 AndroidComposeView 承载节点树。 普通 LayoutNode 不是独立 Android View；AndroidView 互操作有额外 holder。 外层 Android View 树
父布局与窗口约束 → ComposeView / AbstractComposeView
composition 生命周期；ComposeView / AbstractComposeView
composition 生命周期 → AndroidComposeView : ViewGroup
Owner / ViewRoot 接缝；AndroidComposeView : ViewGroup
Owner / ViewRoot 接缝 → LayoutNode / Modifier 树
Compose 内容与局部 layer</desc>
