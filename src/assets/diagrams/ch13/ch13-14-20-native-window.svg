<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Java Surface 进入 Dawn 的位置</title>
<desc id="desc">Surface 经 helper 转为 ANativeWindow，再创建 Dawn surface。 ANativeWindow 是窗口交界，不是 GPU image 或最后显示时刻。 Android Java Surface
由窗口生命周期提供 → windowFromSurface
取得 ANativeWindow 指针；windowFromSurface
取得 ANativeWindow 指针 → Android native-window source
创建 GPUSurface；Android native-window source
创建 GPUSurface → Dawn backend WSI
Vulkan / EGL 对接窗口</desc>
