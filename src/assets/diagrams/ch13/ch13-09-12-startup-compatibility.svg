<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">启动 API 按 provider 能力选择分支</title>
<desc id="desc">兼容库按 V2、V1 与旧 provider fallback 分流。 callback 与诊断能力随分支不同；不能承诺每台设备取得相同预热收益或诊断数据。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
