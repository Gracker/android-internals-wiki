<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 59.2 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 179.6 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">Standard 基线</tspan>
<tspan x="310.0" dy="34.0">保存所有原始配置</tspan>
</text>
<path d="M 679 60 Q 890.0 59.6 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.8 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">只切 Game Mode</tspan>
<tspan x="890.0" dy="34.0">记录内部 FPS / quality</tspan>
</text>
<path d="M 679 340 Q 890.0 340.1 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.5 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">恢复基线，仅改 intervention</tspan>
<tspan x="890.0" dy="34.0">核对重启与游戏声明</tspan>
</text>
<path d="M 99 340 Q 310.0 339.7 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.0 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">恢复基线，单独开 OEM 面板</tspan>
<tspan x="310.0" dy="34.0">对比并恢复原始设置</tspan>
</text>
</svg>
