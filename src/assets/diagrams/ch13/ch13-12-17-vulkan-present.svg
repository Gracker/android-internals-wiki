<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Vulkan present 把写完成 fence 交给下游</title>
<desc id="desc">wait semaphores 被转换为 buffer 的下游读取依赖。 release-image fence 在这里表示生产完成，不是显示端释放旧图。 GPU work + wait semaphores
建立 render-to-present 依赖 → QueueSignalReleaseImage
取得 sync fd；QueueSignalReleaseImage
取得 sync fd → queueBuffer
buffer + 写完成 fence；queueBuffer
buffer + 写完成 fence → BLAST → buffer transaction
后续 SF / display 读取</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
