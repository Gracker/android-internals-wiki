<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ImageReader 外部纹理的 CPU fence 等待</title>
<desc id="desc">ImageReader producer 在 API33+ 的取图路径可进入 Java SyncFence 等待。 API29–32 缺少同一 Java API；CPU 等待只描述固定 backing，不能外推全部 external texture。 Image available / queue
请求 engine 更新 → Raster Paint / ProcessFrame
JNI acquireLatestImage；Raster Paint / ProcessFrame
JNI acquireLatestImage → Java dequeueImage
API33+ fence wait；Java dequeueImage
API33+ fence wait → getFence / awaitForever
可能阻塞当前调用链；getFence / awaitForever
可能阻塞当前调用链 → 取得 HardwareBuffer
Vulkan 导入与布局依赖；取得 HardwareBuffer
Vulkan 导入与布局依赖 → 采样进 Flutter root
继续输出与显示依赖</desc>
