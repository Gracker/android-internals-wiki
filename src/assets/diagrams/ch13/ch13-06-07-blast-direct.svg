<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">BLAST 队列与直接 buffer 提交的汇合点</title>
<desc id="desc">BLAST 管队列消费，直接路径由应用管理 buffer 池。 两条路径汇入 transaction；创建 child 不接管原 window 的队列。 按各自路径推进；两行不表示必然同帧；按各自路径推进；两行不表示必然同帧；按各自路径推进；两行不表示必然同帧；按各自路径推进；两行不表示必然同帧</desc>
