<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">整窗口软件绘制仍有显示下游</title>
<desc id="desc">关闭窗口硬件加速后，ViewRoot 用 CPU Canvas 生成窗口 buffer。 Choreographer 和 BufferQueue/SF/HWC 仍可能参与；没有 RT slice 单独不能定案。 ViewRoot / Choreographer
组织本帧遍历 → Surface.lockCanvas
取得 CPU 可绘制 Canvas；Surface.lockCanvas
取得 CPU 可绘制 Canvas → View.draw
调用线程生成窗口像素；View.draw
调用线程生成窗口像素 → unlockCanvasAndPost
把 buffer 交给 Consumer；unlockCanvasAndPost
把 buffer 交给 Consumer → 目标 Layer / SF / HWC
继续合成与 present</desc>
