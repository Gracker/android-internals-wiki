<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">NDK 与 Java VSync 的汇合</title>
<desc id="desc">VSync 入口按符号选择，再汇合到同一 UI task runner 调度。 NDK target 是 frame start 加刷新周期的估计；不是 SF token 或 display 完成。 NDK符号可用；NDK不可用时Java回退；NDK callback汇合；JNI callback汇合</desc>
