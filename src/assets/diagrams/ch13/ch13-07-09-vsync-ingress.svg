<tspan x="600.0" dy="0">AwaitVSync</tspan>
<tspan x="600.0" dy="34.0">检查 NDK Choreographer 符号</tspan>
</text>
<path d="M 99 255 Q 310.0 254.8 521 255 Q 525 255 525 259 L 525 366 Q 525 370 521 370 Q 310.0 369.6 99 370 Q 95 370 95 366 L 95 259 Q 95 255 99 255" fill="white" stroke="#4A90D9" stroke-width="3"/>
