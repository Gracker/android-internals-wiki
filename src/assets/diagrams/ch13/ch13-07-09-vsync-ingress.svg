<text x="890.0" y="304.0" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">否则：platform task runner</tspan>
<tspan x="890.0" dy="34.0">Java Choreographer / JNI</tspan>
</text>
