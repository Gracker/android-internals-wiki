<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从目标 Surface 反查 Producer</title>
<desc id="desc">先固定输出对象，再用绑定、提交与帧标识关联执行者。 GLThread 或 Render 等线程名只是线索，多个 context / Surface 要分别核对。 Layer tree / display
锁定主体画面对象 → Surface / ANativeWindow
确认队列和 Consumer；Surface / ANativeWindow
确认队列和 Consumer → eglMakeCurrent / swap
对应线程与 context；eglMakeCurrent / swap
对应线程与 context → frame number / fence / token
追踪这一帧的后段</desc>
