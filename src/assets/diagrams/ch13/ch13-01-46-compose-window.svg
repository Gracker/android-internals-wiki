<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Compose 阶段仍接入宿主 HWUI 窗口</title>
<desc id="desc">Compose 组织 UI 内容，宿主窗口继续走标准 HWUI 显示链。 阶段可跳过或交错；图不表示每帧完整重做，也不允许普通测量任意反复 measure。 Composition
创建或更新 UI 描述 → Layout
测量与放置节点；Layout
测量与放置节点 → Drawing
向 Canvas 记录绘制；Drawing
向 Canvas 记录绘制 → Android owner / HWUI
进入宿主 RenderNode；Android owner / HWUI
进入宿主 RenderNode → RenderThread / GPU
生产 App Window buffer；RenderThread / GPU
生产 App Window buffer → BLAST → SF → HWC
合成与 present</desc>
