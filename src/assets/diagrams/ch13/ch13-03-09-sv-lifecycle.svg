<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">SurfaceHolder 有效期约束 Producer</title>
<desc id="desc">Producer 使用当前 Surface 的有效期由 created/destroyed 回调限定。 Activity 可见、View attach 与 Surface 有效是三个状态；销毁回调返回前停止旧目标访问。 surfaceCreated
连接当前目标 → surfaceChanged
更新 format / size；surfaceChanged
更新 format / size → Producer 持续生产
仅使用有效 Surface；Producer 持续生产
仅使用有效 Surface → surfaceDestroyed
请求停止并等待 idle；surfaceDestroyed
请求停止并等待 idle → 回调返回
不再访问旧 native window</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
