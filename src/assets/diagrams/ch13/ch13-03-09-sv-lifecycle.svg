<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">surfaceChanged</tspan>
<tspan x="600.0" dy="34.0">更新 format / size</tspan>
</text>
<path d="M 839 60 Q 985.0 60.5 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.3 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">Producer 持续生产</tspan>
<tspan x="985.0" dy="34.0">仅使用有效 Surface</tspan>
</text>
<path d="M 839 340 Q 985.0 340.8 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.6 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">surfaceDestroyed</tspan>
<tspan x="985.0" dy="34.0">请求停止并等待 idle</tspan>
</text>
<path d="M 454 340 Q 600.0 339.6 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.3 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
