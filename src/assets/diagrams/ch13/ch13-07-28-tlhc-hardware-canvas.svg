<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">TLHC 中间 target 的生产过程</title>
<desc id="desc">Android 子树被投影到 target Surface，再供 Flutter Raster 采样。 TLHC 仍需 Android traversal；它不等于把 Android View 变成 Dart Widget 或直接 SF Layer。 Android View subtree
触发 wrapper 绘制 → target.getSurface
取得当前有效 Surface；target.getSurface
取得当前有效 Surface → lockHardwareCanvas
clear + super.draw 子树；lockHardwareCanvas
clear + super.draw 子树 → scheduleFrame / unlockPost
生产中间 image；scheduleFrame / unlockPost
生产中间 image → Flutter Raster 采样 texture
与 Flutter 内容一起绘制；Flutter Raster 采样 texture
与 Flutter 内容一起绘制 → root target 输出
继续窗口或独立 Layer</desc>
