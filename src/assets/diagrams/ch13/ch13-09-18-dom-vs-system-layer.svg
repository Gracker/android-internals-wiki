<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">DOM layer 与系统显示 Layer</title>
<desc id="desc">网页的内部层与资源通常已合进宿主 target，再由一个窗口 layer 交给系统。 DOM/CSS layer 不逐项映射 SF Layer；可选 overlay 候选才可能另有系统内容 layer。 DOM / CSS / canvas / image
Chromium 内部内容表示 → compositor frame / resources
内部层与 tile 准备；compositor frame / resources
内部层与 tile 准备 → DrawFn → 宿主 HWUI target
与其他 View 合并；DrawFn → 宿主 HWUI target
与其他 View 合并 → App Window / SF Layer
HWC 看到窗口级内容</desc>
