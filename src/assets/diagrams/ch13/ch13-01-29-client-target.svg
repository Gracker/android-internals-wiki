<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">CLIENT 合成如何交给 HWC</title>
<desc id="desc">RenderEngine 将 CLIENT 内容合成到 client target 后再交给 HWC。 CLIENT 与 DEVICE 可共同组成输出，client target 自带 acquire fence。 协商得到 CLIENT 内容
按 display 组织输出 → RenderEngine GPU 合成
生成 client target；RenderEngine GPU 合成
生成 client target → setClientTarget
buffer + acquire fence；setClientTarget
buffer + acquire fence → HWC present
与 DEVICE 内容一起输出</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
