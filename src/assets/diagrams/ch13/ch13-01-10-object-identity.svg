</text>
<path d="M 839 340 Q 985.0 339.6 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.8 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
