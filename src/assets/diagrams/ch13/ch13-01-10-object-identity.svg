<title id="title">对象、线程与帧标识如何对齐</title>
<desc id="desc">先把应用、图层和帧记录对应到同一条显示路径。 PID、Layer、token 与 frame number 各有作用域，不能互换。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
