<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">Vulkan 上传线程与调用方的同步等待</title>
<desc id="desc">upload thread 的同步 GPU submit 完成后，runSync 才让调用方返回。 单独 queue 不代表调用异步；主线程同步创建大图仍可能被阻塞，条长非实测。 调用方 uploadHardwareBitmap
提交 runSync task → UploadThread queue 1
TextureFromAHBWithData + submit；UploadThread queue 1
TextureFromAHBWithData + submit → 调用方取得结果
runSync 完成后返回</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="830" fill="white"/>
<path d="M 365 120.0 L 450 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.9 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.9 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">调用方申请上传</tspan>
<tspan x="215.0" dy="34.0">提交 runSync task</tspan>
</text>
<path d="M 454 60 Q 600.0 60.5 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.2 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">上传任务 / queue 1</tspan>
<tspan x="600.0" dy="34.0">记录数据传输并 submit</tspan>
</text>
<path d="M 839 60 Q 985.0 59.4 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.9 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">调用方取得结果</tspan>
<tspan x="985.0" dy="34.0">runSync 完成后返回</tspan>
</text>
<text x="206" y="543" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">Caller</tspan>
</text>
<path d="M 220 559 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 224 520 Q 300.0 519.6 376 520 Q 380 520 380 524 L 380 553 Q 380 557 376 557 Q 300.0 557.6 224 557 Q 220 557 220 553 L 220 524 Q 220 520 224 520" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="300.0" y="546" text-anchor="middle" style="font-size:21px">
<tspan x="300.0" dy="0">调用</tspan>
</text>
<path d="M 394 520 Q 640.0 520.5 886 520 Q 890 520 890 524 L 890 553 Q 890 557 886 557 Q 640.0 556.2 394 557 Q 390 557 390 553 L 390 524 Q 390 520 394 520" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="640.0" y="546" text-anchor="middle" style="font-size:21px">
<tspan x="640.0" dy="0">runSync 等待</tspan>
</text>
<path d="M 914 520 Q 995.0 519.8 1076 520 Q 1080 520 1080 524 L 1080 553 Q 1080 557 1076 557 Q 995.0 556.9 914 557 Q 910 557 910 553 L 910 524 Q 910 520 914 520" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="995.0" y="546" text-anchor="middle" style="font-size:21px">
<tspan x="995.0" dy="0">返回</tspan>
</text>
<text x="206" y="623" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">UploadThread</tspan>
</text>
<path d="M 220 639 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 404 600 Q 635.0 600.0 866 600 Q 870 600 870 604 L 870 633 Q 870 637 866 637 Q 635.0 636.5 404 637 Q 400 637 400 633 L 400 604 Q 400 600 404 600" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="635.0" y="626" text-anchor="middle" style="font-size:21px">
<tspan x="635.0" dy="0">上传 / submit + CPU wait</tspan>
</text>
<text x="206" y="703" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">GPU queue 1</tspan>
</text>
<path d="M 220 719 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 549 680 Q 695.0 680.6 841 680 Q 845 680 845 684 L 845 713 Q 845 717 841 717 Q 695.0 716.3 549 717 Q 545 717 545 713 L 545 684 Q 545 680 549 680" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="695.0" y="706" text-anchor="middle" style="font-size:21px">
<tspan x="695.0" dy="0">transfer → complete</tspan>
</text>
</svg>
