<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">受保护内容不能用普通非保护路径兜底</title>
<desc id="desc">受保护输入需要匹配的消费和输出能力。 普通非保护 RenderEngine fallback 不能绕过这些约束；具体失败由设备实现取证。 保护用途 / secure flag
分别记录实际输入属性 → 受保护 GPU / display 能力
核对目标设备和 display；受保护 GPU / display 能力
核对目标设备和 display → Composer 结果与可见输出
确认接受、限制或失败</desc>
