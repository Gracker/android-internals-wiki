<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">先找目标 Layer / token</tspan>
<tspan x="310.0" dy="34.0">确认 FrameTimeline 覆盖</tspan>
</text>
