<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">FrameTimeline 缺失时回到哪条证据链</title>
<desc id="desc">目标 Layer 没有完整 App 时间线时，沿 Producer 到显示输出补证。 没有 slice 不是没有工作；独立 Camera、视频、游戏的覆盖取决于实际接入。 先找目标 Layer / token
确认 FrameTimeline 覆盖 → Producer queue / frame
记录输出与节奏；Producer queue / frame
记录输出与节奏 → buffer / transaction / fence
联系 SF readiness 与 latch；buffer / transaction / fence
联系 SF readiness 与 latch → HWC / present timing
建立显示栈结束边界</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
