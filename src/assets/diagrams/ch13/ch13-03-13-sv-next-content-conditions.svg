<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">内容帧事务的三个时机分支</title>
<desc id="desc">内容帧绑定需确认是否停帧、持续生产或没有后续内容。 目标已被 BLAST acquire 时也可直接 apply；不能推导每次都要等新 queue。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 600 180 L 600 255 L 215 255 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 255 L 985 255 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 60.7 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.1 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">绑定 SurfaceView 内容帧</tspan>
<tspan x="600.0" dy="32.64">确认调用与生产时机</tspan>
</text>
<path d="M 69 340 Q 215.0 339.8 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.0 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">调用前暂停渲染</tspan>
<tspan x="215.0" dy="34.0">明确绑定调用后下一帧</tspan>
</text>
<path d="M 454 340 Q 600.0 340.5 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.4 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">持续渲染</tspan>
<tspan x="600.0" dy="34.0">对应哪一帧未定义</tspan>
</text>
<path d="M 839 340 Q 985.0 340.4 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.5 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">调用后无新内容</tspan>
<tspan x="985.0" dy="34.0">事务可能不应用</tspan>
</text>
</svg>
