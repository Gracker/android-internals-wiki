<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">默认时间戳按输出目标选择</title>
<desc id="desc">SurfaceView、SurfaceTexture、编码与其他输出采用不同时间戳策略。 策略选择不保证图像时间仍等于原曝光值。 按目标分别选择；不代表每次全部执行；按目标分别选择；不代表每次全部执行；按目标分别选择；不代表每次全部执行；按目标分别选择；不代表每次全部执行</desc>
