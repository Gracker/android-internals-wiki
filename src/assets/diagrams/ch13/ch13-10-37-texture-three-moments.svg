<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">TextureView 的通知、记录与取图</title>
<desc id="desc">回调、Main 记录、RT 取图和 GPU 读取按各自边界取证。 Java 调用栈不必出现 updateTexImage，native 路径仍可取图。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
