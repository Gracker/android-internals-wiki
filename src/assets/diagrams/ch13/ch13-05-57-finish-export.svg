<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HWUI 正常 finishFrame 的完成依赖导出</title>
<desc id="desc">窗口 submit 的 exportable semaphore 导出 sync fd，queue 后成为 acquire 依赖。 presentCurrentBuffer 只表示交出 buffer；fd 可未 signal，不能把名称当成显示已完成。 Skia draw / flush
附 exportable signal semaphore → submit + frame annotation
CPU 不必等待整帧完成；submit + frame annotation
CPU 不必等待整帧完成 → vkGetSemaphoreFdKHR
取得写入完成 sync fd；vkGetSemaphoreFdKHR
取得写入完成 sync fd → presentCurrentBuffer / queue
Consumer 读取前遵守 acquire</desc>
