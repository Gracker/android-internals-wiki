<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HCPP 借用 transaction 的实际 apply 时机</title>
<desc id="desc">native 填入 buffer 和回调，Java 再把借用事务与宿主绘制同步。 native SurfaceTransaction.Apply 对借用 Java transaction 不直接调用 NDK apply；GPU 仍可未完成。 Java 创建 pending TX
JNI 借给 native → SetContents
AHB + Producer 完成 fence；SetContents
AHB + Producer 完成 fence → native Apply
仅注册 completion callback；native Apply
仅注册 completion callback → swapTransactions
pending 移入 active；swapTransactions
pending 移入 active → onEndFrame
invalidate + applyOnDraw；onEndFrame
invalidate + applyOnDraw → 宿主绘制后提交状态
再追 SF / present / release</desc>
