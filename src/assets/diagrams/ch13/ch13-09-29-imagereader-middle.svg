<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ImageReader 是中间消费边界</title>
<desc id="desc">reader 从 Surface 接收 image，异步取得 buffer 与完成依赖供下游消费。 标准 provider 也使用它；acquire 返回不等于 GPU 完成，也不代表 CPU 图像复制。 decoder / 其他 Producer
写入 reader 的 Surface → AImageReader / usage
private format 与 mode；AImageReader / usage
private format 与 mode → next / latest async acquire
得到 image + fence；next / latest async acquire
得到 image + fence → AHardwareBuffer 引用
保留写入完成依赖；AHardwareBuffer 引用
保留写入完成依赖 → Chromium sampling 或 overlay
追最终消费对象</desc>
