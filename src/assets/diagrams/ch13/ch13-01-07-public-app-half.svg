<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">公共检查点：应用生产与提交</title>
<desc id="desc">把应用调度、UI 同步与 buffer 生产放到同一组坐标中。 这是观察坐标，异步工作可以重叠；非 HWUI 路径可替换节点。 vsync-app
计划应用帧事件 → doFrame
组织帧回调；doFrame
组织帧回调 → syncAndDrawFrame
UI 与 RT 状态同步；syncAndDrawFrame
UI 与 RT 状态同步 → dequeueBuffer
候选 slot 与 release fence；dequeueBuffer
候选 slot 与 release fence → GPU submit
提交异步图形工作；GPU submit
提交异步图形工作 → queueBuffer
交回 buffer 与完成 fence</desc>
