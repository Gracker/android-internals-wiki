<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">buffer 配置、分配与排队延迟</title>
<desc id="desc">配置扩大容纳能力，实际分配和积压还要看运行状态。 不能把容量变大直接当成所有 buffer 已分配或输入延迟必然增加。 配置数量 / 模式
max dequeued / acquired 等 → 实际分配与使用
按需求和生命周期变化；实际分配与使用
按需求和生命周期变化 → 在途与排队数量
决定当前背压和潜在延迟</desc>
