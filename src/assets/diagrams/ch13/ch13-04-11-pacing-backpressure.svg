<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">Producer 过量提交</tspan>
<tspan x="310.0" dy="34.0">早采样多帧输入</tspan>
</text>
<path d="M 679 60 Q 890.0 60.7 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.4 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">队列 / in-flight 增多</tspan>
<tspan x="890.0" dy="34.0">等待后续显示与释放</tspan>
</text>
<path d="M 679 340 Q 890.0 339.6 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.3 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">swap / dequeue 背压</tspan>
<tspan x="890.0" dy="34.0">调用线程周期性等待</tspan>
</text>
<path d="M 99 340 Q 310.0 339.8 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.1 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">输入到 present 变长</tspan>
<tspan x="310.0" dy="34.0">即使显示 FPS 仍稳定</tspan>
</text>
