</text>
<path d="M 454 340 Q 600.0 339.6 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.6 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
