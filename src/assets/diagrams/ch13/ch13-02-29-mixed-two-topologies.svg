<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">宿主采样与独立 Layer 两种拓扑</title>
<desc id="desc">Texture 输入先成为宿主像素，独立 Surface 保留自己的输出 Layer。 这里以硬件加速 TextureView 宿主为前提，具体拓扑以现场对象确认。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
