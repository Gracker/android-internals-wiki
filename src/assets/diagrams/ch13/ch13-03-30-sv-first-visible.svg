<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从 Surface 创建到首次可见的不同门槛</title>
<desc id="desc">分别测量创建、连接、首 buffer、采纳和实际输出。 surfaceCreated 不保证已有像素；销毁重建后旧 EGLSurface 不能继续当新目标使用。 bounds / SurfaceControl
创建队列与当前 Surface → SurfaceHolder callback
Producer 连接目标；SurfaceHolder callback
Producer 连接目标 → 第一块主体 buffer
queue / 事务到达；第一块主体 buffer
queue / 事务到达 → SF 状态与 buffer 采纳
不等于内容已读完；SF 状态与 buffer 采纳
不等于内容已读完 → 读取前满足 acquire
可见 Layer 进入 present</desc>
