<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ANGLE APK 设置与真正库加载</title>
<desc id="desc">Java 先组织 APK 或 system ANGLE 配置，Loader 才装入拆分实现库。 APK 设置失败可试 system；已要求 ANGLE 却未装入实现时固定 r1 可 fatal，不能承诺 native 回退。 setupAngleFromApk未成功时才尝试systemANGLE；APK 设置失败时
尝试配置 system ANGLE → Loader namespace / system 库
EGL + GLESv1_CM + GLESv2；Loader namespace / system 库
EGL + GLESv1_CM + GLESv2 → 检查装入与当前 context
失败处理有 fatal 边界；APK配置成功时直接进入后续Loader加载</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 525 120.0 L 675 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 665 114.0 L 675 120.0 L 665 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 310 180 L 310 250 L 890 250 L 890 340" stroke="#202020" stroke-width="2.8" fill="none" stroke-dasharray="7 6"/>
<path d="M 884 330 L 890 340 L 896 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 60.4 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 180.0 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">setupAngle 请求 ANGLE</tspan>
<tspan x="310.0" dy="34.0">选择允许的 debug / system APK</tspan>
</text>
<path d="M 679 60 Q 890.0 59.9 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 180.0 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">APK 设置失败时</tspan>
<tspan x="890.0" dy="34.0">尝试配置 system ANGLE</tspan>
</text>
<path d="M 679 340 Q 890.0 340.5 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.3 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">Loader namespace / system 库</tspan>
<tspan x="890.0" dy="34.0">EGL + GLESv1_CM + GLESv2</tspan>
</text>
<path d="M 99 340 Q 310.0 339.9 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.7 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">检查装入与当前 context</tspan>
<tspan x="310.0" dy="34.0">失败处理有 fatal 边界</tspan>
</text>
<rect x="557.5" y="85.0" width="85.0" height="36.3" fill="white"/>
<text x="600" y="110" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">未成功</tspan>
</text>
<rect x="420.0" y="225.0" width="160.0" height="36.3" fill="white"/>
<text x="500" y="250" text-anchor="middle" style="font-size:23px">
<tspan x="500" dy="0">APK 设置成功</tspan>
</text>
</svg>
