<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从完整 dump 识别内容层再看合成类型</title>
<desc id="desc">先利用层级和 buffer 属性确认 BLAST child，再看当时的合成类型。 一次 dump 是采样快照；动态回退要用同一显示帧的整屏证据。 设备端保存完整 dump
引用让重定向留在设备 → adb pull 到主机
检查完整输出；adb pull 到主机
检查完整输出 → parent / child / Layer id
加尺寸与 dataspace；parent / child / Layer id
加尺寸与 dataspace → 找到目标 BLAST child
读取本次 composition type</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 525 120.0 L 675 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 665 114.0 L 675 120.0 L 665 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 60.4 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 179.2 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">设备端保存完整 dump</tspan>
<tspan x="310.0" dy="34.0">引用让重定向留在设备</tspan>
</text>
<path d="M 679 60 Q 890.0 59.7 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 180.8 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">adb pull 到主机</tspan>
<tspan x="890.0" dy="34.0">检查完整输出</tspan>
</text>
<path d="M 679 340 Q 890.0 340.6 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.2 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">parent / child / Layer id</tspan>
<tspan x="890.0" dy="34.0">加尺寸与 dataspace</tspan>
</text>
<path d="M 99 340 Q 310.0 340.3 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.1 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">找到目标 BLAST child</tspan>
<tspan x="310.0" dy="34.0">读取本次 composition type</tspan>
</text>
