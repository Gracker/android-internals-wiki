<title id="title">CONTROL_ENABLE_ZSL 的能力边界</title>
<desc id="desc">key 可用且 STILL_CAPTURE 时，设备可以选择历史图像。 设为 true 并不保证选历史图，也不能证明 App reprocess。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
