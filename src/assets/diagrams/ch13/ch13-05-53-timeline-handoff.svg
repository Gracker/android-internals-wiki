<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HWUI FrameTimeline 元数据在 queue 前设置</title>
<desc id="desc">CanvasContext 取得有效 vsyncId 后组织窗口时间线信息，再经 pipeline 交给 native window。 无有效 vsyncId 或无相应 render target 时有条件分支，不能假定每次 draw 都产生完整时间线。 FrameInfo / 平台 vsyncId
确认有效且有 render target → ANativeWindowFrameTimelineInfo
frameNumber / start / input 等；ANativeWindowFrameTimelineInfo
frameNumber / start / input 等 → pipeline setFrameTimelineInfo
在 swap / queue 前设置；pipeline setFrameTimelineInfo
在 swap / queue 前设置 → BLAST / SF / Perfetto
关联窗口与显示帧</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
