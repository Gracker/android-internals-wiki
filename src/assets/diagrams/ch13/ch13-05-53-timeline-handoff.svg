<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">FrameInfo / 平台 vsyncId</tspan>
<tspan x="310.0" dy="34.0">确认有效且有 render target</tspan>
</text>
