<title id="title">合成策略由内容能力与同屏资源共同决定</title>
<desc id="desc">每个 Layer 的 DEVICE/CLIENT 结果由目标 display 实际协商。 CPU/GPU Producer、YUV 或 SurfaceView 名称都不保证获得 overlay plane，成本也不随数量线性增长。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
