<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">命令提交与 acquire fence 完成</title>
<desc id="desc">Producer 提交命令与 buffer 时附上写入完成信号。 queue 返回可能受背压影响；提交时 GPU 不必已经完成。 取得 slot + release fence
保证写入依赖 → HWUI 提交 GPU 工作
CPU 与 GPU 异步；HWUI 提交 GPU 工作
CPU 与 GPU 异步 → queueBuffer + 写完成 fence
Consumer 侧称 acquire fence；queueBuffer + 写完成 fence
Consumer 侧称 acquire fence → Consumer 读取 buffer
必须遵守写入完成信号</desc>
