<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">AcquireImageANDROID</tspan>
<tspan x="890.0" dy="34.0">接入 semaphore / fence</tspan>
</text>
