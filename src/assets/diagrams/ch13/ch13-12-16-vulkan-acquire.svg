<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">dequeueBuffer</tspan>
<tspan x="310.0" dy="34.0">取得 native buffer + fd</tspan>
</text>
<path d="M 679 60 Q 890.0 60.7 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 180.3 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
