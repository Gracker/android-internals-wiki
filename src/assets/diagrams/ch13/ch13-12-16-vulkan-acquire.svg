<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Vulkan acquire 接入旧图释放依赖</title>
<desc id="desc">普通 swapchain 把 dequeue fence 导入 acquire 同步对象。 shared 模式不每帧 dequeue；拿到 image index 后仍须满足访问同步。 dequeueBuffer
取得 native buffer + fd → 匹配 swapchain image
保存并复制 fence fd；匹配 swapchain image
保存并复制 fence fd → AcquireImageANDROID
接入 semaphore / fence；AcquireImageANDROID
接入 semaphore / fence → 应用安全写入 image
遵守 acquire 依赖</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
