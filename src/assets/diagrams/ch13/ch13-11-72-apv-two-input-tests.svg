<tspan x="600.0" dy="0">基础查询通过后</tspan>
<tspan x="600.0" dy="34.0">仍需真实编码与文件校验</tspan>
</text>
<path d="M 99 340 Q 310.0 339.4 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.3 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="374.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">Surface 输入</tspan>
<tspan x="310.0" dy="34.0">configure → createInputSurface</tspan>
<tspan x="310.0" dy="34.0">Camera 等 Producer 供帧</tspan>
</text>
<path d="M 679 340 Q 890.0 340.7 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.4 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
