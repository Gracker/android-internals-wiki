<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">SurfaceTexture 的生产端与消费端</title>
<desc id="desc">SDK 向 Surface 或 ANativeWindow 生产，SurfaceTexture 接收供宿主消费。 SurfaceTexture 本身是消费端，方法名或中间对象不能独立识别 SDK 与最终显示路径。 SDK renderer / decoder
内容 Producer → Surface / ANativeWindow
写入端入口；Surface / ANativeWindow
写入端入口 → SurfaceTexture / queue
接收图像的 Consumer；SurfaceTexture / queue
接收图像的 Consumer → frame available / invalidation
请求宿主更新；frame available / invalidation
请求宿主更新 → 宿主 HWUI 取图与采样
再生产 App Window</desc>
