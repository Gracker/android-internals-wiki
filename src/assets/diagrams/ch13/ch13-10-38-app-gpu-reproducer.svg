<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">自研 renderer 同时消费与生产</title>
<desc id="desc">App GPU pass 把 Camera 输入转成另一个输出 Surface 的内容。 分别测 Camera 写入、App GPU 与最终输出，不能都算 ISP。 Camera buffer + fence
第一生产端输出 → App 导入并满足读取依赖
中间 consumer；App 导入并满足读取依赖
中间 consumer → 滤镜 / 分割 / AR pass
异步 App GPU 工作；滤镜 / 分割 / AR pass
异步 App GPU 工作 → App 输出 Surface
第二生产端提交；App 输出 Surface
第二生产端提交 → SF / output present
另追目标 Layer</desc>
