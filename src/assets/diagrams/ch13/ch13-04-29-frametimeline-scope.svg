<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.0 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 180.8 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="97.56" text-anchor="middle" style="font-size:22px">
<tspan x="215.0" dy="0">GLSurfaceView 独立 child</tspan>
<tspan x="215.0" dy="29.92">先记录 Producer</tspan>
<tspan x="215.0" dy="29.92">与采集配置</tspan>
</text>
<path d="M 454 60 Q 600.0 59.7 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.4 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="112.52" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">App FrameTimeline</tspan>
<tspan x="600.0" dy="29.92">遵守 SurfaceView 支持限制</tspan>
</text>
