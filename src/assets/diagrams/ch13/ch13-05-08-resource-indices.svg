<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">frame slot 与 image index 的复用范围</title>
<desc id="desc">submit 资源按 frame slot 复用，present 等待信号量需要自己的安全复用证明。 submit fence 不证明 present 已消费 semaphore；按 imageIndex 配置是通用方案之一。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
