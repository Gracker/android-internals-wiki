<title id="title">Java 与 NDK 桥接的两种所有权</title>
<desc id="desc">control 桥接取得强引用，transaction 桥接借用 Java 内部对象。 两者都是同进程桥接；借用 transaction 不能用 NDK delete。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
