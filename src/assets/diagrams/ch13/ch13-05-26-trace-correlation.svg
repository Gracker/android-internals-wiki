<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">逐帧关联 CPU、GPU 与显示</title>
<desc id="desc">先固定 Surface 与 Producer，再以帧、buffer 和 fence 标识连接阶段。 同一时间出现不能单独证明因果，API marker 也不等于 GPU busy 时间。 目标 Surface / Producer tid
锁定输出对象 → acquire / submit / present
记录 image 与帧标识；acquire / submit / present
记录 image 与帧标识 → GPU stages / fence
关联真实异步执行；GPU stages / fence
关联真实异步执行 → SF buffer / composition
接目标 display 的 present</desc>
