<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">GLSurfaceView swap 错误的恢复分支</title>
<desc id="desc">GLSurfaceView 按成功、context lost 与其他错误分别恢复。 原生 EGL 要自行协调窗口变化和资源重建，Activity 存活不保证 Surface 不变。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 600 180 L 600 255 L 215 255 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 255 L 985 255 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 59.3 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.2 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">EglHelper.swap</tspan>
<tspan x="600.0" dy="34.0">返回 EGL 错误码</tspan>
</text>
<path d="M 69 340 Q 215.0 340.3 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.1 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">EGL_SUCCESS</tspan>
<tspan x="215.0" dy="34.0">继续下一轮</tspan>
</text>
<path d="M 454 340 Q 600.0 339.5 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.8 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="377.56" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">EGL_CONTEXT_LOST</tspan>
<tspan x="600.0" dy="29.92">重建 context / surface</tspan>
<tspan x="600.0" dy="29.92">与资源</tspan>
</text>
<path d="M 839 340 Q 985.0 339.6 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.5 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="985.0" y="374.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">其他错误</tspan>
<tspan x="985.0" dy="34.0">标记 bad Surface</tspan>
<tspan x="985.0" dy="34.0">等待生命周期变化</tspan>
</text>
</svg>
