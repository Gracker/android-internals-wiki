<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">宿主 queue 可以先于 GPU 完成</title>
<desc id="desc">宿主 buffer 带完成 fence 交出，消费者读取前满足依赖。 RT 提交工作、queue 返回、GPU 完成、latch 和 present 不能合成一个时间点。 RT 组织宿主 GPU 工作
采样输入并画普通 View → host buffer / 完成 fence
经 BLAST 提交事务；host buffer / 完成 fence
经 BLAST 提交事务 → SF 状态与宿主 buffer 采纳
仍可能沿用旧 H；SF 状态与宿主 buffer 采纳
仍可能沿用旧 H → 真正读取前满足 H acquire
必要 CLIENT / HWC present</desc>
