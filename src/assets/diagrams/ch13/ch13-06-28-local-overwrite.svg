<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">未 apply 覆盖时转交旧 acquire 依赖</title>
<desc id="desc">本地覆盖会安排 release 回调，旧 GPU 工作仍可能继续。 本进程由专用线程派发；条长仅为依赖示意，不是覆盖调用栈同步回调。 未应用状态被本地覆盖；安排回调并传回旧写入依赖</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="690" fill="white"/>
<path d="M 365 105 L 450 105" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 99 L 450 105 L 440 111" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 105 L 835 105" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 99 L 835 105 L 825 111" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 45 Q 215.0 44.2 361 45 Q 365 45 365 49 L 365 161 Q 365 165 361 165 Q 215.0 164.5 69 165 Q 65 165 65 161 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">同一 tx 已有 buffer A</tspan>
<tspan x="215.0" dy="34.0">GPU 写入可 pending</tspan>
</text>
<path d="M 454 45 Q 600.0 44.3 746 45 Q 750 45 750 49 L 750 161 Q 750 165 746 165 Q 600.0 165.4 454 165 Q 450 165 450 161 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="97.52" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">再次 setBuffer B</tspan>
<tspan x="600.0" dy="29.92">releaseBufferIfOverwriting</tspan>
</text>
<path d="M 839 45 Q 985.0 44.7 1131 45 Q 1135 45 1135 49 L 1135 161 Q 1135 165 1131 165 Q 985.0 164.8 839 165 Q 835 165 835 161 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="97.18" text-anchor="middle" style="font-size:23px">
<tspan x="985.0" dy="0">回调 A + 旧 acquire fence</tspan>
<tspan x="985.0" dy="31.28">等依赖后才可重写</tspan>
</text>
<text x="241" y="283" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">GPU 写 A</tspan>
</text>
<path d="M 255 299 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 259 260 Q 530.0 260.2 801 260 Q 805 260 805 264 L 805 293 Q 805 297 801 297 Q 530.0 296.5 259 297 Q 255 297 255 293 L 255 264 Q 255 260 259 260" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="530.0" y="286" text-anchor="middle" style="font-size:21px">
<tspan x="530.0" dy="0">异步写入 → signal</tspan>
</text>
<text x="241" y="373" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">回调派发</tspan>
</text>
<path d="M 255 389 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 479 350 Q 595.0 349.3 711 350 Q 715 350 715 354 L 715 383 Q 715 387 711 387 Q 595.0 386.3 479 387 Q 475 387 475 383 L 475 354 Q 475 350 479 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="595.0" y="376" text-anchor="middle" style="font-size:21px">
<tspan x="595.0" dy="0">未展示就回调</tspan>
</text>
<text x="241" y="463" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">A 可重写前</tspan>
</text>
<path d="M 255 479 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 559 440 Q 720.0 439.4 881 440 Q 885 440 885 444 L 885 473 Q 885 477 881 477 Q 720.0 476.7 559 477 Q 555 477 555 473 L 555 444 Q 555 440 559 440" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="720.0" y="466" text-anchor="middle" style="font-size:21px">
<tspan x="720.0" dy="0">等旧 acquire 完成</tspan>
</text>
</svg>
