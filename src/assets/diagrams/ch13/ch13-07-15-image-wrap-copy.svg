<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">FlutterImageView 的 image 消费</title>
<desc id="desc">API 29+ 包装 HardwareBuffer，旧分支复制像素，两者都仍有宿主绘制成本。 hardware bitmap 包装避免旧 CPU 像素 copy，但不等于省去 acquire、采样与窗口提交。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
