<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">GPU 离屏收益取决于最终 consumer</title>
<desc id="desc">先确认 CPU raster 是瓶颈，再确认结果是否能留在 HardwareBuffer 消费。 如果最终要读回 CPU，传输和同步成本也要计入同内容对照。 CPU raster 是主要成本
目标内容适合 HWUI → HBR 写共享目标
下游可直接 GPU / compositor 消费；HBR 写共享目标
下游可直接 GPU / compositor 消费 → 若需 CPU readback
把等待与复制计入总成本</desc>
