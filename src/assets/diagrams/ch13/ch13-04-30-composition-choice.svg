<title id="title">GLES 已渲染不代表使用 DEVICE 合成</title>
<desc id="desc">SF/HWC 决定合成类型，必要的 CLIENT 会增加 RenderEngine 工作。 DEVICE 不保证独占 overlay plane；alpha、变换、颜色与资源均可能改变策略。 条件共同影响策略；本轮选择DEVICE；本轮选择CLIENT</desc>
