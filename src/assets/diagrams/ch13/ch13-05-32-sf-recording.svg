<tspan x="890.0" dy="0">insertRecording / submit</tspan>
<tspan x="890.0" dy="34.0">异步 GPU 工作</tspan>
</text>
<path d="M 99 340 Q 310.0 339.9 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.8 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">导出输出 sync fd</tspan>
<tspan x="310.0" dy="34.0">后续读取 client target 遵守</tspan>
</text>
