<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Graphite Recording 与 CLIENT 输出 fence</title>
<desc id="desc">Recording 携带 wait/signal semaphore 提交，正常路径导出 sync fd 保护后续读取。 SF 输出依赖与 App submit fence 是不同对象，但可处于同一帧的因果链中。 Recorder snap
取得 Graphite Recording → 附输入 wait / 输出 signal
组织 InsertRecordingInfo；附输入 wait / 输出 signal
组织 InsertRecordingInfo → insertRecording / submit
异步 GPU 工作；insertRecording / submit
异步 GPU 工作 → 导出输出 sync fd
后续读取 client target 遵守</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
