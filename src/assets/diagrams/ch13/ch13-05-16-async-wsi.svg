<tspan x="206" dy="0">GPU</tspan>
</text>
<path d="M 220 639 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 344 600 Q 610.0 600.3 876 600 Q 880 600 880 604 L 880 633 Q 880 637 876 637 Q 610.0 636.6 344 637 Q 340 637 340 633 L 340 604 Q 340 600 344 600" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="610.0" y="626" text-anchor="middle" style="font-size:21px">
<tspan x="610.0" dy="0">asynchronous write → signal</tspan>
</text>
