<text x="335.0" y="546" text-anchor="middle" style="font-size:21px">
<tspan x="335.0" dy="0">submit / present</tspan>
</text>
<path d="M 494 520 Q 620.0 519.9 746 520 Q 750 520 750 524 L 750 553 Q 750 557 746 557 Q 620.0 556.4 494 557 Q 490 557 490 553 L 490 524 Q 490 520 494 520" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="620.0" y="546" text-anchor="middle" style="font-size:21px">
<tspan x="620.0" dy="0">queue / transaction</tspan>
</text>
