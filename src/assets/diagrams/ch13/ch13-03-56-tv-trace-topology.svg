<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">用多项证据确认 TextureView 宿主链路</title>
<desc id="desc">输入端点、应用 HWUI 消费与宿主输出一起证明拓扑。 只有 Camera、EGL 或一个 host Layer 都不足以证明使用 TextureView。 独立输入共同决定输出，不表达三路互相串行；独立输入共同决定输出，不表达三路互相串行；独立输入共同决定输出，不表达三路互相串行</desc>
