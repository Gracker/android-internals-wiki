<text x="215.0" y="97.56" text-anchor="middle" style="font-size:22px">
<tspan x="215.0" dy="0">Producer 目标端点</tspan>
<tspan x="215.0" dy="29.92">SurfaceTexture</tspan>
<tspan x="215.0" dy="29.92">与 Surface 包装</tspan>
</text>
<path d="M 454 60 Q 600.0 59.2 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.6 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">TextureLayer / updater</tspan>
<tspan x="600.0" dy="34.0">RT 实际消费输入</tspan>
</text>
<path d="M 839 60 Q 985.0 59.7 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.3 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">host buffer 含主体像素</tspan>
<tspan x="985.0" dy="34.0">SF 无对应独立内容层</tspan>
</text>
<path d="M 404 360 Q 600.0 360.6 796 360 Q 800 360 800 364 L 800 476 Q 800 480 796 480 Q 600.0 479.5 404 480 Q 400 480 400 476 L 400 364 Q 400 360 404 360" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="411.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">确认 TextureView 宿主采样</tspan>
<tspan x="600.0" dy="34.0">再归因线程与 fence</tspan>
</text>
