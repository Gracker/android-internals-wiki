<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Unity 与系统 trace 如何关联</title>
<desc id="desc">为引擎阶段补系统事件，并用同帧和时钟对齐。 Perfetto 默认采集不保证包含 Unity 内部 marker。 Unity Profiler
定位逻辑 / render marker → 关键阶段 ATrace / event
记录统一 frame id；关键阶段 ATrace / event
记录统一 frame id → Perfetto 系统证据
调度、队列、GPU、SF；Perfetto 系统证据
调度、队列、GPU、SF → 校准时钟与帧标识
联系具体输入和输出</desc>
