<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">peek关闭时首帧为何仍未显示</title>
<desc id="desc">首帧解码完成后仍可等待显式 peek 或音频时钟。 ready 通知不能单独证明新内容已经可见。 左侧条件或职责；右侧条件或职责</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 500 180 L 500 255 L 310 255 L 310 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 330 L 310 340 L 316 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 180 L 700 255 L 890 255 L 890 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 330 L 890 340 L 896 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 60 Q 600.0 60.5 811 60 Q 815 60 815 64 L 815 176 Q 815 180 811 180 Q 600.0 179.3 389 180 Q 385 180 385 176 L 385 64 Q 385 60 389 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">首帧已解码且 ready</tspan>
<tspan x="600.0" dy="34.0">AudioTrack 当前暂停</tspan>
</text>
<path d="M 99 340 Q 310.0 340.3 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 459.8 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">peek=0：保持 held</tspan>
<tspan x="310.0" dy="34.0">继续显示旧内容或黑屏</tspan>
</text>
<path d="M 679 340 Q 890.0 339.9 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.6 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">开启 peek 或音频开始播放</tspan>
<tspan x="890.0" dy="34.0">held frame 进入后续显示</tspan>
</text>
</svg>
