<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">BLAST怎样传递显示时间</title>
<desc id="desc">时间戳由 BufferItem 转成 SF buffer 事务的 desiredPresentTime。 BLAST 不用非零 expectedPresent 来等待目标显示时间。 queueBuffer 显式时间戳
BufferItem.mTimestamp → BLAST acquire
expectedPresent=0；BLAST acquire
expectedPresent=0 → setBuffer + acquire fence
保留写入完成依赖；setBuffer + acquire fence
保留写入完成依赖 → 非自动时间戳
setDesiredPresentTime；非自动时间戳
setDesiredPresentTime → SF 时间线 readiness
比较 expected present；SF 时间线 readiness
比较 expected present → 本轮采纳或继续延后
不凭 acquire 返回判可见</desc>
