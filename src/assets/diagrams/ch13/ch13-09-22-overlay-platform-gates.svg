<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">HWUI 提供 overlay 容器的条件</title>
<desc id="desc">平台先决定本次 draw 能否提供 overlay 接口。 四项是共同前提，不是三条任选分支；Enabled 仍不保证候选最终提升。 必要条件：运行开关；必要条件：context及root；必要条件：当前绘制目标</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="570" fill="white"/>
<path d="M 500 160 L 500 235 L 215 235 L 215 305" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 295 L 215 305 L 221 295" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 160 L 600 305" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 295 L 600 305 L 606 295" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 160 L 700 235 L 985 235 L 985 305" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 295 L 985 305 L 991 295" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 50 Q 600.0 50.8 811 50 Q 815 50 815 54 L 815 156 Q 815 160 811 160 Q 600.0 159.6 389 160 Q 385 160 385 156 L 385 54 Q 385 50 389 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">本轮 draw 是否允许 overlay</tspan>
<tspan x="600.0" dy="34.0">四项条件同时满足</tspan>
</text>
<path d="M 69 305 Q 215.0 305.3 361 305 Q 365 305 365 309 L 365 416 Q 365 420 361 420 Q 215.0 419.2 69 420 Q 65 420 65 416 L 65 309 Q 65 305 69 305" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="354.0" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">运行开关开启</tspan>
<tspan x="215.0" dy="34.0">enableWebViewOverlays</tspan>
</text>
<path d="M 454 305 Q 600.0 304.3 746 305 Q 750 305 750 309 L 750 416 Q 750 420 746 420 Q 600.0 419.8 454 420 Q 450 420 450 416 L 450 309 Q 450 305 454 305" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="354.68" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">有 active CanvasContext</tspan>
<tspan x="600.0" dy="31.28">并有 root SurfaceControl</tspan>
</text>
<path d="M 839 305 Q 985.0 304.8 1131 305 Q 1135 305 1135 309 L 1135 416 Q 1135 420 1131 420 Q 985.0 420.6 839 420 Q 835 420 835 416 L 835 309 Q 835 305 839 305" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="354.0" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">不是 HWUI 离屏 layer</tspan>
<tspan x="985.0" dy="34.0">!isLayer / !is_layer</tspan>
</text>
</svg>
