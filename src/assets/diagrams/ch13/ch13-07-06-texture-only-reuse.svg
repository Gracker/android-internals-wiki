<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">External texture 更新可复用已有 layer tree</title>
<desc id="desc">需要更新 texture 时可复用旧树，仍由 Raster 重绘 root。 这种复用不等于复用旧 root buffer；trace 缺少本轮 Dart build 也不代表没有绘制。 texture 请求新帧
可不要求重新生成 tree → CanReuseLastLayerTrees
进入 DrawLastLayerTrees；CanReuseLastLayerTrees
进入 DrawLastLayerTrees → 保留已构建的场景结构
Raster 更新输入 texture；保留已构建的场景结构
Raster 更新输入 texture → 采样与 root 提交
继续 GPU / display 依赖</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
