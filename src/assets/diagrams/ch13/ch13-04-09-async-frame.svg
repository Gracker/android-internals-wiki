<text x="215.0" y="112.18" text-anchor="middle" style="font-size:23px">
<tspan x="215.0" dy="0">CPU draw / window swap</tspan>
<tspan x="215.0" dy="31.28">准备并交出 GPU 工作</tspan>
</text>
<path d="M 454 60 Q 600.0 60.7 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.7 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">queue + acquire fence</tspan>
<tspan x="600.0" dy="34.0">GPU 可尚未完成</tspan>
</text>
<path d="M 839 60 Q 985.0 60.1 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.9 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">Consumer 读取像素</tspan>
<tspan x="985.0" dy="34.0">遵守写入完成依赖</tspan>
</text>
<text x="206" y="543" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">Producer</tspan>
</text>
<path d="M 220 559 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 224 520 Q 355.0 520.4 486 520 Q 490 520 490 524 L 490 553 Q 490 557 486 557 Q 355.0 557.0 224 557 Q 220 557 220 553 L 220 524 Q 220 520 224 520" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="355.0" y="546" text-anchor="middle" style="font-size:21px">
<tspan x="355.0" dy="0">draw / submit</tspan>
</text>
<path d="M 529 520 Q 645.0 519.3 761 520 Q 765 520 765 524 L 765 553 Q 765 557 761 557 Q 645.0 557.7 529 557 Q 525 557 525 553 L 525 524 Q 525 520 529 520" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="645.0" y="546" text-anchor="middle" style="font-size:21px">
<tspan x="645.0" dy="0">queue + fence</tspan>
</text>
<text x="206" y="623" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">GPU</tspan>
</text>
<path d="M 220 639 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 404 600 Q 645.0 600.2 886 600 Q 890 600 890 604 L 890 633 Q 890 637 886 637 Q 645.0 636.9 404 637 Q 400 637 400 633 L 400 604 Q 400 600 404 600" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="645.0" y="626" text-anchor="middle" style="font-size:21px">
<tspan x="645.0" dy="0">asynchronous write → signal</tspan>
</text>
