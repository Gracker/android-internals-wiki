<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">进程边界与宿主线程的位置</title>
<desc id="desc">browser/GPU 服务在宿主内，renderer 独立沙箱，HWUI 与 Viz 再衔接系统显示。 服务名不等于独立进程；旧 API21–25 的进程内 renderer 属于另一历史模型。 进程间frame与资源信息；服务与绘制工作在宿主进程的相应线程；宿主窗口与可选child的提交</desc>
