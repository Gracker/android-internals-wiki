<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HWUI 两条 queue 的对象关系</title>
<desc id="desc">同一逻辑 device 与 graphics family，两个 queue 分别绑定两个 GrDirectContext。 这是独立接口对象，不能把两个 queue 直接画成两套物理 GPU 引擎。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
