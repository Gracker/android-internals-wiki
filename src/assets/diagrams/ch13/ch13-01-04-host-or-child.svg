<title id="title">宿主采样与独立 Layer 的区别</title>
<desc id="desc">标准 UI、TextureView 与 SurfaceView 的合成位置不同。 独立 Layer 不保证 overlay；纹理采样不等于固定 CPU 拷贝。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
