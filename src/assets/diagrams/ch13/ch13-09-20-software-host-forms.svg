<tspan x="600.0" dy="0">已确认 WebView 软件 draw</tspan>
<tspan x="600.0" dy="34.0">最终由哪种宿主承接？</tspan>
</text>
<path d="M 99 335 Q 310.0 335.3 521 335 Q 525 335 525 339 L 525 456 Q 525 460 521 460 Q 310.0 459.8 99 460 Q 95 460 95 456 L 95 339 Q 95 335 99 335" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="389.0" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">整个窗口软件绘制</tspan>
