<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">软件窗口与单 View 软件层</title>
<desc id="desc">软件内容既可经软件窗口提交，也可先成为硬件窗口的输入。 两种都不自动新增独立 SF Layer；是否有宿主 RT/GPU 工作要看最终窗口形态。 左条件分支；右条件分支</desc>
