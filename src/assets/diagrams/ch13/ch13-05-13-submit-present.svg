<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">submit fence 与 present wait semaphore</title>
<desc id="desc">同一次 submit 的 fence 与 render-finished semaphore 服务不同消费者。 frame fence signal 不代表 presentation 已完成；失败 submit 不能继续假定 fence 会 signal。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
