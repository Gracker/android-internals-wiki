<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Swappy 内部阶段需要埋点</title>
<desc id="desc">tracer 回调可把库内等待和提交阶段接入系统 trace。 默认 OS 轨道不能凭名称还原全部 Swappy 逻辑。 注入 SwappyTracer
配置本构建的回调 → preWait / postWait
记录实际等待范围；preWait / postWait
记录实际等待范围 → preSwap / postSwap
记录提交调用范围；preSwap / postSwap
记录提交调用范围 → ATrace / TrackEvent
附 frame id 与时钟</desc>
