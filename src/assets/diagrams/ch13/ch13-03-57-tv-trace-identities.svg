<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">输入帧、更新对象与宿主帧的身份链</title>
<desc id="desc">应用内输入队列与系统可见宿主 Layer 使用不同身份字段。 SF Layer tree 通常列不出输入 image slot，要补应用或 Producer 插桩。 外部 Producer / 输入 queue
frame number / timestamp → SurfaceTexture Consumer
当前 buffer / image slot；SurfaceTexture Consumer
当前 buffer / image slot → TextureLayer updater
ViewRoot / handler / apply；TextureLayer updater
ViewRoot / handler / apply → Host H / BLAST / SF
Layer id / buffer / transaction；Host H / BLAST / SF
Layer id / buffer / transaction → DisplayFrame / present
目标 display 与输出时刻</desc>
