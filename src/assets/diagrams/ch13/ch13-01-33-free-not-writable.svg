<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">FREE 与立即可写之间仍有 fence</title>
<desc id="desc">BufferQueue 可返回带 release fence 的 FREE slot。 选槽等待与后端 fence 同步要分别定位，不能把未 signal 自动当作 FREE 不可选。 Consumer releaseBuffer
slot 回到 FREE → Producer dequeue
返回 slot 与 release fence；Producer dequeue
返回 slot 与 release fence → EGL / Vulkan 等后端
遵守上次使用完成依赖；EGL / Vulkan 等后端
遵守上次使用完成依赖 → 安全写入新内容
再提交新的完成 fence</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
