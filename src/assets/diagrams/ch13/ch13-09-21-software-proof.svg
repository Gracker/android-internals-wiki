<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">确认软件 fallback 的证据</title>
<desc id="desc">结合 Canvas 状态和真实调用栈，区分软件 draw、未采集与没有工作。 缺少 DrawFn slice、白屏或 CSS 属性均不足以单独判断渲染类型。 确定 Canvas acceleration
与 provider / 场景 → 找 OnDrawSoftware
CompositeSW / DemandDrawSw；找 OnDrawSoftware
CompositeSW / DemandDrawSw → 检查是否 early out
空尺寸 / 无 Canvas / 无 draw；检查是否 early out
空尺寸 / 无 Canvas / 无 draw → 关联宿主窗口路径
再看 CPU 与最终输出</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
