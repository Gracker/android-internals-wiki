<title id="title">partial update 的有效性与性能证据</title>
<desc id="desc">内容历史证明可复用范围，性能收益仍须 GPU、带宽与功耗测量。 bufferAge 非零不能证明 fill rate 按 damage 面积同比下降。 有效 age / 足够 history
正确修复像素内容 → 实际 render workload
offscreen / blend / tile 影响；实际 render workload
offscreen / blend / tile 影响 → GPU stage / counter / 功耗
量化真实收益</desc>
