<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">输入帧率请求经 flag 桥接到 View</title>
<desc id="desc">输入流的请求被桥接到 View requested rate，再由系统做刷新率决策。 toolkitSetFrameRateReadOnly 为注册条件；请求不是目标 Display mode 的承诺。 输入 Producer setFrameRate
意图与 compatibility → flag 允许注册 listener
投递到 ViewRoot handler；flag 允许注册 listener
投递到 ViewRoot handler → setRequestedFrameRate
保存 compatibility；setRequestedFrameRate
保存 compatibility → 系统 / 其他 Layer / Display
综合决策实际刷新节奏</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
