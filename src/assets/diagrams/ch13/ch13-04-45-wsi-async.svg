<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">ANGLE WSI 提交与 GPU 完成的异步关系</title>
<desc id="desc">present 请求交接不要求 CPU 已等到 GPU 完成，像素读取仍遵守依赖。 条长为示意；vkQueuePresentKHR 返回不能证明 SurfaceFlinger 已采纳或面板已显示。 Vulkan render submit
准备 present wait semaphore → Android WSI queue
buffer + acquire dependency；Android WSI queue
buffer + acquire dependency → SF / GPU / HWC 读取
遵守写入完成依赖</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="830" fill="white"/>
<path d="M 365 120.0 L 450 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.7 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.7 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="97.56" text-anchor="middle" style="font-size:22px">
<tspan x="215.0" dy="0">Vulkan render submit</tspan>
<tspan x="215.0" dy="29.92">准备 present wait</tspan>
<tspan x="215.0" dy="29.92">semaphore</tspan>
</text>
<path d="M 454 60 Q 600.0 59.9 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.0 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="97.56" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">Android WSI queue</tspan>
<tspan x="600.0" dy="29.92">buffer + acquire</tspan>
<tspan x="600.0" dy="29.92">dependency</tspan>
</text>
<path d="M 839 60 Q 985.0 59.3 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.6 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">SF / GPU / HWC 读取</tspan>
<tspan x="985.0" dy="34.0">遵守写入完成依赖</tspan>
</text>
<text x="206" y="543" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">CPU / WSI</tspan>
</text>
<path d="M 220 559 H 1120" stroke="#777777" stroke-width="1.5"/>
<path d="M 224 520 Q 325.0 519.3 426 520 Q 430 520 430 524 L 430 553 Q 430 557 426 557 Q 325.0 556.5 224 557 Q 220 557 220 553 L 220 524 Q 220 520 224 520" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="325.0" y="546" text-anchor="middle" style="font-size:21px">
<tspan x="325.0" dy="0">submit</tspan>
</text>
