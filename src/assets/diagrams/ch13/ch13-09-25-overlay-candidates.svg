<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">provider 如何筛选可提升候选</title>
<desc id="desc">平台许可后，Chromium 再检查服务准备、候选支持和临时阻止状态。 候选不能提升仍可回到硬件主体路径；这不是软件 fallback。 本轮 HWUI 允许 overlay
并非离屏目标 → 完整 GPU service 已就绪
未就绪不为此硬阻塞 RT；完整 GPU service 已就绪
未就绪不为此硬阻塞 RT → SurfaceControl 支持检查
buffer / crop / transform 等；SurfaceControl 支持检查
buffer / crop / transform 等 → frame sink 未被临时阻止
合格候选才被处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
