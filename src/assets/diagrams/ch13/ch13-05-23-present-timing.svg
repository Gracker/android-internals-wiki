<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">present timing 扩展的启用与反馈</title>
<desc id="desc">扩展、feature、依赖与 swapchain flag 都满足后，按实际 timing 能力查询反馈。 Android 两套 timing 的相关时间戳使用 CLOCK_MONOTONIC；系统反馈不能替代光学测量。 枚举 extension / feature
启用 timing 与 present_id2 → 查询具体 surface 能力
创建 swapchain timing flag；查询具体 surface 能力
创建 swapchain timing flag → 关联 present ID / 查询阶段
管理 timing queue 容量；关联 present ID / 查询阶段
管理 timing queue 容量 → 结果延迟到达时读取
按时间域与有效性解释</desc>
