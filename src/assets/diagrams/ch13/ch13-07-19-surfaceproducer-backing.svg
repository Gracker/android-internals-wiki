<text x="600.0" y="104.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">API29+ 且未强制 GL</tspan>
<tspan x="600.0" dy="34.0">并且无已知 AHB defect？</tspan>
</text>
<path d="M 99 335 Q 310.0 334.5 521 335 Q 525 335 525 339 L 525 456 Q 525 460 521 460 Q 310.0 460.1 99 460 Q 95 460 95 456 L 95 339 Q 95 335 99 335" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="389.0" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">是：ImageReaderSurfaceProducer</tspan>
<tspan x="310.0" dy="34.0">以 HardwareBuffer image 供消费</tspan>
</text>
<path d="M 679 335 Q 890.0 335.2 1101 335 Q 1105 335 1105 339 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.4 679 460 Q 675 460 675 456 L 675 339 Q 675 335 679 335" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="389.34000000000003" text-anchor="middle" style="font-size:24px">
