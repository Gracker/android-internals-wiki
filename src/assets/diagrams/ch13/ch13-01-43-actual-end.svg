<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">共享应用 token 的预测</tspan>
<tspan x="215.0" dy="34.0">查询确认唯一且完整</tspan>
</text>
<path d="M 454 340 Q 600.0 339.3 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.8 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
