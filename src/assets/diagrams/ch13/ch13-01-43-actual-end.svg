<tspan x="215.0" dy="34.0">expected.ts + dur</tspan>
</text>
<path d="M 454 60 Q 600.0 59.7 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.9 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="97.56" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">App Actual end</tspan>
<tspan x="600.0" dy="29.92">max(queue, acquire</tspan>
<tspan x="600.0" dy="29.92">signal)</tspan>
</text>
