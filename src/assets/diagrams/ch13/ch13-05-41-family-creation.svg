<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HWUI 选中第一个 graphics family 并请求双 queue</title>
<desc id="desc">第一个具备 GRAPHICS 能力的 family 还必须满足 queueCount 至少为 2。 不满足会 fatal；这里没有尝试另一个 family 或复用 queue 0 的降级分支。 查询 family properties
按索引依次检查 → 遇到首个 GRAPHICS family
保存 family index；遇到首个 GRAPHICS family
保存 family index → 要求 queueCount ≥ 2
不满足直接 fatal；要求满足后才继续创建双queue，失败直接fatal</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
