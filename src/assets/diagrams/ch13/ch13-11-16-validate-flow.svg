<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">一次常规validate与present</title>
<desc id="desc">常规路径先确认分工，再准备 client target 和提交显示。 这里只画非快路径；调用返回仍不代表 fence 已完成。 准备可见 Layer 状态
buffer / 几何 / fence → HWC validate
返回 types / requests；HWC validate
返回 types / requests → SF 接受所需变更
确定 CLIENT Layer；SF 接受所需变更
确定 CLIENT Layer → RenderEngine 按需合成
生成 client target；RenderEngine 按需合成
生成 client target → 设置 client target
携 GPU completion fence；设置 client target
携 GPU completion fence → HWC present 提交
回传 present / release</desc>
