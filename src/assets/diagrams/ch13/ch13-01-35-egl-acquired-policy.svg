<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">刷新率与 EGL pending release 策略</title>
<desc id="desc">BLAST 可结合当前 acquired 上限暂存 EGL 的部分释放信息。 字段表示数量上限，不是实时已取得数；该持有策略有 EGL 条件。 release 信息
可含 current max acquired → 与 mMaxAcquiredBuffers 比较
计算 EGL 需暂存的数量；与 mMaxAcquiredBuffers 比较
计算 EGL 需暂存的数量 → pending release 列表
超过应持有数再归还；pending release 列表
超过应持有数再归还 → Consumer releaseBuffer
slot 进入后续复用循环</desc>
