<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">ANativeWindow</tspan>
<tspan x="310.0" dy="34.0">vkCreateAndroidSurfaceKHR</tspan>
</text>
