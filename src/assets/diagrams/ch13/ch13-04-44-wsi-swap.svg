<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ANativeWindow 到 Vulkan WSI swap</title>
<desc id="desc">Android surface 建立 VkSurfaceKHR，swap 管理 acquire、submit 与 present。 acquire 可延迟或在更早阶段处理；throttle tail call 可能在 swapImpl slice 外。 ANativeWindow
vkCreateAndroidSurfaceKHR → VkSurfaceKHR / swapchain
按需 acquire 或重建；VkSurfaceKHR / swapchain
按需 acquire 或重建 → WindowSurfaceVk::swapImpl
处理 acquire 结果并 present；WindowSurfaceVk::swapImpl
处理 acquire 结果并 present → Renderer::queuePresent
提交 Vulkan present 请求</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
