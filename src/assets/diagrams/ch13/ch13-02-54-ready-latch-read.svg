<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">事务处理、采纳与实际读取要分开</title>
<desc id="desc">事务可因多种条件推迟，允许的先采纳也不消除输入同步。 committed、BufferTX 增加或 snapshot 更新都不证明目标 display 已使用新 buffer。 transaction 到达
BufferTX / 待处理更新 → readiness 条件
时间、barrier、顺序与 fence；readiness 条件
时间、barrier、顺序与 fence → 本轮状态 / buffer 采纳
部分条件可允许 latch 未完成；本轮状态 / buffer 采纳
部分条件可允许 latch 未完成 → 真正读取与 present
读取前 fence 仍须满足</desc>
