<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">设备位姿与渲染视点的空间关系</title>
<desc id="desc">viewpoint pose 由设备 perception-space pose 与局部视点偏移合成。 组合的是位姿变换，不能逐分量相加；禁用 tracking 时数值可能冻结。 ArDevice.devicePose
perception space 设备位姿 → 组合 localPose
设备中心到视点的偏移；组合 localPose
设备中心到视点的偏移 → RenderViewpoint.pose
perception space 视点位姿</desc>
