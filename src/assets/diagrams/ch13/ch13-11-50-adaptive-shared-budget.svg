<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">多路adaptive selection分配</title>
<desc id="desc">多路 adaptive selection 可继续按检查点分配带宽。 0.7 乘估计带宽只是一部分，不等于每一路的最终预算。 总 allocatable bandwidth
已做倍速 / TTFB 修正 → factory adaptation checkpoints
总带宽到各路映射；factory adaptation checkpoints
总带宽到各路映射 → 按相邻检查点插值
各 selection 分得预算；按相邻检查点插值
各 selection 分得预算 → 在允许 track 中选理想档
按 bitrate ≤ budget 判断</desc>
