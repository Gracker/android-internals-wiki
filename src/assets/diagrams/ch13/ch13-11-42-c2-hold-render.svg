<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Codec2首帧hold到render回调</title>
<desc id="desc">显式 peek 首帧经过 hold、ready 与 start-render 协议。 work update 可继续返回，render time 仍不等于 panel 扫描完成。 首个有效视频输入
内部 first-frame 标记 → CCodecBufferChannel
传 C2 TunnelHoldRender；CCodecBufferChannel
传 C2 TunnelHoldRender → component 解码并 hold
INCOMPLETE work update；component 解码并 hold
INCOMPLETE work update → framework 收 ready
peek 开启则触发 start；framework 收 ready
peek 开启则触发 start → CCodecConfig 映射
TunnelStartRender 参数；CCodecConfig 映射
TunnelStartRender 参数 → component render time
MONOTONIC ns 样本</desc>
