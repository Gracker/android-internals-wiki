<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HCPP AHB 池复用的 fence 依赖</title>
<desc id="desc">buffer 提交携带写完成依赖，旧 buffer 回池后仍需遵守 release 依赖。 OnComplete 对应 previous buffer，不能把当前 B 当成已释放；GPU wait semaphore 不等于 CPU 先等完。 从 AHB pool 取得候选
导入旧 release fd 依赖 → GPU render / submit
等待 render-ready semaphore；GPU render / submit
等待 render-ready semaphore → SetContents 当前 buffer B
携带 present-ready fd；SetContents 当前 buffer B
携带 present-ready fd → 后续 TX completion
查询 previous A release fence；后续 TX completion
查询 previous A release fence → 旧 A 与 fence 放回 pool
不立刻宣称可安全覆写；旧 A 与 fence 放回 pool
不立刻宣称可安全覆写 → 下次 GPU 写 A 前
满足导入的 release 依赖</desc>
