<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">按两次生产对齐可见帧</title>
<desc id="desc">用输入 queue、RT 选帧、宿主 GPU 和 host transaction 连到最终输出。 acquire fence 约束读取并可停止追新；不把 callback 当作 GPU 完成或显示证据。 外部输入 queue
业务帧 T → callback / invalidate
UI applyUpdate；callback / invalidate
UI applyUpdate → RT pending layer apply
实际选中 T 的 frame；RT pending layer apply
实际选中 T 的 frame → GPU 采样与宿主绘制
生成 H / 完成 fence；GPU 采样与宿主绘制
生成 H / 完成 fence → Host Buffer transaction
SF 使用哪块 H；Host Buffer transaction
SF 使用哪块 H → Display present
反查 H 中是哪块 T</desc>
