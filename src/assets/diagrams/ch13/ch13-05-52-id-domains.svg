<tspan x="215.0" dy="0">currentFrameID</tspan>
<tspan x="215.0" dy="34.0">HWUI 内部递增计数</tspan>
</text>
<path d="M 454 60 Q 600.0 60.0 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.1 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">FrameTimeline vsyncId</tspan>
<tspan x="600.0" dy="34.0">平台帧计划关联 token</tspan>
</text>
<path d="M 839 60 Q 985.0 59.9 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.8 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="97.56" text-anchor="middle" style="font-size:22px">
<tspan x="985.0" dy="0">BufferQueue frame</tspan>
<tspan x="985.0" dy="29.92">number</tspan>
<tspan x="985.0" dy="29.92">Producer 的 queue 次序</tspan>
</text>
<path d="M 69 340 Q 215.0 340.6 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.7 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="377.56" text-anchor="middle" style="font-size:22px">
<tspan x="215.0" dy="0">给 Vulkan 工具分组</tspan>
<tspan x="215.0" dy="29.92">不是 expected present</tspan>
<tspan x="215.0" dy="29.92">时间</tspan>
</text>
<path d="M 454 340 Q 600.0 340.3 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.8 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="392.18" text-anchor="middle" style="font-size:23px">
