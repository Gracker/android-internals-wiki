<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Profile、feature 与 surface query 的三个门槛</title>
<desc id="desc">集合符合、feature 启用和特定 surface 支持需要分别确认。 进入 core 不代表带独立 feature bit 的能力自动启用。 目标能力集合
兼容 profile / 芯片要求 → 设备 extension / feature
查询并正确启用；设备 extension / feature
查询并正确启用 → Surface formats / modes
窗口与设备组合的查询；Surface formats / modes
窗口与设备组合的查询 → 合法创建与恢复策略
缺失时降级或明确拒绝</desc>
