<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">软件 post 同样可能携带 fence</title>
<desc id="desc">gralloc unlock 可返回完成 fence，Consumer 读取前仍须遵守。 没有 HWUI GPU draw 不等于没有同步；queue 返回也不证明已显示。 CPU 绘制结束
调用 unlockCanvasAndPost → GraphicBuffer.unlockAsync
返回完成 fd 或无 fence；GraphicBuffer.unlockAsync
返回完成 fd 或无 fence → Surface.queueBuffer
buffer + Producer 完成 fence；Surface.queueBuffer
buffer + Producer 完成 fence → Consumer acquire / 读取
遵守生产完成依赖；Consumer acquire / 读取
遵守生产完成依赖 → 下游 release fence
约束这块 buffer 的后续复用</desc>
