<title id="title">两份 trace 先对齐实验配置</title>
<desc id="desc">可比数据需要固定引擎、输出、调度目标和环境。 build、driver、场景或 thermal 不同可能改变相同代码的表现。 引擎 / API / renderer
记录版本与 pacer → 输出 Surface / display
刷新率、FPS、vote；输出 Surface / display
刷新率、FPS、vote → 系统与画质配置
mode、quality、in-flight；系统与画质配置
mode、quality、in-flight → 环境与输入脚本
温度、亮度、电源、场景</desc>
