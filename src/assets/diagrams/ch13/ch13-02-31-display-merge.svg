<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">一次 display 更新合并多路内容</title>
<desc id="desc">多路 Producer 独立推进，在 SF 对目标 display 的状态和内容选择中汇合。 可能合法组合新旧内容，系统不能从像素推断字幕、遮罩与视频的业务对应关系。 宿主采样T与状态生成H后经hostBLAST提交；hostH事务进入SF状态与内容选择；独立I和几何事务独立参与目标display，不要求先等host提交；各路内容选定后共同进入合成与present</desc>
