<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Choreographer 五类回调顺序</title>
<desc id="desc">同一 doFrame 按固定顺序处理帧回调。 这里只表示回调阶段顺序，不表示每阶段必有工作或相同时长。 INPUT
可消费 batched motion → ANIMATION
动画与按帧 runnable；ANIMATION
动画与按帧 runnable → INSETS_ANIMATION
窗口 Insets 动画；INSETS_ANIMATION
窗口 Insets 动画 → TRAVERSAL
按需 measure / layout / draw；TRAVERSAL
按需 measure / layout / draw → COMMIT
帧提交类回调</desc>
