<path d="M 69 60 Q 215.0 59.7 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.5 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
