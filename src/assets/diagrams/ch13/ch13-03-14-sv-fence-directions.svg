<tspan x="600.0" dy="32.64">对象是已归还的旧 buffer</tspan>
</text>
<path d="M 839 340 Q 985.0 339.7 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.5 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">用于显示栈同步反馈</tspan>
<tspan x="985.0" dy="34.0">不等于面板光学响应</tspan>
</text>
</svg>
