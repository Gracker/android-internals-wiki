<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">跨进程 SurfacePackage 与本地指针桥接</title>
<desc id="desc">跨进程先传受支持的 Binder/Parcelable 对象，再取得本地引用。 不能把 ASurfaceControl 裸地址传到另一进程；参与者同步需显式接入。 提供方 ViewHost
生成 SurfacePackage → Binder 传受支持句柄
连同输入等接口；Binder 传受支持句柄
连同输入等接口 → 接收方 SurfaceView 挂接
可加入 SurfaceSyncGroup；接收方 SurfaceView 挂接
可加入 SurfaceSyncGroup → native 需要时 fromJava
取得本地 control 强引用</desc>
