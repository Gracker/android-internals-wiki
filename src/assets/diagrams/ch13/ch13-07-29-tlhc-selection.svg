<tspan x="215.0" dy="32.64">检查请求的 fallback 模式</tspan>
</text>
<path d="M 454 60 Q 600.0 59.4 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.3 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="112.18" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">TLHC 可用</tspan>
<tspan x="600.0" dy="31.28">选择 PlatformView target</tspan>
</text>
<path d="M 839 60 Q 985.0 60.4 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.7 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">选到 SurfaceProducer</tspan>
<tspan x="985.0" dy="34.0">再调用 FlutterRenderer</tspan>
</text>
<path d="M 69 340 Q 215.0 339.2 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.3 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
