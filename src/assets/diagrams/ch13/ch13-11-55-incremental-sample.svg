<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">分片下载与sample解码可重叠</title>
<desc id="desc">解码的前置条件是目标 sample 数据可用。 不要求整个 segment 下载完成后才开始所有解码。 左侧条件或职责；右侧条件或职责</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 500 180 L 500 255 L 310 255 L 310 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 330 L 310 340 L 316 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 180 L 700 255 L 890 255 L 890 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 330 L 890 340 L 896 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 60 Q 600.0 59.4 811 60 Q 815 60 815 64 L 815 176 Q 815 180 811 180 Q 600.0 180.3 389 180 Q 385 180 385 176 L 385 64 Q 385 60 389 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="128.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">目标 sample 已到达并解析</tspan>
</text>
<path d="M 99 340 Q 310.0 340.2 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.3 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">该 sample 可送入 codec</tspan>
<tspan x="310.0" dy="34.0">沿自己的 PTS 和输出继续</tspan>
</text>
<path d="M 679 340 Q 890.0 339.4 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.6 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">同一 segment 其余字节</tspan>
<tspan x="890.0" dy="34.0">可能还在网络传输</tspan>
</text>
</svg>
