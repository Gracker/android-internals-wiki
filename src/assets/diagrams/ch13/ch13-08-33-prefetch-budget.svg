<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">预取的普通时间预算如何估算</title>
<desc id="desc">以缓存刷新间隔和最近帧起点估算剩余时间。 固定实现不直接读取 preferred frame deadline；刷新率缓存不会逐帧自动更新。 View.display.refreshRate
首次估算并静态缓存间隔 → max(frameStart, drawingTime)
作为最近帧起点；max(frameStart, drawingTime)
作为最近帧起点 → 起点 + frameIntervalNs
估计 nextFrameTime；起点 + frameIntervalNs
估计 nextFrameTime → max(0, nextFrameTime − now)
普通 availableTimeNanos</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
