<tspan x="890.0" dy="0">max(frameStart, drawingTime)</tspan>
<tspan x="890.0" dy="34.0">作为最近帧起点</tspan>
</text>
<path d="M 679 340 Q 890.0 340.2 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.7 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">起点 + frameIntervalNs</tspan>
<tspan x="890.0" dy="34.0">估计 nextFrameTime</tspan>
</text>
<path d="M 99 340 Q 310.0 339.4 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.6 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">max(0, nextFrameTime − now)</tspan>
