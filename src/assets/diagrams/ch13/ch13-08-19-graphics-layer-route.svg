<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Android 17 的 GraphicsLayerV29 路径</title>
<desc id="desc">AndroidComposeView 的主 layer 路径经 GraphicsLayerOwnerLayer 到公开 RenderNode。 固定 Android 12–17 / Compose 1.11.4；兼容 RenderNodeLayer 不代表本基线主路径。 AndroidComposeView.createLayer
复用或创建 OwnedLayer → GraphicsLayerOwnerLayer
GraphicsContext.createLayer；GraphicsLayerOwnerLayer
GraphicsContext.createLayer → GraphicsLayerV29
持有 android.graphics.RenderNode；GraphicsLayerV29
持有 android.graphics.RenderNode → record / drawRenderNode
进入宿主 HWUI 树</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
