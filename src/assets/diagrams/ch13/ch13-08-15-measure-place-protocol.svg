<path d="M 675 165 L 525 165" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 159 L 525 165 L 535 171" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 310 190 L 310 280 L 500 280 L 500 360" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 494 350 L 500 360 L 506 350" stroke="#202020" stroke-width="2.8" fill="none"/>
