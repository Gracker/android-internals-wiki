<text x="310.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">父 MeasurePolicy</tspan>
<tspan x="310.0" dy="34.0">生成 child Constraints</tspan>
</text>
<path d="M 679 70 Q 890.0 70.4 1101 70 Q 1105 70 1105 74 L 1105 186 Q 1105 190 1101 190 Q 890.0 190.2 679 190 Q 675 190 675 186 L 675 74 Q 675 70 679 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">child / Placeable</tspan>
<tspan x="890.0" dy="34.0">测量返回尺寸；随后被放置</tspan>
</text>
<path d="M 389 360 Q 600.0 359.2 811 360 Q 815 360 815 364 L 815 476 Q 815 480 811 480 Q 600.0 479.8 389 480 Q 385 480 385 476 L 385 364 Q 385 360 389 360" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="411.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">父 MeasureResult / placement</tspan>
<tspan x="600.0" dy="34.0">确定 child 的位置</tspan>
</text>
