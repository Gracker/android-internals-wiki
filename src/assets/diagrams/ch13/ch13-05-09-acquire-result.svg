<text x="600.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">vkAcquireNextImageKHR</tspan>
<tspan x="600.0" dy="32.64">检查 VkResult</tspan>
</text>
<path d="M 69 340 Q 215.0 339.6 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.6 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">成功取得 imageIndex</tspan>
<tspan x="215.0" dy="32.64">仍须等待 availability 信号</tspan>
</text>
