<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">五段诊断的对象与异常</title>
<desc id="desc">从 App、CameraService、HAL 到 consumer 和显示逐段关联。 线程名与 slice 前缀取决于 transport、厂商和采集配置。 App / CameraX
配置 / request / executor → CameraService
RequestThread / stream wait；CameraService
RequestThread / stream wait → HAL / sensor / ISP
实际job与result / fence；HAL / sensor / ISP
实际job与result / fence → 各 consumer
Image / codec / App GPU；各 consumer
Image / codec / App GPU → 实际显示输入
queue / SF / HWC / present</desc>
