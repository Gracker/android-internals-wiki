<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">替换 SurfaceTexture 不补发旧新生命周期回调</title>
<desc id="desc">替换前停止旧目标并准备 detached 的新对象，替换后自行管理新连接。 旧对象立即 release；不调用旧 destroyed，也不调用新 available。 停止旧 Producer
释放旧 Surface 包装 → 新 SurfaceTexture 有效
从 GL context detach；新 SurfaceTexture 有效
从 GL context detach → setSurfaceTexture
立即释放旧对象；setSurfaceTexture
立即释放旧对象 → 新对象绑定 TextureLayer
应用自行安排 Producer；新对象绑定 TextureLayer
应用自行安排 Producer → 后续 View 绘制
核对 listener 与更新标志</desc>
