<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">CameraX 候选帧先配对再过滤</title>
<desc id="desc">图像与 TotalCaptureResult 先按 timestamp 配对，再筛选进入 ring。 固定 CameraX 1.6.1 行为，HAL 并不知道应用的三帧策略。 图像侧先后可变；metadata侧按时间戳匹配；配对后再质量筛选；合格图像才进入ring</desc>
