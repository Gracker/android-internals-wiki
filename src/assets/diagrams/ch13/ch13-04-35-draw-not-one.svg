<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">一个 GLES draw 可产生多种 Vulkan 命令</title>
<desc id="desc">按语义和 frame 关联命令，不能按调用名与数量一一对应。 GL_LINE_LOOP 是源码中的具体例子；兼容 pass 取决于功能和设备配置。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
