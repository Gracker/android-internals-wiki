<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">sideband控制面与设备数据面</title>
<desc id="desc">sideband handle 关联设备侧视频流，SF 仍管理 Layer。 普通 queue/latch 事件稀疏需结合实际模式解释。 codec 配置 tunnel
同步类型与 sync id → component 返回 handle
关联设备侧视频流；component 返回 handle
关联设备侧视频流 → native window 绑定
BLAST 转发 sideband；native window 绑定
BLAST 转发 sideband → SF 管理 Layer 状态
位置 / 尺寸 / 层级；SF 管理 Layer 状态
位置 / 尺寸 / 层级 → HWC 关联设备机制
更新内容与同步</desc>
