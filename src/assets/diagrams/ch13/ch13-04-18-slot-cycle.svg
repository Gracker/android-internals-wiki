<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">普通 BufferQueue slot 状态环</title>
<desc id="desc">Producer 取得 slot、提交，再由本例的 BLAST Consumer 获取并归还。 省略 cancel/drop/shared/attach 分支；FREE 仍可能带未 signal 的 release fence。 FREE
候选 slot 可附 release fence → DEQUEUED
Producer 持有，遵守写入依赖；DEQUEUED
Producer 持有，遵守写入依赖 → QUEUED
内容 + 完成 fence 已交出；QUEUED
内容 + 完成 fence 已交出 → ACQUIRED
本地 Consumer 为 BLAST；ACQUIRED
本地 Consumer 为 BLAST → FREE
归还后未来可再次 dequeue</desc>
