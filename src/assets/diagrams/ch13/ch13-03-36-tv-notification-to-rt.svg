<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">UI 送更新，RenderThread 按标志取输入</title>
<desc id="desc">listener 标记更新，UI 提交 updater，RT 再选择并组织输入绘制。 公共 updateTexImage 是应用自管 GLConsumer 路径；不能当成 HWUI 固定入口。 frame available
ViewRoot handler → updateLayer / invalidate
UI 合并到 traversal；updateLayer / invalidate
UI 合并到 traversal → TextureView.applyUpdate
prepare / pushLayerUpdate；TextureView.applyUpdate
prepare / pushLayerUpdate → RT syncFrameState
处理 pending updater；RT syncFrameState
处理 pending updater → apply 的更新标志置位
才取输入 / 可沿用旧内容；apply 的更新标志置位
才取输入 / 可沿用旧内容 → HWUI layer / GPU
采样写入宿主 buffer</desc>
