<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ANGLE 与 Vulkan 的关联证据</title>
<desc id="desc">以配置、当前 context、已加载库和同帧事件共同确认 ANGLE。 单独看到 Vulkan submit 也可能来自 HWUI、原生 Vulkan 或进程内其他模块。 固定进程与目标 Surface
确认 context / 线程 → GL / EGL 原始字符串
结合 ANGLE 库映射；GL / EGL 原始字符串
结合 ANGLE 库映射 → ANGLE event ↔ Vulkan submit
联系同 frame / context；ANGLE event ↔ Vulkan submit
联系同 frame / context → queue / latch / present
继续验证该帧的输出</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
