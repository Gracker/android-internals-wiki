<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Swappy 用目标时间和 fence 控制节奏</title>
<desc id="desc">pacer 把显示反馈用于安排后续提交，避免盲目填满队列。 主动 wait 可能改善延迟；实际 interval 和模式仍须记录。 目标 interval / mode
与显示刷新能力匹配 → Choreographer / timing
估算并安排目标时刻；Choreographer / timing
估算并安排目标时刻 → fence + 主动等待
控制过早提交和在途；fence + 主动等待
控制过早提交和在途 → swap / queuePresent
持续检验实际反馈</desc>
