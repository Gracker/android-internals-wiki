<text x="215.0" y="112.18" text-anchor="middle" style="font-size:23px">
<tspan x="215.0" dy="0">选择 time / VSync id</tspan>
<tspan x="215.0" dy="31.28">检查 API / flag 有效</tspan>
</text>
<path d="M 839 60 Q 985.0 60.0 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.3 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="112.18" text-anchor="middle" style="font-size:23px">
<tspan x="985.0" dy="0">Producer 生成 buffer</tspan>
<tspan x="985.0" dy="31.28">可携未完成的生产 fence</tspan>
</text>
<path d="M 454 340 Q 600.0 340.7 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.6 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="376.54" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">Transaction</tspan>
<tspan x="600.0" dy="31.28">状态、buffer、生产 fence</tspan>
<tspan x="600.0" dy="31.28">以及调度目标</tspan>
</text>
<path d="M 454 570 Q 600.0 570.6 746 570 Q 750 570 750 574 L 750 686 Q 750 690 746 690 Q 600.0 689.9 454 690 Q 450 690 450 686 L 450 574 Q 450 570 454 570" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="606.5400000000001" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">SF 调度、读取与输出</tspan>
<tspan x="600.0" dy="31.28">读取前 fence 必须满足</tspan>
<tspan x="600.0" dy="31.28">不承诺精确纳秒</tspan>
</text>
</svg>
