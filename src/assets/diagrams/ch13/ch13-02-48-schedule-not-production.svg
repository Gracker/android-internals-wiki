<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">desired present 与 FrameTimeline 是调度目标</title>
<desc id="desc">请求目标时刻或 VSync timeline 不会代替生产与同步。 固定 r1 相关 flag 关闭时可直接返回；过期 id 被忽略，早目标不能抢占前面较晚事务。 有效调度目标加入transaction；内容与其生产fence加入transaction；GPU可仍在执行；SF按readiness和目标调度，读取仍要满足生产fence</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
