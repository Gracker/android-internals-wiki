<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">驱动选路在应用进程初始化时发生</title>
<desc id="desc">Settings 修改后重启目标进程，再确认实际装入结果。 只重建 EGLContext 不会让已经完成的 Java GraphicsEnvironment.setup 重新执行。 更改并记录选路配置
只表达下一次启动意图 → 停止并重新启动目标进程
setupAngle 执行；停止并重新启动目标进程
setupAngle 执行 → Loader 装入图形库
建立实际 context；Loader 装入图形库
建立实际 context → 记录 strings / maps / build
再进入 A/B 测量</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 525 120.0 L 675 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 665 114.0 L 675 120.0 L 665 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 60.3 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 179.4 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">更改并记录选路配置</tspan>
<tspan x="310.0" dy="34.0">只表达下一次启动意图</tspan>
</text>
<path d="M 679 60 Q 890.0 60.0 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.2 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">停止并重新启动目标进程</tspan>
<tspan x="890.0" dy="34.0">setupAngle 执行</tspan>
</text>
<path d="M 679 340 Q 890.0 340.0 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.7 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">Loader 装入图形库</tspan>
<tspan x="890.0" dy="34.0">建立实际 context</tspan>
</text>
<path d="M 99 340 Q 310.0 340.6 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 459.9 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">记录 strings / maps / build</tspan>
<tspan x="310.0" dy="34.0">再进入 A/B 测量</tspan>
</text>
</svg>
