<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">BufferQueue slot 的主要循环</title>
<desc id="desc">普通队列循环中，slot 在 Producer、队列与 Consumer 之间流转。 省略 cancel、drop、attach/detach 和 shared-buffer 等分支；FREE 仍可能附未完成 fence。 FREE
可作为 dequeue 候选 → DEQUEUED
Producer 已取出；DEQUEUED
Producer 已取出 → QUEUED
提交等待 Consumer acquire；QUEUED
提交等待 Consumer acquire → ACQUIRED
Consumer 持有；release 后归还；普通ACQUIRED经release归还FREE，release fence可继续未signal</desc>
