<tspan x="890.0" dy="0">QUEUED</tspan>
<tspan x="890.0" dy="34.0">提交等待 Consumer acquire</tspan>
</text>
<path d="M 99 340 Q 310.0 340.6 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.1 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
