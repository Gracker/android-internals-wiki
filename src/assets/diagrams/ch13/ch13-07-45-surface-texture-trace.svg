<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Surface 与 Texture root 的 trace 差异</title>
<desc id="desc">独立 root 与宿主消费 root 在不同队列追完成和提交。 Raster CPU 结束后仍需确认源 GPU 与显示后段；窗口未更新不独立证明宿主是根因。 surface root Flutter buffer 进入独立 Layer 对应 root fence / own queue SF latch / display feedback；texture root Flutter image 供宿主消费 对应 源 GPU 依赖 / host draw HWUI sample / window queue</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
