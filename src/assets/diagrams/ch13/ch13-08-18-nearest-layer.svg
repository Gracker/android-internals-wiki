<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">绘制失效到最近 layer 边界</title>
<desc id="desc">普通节点内容变化可扩大到其最近所属 layer 的重录范围。 其他 layer 未失效时可继续复用；隔离边界需要结合实际成本选择。 无layer时向上失效；直到最近层边界；所属layer重录时可引用内部独立子layer的未变记录</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="620" fill="white"/>
<path d="M 365 135 L 450 135" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 129 L 450 135 L 440 141" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 135 L 835 135" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 129 L 835 135 L 825 141" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 195 L 985 415 L 750 415" stroke="#202020" stroke-width="2.8" fill="none" stroke-dasharray="7 6"/>
<path d="M 760 409 L 750 415 L 760 421" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 75 Q 215.0 74.8 361 75 Q 365 75 365 79 L 365 191 Q 365 195 361 195 Q 215.0 194.8 69 195 Q 65 195 65 191 L 65 79 Q 65 75 69 75" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="126.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">普通子节点 draw 改变</tspan>
<tspan x="215.0" dy="34.0">没有独立 layer</tspan>
</text>
<path d="M 454 75 Q 600.0 74.3 746 75 Q 750 75 750 79 L 750 191 Q 750 195 746 195 Q 600.0 195.4 454 195 Q 450 195 450 191 L 450 79 Q 450 75 454 75" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="126.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">沿 coordinator 向上</tspan>
<tspan x="600.0" dy="34.0">找最近所属 layer</tspan>
</text>
<path d="M 839 75 Q 985.0 74.4 1131 75 Q 1135 75 1135 79 L 1135 191 Q 1135 195 1131 195 Q 985.0 195.5 839 195 Q 835 195 835 191 L 835 79 Q 835 75 839 75" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="126.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">该 layer 内容 dirty</tspan>
<tspan x="985.0" dy="34.0">重录受覆盖的 draw</tspan>
</text>
<path d="M 454 355 Q 600.0 355.3 746 355 Q 750 355 750 359 L 750 471 Q 750 475 746 475 Q 600.0 475.3 454 475 Q 450 475 450 471 L 450 359 Q 450 355 454 355" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="406.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">内部独立子 layer</tspan>
<tspan x="600.0" dy="34.0">内容未变可引用旧记录</tspan>
</text>
<rect x="931.0" y="285.0" width="108.0" height="36.3" fill="white"/>
<text x="985" y="310" text-anchor="middle" style="font-size:23px">
<tspan x="985" dy="0">引用子层</tspan>
</text>
</svg>
