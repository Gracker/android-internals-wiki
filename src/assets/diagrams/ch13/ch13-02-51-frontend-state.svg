<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">多 Layer 的请求状态与输出快照</title>
<desc id="desc">当前 SF 分开管理请求状态、生命周期/层级和本轮快照。 buffer readiness、fence 与内容选择还要另查，不能仅套逐个旧 Layer latch 的模型。 收到 transaction
保存各路请求更新 → RequestedLayerState
描述目标状态；RequestedLayerState
描述目标状态 → LayerLifecycleManager
组织生命周期与 hierarchy；LayerLifecycleManager
组织生命周期与 hierarchy → LayerSnapshotBuilder
生成本轮可见性、几何与效果</desc>
