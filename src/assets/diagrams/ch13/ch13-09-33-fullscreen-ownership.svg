<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">固定 Chromium 的 FullScreenView 切换</title>
<desc id="desc">同一 AwContents 可迁移到 FullScreenView，网页绘制仍可能继续用 functor。 这是固定实现例子，类名不是公开跨版本保证；媒体 overlay 是另一条可并存机制。 拆下旧宿主关联；建立FullScreenView承载；新挂载后再次绘制；退出时还原承载对象</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 365 120 L 450 120" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114 L 450 120 L 440 126" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120 L 835 120" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114 L 835 120 L 825 126" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 175 L 985 345" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 335 L 985 345 L 991 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 835 405 L 750 405" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 760 399 L 750 405 L 760 411" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.3 361 60 Q 365 60 365 64 L 365 171 Q 365 175 361 175 Q 215.0 174.2 69 175 Q 65 175 65 171 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="110.02" text-anchor="middle" style="font-size:22px">
<tspan x="215.0" dy="0">普通嵌入模式</tspan>
<tspan x="215.0" dy="29.92">WebView 承载 AwContents</tspan>
</text>
<path d="M 454 60 Q 600.0 60.0 746 60 Q 750 60 750 64 L 750 171 Q 750 175 746 175 Q 600.0 175.5 454 175 Q 450 175 450 171 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="109.34" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">enterFullScreen</tspan>
<tspan x="600.0" dy="32.64">切换绘制委托 / container</tspan>
</text>
<path d="M 839 60 Q 985.0 59.4 1131 60 Q 1135 60 1135 64 L 1135 171 Q 1135 175 1131 175 Q 985.0 175.1 839 175 Q 835 175 835 171 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="95.06" text-anchor="middle" style="font-size:22px">
<tspan x="985.0" dy="0">FullScreenView</tspan>
<tspan x="985.0" dy="29.92">FrameLayout / 同一</tspan>
<tspan x="985.0" dy="29.92">AwContents</tspan>
</text>
<path d="M 839 345 Q 985.0 345.2 1131 345 Q 1135 345 1135 349 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.6 839 460 Q 835 460 835 456 L 835 349 Q 835 345 839 345" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="394.0" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">新 container onDraw</tspan>
<tspan x="985.0" dy="34.0">重新建立 functor</tspan>
</text>
<path d="M 454 345 Q 600.0 344.8 746 345 Q 750 345 750 349 L 750 456 Q 750 460 746 460 Q 600.0 459.5 454 460 Q 450 460 450 456 L 450 349 Q 450 345 454 345" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="394.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">exitFullScreen</tspan>
<tspan x="600.0" dy="34.0">委托切回原 WebView</tspan>
</text>
</svg>
