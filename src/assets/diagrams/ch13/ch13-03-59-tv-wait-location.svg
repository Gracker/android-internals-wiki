<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">同名 dequeue 要先定位是哪套队列</title>
<desc id="desc">外部 Producer、RT 输入消费和宿主输出分别对应不同上游。 一个可见帧可以同时受两套背压影响，报告需注明 buffer 与 fence 创建者。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
