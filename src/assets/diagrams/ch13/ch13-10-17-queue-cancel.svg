<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">CameraService 正常交付与丢弃分支</title>
<desc id="desc">CameraService 按状态、丢帧标志与时间戳选择 queue 或 cancel。 两条路径都须保留 HAL release fence，读取不能越过依赖。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
