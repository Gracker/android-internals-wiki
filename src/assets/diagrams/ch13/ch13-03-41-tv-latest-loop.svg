<title id="title">取最新的循环与停止条件</title>
<desc id="desc">循环可以跳过旧输入，也可因队列空、未 signal fence 或失败停止。 outQueueEmpty 是外层停止保护提示，不保证物理队列为空；无新输入可返回 current。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
