<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">帧回调投递与任务排队的时序</title>
<desc id="desc">用 flow 联系平台回调与 UI 处理，再区分新构建和复用。 时序条仅表示依赖，长度非实测；回调不能抢占 Main 上正在运行的任务。 投递后可能排队；按本轮构建需求分支</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="670" fill="white"/>
<path d="M 365 100 L 450 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 94 L 450 100 L 440 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 100 L 835 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 94 L 835 100 L 825 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 45 Q 215.0 44.5 361 45 Q 365 45 365 49 L 365 151 Q 365 155 361 155 Q 215.0 154.3 69 155 Q 65 155 65 151 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">PlatformVsync</tspan>
<tspan x="215.0" dy="34.0">FireCallback 产生 flow</tspan>
</text>
<path d="M 454 45 Q 600.0 45.2 746 45 Q 750 45 750 49 L 750 151 Q 750 155 746 155 Q 600.0 154.6 454 155 Q 450 155 450 151 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="92.18" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">UI task runner</tspan>
<tspan x="600.0" dy="31.28">ProcessCallback 实际执行</tspan>
</text>
<path d="M 839 45 Q 985.0 44.4 1131 45 Q 1135 45 1135 49 L 1135 151 Q 1135 155 1131 155 Q 985.0 154.8 839 155 Q 835 155 835 151 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">按条件 BeginFrame</tspan>
<tspan x="985.0" dy="34.0">或 DrawLastLayerTrees</tspan>
</text>
<text x="600" y="630" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">同一 runner 上串行处理；图不表示固定等待时长</tspan>
</text>
<text x="241" y="273" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">回调入口</tspan>
</text>
<path d="M 255 289 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 259 250 Q 380.0 250.4 501 250 Q 505 250 505 254 L 505 283 Q 505 287 501 287 Q 380.0 286.8 259 287 Q 255 287 255 283 L 255 254 Q 255 250 259 250" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="380.0" y="276" text-anchor="middle" style="font-size:21px">
<tspan x="380.0" dy="0">frame callback / post</tspan>
</text>
<text x="241" y="378" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">UI runner</tspan>
</text>
<path d="M 255 394 H 1105" stroke="#777777" stroke-width="1.5"/>
