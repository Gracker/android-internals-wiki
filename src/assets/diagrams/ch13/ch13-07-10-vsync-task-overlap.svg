<text x="625.0" y="381" text-anchor="middle" style="font-size:21px">
<tspan x="625.0" dy="0">前序任务</tspan>
</text>
<path d="M 779 355 Q 925.0 354.3 1071 355 Q 1075 355 1075 359 L 1075 388 Q 1075 392 1071 392 Q 925.0 391.4 779 392 Q 775 392 775 388 L 775 359 Q 775 355 779 355" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="925.0" y="381" text-anchor="middle" style="font-size:21px">
