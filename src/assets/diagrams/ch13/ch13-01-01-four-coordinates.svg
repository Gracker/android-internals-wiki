<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">用四个对象坐标识别出图路径</title>
<desc id="desc">先对应 Producer、输出目标、Layer 拓扑与合成结果。 框架名和线程名只提供候选，最终用对象标识验证。 Producer
谁生成并提交 buffer → Surface / swapchain
内容写入哪里；Surface / swapchain
内容写入哪里 → Layer 拓扑
宿主窗口或独立 child；Layer 拓扑
宿主窗口或独立 child → Composition / present
目标 display 如何输出</desc>
