<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">包级 A/B 配置的可恢复流程</title>
<desc id="desc">先保存原列表，成对修改目标条目，测试后精确恢复。 put 替换整个全局列表；只有原先 key 不存在时才用 delete 恢复。 记录 pkgs / values / all_angle
检查已有其他包配置 → 成对修改目标包条目
保留其他项的一一对应；成对修改目标包条目
保留其他项的一一对应 → 重启进程并核实 backend
进行同条件 A/B；重启进程并核实 backend
进行同条件 A/B → 恢复原值 / 原不存在状态
重启并再次核实</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 525 120.0 L 675 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 665 114.0 L 675 120.0 L 665 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 60.5 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 180.5 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">记录 pkgs / values / all_angle</tspan>
<tspan x="310.0" dy="34.0">检查已有其他包配置</tspan>
</text>
<path d="M 679 60 Q 890.0 59.8 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.8 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">成对修改目标包条目</tspan>
<tspan x="890.0" dy="34.0">保留其他项的一一对应</tspan>
</text>
<path d="M 679 340 Q 890.0 340.7 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.4 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">重启进程并核实 backend</tspan>
<tspan x="890.0" dy="34.0">进行同条件 A/B</tspan>
</text>
<path d="M 99 340 Q 310.0 340.0 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.1 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">恢复原值 / 原不存在状态</tspan>
<tspan x="310.0" dy="34.0">重启并再次核实</tspan>
</text>
</svg>
