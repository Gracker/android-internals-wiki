<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">四组 Compose 机制如何衔接</title>
<desc id="desc">Snapshot 记录依赖，Recomposer 应用结构变化，节点与 layer 承载布局和绘制。 层级之间按变更传播；不表示一次写入必定重走所有机制。 Snapshot state / observer
版本可见性与读者集合 → Recomposer / applyChanges
处理需要重组的范围；Recomposer / applyChanges
处理需要重组的范围 → LayoutNode / Modifier nodes
测量、放置、绘制与语义；LayoutNode / Modifier nodes
测量、放置、绘制与语义 → OwnedLayer / GraphicsLayer
绘制记录和属性复用</desc>
