<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">像素完成依赖与几何进入同一事务</title>
<desc id="desc">先绑定 buffer/fence，再一起提交所需几何与可见性。 crop/position 需 API31；apply 后可删除本地 transaction，异步工作继续。 Producer 提交写入
导出 acquire fence → setBuffer + crop / position
show 等 Layer 状态；setBuffer + crop / position
show 等 Layer 状态 → apply → delete tx
不等待 GPU 或显示；apply → delete tx
不等待 GPU 或显示 → 依提交记录跟踪 release
不能直接复写当前 buffer</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
