<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">CameraX InputRequest 到 HAL input</title>
<desc id="desc">从应用候选一直对应到原生 input_buffer 与 AIDL 标识。 HAL 内部是否再次经过某 ISP 模块由实现决定。 CameraX InputRequest
图像 + FrameInfo → Camera2 reprocess request
基于源结果构造；Camera2 reprocess request
基于源结果构造 → Camera3 mInputStream
读取 session 下一输入图像；Camera3 mInputStream
读取 session 下一输入图像 → native input_buffer
连同 input 尺寸；native input_buffer
连同 input 尺寸 → AIDL inputBuffer
ID / 缓存 / acquire fence；AIDL inputBuffer
ID / 缓存 / acquire fence → HAL reprocess
结果归还 input 与 outputs</desc>
