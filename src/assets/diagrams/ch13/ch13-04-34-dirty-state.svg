<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">GLES dirty bits 到 Vulkan 工作</title>
<desc id="desc">前端积累状态，后端在需要执行时准备 Vulkan 状态与命令。 语义上的阶段关系不意味着每次 GL 状态修改都即时发出 Vulkan 命令。 GLES API / 对象状态
记录 dirty bits → ContextVk::syncState
同步 viewport / program 等；ContextVk::syncState
同步 viewport / program 等 → Pipeline / descriptor / barriers
按实际需求准备；Pipeline / descriptor / barriers
按实际需求准备 → Vulkan command buffer
记录 draw / dispatch / clear</desc>
