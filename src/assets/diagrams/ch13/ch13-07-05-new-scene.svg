<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">新 scene 从 BeginFrame 到 Raster</title>
<desc id="desc">新 scene 需先取得 pipeline 空位，按 view 收集后才交给 Raster。 PipelineFull 可使 BeginFrame 早退；没有 Render 或重试不保证产生新 buffer。 已请求的 VSync callback
需要重新生成 layer tree → BeginFrame / Produce
先取得 pipeline 空位；BeginFrame / Produce
先取得 pipeline 空位 → Dart frame work
animation / build / layout / paint；Dart frame work
animation / build / layout / paint → Render(view id)
收集本轮 LayerTreeTask；Render(view id)
收集本轮 LayerTreeTask → EndFrame / Complete
有任务才放入 pipeline；EndFrame / Complete
有任务才放入 pipeline → Raster Draw / DoDraw
消费后取得 target 并提交</desc>
