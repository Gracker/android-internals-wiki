<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">普通队列的所有权与 fence 边界</title>
<desc id="desc">主要非 shared-buffer 路径按 dequeue、queue、acquire、release 周转。 省略 cancel、drop、detach/attach；FREE 或已 release 不自动表示有效 fence 已完成。 FREE 候选
可回收所有权 → DEQUEUED
写前满足 release fence；DEQUEUED
写前满足 release fence → QUEUED
提交内容与 acquire fence；QUEUED
提交内容与 acquire fence → ACQUIRED
消费者取得并使用；ACQUIRED
消费者取得并使用 → release → FREE
后续复用仍看 fence</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
