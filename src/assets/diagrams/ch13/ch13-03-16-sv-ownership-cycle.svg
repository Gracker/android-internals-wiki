<tspan x="985.0" dy="0">QUEUED</tspan>
<tspan x="985.0" dy="32.64">提交内容与 acquire fence</tspan>
</text>
<path d="M 839 340 Q 985.0 340.7 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.3 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
