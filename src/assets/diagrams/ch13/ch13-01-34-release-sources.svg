<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">正常释放与 stale buffer 补释放</title>
<desc id="desc">按来源区分正常释放、完成回调补通知和真正的 fence 完成。 fake release 是补回调，不是伪造内核已完成信号。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
