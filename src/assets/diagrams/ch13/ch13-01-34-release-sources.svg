<tspan x="215.0" dy="34.0">或 release channel</tspan>
</text>
<path d="M 454 60 Q 600.0 60.7 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.3 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="112.52" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">transaction completed</tspan>
<tspan x="600.0" dy="29.92">发现 stale submitted buffer</tspan>
</text>
