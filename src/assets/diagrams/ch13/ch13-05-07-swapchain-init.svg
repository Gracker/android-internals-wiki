<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">原生 surface 与 swapchain 初始化</title>
<desc id="desc">先查 present 支持和窗口能力，再决定合法交换链参数。 queue family 是接口能力分组；image 数应创建后再查，不能预设固定双/三缓冲。 ANativeWindow
创建 VkSurfaceKHR → 查询 family present 支持
capabilities / format / mode；查询 family present 支持
capabilities / format / mode → 选择 extent / usage / transform
image count 等参数；选择 extent / usage / transform
image count 等参数 → 创建 swapchain / images
准备正确的同步资源</desc>
