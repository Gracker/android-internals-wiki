<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Swappy 的 swapchain 生命周期</title>
<desc id="desc">为每个 swapchain 初始化并在重建时更新库状态，仍处理 VkResult。 骨架不是完整库调用协议；具体 hook、签名和配置须锁定 AGDK 版本。 创建 swapchain
为该目标初始化 Swappy → 配置目标 / auto mode
明确 pacing 所有者；配置目标 / auto mode
明确 pacing 所有者 → submit 后包装 present
处理 OUT_OF_DATE 等结果；submit 后包装 present
处理 OUT_OF_DATE 等结果 → 重建 swapchain
更新或重建对应库状态</desc>
