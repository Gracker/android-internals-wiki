<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">AndroidViewHolder 的布局和绘制适配</title>
<desc id="desc">holder 连接两套布局协议，并把普通 View 的内容放回宿主 draw 链。 包装不天然创建 Surface；内部若含独立 Producer，需另查其生命周期和同步。 Compose Constraints
结合 View LayoutParams → obtainMeasureSpec / View.measure
取得传统 View 尺寸；obtainMeasureSpec / View.measure
取得传统 View 尺寸 → Compose placement
layoutAccordingTo / View.layout；Compose placement
layoutAccordingTo / View.layout → drawBehind / drawAndroidView
宿主记录传统 View 内容；View invalidation请求后续所属绘制范围更新，不是draw之后固定发生</desc>
