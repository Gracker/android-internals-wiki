<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ANGLE 偏好、设置与最终后端</title>
<desc id="desc">选路意图要经过 setup 和实际库加载，最终用当前 context 验证。 native 查询不是最终厂商 GLES 证明；已要求 ANGLE 的库加载失败可触发 fatal。 Settings / resource / manifest
形成 angle/native/default 意图 → setupAngle + flags / properties
决定是否配置 ANGLE；setupAngle + flags / properties
决定是否配置 ANGLE → Loader 实际装入库
失败处理有 fatal 边界；Loader 实际装入库
失败处理有 fatal 边界 → 正确 context / maps / trace
确认本进程的实际后端</desc>
