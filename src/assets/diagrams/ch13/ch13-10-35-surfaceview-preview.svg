<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">SurfaceView 预览的提交与显示</title>
<desc id="desc">相机预览 buffer 经独立队列和 transaction 进入系统显示。 是否 DEVICE composition 要看该帧全部 Layer 的协商结果。 HAL 写 preview buffer
归还 release fence → CameraService queue
携带完成依赖；CameraService queue
携带完成依赖 → BLAST / SurfaceControl
buffer 与几何协调；BLAST / SurfaceControl
buffer 与几何协调 → SF 采纳并安排合成
读取必须满足依赖；SF 采纳并安排合成
读取必须满足依赖 → HWC / present 反馈
逐 Layer 查看合成类型</desc>
