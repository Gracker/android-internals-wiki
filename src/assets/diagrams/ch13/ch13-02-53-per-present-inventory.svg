<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">逐项还原一次 present 使用的内容</title>
<desc id="desc">逐个对象记录新旧 buffer、几何和合成类型，再解释异常画面。 BufferTX 是 SF 待处理 buffer 更新计数，不能替代 fence、ready 或 present 证据。 目标 display / present
锁定异常可见时刻 → 宿主 H 与独立 I
记录采纳新内容或沿用旧内容；宿主 H 与独立 I
记录采纳新内容或沿用旧内容 → container 与 parent 状态
记录 position / crop / Z；container 与 parent 状态
记录 position / crop / Z → 宿主内部 Texture T
记录这块 H 的实际输入；宿主内部 Texture T
记录这块 H 的实际输入 → DEVICE / CLIENT
记录 Layer 类型与 client target</desc>
