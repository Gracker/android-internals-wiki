<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">工具 frame-boundary 到显示仍有异步阶段</title>
<desc id="desc">边界标注只把工作归组，后续交接、读取依赖和显示结果还需单独追踪。 queue 可先于 GPU 完成，受限 latch 可先于 signal；标记不保证画面赶上目标周期。 submit 附 frame annotation
给 GPU 工具分组 → CPU 导出 fd / queue buffer
GPU 可尚未完成；CPU 导出 fd / queue buffer
GPU 可尚未完成 → BLAST / SF readiness / latch
真正读取前遵守 acquire；BLAST / SF readiness / latch
真正读取前遵守 acquire → 合成策略 / HWC present
再检查目标 display 反馈</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
