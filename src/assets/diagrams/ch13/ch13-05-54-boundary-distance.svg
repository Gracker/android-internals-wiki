<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">submit 附 frame annotation</tspan>
<tspan x="310.0" dy="34.0">给 GPU 工具分组</tspan>
</text>
