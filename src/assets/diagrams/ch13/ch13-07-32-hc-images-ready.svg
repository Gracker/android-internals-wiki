<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HC 的 root 与 overlay 图像完整性检查</title>
<desc id="desc">原始 HC 在帧结束检查所需 image，避免把不完整的 Flutter overlay 与原生 View 混合。 固定同步开启时，所需 root/overlay 图像未齐会隐藏本帧原生 parent；不是每次 endFrame 都可见。 左分支条件；右分支条件</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 600 170 L 600 255 L 310 255 L 310 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 325 L 310 335 L 316 325" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 170 L 600 255 L 890 255 L 890 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 325 L 890 335 L 896 325" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 55 Q 600.0 54.6 811 55 Q 815 55 815 59 L 815 166 Q 815 170 811 170 Q 600.0 170.0 389 170 Q 385 170 385 166 L 385 59 Q 385 55 389 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="104.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">当前帧所需 root / overlay</tspan>
<tspan x="600.0" dy="34.0">全部 acquire 到 image？</tspan>
</text>
<path d="M 99 335 Q 310.0 334.6 521 335 Q 525 335 525 339 L 525 456 Q 525 460 521 460 Q 310.0 460.4 99 460 Q 95 460 95 456 L 95 339 Q 95 335 99 335" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="389.0" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">是且本帧使用该 PlatformView</tspan>
<tspan x="310.0" dy="34.0">parent View 可设 VISIBLE</tspan>
</text>
<path d="M 679 335 Q 890.0 334.8 1101 335 Q 1105 335 1105 339 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.1 679 460 Q 675 460 675 456 L 675 339 Q 675 335 679 335" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="389.0" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">否且同步开启</tspan>
<tspan x="890.0" dy="34.0">parent View 设 GONE</tspan>
</text>
</svg>
