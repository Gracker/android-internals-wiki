<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">presentOrValidate的条件与分支</title>
<desc id="desc">快路径可能完成提交，也可能转入常规协商。 PresentSucceeded 不表示显示硬件已经结束工作。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
