<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">WebView 数量与 renderer 数量</title>
<desc id="desc">同一 Profile 共享 renderer，多 Profile 与内置错误页可能增加进程。 按实际 provider 能力和 Profile 配置核对，不能用 WebView 实例数推导 renderer 数。 同Profile共享策略A；多Profile对应独立rendererB</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="740" fill="white"/>
<path d="M 500 155 L 500 220 L 310 220 L 310 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 270 L 310 280 L 316 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 155 L 700 220 L 890 220 L 890 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 270 L 890 280 L 896 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 40 Q 600.0 39.6 811 40 Q 815 40 815 44 L 815 151 Q 815 155 811 155 Q 600.0 154.5 389 155 Q 385 155 385 151 L 385 44 Q 385 40 389 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="89.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">WebView 按 Profile 归属</tspan>
<tspan x="600.0" dy="34.0">固定现代 provider 策略</tspan>
</text>
<path d="M 99 280 Q 310.0 279.8 521 280 Q 525 280 525 284 L 525 401 Q 525 405 521 405 Q 310.0 405.4 99 405 Q 95 405 95 401 L 95 284 Q 95 280 99 280" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="334.0" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">Profile A：多个 WebView</tspan>
<tspan x="310.0" dy="34.0">通常共享 renderer A</tspan>
</text>
<path d="M 679 280 Q 890.0 279.8 1101 280 Q 1105 280 1105 284 L 1105 401 Q 1105 405 1101 405 Q 890.0 405.5 679 405 Q 675 405 675 401 L 675 284 Q 675 280 679 280" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="334.0" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">Profile B：多个 WebView</tspan>
<tspan x="890.0" dy="34.0">可有自己的 renderer B</tspan>
</text>
<path d="M 389 510 Q 600.0 510.6 811 510 Q 815 510 815 514 L 815 616 Q 815 620 811 620 Q 600.0 619.5 389 620 Q 385 620 385 616 L 385 514 Q 385 510 389 510" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="556.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">内置错误页 / webui</tspan>
<tspan x="600.0" dy="34.0">可能有额外 renderer</tspan>
</text>
</svg>
