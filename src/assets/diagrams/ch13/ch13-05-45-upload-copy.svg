<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">hardware bitmap 创建中的内容传输</title>
<desc id="desc">CPU 数据经过必要转换和传输写进新 AHardwareBuffer，再供 GPU 采样。 AHardwareBuffer 不保证零复制、恰好一次内部搬运或没有 staging 存储。 已有 CPU SkBitmap pixels
检查格式支持 → 必要时 makeHwCompatible
可先做 CPU 格式转换；必要时 makeHwCompatible
可先做 CPU 格式转换 → 分配 sampled-image AHB
上传源像素数据；分配 sampled-image AHB
上传源像素数据 → Bitmap 包装共享 buffer
供后续窗口帧采样</desc>
