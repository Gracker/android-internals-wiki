<text x="600.0" y="112.18" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">普通 buffer 更新</tspan>
<tspan x="600.0" dy="31.28">BLAST 创建本地事务</tspan>
</text>
