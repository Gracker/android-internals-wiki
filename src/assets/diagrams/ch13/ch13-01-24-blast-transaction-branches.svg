<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">BLAST 普通提交与同步窗口更新</title>
<desc id="desc">BLAST 从应用内队列取出 buffer，再组织 SurfaceControl transaction。 无法立即 acquire 时可延后；普通与同步路径的 apply 所有者不同。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
