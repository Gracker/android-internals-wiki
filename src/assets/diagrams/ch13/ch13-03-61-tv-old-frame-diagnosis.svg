<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">queue 之后仍旧画面的检查门槛</title>
<desc id="desc">从通知到宿主输出逐段定位旧输入在哪里被保留。 外部 queue 只证明输入已提交，不能证明已进入当前宿主 H。 输入 queue
确认目标 ST / frame → listener / visibility
通知是否恢复并执行；listener / visibility
通知是否恢复并执行 → UI applyUpdate
本次 updater 是否提交；UI applyUpdate
本次 updater 是否提交 → RT 选择与 acquire
输入是哪块 / 何时可读；RT 选择与 acquire
输入是哪块 / 何时可读 → 宿主 H / SF 输出
是否真的使用新内容</desc>
