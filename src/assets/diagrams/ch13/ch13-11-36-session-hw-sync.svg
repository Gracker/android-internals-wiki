<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">audio session与硬件sync ID</title>
<desc id="desc">Java audio session id 经查询转换为 native 硬件同步 ID。 两个值和职责不同，不能直接画成同一个标识。 应用 audio session id
AudioTrack 与视频共享 → MediaCodec Java 配置
识别 AUDIO_SESSION_ID；MediaCodec Java 配置
识别 AUDIO_SESSION_ID → AudioSystem 查询 session
获取 hardware sync id；AudioSystem 查询 session
获取 hardware sync id → 改写 native audio-hw-sync
传递给 codec component；改写 native audio-hw-sync
传递给 codec component → 音频 HAL / 设备同步
关联对应时钟与流</desc>
