<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">onSurfaceTextureUpdated 只证明 UI 提交了更新</title>
<desc id="desc">通知、UI 更新、RT 取帧与宿主显示分别举证。 Updated callback 不证明 acquire、GPU 完成或可见性；帧号也不与通知一一对应。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
