<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">TextureView 的输入与宿主两次生产</title>
<desc id="desc">外部 queue 到应用输入，宿主 queue 才把最终窗口交给显示系统。 两次 buffer 生产不等于固定两帧延迟，时延取决于调度、取帧与 fence。 外部 Producer
生成输入内容 T → SurfaceTexture 输入队列
应用 HWUI Consumer；SurfaceTexture 输入队列
应用 HWUI Consumer → RenderThread 组织 / GPU 采样
把 T 混入宿主 H；RenderThread 组织 / GPU 采样
把 T 混入宿主 H → 宿主 Window 队列 / BLAST
提交包含 UI 的 H；宿主 Window 队列 / BLAST
提交包含 UI 的 H → SF / HWC / Display
显示宿主 Layer</desc>
