<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="title desc">
<title id="title">多个 ComposeView 的共享边界</title>
<desc id="desc">每个内容 root 有自己的宿主和生命周期，context 与应用 state 却可以共享。 不同 root 不保证状态隔离，也不保证各自独占 Recomposer；以真实 context 查找为准。 查找或显式获得context A；查找或显式获得context B；A可读同一state；B可读同一state</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="765" fill="white"/>
<path d="M 500 165 L 500 235 L 310 235 L 310 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 290 L 310 300 L 316 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 165 L 700 235 L 890 235 L 890 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 290 L 890 300 L 896 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 500 525 L 500 465 L 310 465 L 310 415" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 425 L 310 415 L 316 425" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 525 L 700 465 L 890 465 L 890 415" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 425 L 890 415 L 896 425" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 50 Q 600.0 50.6 811 50 Q 815 50 815 54 L 815 161 Q 815 165 811 165 Q 600.0 165.6 389 165 Q 385 165 385 161 L 385 54 Q 385 50 389 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="99.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">可共享 window Recomposer</tspan>
<tspan x="600.0" dy="34.0">或显式 parent context</tspan>
</text>
<path d="M 99 300 Q 310.0 300.3 521 300 Q 525 300 525 304 L 525 411 Q 525 415 521 415 Q 310.0 414.2 99 415 Q 95 415 95 411 L 95 304 Q 95 300 99 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="349.0" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">ComposeView A</tspan>
<tspan x="310.0" dy="34.0">composition root / owner A</tspan>
</text>
<path d="M 679 300 Q 890.0 299.4 1101 300 Q 1105 300 1105 304 L 1105 411 Q 1105 415 1101 415 Q 890.0 415.4 679 415 Q 675 415 675 411 L 675 304 Q 675 300 679 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="349.0" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">ComposeView B</tspan>
<tspan x="890.0" dy="34.0">composition root / owner B</tspan>
</text>
<path d="M 389 525 Q 600.0 524.6 811 525 Q 815 525 815 529 L 815 636 Q 815 640 811 640 Q 600.0 640.5 389 640 Q 385 640 385 636 L 385 529 Q 385 525 389 525" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="574.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">应用 state</tspan>
<tspan x="600.0" dy="34.0">可由多个 root 显式共享</tspan>
</text>
</svg>
