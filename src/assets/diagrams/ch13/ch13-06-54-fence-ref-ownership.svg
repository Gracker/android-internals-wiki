<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Java wrapper、native Fence 与 fd 生命周期</title>
<desc id="desc">Java 提交时 native transaction 增持 Fence，wrapper 可以独立关闭。 NDK setBuffer 则接管传入 fd；任何一种 close 都不能代替等待完成。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 215 180 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 180 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.6 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.9 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">HBR JNI 返回 fd</tspan>
<tspan x="215.0" dy="34.0">SyncFence.adopt</tspan>
</text>
<path d="M 454 60 Q 600.0 60.4 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.4 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="97.56" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">Java setBuffer(SyncFence)</tspan>
<tspan x="600.0" dy="29.92">transaction 持 native</tspan>
<tspan x="600.0" dy="29.92">sp&lt;Fence&gt;</tspan>
</text>
<path d="M 839 60 Q 985.0 59.8 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.6 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">NDK setBuffer(fd)</tspan>
<tspan x="985.0" dy="34.0">framework 接管 fd</tspan>
</text>
<path d="M 69 340 Q 215.0 339.7 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.7 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="392.52000000000004" text-anchor="middle" style="font-size:22px">
<tspan x="215.0" dy="0">新 wrapper 由调用方 close</tspan>
<tspan x="215.0" dy="29.92">保留直到所需交接完成</tspan>
</text>
<path d="M 454 340 Q 600.0 339.4 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.2 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">提交后可关原 wrapper</tspan>
<tspan x="600.0" dy="34.0">native 仍保留完成依赖</tspan>
</text>
<path d="M 839 340 Q 985.0 340.5 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.1 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="391.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="985.0" dy="0">传后不再由原调用方 close</tspan>
<tspan x="985.0" dy="32.64">诊断需事前 dup 另一份</tspan>
</text>
</svg>
