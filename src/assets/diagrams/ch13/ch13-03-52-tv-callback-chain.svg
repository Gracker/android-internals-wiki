<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">frame available 通知通过宿主 handler 传播</title>
<desc id="desc">输入通知只设置更新与 dirty，不等于 RT 已取得输入。 裸 SurfaceTexture 可自选 handler；TextureView 内部按 ViewRoot handler 解释。 Producer 输入 queue
触发 frame available → ViewRoot handler
串行执行内部 listener；ViewRoot handler
串行执行内部 listener → updateLayer / invalidate
合并宿主 traversal；updateLayer / invalidate
合并宿主 traversal → UI 提交 updater
RT 才有本次更新对象</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
