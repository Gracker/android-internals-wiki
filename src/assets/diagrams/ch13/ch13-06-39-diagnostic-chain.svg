<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">SurfaceControl 从生产到安全复用的证据链</title>
<desc id="desc">沿同一内容依次核对生产、提交、采纳、合成和回收。 DEVICE/CLIENT 是 per-Layer 结果；某段等待要沿 fence 找真实依赖。 图表示排查顺序，不表示 GPU 必须先 signal 才能 apply。 Producer / GPU 或 codec
写入与 acquire signal → 应用 apply / 覆盖
对应 transaction / frame id；应用 apply / 覆盖
对应 transaction / frame id → SF readiness / latch
parent / Z / crop / buffer；SF readiness / latch
parent / Z / crop / buffer → 每 Layer DEVICE / CLIENT
RenderEngine / HWC；每 Layer DEVICE / CLIENT
RenderEngine / HWC → display present 反馈
目标 DisplayFrame；display present 反馈
目标 DisplayFrame → release 与 pool
确认 slot 恢复可写</desc>
