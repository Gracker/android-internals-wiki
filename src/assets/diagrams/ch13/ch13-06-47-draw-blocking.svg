<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">draw 的 host 同步与 GPU fence 是不同边界</title>
<desc id="desc">draw 需要等待场景同步边界，GPU 完成另由返回 fence 表达。 图示 canUnblockUiThread 允许较早返回的情况；条长不表示性能比例。 调用方等待RT同步边界；RTflush后经JNI和executor交付结果</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="820" fill="white"/>
<path d="M 365 105 L 450 105" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 99 L 450 105 L 440 111" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 105 L 835 105" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 99 L 835 105 L 825 111" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 45 Q 215.0 45.5 361 45 Q 365 45 365 49 L 365 161 Q 365 165 361 165 Q 215.0 165.4 69 165 Q 65 165 65 161 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="96.84" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">调用方 draw</tspan>
<tspan x="215.0" dy="32.64">postAndWait / host 同步</tspan>
</text>
<path d="M 454 45 Q 600.0 45.1 746 45 Q 750 45 750 49 L 750 161 Q 750 165 746 165 Q 600.0 164.8 454 165 Q 450 165 450 161 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">RT 同步 / 绘制 / flush</tspan>
<tspan x="600.0" dy="34.0">可先唤醒调用方</tspan>
</text>
<path d="M 839 45 Q 985.0 44.5 1131 45 Q 1135 45 1135 49 L 1135 161 Q 1135 165 1131 165 Q 985.0 165.6 839 165 Q 835 165 835 161 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="96.84" text-anchor="middle" style="font-size:24px">
<tspan x="985.0" dy="0">executor 交付结果</tspan>
<tspan x="985.0" dy="32.64">GPU fence 仍可 pending</tspan>
</text>
<text x="241" y="283" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">draw 调用方</tspan>
</text>
