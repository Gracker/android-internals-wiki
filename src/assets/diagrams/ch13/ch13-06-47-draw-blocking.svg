<path d="M 259 260 Q 405.0 259.5 551 260 Q 555 260 555 264 L 555 293 Q 555 297 551 297 Q 405.0 296.7 259 297 Q 255 297 255 293 L 255 264 Q 255 260 259 260" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="405.0" y="286" text-anchor="middle" style="font-size:21px">
<tspan x="405.0" dy="0">host sync wait</tspan>
</text>
<text x="241" y="373" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">RenderThread</tspan>
</text>
<path d="M 255 389 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 329 350 Q 550.0 349.6 771 350 Q 775 350 775 354 L 775 383 Q 775 387 771 387 Q 550.0 387.8 329 387 Q 325 387 325 383 L 325 354 Q 325 350 329 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
