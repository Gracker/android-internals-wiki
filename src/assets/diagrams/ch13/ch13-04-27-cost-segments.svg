<title id="title">ANGLE 成本的四段归因</title>
<desc id="desc">逐段区分应用调用、ANGLE 转换、厂商驱动/GPU 与窗口显示。 结构图不提供快慢结论；设备、workload 与 cache 状态决定实测结果。 应用 GLES 调用
状态切换与对象使用 → ANGLE frontend / backend
校验、翻译与缓存；ANGLE frontend / backend
校验、翻译与缓存 → Vulkan driver / GPU
编译、提交与执行；Vulkan driver / GPU
编译、提交与执行 → Window / display
WSI、队列与合成</desc>
