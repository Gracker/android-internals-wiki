<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">EGL window surface 到显示的交接</title>
<desc id="desc">窗口驱动把 buffer 与写入完成依赖交给 native window，再经 BLAST 事务进入 SF。 GLES 命令通过图形驱动执行，GPU 本身不直接调用 queueBuffer。 EGL window surface
当前默认 framebuffer → Surface / ANativeWindow
驱动交出 buffer + fence；Surface / ANativeWindow
驱动交出 buffer + fence → BufferQueue / BLAST
取得输入并组织事务；BufferQueue / BLAST
取得输入并组织事务 → SF / Composer
采纳、合成与 present</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
