<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">长 dequeue 不等于只有 release fence 慢</title>
<desc id="desc">候选 slot 等待、分配与写前 fence 依赖必须按调用栈区分。 无槽可等待、超时或失败；max-dequeued 违规也可能报错，不能只增加深度。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
