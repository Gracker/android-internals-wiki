<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Engine 事件的阶段范围</title>
<desc id="desc">用事件范围识别 callback 排队、Dart scene 交付与 Raster 消费。 PipelineFull 可提前退出；reuse、discard、retry 会改变事件序列，名称不能代替结果。 PlatformVsync
记录 frame start / target → FireCallback → ProcessCallback
flow 关联 UI 处理；FireCallback → ProcessCallback
flow 关联 UI 处理 → BeginFrame / PipelineFull
先区分是否有构建空位；BeginFrame / PipelineFull
先区分是否有构建空位 → Render / EndFrame
有 scene 才入 pipeline；Render / EndFrame
有 scene 才入 pipeline → GPURasterizer.Draw / DoDraw
实际消费或 retry；GPURasterizer.Draw / DoDraw
实际消费或 retry → DrawToSurfaces
绘制提交区间非 GPU 完成</desc>
