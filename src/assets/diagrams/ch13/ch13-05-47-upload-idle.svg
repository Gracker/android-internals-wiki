<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">上传 context 的 60 秒闲置回收</title>
<desc id="desc">延迟检查满足无 pending upload 和闲置阈值时清理上传 context/强引用。 60000 ms 是检查阈值，不保证精确到时回收或固定 GPU 内存回收量；不等于线程必然退出。 上传完成
更新 mLastUpload → 延迟 idleTimeoutCheck
无 pending 且超过 60000 ms；延迟 idleTimeoutCheck
无 pending 且超过 60000 ms → VkUploader::onIdle
清 context 与 manager 强引用；VkUploader::onIdle
清 context 与 manager 强引用 → 下次上传
按仍存活的 manager 按需重建</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 525 120.0 L 675 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 665 114.0 L 675 120.0 L 665 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 59.9 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 179.5 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">上传完成</tspan>
<tspan x="310.0" dy="34.0">更新 mLastUpload</tspan>
</text>
<path d="M 679 60 Q 890.0 59.5 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 180.2 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">延迟 idleTimeoutCheck</tspan>
<tspan x="890.0" dy="34.0">无 pending 且超过 60000 ms</tspan>
</text>
<path d="M 679 340 Q 890.0 339.3 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.4 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">VkUploader::onIdle</tspan>
<tspan x="890.0" dy="34.0">清 context 与 manager 强引用</tspan>
</text>
<path d="M 99 340 Q 310.0 339.8 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 459.4 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">下次上传</tspan>
<tspan x="310.0" dy="34.0">按仍存活的 manager 按需重建</tspan>
</text>
</svg>
