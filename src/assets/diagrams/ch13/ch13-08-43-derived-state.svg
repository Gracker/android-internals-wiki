<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">derivedStateOf 的输入与输出频率</title>
<desc id="desc">高频输入映射到低频派生结果，读者只关心输出语义的变化。 源 state 仍照常写入；派生观察和计算有成本，实例与相等策略要匹配用途。 滚动位置 state
输入频繁变化 → remember / derivedStateOf
计算是否超过阈值；remember / derivedStateOf
计算是否超过阈值 → 派生结果及相等策略
输出大部分时间相同；派生结果及相等策略
输出大部分时间相同 → 读取结果的 composable
按输出变化处理失效</desc>
