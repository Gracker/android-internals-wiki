<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HWC 快速 present 与 validated 分支</title>
<desc id="desc">无 CLIENT 且时间条件允许时，组合调用可直接完成 HAL present。 直接成功后不重复 present；HAL 返回或 fence 创建不证明面板扫描完成。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
