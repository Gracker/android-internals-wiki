<text x="600.0" y="112.18" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">查询当前 back buffer age</tspan>
<tspan x="600.0" dy="31.28">保存每帧 surface damage</tspan>
</text>
<path d="M 69 340 Q 215.0 339.7 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.6 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="392.18" text-anchor="middle" style="font-size:23px">
<tspan x="215.0" dy="0">age = 0</tspan>
<tspan x="215.0" dy="31.28">旧内容不可依赖，完整重绘</tspan>
</text>
<path d="M 454 340 Q 600.0 339.7 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.4 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">age = N &gt; 0</tspan>
<tspan x="600.0" dy="32.64">本帧 + 前 N−1 帧并集修复</tspan>
</text>
<path d="M 839 340 Q 985.0 339.2 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.9 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#E8913A" stroke-width="3"/>
