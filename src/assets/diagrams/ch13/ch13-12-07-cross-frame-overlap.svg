<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Render / RHI</tspan>
<tspan x="600.0" dy="34.0">处理已有 snapshot</tspan>
</text>
<path d="M 839 45 Q 985.0 44.4 1131 45 Q 1135 45 1135 49 L 1135 151 Q 1135 155 1131 155 Q 985.0 154.3 839 155 Q 835 155 835 151 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">GPU / display</tspan>
