<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">GLThread 生命周期与渲染回调</title>
<desc id="desc">主线程传入 Surface 和生命周期状态，GLThread 管理 EGL 与 Renderer。 回调示意省略等待/错误分支；独立线程仍需协调共享状态。 setRenderer
启动 GLThread → Surface / pause / size
满足 readyToDraw 条件；Surface / pause / size
满足 readyToDraw 条件 → 创建 context / surface
onSurfaceCreated / Changed；创建 context / surface
onSurfaceCreated / Changed → onDrawFrame + swap
处理错误或进入下一轮</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
