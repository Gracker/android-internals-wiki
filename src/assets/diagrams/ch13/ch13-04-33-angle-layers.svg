<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ANGLE 前端、后端与厂商驱动</title>
<desc id="desc">统一 GLES 语义后仍经厂商 Vulkan 驱动和硬件执行。 ANGLE 能减少部分 GLES 实现差异，不能消除设备和驱动差异。 App GLES / EGL
应用接口保持兼容 → ANGLE frontend / translator
对象、校验与 shader 语义；ANGLE frontend / translator
对象、校验与 shader 语义 → ANGLE Vulkan backend
状态、资源与 command buffers；ANGLE Vulkan backend
状态、资源与 command buffers → Vendor Vulkan / GPU / display
继续负责硬件与输出</desc>
