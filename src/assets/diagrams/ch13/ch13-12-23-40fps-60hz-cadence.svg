<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">40 FPS 与 60 Hz 的不均匀保持周期</title>
<desc id="desc">60 Hz 固定刷新下，40 个均匀内容帧也无法全按整数相同周期保持。 16.7/33.3 ms 是理想量化示意，真实抖动还需测 requested/actual timing。 内容与刷新节奏需共同考虑；固定刷新量化造成不均匀保持</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 365 100 L 450 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 94 L 450 100 L 440 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 100 L 835 100" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 94 L 835 100 L 825 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 45 Q 215.0 45.1 361 45 Q 365 45 365 49 L 365 151 Q 365 155 361 155 Q 215.0 155.3 69 155 Q 65 155 65 151 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">60 Hz 固定刷新</tspan>
<tspan x="215.0" dy="34.0">每周期约 16.7 ms</tspan>
</text>
<path d="M 454 45 Q 600.0 45.0 746 45 Q 750 45 750 49 L 750 151 Q 750 155 746 155 Q 600.0 155.5 454 155 Q 450 155 450 151 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">40 FPS 内容</tspan>
<tspan x="600.0" dy="34.0">平均周期 25 ms</tspan>
</text>
<path d="M 839 45 Q 985.0 44.8 1131 45 Q 1135 45 1135 49 L 1135 151 Q 1135 155 1131 155 Q 985.0 154.5 839 155 Q 835 155 835 151 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">部分帧 1 次刷新</tspan>
<tspan x="985.0" dy="34.0">部分帧 2 次刷新</tspan>
</text>
<text x="600" y="565" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">示意条按 1:2 周期画；不是设备实测</tspan>
</text>
<text x="241" y="308" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">内容保持示意</tspan>
</text>
<path d="M 255 324 H 1105" stroke="#777777" stroke-width="1.5"/>
<path d="M 259 285 Q 375.0 285.6 491 285 Q 495 285 495 289 L 495 318 Q 495 322 491 322 Q 375.0 322.2 259 322 Q 255 322 255 318 L 255 289 Q 255 285 259 285" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="375.0" y="311" text-anchor="middle" style="font-size:21px">
<tspan x="375.0" dy="0">A：1周期</tspan>
</text>
<path d="M 499 285 Q 735.0 284.3 971 285 Q 975 285 975 289 L 975 318 Q 975 322 971 322 Q 735.0 322.8 499 322 Q 495 322 495 318 L 495 289 Q 495 285 499 285" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="735.0" y="311" text-anchor="middle" style="font-size:21px">
<tspan x="735.0" dy="0">B：2周期</tspan>
</text>
</svg>
