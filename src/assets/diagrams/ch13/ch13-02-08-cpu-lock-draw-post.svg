<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">CPU 窗口生产的 lock、draw、post 主链</title>
<desc id="desc">CPU 像素生产只是一段，前后仍有队列和同步工作。 图按主要依赖排序；lock 可包含 copyback，post 也可能发生等待或失败。 ViewRoot.drawSoftware
选择窗口软件路径 → Surface.lockCanvas
经 JNI 进入 native；Surface.lockCanvas
经 JNI 进入 native → dequeue + CPU lock
遵守返回 release fence；dequeue + CPU lock
遵守返回 release fence → View.draw / Canvas draw
CPU 写入像素；View.draw / Canvas draw
CPU 写入像素 → unlockAsync
可产生有效完成 fence；unlockAsync
可产生有效完成 fence → queueBuffer
交给后续 Consumer</desc>
