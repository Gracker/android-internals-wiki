<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">tunnel handle绑定及重置</title>
<desc id="desc">tunnel handle 是关联设备流的控制对象。 本 CCodec 分支不逐帧携带普通 graphic-buffer dma-buf fd。 C2 配置 SIDEBAND 模式
包含 sync type / id → 查询 tunnel handle 参数
component 提供整数数据；查询 tunnel handle 参数
component 提供整数数据 → CCodec 包装 native handle
本分支不含 fd；CCodec 包装 native handle
本分支不含 fd → 输出 Surface 绑定 sideband
BLAST / SF 转发状态；输出 Surface 绑定 sideband
BLAST / SF 转发状态 → 非 tunnel 复用窗口
显式清空旧 sideband</desc>
