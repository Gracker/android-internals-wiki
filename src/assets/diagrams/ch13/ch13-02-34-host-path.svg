<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">混合页的宿主仍走自己的窗口帧</title>
<desc id="desc">宿主按帧组织 UI，再提交独立的 host buffer。 宿主帧不自动绑定外部 Texture 或独立 Producer 的下一业务帧。 Choreographer.doFrame
五类回调组织 UI → View / Compose 状态
更新 RenderNode 记录；View / Compose 状态
更新 RenderNode 记录 → Host RenderThread / GPU
生成窗口 buffer H；Host RenderThread / GPU
生成窗口 buffer H → Host BLAST transaction
提交到宿主 Layer</desc>
