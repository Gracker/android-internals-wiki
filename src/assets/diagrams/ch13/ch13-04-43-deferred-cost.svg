<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">轻量 draw 内可能支付此前的准备成本</title>
<desc id="desc">耗时归属要沿 dirty-state、资源和 pipeline 的因果链回查。 长 draw CPU slice 不直接证明 GPU draw 很慢，也可能包含等待。 先前 GL 状态 / 资源变化
许多操作可延迟处理 → 后续 draw / dispatch 到来
同步积累的状态；后续 draw / dispatch 到来
同步积累的状态 → 准备 texture / framebuffer
shader / pipeline / command；准备 texture / framebuffer
shader / pipeline / command → CPU slice 变长
进一步区分工作与等待</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
