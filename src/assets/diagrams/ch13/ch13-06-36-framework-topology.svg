<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">跨进程与 Flutter 的目标分类</title>
<desc id="desc">从 Producer、消费位置和宿主关系确认真实拓扑。 框架名、进程名不保证独立 Layer；插件和 engine 版本需固定。 内容 Producer
View / Flutter / media → 实际 consumer
宿主纹理或独立 Surface；实际 consumer
宿主纹理或独立 Surface → 输出目标与 Layer parent
共享宿主或 child；输出目标与 Layer parent
共享宿主或 child → SurfaceFlinger 合成输入
对应 buffer / fence 验证</desc>
