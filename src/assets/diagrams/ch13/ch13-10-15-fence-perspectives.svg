<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">同一轮交接中 fence 的命名</title>
<desc id="desc">按当前写入方和读取方解释 acquire / release。 同名字段不等于同一阶段，更不能只按 fd 数字认对象。 consumer release
上一轮读取结束依赖 → Camera dequeue
取 slot 与依赖；Camera dequeue
取 slot 与依赖 → HAL acquire fence
写入前满足旧读取完成；HAL acquire fence
写入前满足旧读取完成 → HAL release fence
本轮访问完成依赖；HAL release fence
本轮访问完成依赖 → 新 consumer acquire
读取前满足新写入完成；新 consumer acquire
读取前满足新写入完成 → consumer release
进入下一轮复用</desc>
