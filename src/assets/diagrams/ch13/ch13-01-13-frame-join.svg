<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Actual 逐 Layer，Expected 按应用 token 共享</title>
<desc id="desc">Expected 以进程/token 关联，Actual 保留独立 id 和 Layer。 固定 r1 解析器会去重 Expected；不能强制两边 Layer 相等。 Layer A Actual references the same process/token prediction；Layer B Actual references the same process/token prediction; Layer-name equality is not required；Missing, incomplete or duplicate Expected remains unmatched</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 600 180 L 600 255 L 215 255 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 255 L 985 255 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 60.4 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.3 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="112.18" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">按 upid + VSync token</tspan>
<tspan x="600.0" dy="31.28">查找共享 Expected</tspan>
</text>
<path d="M 69 340 Q 215.0 339.8 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.6 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">Actual：Layer A</tspan>
<tspan x="215.0" dy="34.0">保留其 id 与完成时刻</tspan>
</text>
<path d="M 454 340 Q 600.0 340.5 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.5 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Actual：Layer B</tspan>
<tspan x="600.0" dy="34.0">共享预测，单独统计</tspan>
</text>
<path d="M 839 340 Q 985.0 339.4 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.1 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="985.0" y="392.18" text-anchor="middle" style="font-size:23px">
<tspan x="985.0" dy="0">Expected 缺失或异常重复</tspan>
<tspan x="985.0" dy="31.28">不计算 deadline / overrun</tspan>
</text>
</svg>
