<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">FlutterSurfaceView 的输出生命周期</title>
<desc id="desc">Surface 创建后才连接 renderer，尺寸与销毁回调继续控制 target 生命周期。 连接 Surface 不保证立即有 buffer；HCPP 还可能在其下建立 AHB/control 输出。 SurfaceHolder.surfaceCreated
标记可用于渲染 → renderer 已 attach 且非 paused
connectSurfaceToRenderer；renderer 已 attach 且非 paused
connectSurfaceToRenderer → startRenderingToSurface
JNI / engine 设置 target；startRenderingToSurface
JNI / engine 设置 target → surfaceChanged
通知尺寸变化；surfaceChanged
通知尺寸变化 → surfaceDestroyed
断开渲染目标；surfaceDestroyed
断开渲染目标 → 后续新 Surface 可用
按状态重新连接</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
