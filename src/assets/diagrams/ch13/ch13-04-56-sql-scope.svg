<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Perfetto SQL 的筛选与统计边界</title>
<desc id="desc">进程线程轨加源码名称筛选得到候选完整事件，时长为墙钟时间。 排除 dur=-1；正式统计限定 upid/时间窗，嵌套 slice 不可直接相加。 slice + thread_track
连接 thread / process → 限定进程和事件名
正式统计再定 upid / 时间窗；限定进程和事件名
正式统计再定 upid / 时间窗 → 仅保留 dur &gt;= 0
输出完整 event 墙钟时长；仅保留 dur &gt;= 0
输出完整 event 墙钟时长 → 回看 category / library
CPU busy 与 GPU 另查</desc>
