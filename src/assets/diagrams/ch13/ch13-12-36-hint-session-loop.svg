<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Performance Hint 的周期反馈</title>
<desc id="desc">为长期关联线程建立 session，再按周期报告工作。 null、不合法参数、线程变化和 session 生命周期都要处理。 长期相关线程 + 正 target
创建 Hint Session → 执行一个周期工作
量测实际时间；执行一个周期工作
量测实际时间 → reportActualWorkDuration
报告实际负载；reportActualWorkDuration
报告实际负载 → 预算 / 线程集合变化
更新 target / setThreads</desc>
