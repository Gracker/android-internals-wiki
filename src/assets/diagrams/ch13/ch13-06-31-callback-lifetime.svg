<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 60.7 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 179.3 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">停新提交</tspan>
<tspan x="310.0" dy="34.0">保留 in-flight 记录</tspan>
</text>
<path d="M 679 60 Q 890.0 59.3 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.5 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">回调只做移交</tspan>
<tspan x="890.0" dy="34.0">业务队列持有 context</tspan>
</text>
<path d="M 679 340 Q 890.0 339.9 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.4 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">等待完成并清理 fd</tspan>
<tspan x="890.0" dy="34.0">核对 generation / 引用</tspan>
</text>
<path d="M 99 340 Q 310.0 339.4 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.3 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">最后销毁 context / pool</tspan>
<tspan x="310.0" dy="34.0">避免迟到回调访问已释放对象</tspan>
</text>
</svg>
