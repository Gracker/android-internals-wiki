<title id="title">NDK 自建 Producer 与版本化回收接口</title>
<desc id="desc">Java HBR 与 NDK AHardwareBuffer 生产路线是两套公开入口。 没有 AHardwareBufferRenderer API；EGL/Vulkan 导入、同步与显示用途仍需自行处理。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
