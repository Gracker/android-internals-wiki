<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">HCPP 的实际 View、窗口与 AHB layer</title>
<desc id="desc">普通原生 View 仍在宿主窗口，Impeller AHB 和内部 SurfaceView 可作为独立 Layer。 不会为每个 PlatformView 强制创建独立 Surface；Layer 存在也不保证 DEVICE composition。 普通View在宿主绘制；宿主窗口作为Layer输出；AHBbuffer通过TX直交；HCPPFlutter输出参与SF合成；SurfaceView独立子Surface；childLayer独立参与显示</desc>
