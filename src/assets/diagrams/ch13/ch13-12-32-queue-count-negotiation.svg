<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">N &gt; 0：查询最少保留数</tspan>
<tspan x="310.0" dy="34.0">min-undequeued</tspan>
</text>
<path d="M 679 60 Q 890.0 60.1 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.5 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">转换 max-dequeued</tspan>
<tspan x="890.0" dy="34.0">N − min-undequeued</tspan>
</text>
<path d="M 679 340 Q 890.0 340.0 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.7 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">校验当前持有 / 最小数</tspan>
<tspan x="890.0" dy="34.0">和总 slot / buffer 上限</tspan>
</text>
<path d="M 99 340 Q 310.0 340.2 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.5 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">接受新约束或返回错误</tspan>
<tspan x="310.0" dy="34.0">不是直接分配 N 张图</tspan>
</text>
</svg>
