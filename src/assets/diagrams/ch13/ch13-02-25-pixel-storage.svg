<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">RGBA_8888 像素量与实际分配</title>
<desc id="desc">先估紧密像素数据，再查实际 buffer 分配与存活数量。 未计 stride、对齐、布局元数据和额外目标；三块仅是示例。 1440 × 3200 × 4 byte
18,432,000 byte / 块 → 除以 1024²
约 17.6 MiB / 块；除以 1024²
约 17.6 MiB / 块 → 示例：同时存活三块
约 52.7 MiB 像素数据</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="420" fill="white"/>
<path d="M 365 120.0 L 450 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.5 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 180.5 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">1440 × 3200 × 4 byte</tspan>
<tspan x="215.0" dy="34.0">18,432,000 byte / 块</tspan>
</text>
<path d="M 454 60 Q 600.0 60.2 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.4 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">除以 1024²</tspan>
<tspan x="600.0" dy="34.0">约 17.6 MiB / 块</tspan>
</text>
<path d="M 839 60 Q 985.0 60.0 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.1 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">示例：同时存活三块</tspan>
<tspan x="985.0" dy="34.0">约 52.7 MiB 像素数据</tspan>
</text>
</svg>
