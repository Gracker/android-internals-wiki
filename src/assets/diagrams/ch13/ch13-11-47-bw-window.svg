<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">并行网络传输的吞吐采样</title>
<desc id="desc">DefaultBandwidthMeter 结算的是计量窗口中的聚合字节。 并行时不能当作当前结束请求单独的吞吐。 符合 full-network-speed
条件的传输开始 → 累计窗口内字节
可包含并行传输；累计窗口内字节
可包含并行传输 → 一项符合条件的传输结束
结算窗口时间差；一项符合条件的传输结束
结算窗口时间差 → 正耗时计算 bits/s
bytes × 8000 / ms；正耗时计算 bits/s
bytes × 8000 / ms → 加入加权分位数
零耗时字节留到后面</desc>
