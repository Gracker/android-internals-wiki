<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 60.0 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 180.1 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">native window dequeue</tspan>
<tspan x="310.0" dy="34.0">buffer + 旧 Consumer fence</tspan>
</text>
<path d="M 679 60 Q 890.0 60.2 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.5 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">匹配或延迟绑定 VkImage</tspan>
<tspan x="890.0" dy="34.0">异常可 cancel / 报错</tspan>
</text>
<path d="M 679 340 Q 890.0 340.5 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.0 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">dup fence fd</tspan>
<tspan x="890.0" dy="34.0">交 AcquireImageANDROID</tspan>
</text>
<path d="M 99 340 Q 310.0 339.4 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.0 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">驱动连接 semaphore / fence</tspan>
<tspan x="310.0" dy="34.0">成功返回 imageIndex</tspan>
</text>
</svg>
