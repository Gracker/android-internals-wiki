<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Android WSI acquire 的 fd 交接</title>
<desc id="desc">WSI 从 native window 取得 buffer/fence，再由私有驱动入口连接同步对象。 dup 失败可走 CPU sync_wait；驱动私有导入不是应用重复 import 的接口。 native window dequeue
buffer + 旧 Consumer fence → 匹配或延迟绑定 VkImage
异常可 cancel / 报错；匹配或延迟绑定 VkImage
异常可 cancel / 报错 → dup fence fd
交 AcquireImageANDROID；dup fence fd
交 AcquireImageANDROID → 驱动连接 semaphore / fence
成功返回 imageIndex</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
