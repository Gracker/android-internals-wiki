<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">SurfaceView内容与宿主窗口独立</title>
<desc id="desc">SurfaceView 保留独立视频输出和合成属性。 宿主窗口没有重绘不代表视频没有更新。 左侧条件或职责；右侧条件或职责</desc>
