<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Traversal 申请、同步屏障与帧合并</title>
<desc id="desc">多次重绘申请可合并到待执行帧，真正绘制稍后发生。 屏障允许异步消息绕过同步消息，不能抢占当前任务或替代调度。 invalidate / requestLayout
更新脏状态和遍历需求 → scheduleTraversals
屏障 + TRAVERSAL runnable；scheduleTraversals
屏障 + TRAVERSAL runnable → Choreographer
mFrameScheduled 合并申请；Choreographer
mFrameScheduled 合并申请 → doFrame / traversal
按需要测量、布局与记录</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
