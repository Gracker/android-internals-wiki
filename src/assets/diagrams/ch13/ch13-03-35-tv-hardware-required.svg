<title id="title">TextureView 黑屏先确认硬件加速前提</title>
<desc id="desc">Producer 正常输出与宿主能够绘制 TextureLayer 是两项证据。 软件 Canvas 分支不会绘制主体；同时核对生命周期与连接。 按该条件分支处理；按该条件分支处理；按该条件分支处理</desc>
