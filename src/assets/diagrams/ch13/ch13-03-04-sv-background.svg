<title id="title">背景层显示需要同时满足的条件</title>
<desc id="desc">背景层只在指定 Z、opaque 与启用条件同时满足时显示。 它不是视频 buffer，也不能凭背景颜色推断主体首帧已提交。 独立输入共同决定输出，不表达三路互相串行；独立输入共同决定输出，不表达三路互相串行；独立输入共同决定输出，不表达三路互相串行</desc>
