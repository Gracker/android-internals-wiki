<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">GLSL ES 翻译与厂商 pipeline 编译</title>
<desc id="desc">ANGLE 先输出 SPIR-V，厂商 Vulkan 驱动再结合 pipeline 编译设备代码。 编译、link、cache 恢复和 pipeline 准备分阶段发生，不是每个 draw 从文本重编。 GLSL ES / shader 语义
校验与 AST 处理 → TranslatorSPIRV
输出 SPIR-V blob；TranslatorSPIRV
输出 SPIR-V blob → Vulkan pipeline state
与 shader 模块组合；Vulkan pipeline state
与 shader 模块组合 → Vendor compiler
设备可执行形式 / cache</desc>
