<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Renderer 与 graphics backend 的选择</title>
<desc id="desc">先确认 renderer 配置，再读动态 Vulkan/GLES 的运行分支。 通常构建还受 Vivante、软件互斥、调试强制 backend 与编译条件影响。 通常Impeller启用条件满足；关闭/低API/workaround等其他选择；动态Vulkan创建成功；动态Vulkan避让或创建无效</desc>
