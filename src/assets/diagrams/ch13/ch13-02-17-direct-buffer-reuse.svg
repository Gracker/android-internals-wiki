<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">直接 setBuffer 的提交与回收协议</title>
<desc id="desc">直接 buffer transaction 可以替代该 Layer 的普通生产队列循环。 production fence 约束读取，release 通知携带的有效 fence 仍须满足后才能复用。 调用方生产 HardwareBuffer
保存实际写入依赖 → Transaction.setBuffer
提交 buffer + acquire fence；Transaction.setBuffer
提交 buffer + acquire fence → SF readiness / 采纳
读取前遵守输入依赖；SF readiness / 采纳
读取前遵守输入依赖 → 后续 release callback
对应这次 buffer 提交；后续 release callback
对应这次 buffer 提交 → 有效 release fence 满足
才可回池并再次写入</desc>
