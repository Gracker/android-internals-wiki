<path d="M 304 325 L 310 335 L 316 325" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 165 L 700 255 L 890 255 L 890 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 325 L 890 335 L 896 325" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 50 Q 600.0 50.4 811 50 Q 815 50 815 54 L 815 161 Q 815 165 811 165 Q 600.0 165.0 389 165 Q 385 165 385 161 L 385 54 Q 385 50 389 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="99.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">updateDisplayList</tspan>
<tspan x="600.0" dy="34.0">检查内容 isDirty</tspan>
</text>
<path d="M 99 335 Q 310.0 335.2 521 335 Q 525 335 525 339 L 525 456 Q 525 460 521 460 Q 310.0 459.3 99 460 Q 95 460 95 456 L 95 339 Q 95 335 99 335" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="389.0" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">dirty：GraphicsLayer.record</tspan>
<tspan x="310.0" dy="34.0">beginRecording / endRecording</tspan>
</text>
<path d="M 679 335 Q 890.0 335.7 1101 335 Q 1105 335 1105 339 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.5 679 460 Q 675 460 675 456 L 675 339 Q 675 335 679 335" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="389.0" text-anchor="middle" style="font-size:25px">
