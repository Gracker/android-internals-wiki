<text x="380.0" y="286" text-anchor="middle" style="font-size:21px">
<tspan x="380.0" dy="0">submit / apply</tspan>
</text>
<text x="241" y="373" text-anchor="end" style="font-size:23px">
<tspan x="241" dy="0">Producer GPU</tspan>
</text>
<path d="M 255 389 H 1105" stroke="#777777" stroke-width="1.5"/>
