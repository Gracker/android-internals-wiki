<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">CPU 提交与 GPU 完成可重叠</title>
<desc id="desc">buffer 与完成依赖可先交给系统，实际读取再遵守 fence。 轨道仅为依赖示意；受限 latch-unsignaled 不表示可提前读取像素。 提交到SF异步推进；采纳与实际读取是不同边界</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="690" fill="white"/>
<path d="M 365 105 L 450 105" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 99 L 450 105 L 440 111" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 105 L 835 105" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 99 L 835 105 L 825 111" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 45 Q 215.0 45.3 361 45 Q 365 45 365 49 L 365 161 Q 365 165 361 165 Q 215.0 165.5 69 165 Q 65 165 65 161 L 65 49 Q 65 45 69 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">CPU apply</tspan>
<tspan x="215.0" dy="34.0">提交 buffer + fence</tspan>
</text>
<path d="M 454 45 Q 600.0 44.3 746 45 Q 750 45 750 49 L 750 161 Q 750 165 746 165 Q 600.0 165.2 454 165 Q 450 165 450 161 L 450 49 Q 450 45 454 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">SF readiness / latch</tspan>
<tspan x="600.0" dy="34.0">调度与条件分支</tspan>
</text>
<path d="M 839 45 Q 985.0 44.5 1131 45 Q 1135 45 1135 49 L 1135 161 Q 1135 165 1131 165 Q 985.0 165.5 839 165 Q 835 165 835 161 L 835 49 Q 835 45 839 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">Consumer 实际读取</tspan>
