<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ThreadedRenderer 包含 display-list 更新</title>
<desc id="desc">ThreadedRenderer.draw 内先更新 display list，随后进入 RenderThread 同步提交。 dispatchDraw 是否执行受失效与复用控制；不能画成先 dispatchDraw 再调用 renderer.draw。 ViewRootImpl.performDraw
窗口有 draw 工作 → ThreadedRenderer.draw
进入 HWUI Java 入口；ThreadedRenderer.draw
进入 HWUI Java 入口 → updateRootDisplayList
更新失效的 View 记录；updateRootDisplayList
更新失效的 View 记录 → AndroidComposeView
dispatchDraw / layer 更新；AndroidComposeView
dispatchDraw / layer 更新 → syncAndDrawFrame
跨入 HWUI native；syncAndDrawFrame
跨入 HWUI native → RenderThread
tree sync / 目标与提交</desc>
