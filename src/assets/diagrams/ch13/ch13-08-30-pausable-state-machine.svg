<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">PausedComposition 的使用状态机</title>
<desc id="desc">反复 resume 直到完成，立即 apply；放弃则 cancel 并丢弃 composition。 shouldPause 只是请求；完成后延迟 apply 期间的 state 变化可使结果需要再次处理。 初始等待resume；resume返回后检查；完成时调用apply；未完成时后续继续resume；不再需要时取消</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 365 110 L 450 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 104 L 450 110 L 440 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 110 L 835 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 104 L 835 110 L 825 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 170 L 985 345" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 335 L 985 345 L 991 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 835 130 L 790 130 L 790 255 L 600 255 L 600 170" stroke="#202020" stroke-width="2.8" fill="none" stroke-dasharray="7 6"/>
<path d="M 594 180 L 600 170 L 606 180" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 450 130 L 405 130 L 405 300 L 215 300 L 215 345" stroke="#202020" stroke-width="2.8" fill="none" stroke-dasharray="7 6"/>
<path d="M 209 335 L 215 345 L 221 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 55 Q 215.0 54.5 361 55 Q 365 55 365 59 L 365 166 Q 365 170 361 170 Q 215.0 170.4 69 170 Q 65 170 65 166 L 65 59 Q 65 55 69 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="104.34" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">setPausableContent</tspan>
<tspan x="215.0" dy="32.64">创建 PausedComposition</tspan>
</text>
<path d="M 454 55 Q 600.0 55.3 746 55 Q 750 55 750 59 L 750 166 Q 750 170 746 170 Q 600.0 169.9 454 170 Q 450 170 450 166 L 450 59 Q 450 55 454 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="104.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">resume(shouldPause)</tspan>
<tspan x="600.0" dy="34.0">执行至完成或暂停</tspan>
</text>
<path d="M 839 55 Q 985.0 55.2 1131 55 Q 1135 55 1135 59 L 1135 166 Q 1135 170 1131 170 Q 985.0 170.3 839 170 Q 835 170 835 166 L 835 59 Q 835 55 839 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="104.0" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">检查 isComplete</tspan>
<tspan x="985.0" dy="34.0">是否已经完成？</tspan>
</text>
<path d="M 839 345 Q 985.0 345.6 1131 345 Q 1135 345 1135 349 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.7 839 460 Q 835 460 835 456 L 835 349 Q 835 345 839 345" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="394.0" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">完成：立即同步 apply</tspan>
<tspan x="985.0" dy="34.0">随后才可使用结果</tspan>
</text>
<path d="M 69 345 Q 215.0 345.3 361 345 Q 365 345 365 349 L 365 456 Q 365 460 361 460 Q 215.0 460.6 69 460 Q 65 460 65 456 L 65 349 Q 65 345 69 345" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="215.0" y="394.0" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">放弃：cancel</tspan>
<tspan x="215.0" dy="34.0">丢弃对应 composition</tspan>
</text>
</svg>
