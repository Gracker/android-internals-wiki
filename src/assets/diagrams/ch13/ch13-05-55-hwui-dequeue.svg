<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HWUI dequeue fence 的 pending 导入分支</title>
<desc id="desc">成功查询到 status != 1 时复制并导入旧 Consumer fence，及时提交 wait。 这是 queue 0 写入前依赖，不是 CPU 已等到 GPU 结束；源码对额外 flush 留有 workaround 注释。 dequeue buffer + fence
查询 sync_file_info 状态 → status != 1 分支
dup fd / create semaphore；status != 1 分支
dup fd / create semaphore → 临时导入 SYNC_FD
Skia surface 等待；临时导入 SYNC_FD
Skia surface 等待 → FlushAndSubmit wait
再组织窗口像素写入</desc>
