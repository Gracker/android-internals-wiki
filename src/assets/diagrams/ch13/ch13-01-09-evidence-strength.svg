<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">事实、关联与因果的证据强度</title>
<desc id="desc">先记录观测事实，再建立同帧关联，最后检验原因。 时间接近或单一 jank 分类不能独立证明根因。 事实
目标对象发生了什么 → 关联
同 token / frame / fence；关联
同 token / frame / fence → 因果检验
依赖链与同条件修复对照</desc>
