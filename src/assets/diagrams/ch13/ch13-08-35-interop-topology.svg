<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">互操作按实际 Surface 拓扑分类</title>
<desc id="desc">UI 包装方式不决定输出对象，先确认 Producer 与最终 Consumer。 普通 View/Compose 常共享窗口；独立 Surface 与中间 texture 需分别追依赖。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
