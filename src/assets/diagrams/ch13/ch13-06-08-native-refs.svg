<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">window 与 child 分别持有和释放引用</title>
<desc id="desc">先借 Surface 取得 window 引用，再取得独立的 child 引用。 示例为串行生命周期；宿主重建前须移除、释放旧 child 并清空句柄。 ANativeWindow_fromSurface
取得 window 强引用 → createFromWindow
返回独立 child 引用；createFromWindow
返回独立 child 引用 → 释放临时 window 引用
child 另按生命周期 release</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="420" fill="white"/>
<path d="M 365 120.0 L 450 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114.0 L 450 120.0 L 440 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120.0 L 835 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114.0 L 835 120.0 L 825 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.4 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.6 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="97.56" text-anchor="middle" style="font-size:22px">
<tspan x="215.0" dy="0">Java Surface 桥接</tspan>
<tspan x="215.0" dy="29.92">取得 ANativeWindow</tspan>
<tspan x="215.0" dy="29.92">强引用</tspan>
</text>
<path d="M 454 60 Q 600.0 60.4 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.0 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">createFromWindow</tspan>
<tspan x="600.0" dy="34.0">返回独立 child 引用</tspan>
</text>
<path d="M 839 60 Q 985.0 59.8 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.8 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="112.52" text-anchor="middle" style="font-size:22px">
<tspan x="985.0" dy="0">释放临时 window 引用</tspan>
<tspan x="985.0" dy="29.92">child 另按生命周期 release</tspan>
</text>
</svg>
