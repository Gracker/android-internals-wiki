<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">普通主体与 overlay 的双输出</title>
<desc id="desc">主体窗口和提升候选可以同时参与显示，分别追 buffer 与完成依赖。 宿主 HWUI 是最终窗口 Producer；decoder/provider 的候选不必经过传统窗口 BufferQueue。 普通主体输出；符合条件时可选提升；宿主窗口进入系统合成；候选child进入系统合成</desc>
