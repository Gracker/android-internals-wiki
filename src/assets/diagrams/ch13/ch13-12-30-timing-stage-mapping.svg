<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">固定 r1 的 stage 时间映射</title>
<desc id="desc">四个 stage 名称在该实现中落到三种时间来源。 两个 first-pixel stage 共用 actual-present；无有效时间可返回 0。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
