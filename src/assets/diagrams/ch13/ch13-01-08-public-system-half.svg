<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">公共检查点：事务、合成与反馈</title>
<desc id="desc">从 BLAST 事务继续追踪目标 display 的显示结果。 CLIENT 合成可选，presentOrValidate 可能提前完成 present。 BLAST transaction
传 buffer 句柄与元数据 → SF snapshot / latch
合入状态并采纳 buffer；SF snapshot / latch
合入状态并采纳 buffer → HWC strategy
协商输出 Layer 的合成类型；HWC strategy
协商输出 Layer 的合成类型 → 可选 CLIENT composition
RenderEngine 生成 client target；可选 CLIENT composition
RenderEngine 生成 client target → present
提交 display 输出；present
提交 display 输出 → present feedback
时间基准与 release 信息</desc>
