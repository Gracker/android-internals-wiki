<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">provider transaction 的合并与独立 apply</title>
<desc id="desc">有 active context 时先尝试合并；没有或合并未成功才独立 apply。 容器创建、几何状态和 buffer 提交分别核对，不能仅凭接口调用证明已显示。 左条件分支；右条件分支</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 500 165 L 500 255 L 310 255 L 310 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 325 L 310 335 L 316 325" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 165 L 700 255 L 890 255 L 890 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 325 L 890 335 L 896 325" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 50 Q 600.0 49.4 811 50 Q 815 50 815 54 L 815 161 Q 815 165 811 165 Q 600.0 165.5 389 165 Q 385 165 385 161 L 385 54 Q 385 50 389 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="99.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">mergeTransaction</tspan>
<tspan x="600.0" dy="34.0">active context 存在且合并成功？</tspan>
</text>
<path d="M 99 335 Q 310.0 335.2 521 335 Q 525 335 525 339 L 525 456 Q 525 460 521 460 Q 310.0 460.3 99 460 Q 95 460 95 456 L 95 339 Q 95 335 99 335" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="389.0" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">是：合入 HWUI 更新</tspan>
<tspan x="310.0" dy="34.0">与窗口提交协调</tspan>
</text>
<path d="M 679 335 Q 890.0 334.8 1101 335 Q 1105 335 1105 339 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.6 679 460 Q 675 460 675 456 L 675 339 Q 675 335 679 335" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="389.0" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">否：独立 apply</tspan>
<tspan x="890.0" dy="34.0">包括无 context 或 merge 失败</tspan>
</text>
</svg>
