<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">server wait 从 sync fd 建立 GPU 依赖</title>
<desc id="desc">未 signal 时导入 duplicated fd 并把 binary semaphore 加到后续 submit。 已 signal 会快速返回；server wait 不要求 CPU 先阻塞到依赖完成。 前置判断未提前返回时才进入后续路径；未完成：创建 binary semaphore
dup 原 sync fd → importFd 成功
临时 SYNC_FD payload；importFd 成功
临时 SYNC_FD payload → addWaitSemaphore
ALL_COMMANDS 后续 submit</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 525 120.0 L 675 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 665 114.0 L 675 120.0 L 665 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 60.7 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 179.9 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">先检查 native fence 状态</tspan>
<tspan x="310.0" dy="34.0">已 signal 则直接返回</tspan>
</text>
<path d="M 679 60 Q 890.0 60.1 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 179.6 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">未完成：创建 binary semaphore</tspan>
<tspan x="890.0" dy="34.0">dup 原 sync fd</tspan>
</text>
<path d="M 679 340 Q 890.0 339.3 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.2 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">importFd 成功</tspan>
<tspan x="890.0" dy="34.0">临时 SYNC_FD payload</tspan>
</text>
<path d="M 99 340 Q 310.0 340.1 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 459.9 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">addWaitSemaphore</tspan>
<tspan x="310.0" dy="34.0">ALL_COMMANDS 后续 submit</tspan>
</text>
<rect x="557.5" y="85.0" width="85.0" height="36.3" fill="white"/>
<text x="600" y="110" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">未返回</tspan>
</text>
</svg>
