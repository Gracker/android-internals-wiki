<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HWC 常规协商与 client target 路径</title>
<desc id="desc">先写 Layer 状态，再协商并生成所需 client target。 预测合成可以并行；此图省略直接 present 成功的快路径。 writeCompositionState
提交 buffer / 几何 / 类型 → chooseCompositionStrategy
validate 当前 Layer 栈；chooseCompositionStrategy
validate 当前 Layer 栈 → 接受 changes / requests
确定 CLIENT 与 DEVICE；接受 changes / requests
确定 CLIENT 与 DEVICE → 必要时 RE 合成
client target + fence；必要时 RE 合成
client target + fence → setClientTarget / present
连同 DEVICE 内容输出；setClientTarget / present
连同 DEVICE 内容输出 → 收集 / 合并 fences
显示反馈与旧图归还</desc>
