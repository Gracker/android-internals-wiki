<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">composition order 决定相对宿主的位置</title>
<desc id="desc">负值在宿主下方，非负值在宿主上方，同级值越大越靠上。 API 36 首引及固定 r1 flag 需核对；相同 order 未定义顺序。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 215 180 L 215 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 209 330 L 215 340 L 221 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 180 L 600 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 330 L 600 340 L 606 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 180 L 985 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 979 330 L 985 340 L 991 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 59.6 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 179.5 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">order &lt; 0</tspan>
<tspan x="215.0" dy="34.0">位于宿主窗口下方</tspan>
</text>
<path d="M 454 60 Q 600.0 60.2 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.4 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">order ≥ 0</tspan>
<tspan x="600.0" dy="34.0">位于宿主窗口上方</tspan>
</text>
<path d="M 839 60 Q 985.0 60.8 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.8 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">同级 SurfaceView</tspan>
<tspan x="985.0" dy="34.0">按 order 比较</tspan>
</text>
<path d="M 69 340 Q 215.0 340.6 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 459.5 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">宿主需要透明洞</tspan>
<tspan x="215.0" dy="34.0">普通 View 可盖住内容</tspan>
</text>
<path d="M 454 340 Q 600.0 340.4 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.2 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">宿主普通 View</tspan>
<tspan x="600.0" dy="34.0">不能盖到该内容之上</tspan>
</text>
<path d="M 839 340 Q 985.0 340.7 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.3 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">数值大者在上</tspan>
<tspan x="985.0" dy="34.0">相同值顺序未定义</tspan>
</text>
</svg>
