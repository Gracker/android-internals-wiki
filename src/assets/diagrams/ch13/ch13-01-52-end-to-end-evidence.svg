<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从状态更新到显示结果的同帧复核</title>
<desc id="desc">把每段观测按 buffer、token 与明确依赖连接起来。 每个信号只回答一个阶段，单独最长 slice 或平均 FPS 都不能完成归因。 MainThread
输入与 UI 状态 → RenderThread / GPU
窗口 buffer 生产；RenderThread / GPU
窗口 buffer 生产 → BLAST / transaction
关联提交与同步；BLAST / transaction
关联提交与同步 → SF snapshot / latch
对应本轮目标 Layer；SF snapshot / latch
对应本轮目标 Layer → SF / HWC composition
区分 CLIENT 与 DEVICE；SF / HWC composition
区分 CLIENT 与 DEVICE → present / release
显示时间与资源复用</desc>
