<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">恢复前台时重新查询 Game Mode</title>
<desc id="desc">用户在暂停期间可能改模式，恢复时重新建立应用策略。 Performance / Battery 是偏好，不能保证固定 FPS 或 OEM 相同动作。 onResume
重新查询 Game Mode → 读取用户目标
Standard / Performance 等；读取用户目标
Standard / Performance 等 → 应用自行选择
FPS、画质与资源预算；应用自行选择
FPS、画质与资源预算 → 核对 intervention / limiter
记录实际 present 结果</desc>
