<title id="title">视频DEVICE与其他GPU工作并存</title>
<desc id="desc">视频 DEVICE 和其他 Layer 的 client composition 可以并存。 GPU 忙不能单独证明视频 Overlay 失败。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
