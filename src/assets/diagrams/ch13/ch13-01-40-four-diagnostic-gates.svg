<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从 App 到显示输出的四个排查关口</title>
<desc id="desc">依次核对 UI 回调、RT、事务与显示后段。 UI 和 RT 短不能排除 GPU、acquire fence、事务或显示预测问题。 UI doFrame
哪个 callback 首先变长 → RenderThread
同步 / 提交 / dequeue 等待；RenderThread
同步 / 提交 / dequeue 等待 → queue 之后到 SF
BufferTX / readiness / latch；queue 之后到 SF
BufferTX / readiness / latch → SF 与 display
合成类型 / present / prediction</desc>
