<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">多个 SurfaceFrame 汇入一个 DisplayFrame</title>
<desc id="desc">显示合成帧可汇入多个进程、多个 Layer 的 SurfaceFrame。 surface token 与 display token 作用不同，不能合成一个通用端到端 id。 对应SurfaceFrame映射并汇入同一DisplayFrame；不是显示帧生成应用工作；对应SurfaceFrame映射并汇入同一DisplayFrame；不是显示帧生成应用工作；对应SurfaceFrame映射并汇入同一DisplayFrame；不是显示帧生成应用工作</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 215 340 L 215 255 L 600 255 L 600 180" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 190 L 600 180 L 606 190" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 340 L 600 180" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 190 L 600 180 L 606 190" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 985 340 L 985 255 L 600 255 L 600 180" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 190 L 600 180 L 606 190" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 59.5 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.4 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">同一 DisplayFrame token</tspan>
<tspan x="600.0" dy="32.64">对应一次显示合成</tspan>
</text>
<path d="M 69 340 Q 215.0 339.5 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.6 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">进程 A / Layer 1</tspan>
<tspan x="215.0" dy="34.0">SurfaceFrame Actual</tspan>
</text>
<path d="M 454 340 Q 600.0 339.5 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.4 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">进程 A / Layer 2</tspan>
<tspan x="600.0" dy="34.0">可共享应用 VSync token</tspan>
</text>
<path d="M 839 340 Q 985.0 340.6 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 459.6 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">进程 B / 其他 Layer</tspan>
<tspan x="985.0" dy="34.0">也可汇入该显示帧</tspan>
</text>
</svg>
