<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">GL 与 Vulkan 都要导入输入并遵守同步</title>
<desc id="desc">当前 RenderPipelineType 决定 image、wait 和 release 的后端实现。 改变后端不消除宿主 GPU 采样和最终 buffer 写出。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
