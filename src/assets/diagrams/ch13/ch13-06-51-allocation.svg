<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">支持查询、实际分配与固定目标实例</title>
<desc id="desc">先匹配格式/用途，再分配 buffer 并建立对应 renderer。 isSupported 不预留内存；实际分配仍可能失败，且不保证 DEVICE。 确定尺寸 / format / usage
按生产与消费用途 → isSupported 查询
实际 allocation 仍处理失败；isSupported 查询
实际 allocation 仍处理失败 → HardwareBuffer.create
建立 slot 与 generation；HardwareBuffer.create
建立 slot 与 generation → new HBR(buffer)
固定输出目标</desc>
