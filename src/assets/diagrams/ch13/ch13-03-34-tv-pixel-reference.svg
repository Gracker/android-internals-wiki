<title id="title">DisplayList 记录引用，像素在 GPU 采样时汇入宿主</title>
<desc id="desc">TextureView 的绘制记录与实际输入像素分别流转。 DisplayList 不存整帧视频像素；输入流也不会因此产生独立 SF Layer。 独立输入共同决定输出，不表达三路互相串行；独立输入共同决定输出，不表达三路互相串行；独立输入共同决定输出，不表达三路互相串行</desc>
