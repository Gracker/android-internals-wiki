<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">TextureLayer 与系统 layer 不是同一对象</title>
<desc id="desc">应用中的 View、SurfaceTexture 和 updater 协作生成宿主 buffer。 HWUI layer 不自动对应 SurfaceFlinger 可见层，命名时注明所属体系。 TextureView
生命周期 / dirty / 变换 → SurfaceTexture
输入端点与通知；SurfaceTexture
输入端点与通知 → TextureLayer
持有 native updater；TextureLayer
持有 native updater → DeferredLayerUpdater
取 image / 包装与属性；DeferredLayerUpdater
取 image / 包装与属性 → Host Surface / BLAST
最终 buffer 进入 SF</desc>
