<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">基础队列容量的两部分</title>
<desc id="desc">基础容量来自 consumer 保留量与 HAL max_buffers。 显示同步或 framework 暂存可再追加，容量不等于驻留。 consumer 不可出队保留量
MIN_UNDEQUEUED 查询 → 加 HAL max_buffers
生产流水线持有需求；加 HAL max_buffers
生产流水线持有需求 → 按具体预览策略追加
显示同步 / spacer；按具体预览策略追加
显示同步 / spacer → 实际已分配与在用数量
从 dump / allocator 另查</desc>
