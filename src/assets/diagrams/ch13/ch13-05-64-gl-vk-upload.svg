<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">GL 与 Vulkan 上传的 CPU 等待位置</title>
<desc id="desc">两种后端都有上传线程，实际 GPU 完成等待所在的 CPU 线程不同。 GL client wait 有有限超时且异常处理须核对；两种后端均不保证硬件同时执行上传与窗口绘制。 本条路径的阶段关系；本条路径的阶段关系；本条路径的阶段关系；本条路径的阶段关系</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 365 120 L 450 120" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 114 L 450 120 L 440 126" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 120 L 835 120" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 114 L 835 120 L 825 126" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 365 400 L 450 400" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 394 L 450 400 L 440 406" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 400 L 835 400" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 825 394 L 835 400 L 825 406" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 60 Q 215.0 60.5 361 60 Q 365 60 365 64 L 365 176 Q 365 180 361 180 Q 215.0 180.8 69 180 Q 65 180 65 176 L 65 64 Q 65 60 69 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">Vulkan：调用方 runSync</tspan>
<tspan x="215.0" dy="32.64">等待上传 task 返回</tspan>
</text>
<path d="M 454 60 Q 600.0 59.5 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 180.6 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">UploadThread 执行上传</tspan>
<tspan x="600.0" dy="34.0">GrSyncCpu::kYes</tspan>
</text>
<path d="M 839 60 Q 985.0 60.8 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 179.5 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">上传线程等待 GPU 完成</tspan>
<tspan x="985.0" dy="34.0">再向调用方交回结果</tspan>
</text>
<path d="M 69 340 Q 215.0 340.5 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.2 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="215.0" y="377.56" text-anchor="middle" style="font-size:22px">
<tspan x="215.0" dy="0">GL：UploadThread task</tspan>
<tspan x="215.0" dy="29.92">TexSubImage / fence /</tspan>
<tspan x="215.0" dy="29.92">flush</tspan>
</text>
<path d="M 454 340 Q 600.0 339.6 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.8 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">runSync 返回 fence</tspan>
<tspan x="600.0" dy="34.0">调用方执行 clientWait</tspan>
</text>
<path d="M 839 340 Q 985.0 340.4 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.3 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="377.56" text-anchor="middle" style="font-size:22px">
<tspan x="985.0" dy="0">有限超时的 CPU wait</tspan>
<tspan x="985.0" dy="29.92">不是 upload thread</tspan>
<tspan x="985.0" dy="29.92">无限等待</tspan>
</text>
</svg>
