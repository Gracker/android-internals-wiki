<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">先确认 Layer 的 FrameTimeline 覆盖</title>
<desc id="desc">覆盖完整才使用对应时间线，独立 Surface 需准备其他同帧证据。 engine frame、vsync target、SF token 不可互换；官方仍有 SurfaceView 覆盖限制。 目标覆盖完整时使用时间线；目标覆盖缺失或不完整时补证</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 600 170 L 600 255 L 310 255 L 310 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 325 L 310 335 L 316 325" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 170 L 600 255 L 890 255 L 890 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 325 L 890 335 L 896 325" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 389 55 Q 600.0 55.3 811 55 Q 815 55 815 59 L 815 166 Q 815 170 811 170 Q 600.0 169.5 389 170 Q 385 170 385 166 L 385 59 Q 385 55 389 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="104.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">固定目标 Layer</tspan>
<tspan x="600.0" dy="34.0">检查 Expected / Actual 覆盖</tspan>
</text>
<path d="M 99 335 Q 310.0 334.6 521 335 Q 525 335 525 339 L 525 456 Q 525 460 521 460 Q 310.0 460.2 99 460 Q 95 460 95 456 L 95 339 Q 95 335 99 335" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="389.0" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">完整：按合法 token 关联</tspan>
<tspan x="310.0" dy="34.0">App / Display 边界分开</tspan>
</text>
<path d="M 679 335 Q 890.0 335.4 1101 335 Q 1105 335 1105 339 L 1105 456 Q 1105 460 1101 460 Q 890.0 459.9 679 460 Q 675 460 675 456 L 675 339 Q 675 335 679 335" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="389.0" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">缺失：补 buffer / TX / fence</tspan>
<tspan x="890.0" dy="34.0">latch 与 display 反馈</tspan>
</text>
</svg>
