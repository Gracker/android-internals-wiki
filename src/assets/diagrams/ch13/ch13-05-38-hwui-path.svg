<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">上传结果进入后续窗口帧</title>
<desc id="desc">queue 1 生成 hardware bitmap，后续 queue 0 采样并交出窗口 buffer。 两条 queue 不共同 present 同一窗口帧；CPU queue 可早于窗口 GPU 写入完成。 runSync task执行上传；GPU上传完成后返回结果；后续窗口帧采样hardware bitmap；RenderNode驱动窗口绘制；RenderThread通过CPU交出buffer/fence</desc>
