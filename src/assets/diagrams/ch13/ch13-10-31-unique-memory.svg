<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">图像内存按唯一分配计算</title>
<desc id="desc">按唯一 allocation 的实际分配大小估算驻留。 队列容量、跨组件引用数与唯一图像分配数不同。 列出每路 stream 的分配
不要只读 maxBuffers → 按 allocation / dma-buf 去重
识别共享池与导入；按 allocation / dma-buf 去重
识别共享池与导入 → 读取 allocator 大小与布局
stride / tile / metadata；读取 allocator 大小与布局
stride / tile / metadata → 另列 HAL / ISP / codec 工作区
不能都记到 Java heap</desc>
