<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从 Window 找到最终显示路径</title>
<desc id="desc">按目标对象、Producer、提交点和输出结果依次确认。 多窗口、多 Layer 与多个 display 必须分别对应。 目标 Window / Layer
先固定对象和 display → 定位 Producer
沿线程与队列找到写入方；定位 Producer
沿线程与队列找到写入方 → 确认提交点
queue 或 buffer transaction；确认提交点
queue 或 buffer transaction → 检查合成与呈现
latch / type / present</desc>
