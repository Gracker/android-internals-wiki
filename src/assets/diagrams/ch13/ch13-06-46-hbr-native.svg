<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HBR 通过 RenderProxy 与 HWUI pipeline 写独立目标</title>
<desc id="desc">Java 请求经 JNI/RenderProxy 同步场景树，再由 pipeline 导出 producer fence。 DrawFrameTask 的回调交出 fd 与 status，Java 在指定 executor 交付，不保证 fence 已完成。 RenderRequest.draw
nRender 配置参数与 callback → RenderProxy / DrawFrameTask
同步 RenderNode 树；RenderProxy / DrawFrameTask
同步 RenderNode 树 → Skia pipeline / GPU
写构造时绑定的 AHB；Skia pipeline / GPU
写构造时绑定的 AHB → pipeline.flush → fd
JNI adopt 为 SyncFence</desc>
