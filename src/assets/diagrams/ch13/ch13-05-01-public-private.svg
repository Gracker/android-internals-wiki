<title id="title">原生 Vulkan WSI 与 HWUI 窗口管理</title>
<desc id="desc">原生应用使用 VkSwapchainKHR，HWUI VulkanSurface 直接管理窗口 buffer。 两条路径最终都交出 Android buffer/fence；HWUI 双 queue 不证明 GPU 硬件并行。 本条路径的阶段关系；本条路径的阶段关系；本条路径的阶段关系；本条路径的阶段关系</desc>
