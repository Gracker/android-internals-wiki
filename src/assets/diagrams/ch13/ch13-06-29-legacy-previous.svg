<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">API29–35 统计回收的是上一块 buffer</title>
<desc id="desc">提交 B 时保存 A→B 映射，用 B 的完成统计回收上一提交引用 A。 当前 B 留待未来替换/移除；control 必须来自该 stats 的合法列表。 已提交 A
保存它的提交引用 → 后续 tx 提交 B
记录被替换 A；后续 tx 提交 B
记录被替换 A → B 的 OnComplete
查询 previous release fence；B 的 OnComplete
查询 previous release fence → A 依赖成功后回收
B 仍是当前内容</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="610" fill="white"/>
<path d="M 525 120.0 L 675 120.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 665 114.0 L 675 120.0 L 665 126.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890.0 180 L 890.0 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884.0 330 L 890.0 340 L 896.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 675 400.0 L 525 400.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 535 394.0 L 525 400.0 L 535 406.0" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 99 60 Q 310.0 60.7 521 60 Q 525 60 525 64 L 525 176 Q 525 180 521 180 Q 310.0 180.6 99 180 Q 95 180 95 176 L 95 64 Q 95 60 99 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">已提交 A</tspan>
<tspan x="310.0" dy="34.0">保存它的提交引用</tspan>
</text>
<path d="M 679 60 Q 890.0 59.9 1101 60 Q 1105 60 1105 64 L 1105 176 Q 1105 180 1101 180 Q 890.0 180.1 679 180 Q 675 180 675 176 L 675 64 Q 675 60 679 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">后续 tx 提交 B</tspan>
<tspan x="890.0" dy="34.0">记录被替换 A</tspan>
</text>
<path d="M 679 340 Q 890.0 339.8 1101 340 Q 1105 340 1105 344 L 1105 456 Q 1105 460 1101 460 Q 890.0 460.6 679 460 Q 675 460 675 456 L 675 344 Q 675 340 679 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">B 的 OnComplete</tspan>
<tspan x="890.0" dy="34.0">查询 previous release fence</tspan>
</text>
<path d="M 99 340 Q 310.0 339.6 521 340 Q 525 340 525 344 L 525 456 Q 525 460 521 460 Q 310.0 460.5 99 460 Q 95 460 95 456 L 95 344 Q 95 340 99 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">A 依赖成功后回收</tspan>
<tspan x="310.0" dy="34.0">B 仍是当前内容</tspan>
</text>
</svg>
