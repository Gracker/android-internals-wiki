<title id="title">acquire、release 与 present fence 的分工</title>
<desc id="desc">三个同步边界分别说明可读、可复用与显示呈现。 FREE slot 可携带未完成 release fence，present 不能替代 release。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
