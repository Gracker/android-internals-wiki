<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">看到 fence wait 后沿对象与创建者反查</title>
<desc id="desc">先确认等待哪种 fence，再把责任追到对应 Producer 或合成路径。 CPU blocked、runnable 与 GPU dependency 含义不同，不能只按一条 wait slice 定责。 等待者线程与目标对象
queue / Layer / buffer → fence 类型与方向
acquire / release / present；fence 类型与方向
acquire / release / present → 创建者与上游工作
GPU / codec / camera / Display；创建者与上游工作
GPU / codec / camera / Display → signal 与目标 deadline
再查 running / runnable / blocked</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
