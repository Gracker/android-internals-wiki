<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">SF 收到并计入 pending</tspan>
<tspan x="600.0" dy="34.0">BufferTX 增加</tspan>
</text>
<path d="M 69 340 Q 215.0 339.5 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.3 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="215.0" y="391.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">本轮 latch</tspan>
<tspan x="215.0" dy="32.64">采纳该 buffer，计数下降</tspan>
</text>
<path d="M 454 340 Q 600.0 339.9 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.4 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
