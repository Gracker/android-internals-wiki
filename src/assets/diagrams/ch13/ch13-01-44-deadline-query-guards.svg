<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">SQL 的完整性、对象与歧义检查</title>
<desc id="desc">Actual 保留目标 Layer，Expected 按进程/token 唯一完整记录关联。 不能用包名猜 Layer，也不能任意选重复 Expected；未匹配保留 NULL。 现场 process + 精确 Layer
过滤目标 Actual → Actual dur ≥ 0
保留合法零时长；Actual dur ≥ 0
保留合法零时长 → Expected：upid + token
恰好一条且 dur ≥ 0；Expected：upid + token
恰好一条且 dur ≥ 0 → LEFT JOIN 保留 Actual
不因缺 Expected 丢记录；LEFT JOIN 保留 Actual
不因缺 Expected 丢记录 → 有匹配再算 overrun
分别检查 jank / present</desc>
