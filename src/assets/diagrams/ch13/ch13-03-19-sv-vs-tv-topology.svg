<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">SurfaceView 独立输出与 TextureView 宿主采样</title>
<desc id="desc">两者差异在 Consumer 位置和像素最终写入的 buffer。 RT 是组织与提交方，纹理采样由 GPU 执行；不按组件名断言性能高低。 对应证据或后续处理；对应证据或后续处理；对应证据或后续处理</desc>
