<text x="215.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="215.0" dy="0">旧 Consumer 使用 buffer</tspan>
<tspan x="215.0" dy="32.64">HWC / CLIENT 等读取</tspan>
</text>
<path d="M 454 60 Q 600.0 60.6 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.6 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.84" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">release / dequeue fence</tspan>
<tspan x="600.0" dy="32.64">未来 Producer 安全复用</tspan>
</text>
<path d="M 839 60 Q 985.0 59.3 1131 60 Q 1135 60 1135 64 L 1135 176 Q 1135 180 1131 180 Q 985.0 180.3 839 180 Q 835 180 835 176 L 835 64 Q 835 60 839 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="985.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">queue 0 新一轮写入</tspan>
<tspan x="985.0" dy="34.0">在依赖满足后进行</tspan>
</text>
<path d="M 69 340 Q 215.0 339.6 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.2 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="215.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="215.0" dy="0">queue 0 写入新内容</tspan>
<tspan x="215.0" dy="34.0">生成完成依赖</tspan>
</text>
<path d="M 454 340 Q 600.0 339.2 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 460.5 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="377.56" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">queue buffer + acquire</tspan>
<tspan x="600.0" dy="29.92">fence</tspan>
<tspan x="600.0" dy="29.92">CPU 可先交出</tspan>
</text>
<path d="M 839 340 Q 985.0 339.4 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.6 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="985.0" y="391.5" text-anchor="middle" style="font-size:25px">
<tspan x="985.0" dy="0">新 Consumer 真正读取</tspan>
