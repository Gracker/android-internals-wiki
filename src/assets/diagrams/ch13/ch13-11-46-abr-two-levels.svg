<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">候选过滤与ABR实时选档</title>
<desc id="desc">候选能力过滤和动态选档属于两个层级。 默认 ABR 不读取 HWC 类型，也不直接按 decoder 掉帧自动降档。 DefaultTrackSelector
能力与用户约束 → 得到允许的 track 集
尺寸 / MIME / HDR 等；得到允许的 track 集
尺寸 / MIME / HDR 等 → BandwidthMeter 输入
估计带宽 / 可选 TTFB；BandwidthMeter 输入
估计带宽 / 可选 TTFB → AdaptiveTrackSelection
预算与 buffer / live edge；AdaptiveTrackSelection
预算与 buffer / live edge → 决定下一次选档
保留 selection reason</desc>
