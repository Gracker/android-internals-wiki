<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从真实资源依赖缩小同步范围</title>
<desc id="desc">先找生产者与最早消费者，再验证 barrier 和提交组织的实际收益。 附带 fence 不自动阻塞 CPU；ALL_COMMANDS 或小 submit 的成本取决于依赖与实现。 资源 Producer / Consumer
先画必需依赖 → 最早真实消费 stage
精确覆盖访问范围；最早真实消费 stage
精确覆盖访问范围 → 减少无意义 submit / idle
保留正确同步；减少无意义 submit / idle
保留正确同步 → GPU trace 与时延对照
确认 bubble 和成本变化</desc>
