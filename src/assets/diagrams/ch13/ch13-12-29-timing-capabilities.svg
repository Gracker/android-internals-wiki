<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Present timing 先查询完整能力</title>
<desc id="desc">设备、Surface、feature 和 swapchain 条件必须同时满足。 Android 版本与头文件不证明目标设备可用。 枚举扩展 / features
present timing + present id2 → 查询 Surface timing 能力
stage / absolute / relative；查询 Surface timing 能力
stage / absolute / relative → 按条件创建 swapchain
启用所需 flags；按条件创建 swapchain
启用所需 flags → 请求时间与 present id
回收反馈或选兼容路径</desc>
