<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">context priority 请求的启用条件</title>
<desc id="desc">初始化前的非零 EGL priority 常量，满足扩展检查后映射为 Vulkan global priority。 请求对同一 queueInfo 创建的两条 queue 生效，不保证设备允许该优先级。 Properties::contextPriority
默认 0，内部入口可设置 → 非零 + EXT_global_priority v2
进入请求逻辑；非零 + EXT_global_priority v2
进入请求逻辑 → 映射 LOW / MEDIUM / HIGH
查询该 family 支持情况；映射 LOW / MEDIUM / HIGH
查询该 family 支持情况 → 附到同一 queueInfo
请求覆盖 queue 0 与 queue 1</desc>
