<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">HBR 生产像素与 SurfaceControl 提交 Layer</title>
<desc id="desc">先把像素生产、共享存储、Layer 交付和显示消费连起来。 事务与 fence 交接由应用维护；HWC 不保证给该 Layer 分配 overlay。 RenderNode / HBR
共享 RT 提交 GPU 工作 → HardwareBuffer + fence
持有像素与写入完成依赖；HardwareBuffer + fence
持有像素与写入完成依赖 → SurfaceControl transaction
提交 Layer 状态；SurfaceControl transaction
提交 Layer 状态 → SF / 合成器 / display
按依赖读取并输出</desc>
