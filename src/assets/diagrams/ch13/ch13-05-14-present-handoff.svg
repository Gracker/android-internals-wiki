<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">CPU present 怎样变成 Android buffer 提交</title>
<desc id="desc">私有驱动入口导出 Producer 完成 fence，再由 CPU queueBuffer 交出窗口内容。 fence 可未 signal；queueBuffer 接管 fd 不代表 GPU 完成或显示已经发生。 vkQueuePresentKHR
imageIndex + wait semaphore → QueueSignalReleaseImageANDROID
转换为写入完成 fence；QueueSignalReleaseImageANDROID
转换为写入完成 fence → CPU queueBuffer(buffer, fd)
fd 所有权交给窗口；CPU queueBuffer(buffer, fd)
fd 所有权交给窗口 → BLAST buffer transaction
SF 读取前遵守 acquire</desc>
