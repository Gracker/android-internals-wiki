<tspan x="215.0" dy="0">true</tspan>
<tspan x="215.0" dy="34.0">draw 前 unblock UI</tspan>
</text>
<path d="M 454 340 Q 600.0 339.7 746 340 Q 750 340 750 344 L 750 456 Q 750 460 746 460 Q 600.0 459.5 454 460 Q 450 460 450 456 L 450 344 Q 450 340 454 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="377.56" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">false</tspan>
<tspan x="600.0" dy="29.92">draw / waitOnFences</tspan>
<tspan x="600.0" dy="29.92">后放行</tspan>
</text>
<path d="M 839 340 Q 985.0 339.9 1131 340 Q 1135 340 1135 344 L 1135 456 Q 1135 460 1131 460 Q 985.0 460.4 839 460 Q 835 460 835 456 L 835 344 Q 835 340 839 340" fill="white" stroke="#E8913A" stroke-width="3"/>
