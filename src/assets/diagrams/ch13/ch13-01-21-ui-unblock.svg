<path d="M 454 60 Q 600.0 60.2 746 60 Q 750 60 750 64 L 750 176 Q 750 180 746 180 Q 600.0 179.8 454 180 Q 450 180 450 176 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="112.52" text-anchor="middle" style="font-size:22px">
<tspan x="600.0" dy="0">syncFrameState</tspan>
<tspan x="600.0" dy="29.92">返回 info.prepareTextures</tspan>
</text>
<path d="M 69 340 Q 215.0 339.8 361 340 Q 365 340 365 344 L 365 456 Q 365 460 361 460 Q 215.0 460.3 69 460 Q 65 460 65 456 L 65 344 Q 65 340 69 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
