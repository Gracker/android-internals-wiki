<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
<title id="title">启动视图按 slice 起点选取，原始时长未裁剪且可嵌套</title>
<desc id="desc">v57.2低层视图slice.ts BETWEEN启动起止，返回整段slice.dur；5ms仅查询过滤条件。 教学区间，无测量；整段时长、窗口交集和去重CPU时间是不同指标，不能直接相加。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
