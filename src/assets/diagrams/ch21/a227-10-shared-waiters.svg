<path d="M 400 455 L 460 455 L 460 330 L 540 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 530 324 L 540 330 L 530 336" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 900 300 L 1010 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1000 294 L 1010 300 L 1000 306" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 80 Q 235.0 79.4 396 80 Q 400 80 400 84 L 400 186 Q 400 190 396 190 Q 235.0 190.3 74 190 Q 70 190 70 186 L 70 84 Q 70 80 74 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="235.0" y="126.5" text-anchor="middle" style="font-size:25px">
<tspan x="235.0" dy="0">页面 A</tspan>
<tspan x="235.0" dy="34.0">awaitReady(deadline)</tspan>
</text>
<path d="M 74 400 Q 235.0 399.6 396 400 Q 400 400 400 404 L 400 506 Q 400 510 396 510 Q 235.0 510.1 74 510 Q 70 510 70 506 L 70 404 Q 70 400 74 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="235.0" y="446.5" text-anchor="middle" style="font-size:25px">
<tspan x="235.0" dy="0">页面 B</tspan>
<tspan x="235.0" dy="34.0">awaitReady(deadline)</tspan>
</text>
<path d="M 544 240 Q 720.0 239.6 896 240 Q 900 240 900 244 L 900 356 Q 900 360 896 360 Q 720.0 359.9 544 360 Q 540 360 540 356 L 540 244 Q 540 240 544 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="720.0" y="291.5" text-anchor="middle" style="font-size:25px">
<tspan x="720.0" dy="0">AdSdkGateway</tspan>
<tspan x="720.0" dy="34.0">私有 Deferred + Mutex</tspan>
</text>
<path d="M 1014 240 Q 1175.0 240.3 1336 240 Q 1340 240 1340 244 L 1340 356 Q 1340 360 1336 360 Q 1175.0 360.5 1014 360 Q 1010 360 1010 356 L 1010 244 Q 1010 240 1014 240" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="1175.0" y="292.18" text-anchor="middle" style="font-size:23px">
<tspan x="1175.0" dy="0">App 受控 Job / 作用域</tspan>
<tspan x="1175.0" dy="31.28">按 SDK 契约执行 initializer</tspan>
</text>
<text x="700.0" y="565" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">协作式超时不能抢占主线程阻塞供应方调用；owner 取消仍会取消共享任务</tspan>
</text>
</svg>
