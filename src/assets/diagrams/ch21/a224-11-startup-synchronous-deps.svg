<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">共享一个 InitializationProvider，依赖同步执行后才创建根</title>
<desc id="desc">依赖节点无需重复metadata；手动初始化同样要满足调用线程契约，其他剩余根仍可提前触发共享依赖。 减少Provider入口不会消除SDK磁盘、锁和网络成本，也不会自动异步化。 根发现之后先递归依赖；Logger完成后才创建CrashClient；创建结果写入缓存</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="620" fill="white"/>
<path d="M 410 240 L 460 240 L 460 125 L 520 125" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 510 119 L 520 125 L 510 131" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 180 L 700 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 694 330 L 700 340 L 706 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 880 395 L 1030 395" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1020 389 L 1030 395 L 1020 401" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 190 Q 240.0 189.3 406 190 Q 410 190 410 194 L 410 286 Q 410 290 406 290 Q 240.0 290.2 74 290 Q 70 290 70 286 L 70 194 Q 70 190 74 190" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="240.0" y="231.5" text-anchor="middle" style="font-size:25px">
<tspan x="240.0" dy="0">Manifest根</tspan>
<tspan x="240.0" dy="34.0">CrashInitializer</tspan>
</text>
<path d="M 524 70 Q 700.0 69.3 876 70 Q 880 70 880 74 L 880 176 Q 880 180 876 180 Q 700.0 180.5 524 180 Q 520 180 520 176 L 520 74 Q 520 70 524 70" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="700.0" y="117.18" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">依赖LoggerInitializer</tspan>
<tspan x="700.0" dy="31.28">同步create先完成</tspan>
</text>
<path d="M 524 340 Q 700.0 340.4 876 340 Q 880 340 880 344 L 880 446 Q 880 450 876 450 Q 700.0 450.2 524 450 Q 520 450 520 446 L 520 344 Q 520 340 524 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="700.0" y="387.18" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">CrashInitializer.create</tspan>
<tspan x="700.0" dy="31.28">同步返回CrashClient</tspan>
</text>
<path d="M 1034 340 Q 1180.0 340.4 1326 340 Q 1330 340 1330 344 L 1330 446 Q 1330 450 1326 450 Q 1180.0 449.5 1034 450 Q 1030 450 1030 446 L 1030 344 Q 1030 340 1034 340" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="1180.0" y="387.18" text-anchor="middle" style="font-size:23px">
<tspan x="1180.0" dy="0">进程内缓存</tspan>
<tspan x="1180.0" dy="31.28">后续请求复用</tspan>
</text>
<text x="700.0" y="575" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">减少Provider入口不会消除SDK磁盘、锁和网络成本，也不会自动异步化。</tspan>
</text>
</svg>
