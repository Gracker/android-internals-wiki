<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">starting theme 在 onCreate 前交给正常主题</title>
<desc id="desc">启动主题提供背景和图标，兼容库安装时切换到正常主题；主题切换责任要明确。 图标动画时长属性不决定 Splash 停留时间；API33+ 可从 AVD 推断时长 Manifest 入口 / Starting Theme → installSplashScreen / 紧邻 super 之前；installSplashScreen / 紧邻 super 之前 → 切 postSplashTheme / 正常 Activity 主题；切 postSplashTheme / 正常 Activity 主题 → setContentView / 构造 App 首帧</desc>
