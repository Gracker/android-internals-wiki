<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">Provider 可在 Application 开关之前触发 SDK</title>
<desc id="desc">从最终构建产物检查组件、进程和 initializer 依赖；Application 内开关不能撤回已执行的 Provider。 移除自动入口需供应方支持，升级后再次检查 Manifest diff 最终 merged manifest / 包含自动初始化入口 → 进程绑定 / 安装 / Provider 列表；进程绑定 / 安装 / Provider 列表 → Provider.onCreate / SDK 自动工作；Provider.onCreate / SDK 自动工作 → Application.onCreate / 此处开关已经晚了</desc>
