<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">Application 先创建，普通 Provider 安装早于 Application.onCreate</title>
<desc id="desc">仅普通绑定且列表非空执行Provider段；restrictedBackupMode跳过，动态获取还可能后续安装。 Application.onCreate起点会漏Provider和更早系统工作，不能作为完整TTID起点。 创建并 attach / Application实例 → 安装分配的Providers / 同步onCreate；安装分配的Providers / 同步onCreate → Instrumentation / onCreate；Instrumentation / onCreate → Application / onCreate</desc>
