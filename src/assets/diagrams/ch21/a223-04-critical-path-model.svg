<title id="title">最长依赖链给出理论下界，非关键分支变快未必缩短结束时间</title>
<desc id="desc">教学假设：max(8+20,12+10)+15+0=43ms；真机还需加入排队、竞争和实际帧成本。 所有数字均为理想DAG教学输入，不是测量；FirstFrame额外成本在这个模型中按零。 Logger依赖传到Crash；Device依赖传到Config；28ms分支先完成再汇合；22ms分支也必须完成；HomeState完成再到FirstFrame</desc>
