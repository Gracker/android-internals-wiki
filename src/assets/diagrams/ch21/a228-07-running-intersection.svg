<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
<title id="title">SQL 只累加 Running 区间与启动窗口的交集</title>
<desc id="desc">SQL 以 utid/upid 关联线程和进程，并按 upid 拆分同名进程生命周期；统计的是 daemon CPU 时间。 dur&lt;0 不计入，缺失不等于零；图示单个区间，不是实测启动或 GC 时长 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="610" fill="white"/>
<text x="700.0" y="565" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">dur&lt;0 不计入，缺失不等于零；图示单个区间，不是实测启动或 GC 时长</tspan>
</text>
<text x="286" y="113" text-anchor="end" style="font-size:23px">
<tspan x="286" dy="0">启动窗口</tspan>
</text>
<path d="M 300 129 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 504 90 Q 800.0 90.8 1096 90 Q 1100 90 1100 94 L 1100 123 Q 1100 127 1096 127 Q 800.0 126.8 504 127 Q 500 127 500 123 L 500 94 Q 500 90 504 90" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="800.0" y="116" text-anchor="middle" style="font-size:21px">
<tspan x="800.0" dy="0">start_ns → end_ns</tspan>
</text>
<text x="286" y="283" text-anchor="end" style="font-size:23px">
<tspan x="286" dy="0">daemon Running</tspan>
</text>
<path d="M 300 299 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 354 260 Q 800.0 259.5 1246 260 Q 1250 260 1250 264 L 1250 293 Q 1250 297 1246 297 Q 800.0 296.7 354 297 Q 350 297 350 293 L 350 264 Q 350 260 354 260" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="800.0" y="286" text-anchor="middle" style="font-size:21px">
<tspan x="800.0" dy="0">一个已知时长的 Running 区间</tspan>
</text>
<text x="286" y="453" text-anchor="end" style="font-size:23px">
<tspan x="286" dy="0">计入 SQL 的部分</tspan>
</text>
<path d="M 300 469 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 504 430 Q 800.0 429.3 1096 430 Q 1100 430 1100 434 L 1100 463 Q 1100 467 1096 467 Q 800.0 467.2 504 467 Q 500 467 500 463 L 500 434 Q 500 430 504 430" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="800.0" y="456" text-anchor="middle" style="font-size:21px">
<tspan x="800.0" dy="0">max(0, min(结束) − max(开始))</tspan>
</text>
</svg>
