<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">系统条件判断到 Shell 表面创建</title>
<desc id="desc">system_server 传递条件和数据，Shell 根据类型创建 Splash、Snapshot 或 windowless 表面。 系统起始表面不要求 App 先 inflate 一张业务启动页 ActivityRecord / 条件 / 主题 / 快照 → StartingData / 经 TaskOrganizer；StartingData / 经 TaskOrganizer → Shell Controller / 算法选择具体类型；Shell Controller / 算法选择具体类型 → SurfaceDrawer / 对应 Creator 绘制</desc>
