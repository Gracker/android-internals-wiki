<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">每个进程有独立任务图和单例，内存依赖边不能跨进程</title>
<desc id="desc">:worker是私有进程名称后缀；Provider子类与唯一authority指定它自己的metadata。 默认Provider不会自动复制到所有子进程；Main首帧尽量不阻塞等待远端进程。 主进程通过明确协议读取状态；worker通过明确协议发布状态</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="660" fill="white"/>
<path d="M 310 230 L 310 440 L 450 440" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 434 L 450 440 L 440 446" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1090 230 L 1090 440 L 950 440" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 960 434 L 950 440 L 960 446" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 100 Q 310.0 100.1 546 100 Q 550 100 550 104 L 550 226 Q 550 230 546 230 Q 310.0 230.5 74 230 Q 70 230 70 226 L 70 104 Q 70 100 74 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="156.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">默认进程 Provider</tspan>
<tspan x="310.0" dy="34.0">独立 AppInitializer 与缓存</tspan>
</text>
<path d="M 854 100 Q 1090.0 99.6 1326 100 Q 1330 100 1330 104 L 1330 226 Q 1330 230 1326 230 Q 1090.0 229.2 854 230 Q 850 230 850 226 L 850 104 Q 850 100 854 100" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1090.0" y="157.18" text-anchor="middle" style="font-size:23px">
<tspan x="1090.0" dy="0">:worker 私有应用进程</tspan>
<tspan x="1090.0" dy="31.28">专用Provider子类与metadata</tspan>
</text>
<path d="M 454 380 Q 700.0 379.3 946 380 Q 950 380 950 384 L 950 496 Q 950 500 946 500 Q 700.0 500.0 454 500 Q 450 500 450 496 L 450 384 Q 450 380 454 380" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="700.0" y="432.18" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">跨进程完成关系</tspan>
<tspan x="700.0" dy="31.28">Binder / Provider / 持久协议</tspan>
</text>
<text x="700.0" y="615" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">默认Provider不会自动复制到所有子进程；Main首帧尽量不阻塞等待远端进程。</tspan>
</text>
</svg>
