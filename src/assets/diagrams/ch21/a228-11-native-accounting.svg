<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
<title id="title">ART native 压力不是进程 PSS 的同义词</title>
<desc id="desc">系统 malloc 未逐笔注册也可能参与压力；自行 mmap、图形与文件页是否覆盖，取决于分配和登记路径。 计入统计与触发检查是两回事；PSS、Java已用量与 native 压力阈值不能互相替代 malloc bytes contribute to native accounting；explicit registered nonmalloc bytes contribute；check uses current native and Java heap pressure</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="610" fill="white"/>
<path d="M 400 145 L 460 145 L 460 270 L 520 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 510 264 L 520 270 L 510 276" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 400 445 L 460 445 L 460 330 L 520 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 510 324 L 520 330 L 510 336" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 860 300 L 980 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 970 294 L 980 300 L 970 306" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 90 Q 235.0 89.7 396 90 Q 400 90 400 94 L 400 196 Q 400 200 396 200 Q 235.0 200.5 74 200 Q 70 200 70 196 L 70 94 Q 70 90 74 90" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="235.0" y="136.5" text-anchor="middle" style="font-size:25px">
<tspan x="235.0" dy="0">系统 malloc 已用</tspan>
<tspan x="235.0" dy="34.0">mallinfo.uordblks</tspan>
</text>
<path d="M 74 390 Q 235.0 390.0 396 390 Q 400 390 400 394 L 400 496 Q 400 500 396 500 Q 235.0 500.5 74 500 Q 70 500 70 496 L 70 394 Q 70 390 74 390" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="235.0" y="436.5" text-anchor="middle" style="font-size:25px">
<tspan x="235.0" dy="0">非 malloc 显式登记</tspan>
<tspan x="235.0" dy="34.0">native_bytes_registered</tspan>
</text>
<path d="M 524 240 Q 690.0 240.0 856 240 Q 860 240 860 244 L 860 356 Q 860 360 856 360 Q 690.0 360.7 524 360 Q 520 360 520 356 L 520 244 Q 520 240 524 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="690.0" y="291.5" text-anchor="middle" style="font-size:25px">
<tspan x="690.0" dy="0">GetNativeBytes</tspan>
<tspan x="690.0" dy="34.0">两笔统计相加</tspan>
</text>
<path d="M 984 240 Q 1155.0 240.2 1326 240 Q 1330 240 1330 244 L 1330 356 Q 1330 360 1326 360 Q 1155.0 360.2 984 360 Q 980 360 980 356 L 980 244 Q 980 240 984 240" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="1155.0" y="292.18" text-anchor="middle" style="font-size:23px">
<tspan x="1155.0" dy="0">检查发生且压力满足</tspan>
<tspan x="1155.0" dy="31.28">Java heap + native 综合判断</tspan>
</text>
<text x="700.0" y="565" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">计入统计与触发检查是两回事；PSS、Java已用量与 native 压力阈值不能互相替代</tspan>
</text>
</svg>
