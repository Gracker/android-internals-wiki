<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
<title id="title">任务移到后台后，主线程等待仍可能留在关键路径</title>
<desc id="desc">等待结果时端到端路径没有消失；即使不等待，后台CPU/I/O/类加载也可能与首帧竞争。 教学时序，无持续时间或CPU占用测量；墙时含等待，不等于CPU消耗。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="480" fill="white"/>
<text x="700.0" y="435" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">教学时序，无持续时间或CPU占用测量；墙时含等待，不等于CPU消耗。</tspan>
</text>
<text x="266" y="133" text-anchor="end" style="font-size:23px">
<tspan x="266" dy="0">主线程</tspan>
</text>
