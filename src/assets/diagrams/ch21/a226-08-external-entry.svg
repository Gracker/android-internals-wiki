<text x="940.0" y="341.5" text-anchor="middle" style="font-size:25px">
<tspan x="940.0" dy="0">实际起始 Activity</tspan>
<tspan x="940.0" dy="34.0">Starting Theme + install</tspan>
</text>
<text x="700.0" y="665" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">installSplashScreen 放在对应 Activity 的 super.onCreate 之前</tspan>
</text>
</svg>
