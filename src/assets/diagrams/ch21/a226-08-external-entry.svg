<path d="M 690 314 L 700 320 L 690 326" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 380 345 L 700 345" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 690 339 L 700 345 L 690 351" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 380 545 L 540 545 L 540 380 L 700 380" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 690 374 L 700 380 L 690 386" stroke="#202020" stroke-width="2.8" fill="none"/>
