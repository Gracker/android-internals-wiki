<text x="230.0" y="136.5" text-anchor="middle" style="font-size:25px">
<tspan x="230.0" dy="0">Launcher</tspan>
<tspan x="230.0" dy="34.0">桌面图标入口</tspan>
</text>
<path d="M 84 290 Q 230.0 289.9 376 290 Q 380 290 380 294 L 380 396 Q 380 400 376 400 Q 230.0 400.2 84 400 Q 80 400 80 396 L 80 294 Q 80 290 84 290" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="230.0" y="336.5" text-anchor="middle" style="font-size:25px">
<tspan x="230.0" dy="0">Deep link / App Link</tspan>
<tspan x="230.0" dy="34.0">直接目标页入口</tspan>
</text>
<path d="M 84 490 Q 230.0 490.1 376 490 Q 380 490 380 494 L 380 596 Q 380 600 376 600 Q 230.0 600.2 84 600 Q 80 600 80 596 L 80 494 Q 80 490 84 490" fill="white" stroke="#E8913A" stroke-width="3"/>
