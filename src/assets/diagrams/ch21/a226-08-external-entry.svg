<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710" role="img" aria-labelledby="title desc">
<title id="title">所有可能冷启动的外部入口都需要主题与安装</title>
<desc id="desc">每条外部路由都可能在冷进程中直接进入不同 Activity；仅桌面入口接入会漏测其他路径。 installSplashScreen 放在对应 Activity 的 super.onCreate 之前 launcher target installs splash；direct-link target installs splash；notification target installs splash</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
