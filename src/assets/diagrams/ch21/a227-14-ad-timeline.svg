<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">把初始化、请求、素材与曝光拆成不同时间线</title>
<desc id="desc">用同一单调时间基准关联会话，分别记录触发、调用、回调、响应、渲染 Ready 与曝光。 教学轨道没有测量时长；初始化完成、素材可渲染与广告曝光不等价 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="650" fill="white"/>
<text x="700.0" y="605" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">教学轨道没有测量时长；初始化完成、素材可渲染与广告曝光不等价</tspan>
</text>
<text x="286" y="123" text-anchor="end" style="font-size:23px">
<tspan x="286" dy="0">初始化</tspan>
</text>
<path d="M 300 139 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 304 100 Q 405.0 100.6 506 100 Q 510 100 510 104 L 510 133 Q 510 137 506 137 Q 405.0 136.9 304 137 Q 300 137 300 133 L 300 104 Q 300 100 304 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="405.0" y="126" text-anchor="middle" style="font-size:21px">
<tspan x="405.0" dy="0">网关触发 / init</tspan>
</text>
<path d="M 514 100 Q 675.0 100.4 836 100 Q 840 100 840 104 L 840 133 Q 840 137 836 137 Q 675.0 136.9 514 137 Q 510 137 510 133 L 510 104 Q 510 100 514 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="675.0" y="126" text-anchor="middle" style="font-size:21px">
<tspan x="675.0" dy="0">等待 SDK 回调</tspan>
</text>
<text x="286" y="303" text-anchor="end" style="font-size:23px">
<tspan x="286" dy="0">广告请求</tspan>
</text>
<path d="M 300 319 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 844 280 Q 955.0 280.6 1066 280 Q 1070 280 1070 284 L 1070 313 Q 1070 317 1066 317 Q 955.0 317.2 844 317 Q 840 317 840 313 L 840 284 Q 840 280 844 280" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="955.0" y="306" text-anchor="middle" style="font-size:21px">
<tspan x="955.0" dy="0">请求 → 响应</tspan>
</text>
<text x="286" y="483" text-anchor="end" style="font-size:23px">
<tspan x="286" dy="0">渲染与曝光</tspan>
</text>
<path d="M 300 499 H 1300" stroke="#777777" stroke-width="1.5"/>
<path d="M 1074 460 Q 1180.0 459.3 1286 460 Q 1290 460 1290 464 L 1290 493 Q 1290 497 1286 497 Q 1180.0 496.3 1074 497 Q 1070 497 1070 493 L 1070 464 Q 1070 460 1074 460" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1180.0" y="486" text-anchor="middle" style="font-size:21px">
<tspan x="1180.0" dy="0">素材 Ready / 曝光</tspan>
</text>
</svg>
