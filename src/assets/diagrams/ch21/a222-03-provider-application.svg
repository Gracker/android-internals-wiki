<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">Application 先创建，Provider 初始化早于它的 onCreate</title>
<desc id="desc">自动SDK与App Startup可能位于中间段；restrictedBackupMode和空Provider列表会跳过安装。 按实际进程与入口评估，不能把Application.onCreate计时称作总启动。 创建并 attach / Application 实例 → 安装 Providers / 类加载 / onCreate；安装 Providers / 类加载 / onCreate → Instrumentation / onCreate；Instrumentation / onCreate → Application / onCreate</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
