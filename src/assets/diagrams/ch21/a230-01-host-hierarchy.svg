<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">Compose 通过 View 宿主接入 Android 渲染管线</title>
<desc id="desc">公开容器与内部 UI owner 各有职责；Composable 调用数量不能等同 View 或布局节点数量。 Compose 是应用携带的 AndroidX 库，不属于 Android17 framework boot image ComponentActivity / setContent 扩展入口 → 公开 ComposeView / 保存业务 content；公开 ComposeView / 保存业务 content → AndroidComposeView / 内部 UI owner / 节点；AndroidComposeView / 内部 UI owner / 节点 → ViewRootImpl / HWUI / 承接窗口遍历与渲染</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
