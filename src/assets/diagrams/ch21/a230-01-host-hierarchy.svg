<path d="M 406.0 189 L 416.0 195 L 406.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 678.0 195 L 722.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 712.0 189 L 722.0 195 L 712.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 984.0 195 L 1028.0 195" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1018.0 189 L 1028.0 195 L 1018.0 201" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114.0 130 Q 241.0 130.4 368.0 130 Q 372.0 130 372.0 134 L 372.0 256 Q 372.0 260 368.0 260 Q 241.0 259.8 114.0 260 Q 110.0 260 110.0 256 L 110.0 134 Q 110.0 130 114.0 130" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="241.0" y="187.18" text-anchor="middle" style="font-size:23px">
<tspan x="241.0" dy="0">ComponentActivity</tspan>
<tspan x="241.0" dy="31.28">setContent 扩展入口</tspan>
</text>
<path d="M 420.0 130 Q 547.0 130.3 674.0 130 Q 678.0 130 678.0 134 L 678.0 256 Q 678.0 260 674.0 260 Q 547.0 260.2 420.0 260 Q 416.0 260 416.0 256 L 416.0 134 Q 416.0 130 420.0 130" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="547.0" y="187.18" text-anchor="middle" style="font-size:23px">
<tspan x="547.0" dy="0">公开 ComposeView</tspan>
<tspan x="547.0" dy="31.28">保存业务 content</tspan>
</text>
<path d="M 726.0 130 Q 853.0 129.6 980.0 130 Q 984.0 130 984.0 134 L 984.0 256 Q 984.0 260 980.0 260 Q 853.0 259.5 726.0 260 Q 722.0 260 722.0 256 L 722.0 134 Q 722.0 130 726.0 130" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="853.0" y="187.18" text-anchor="middle" style="font-size:23px">
<tspan x="853.0" dy="0">AndroidComposeView</tspan>
<tspan x="853.0" dy="31.28">内部 UI owner / 节点</tspan>
</text>
<path d="M 1032.0 130 Q 1159.0 129.9 1286.0 130 Q 1290.0 130 1290.0 134 L 1290.0 256 Q 1290.0 260 1286.0 260 Q 1159.0 260.1 1032.0 260 Q 1028.0 260 1028.0 256 L 1028.0 134 Q 1028.0 130 1032.0 130" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="1159.0" y="187.18" text-anchor="middle" style="font-size:23px">
<tspan x="1159.0" dy="0">ViewRootImpl / HWUI</tspan>
<tspan x="1159.0" dy="31.28">承接窗口遍历与渲染</tspan>
</text>
<text x="700" y="338" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">Compose 是应用携带的 AndroidX 库，不属于 Android17 framework boot image</tspan>
</text>
</svg>
