<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">正常绑定路径先安装 provider，再调用 Application.onCreate</title>
<desc id="desc">创建 Application 并完成 attach 后，正常绑定路径先安装同进程 provider，再进入 Instrumentation 和 Application 回调。 provider 的 attachInfo/onCreate 可进入冷启动关键路径；图省略中间设置与异常处理，provider 失败时不保证后续 Application 回调执行。 创建Application与attach
包括应用attachBaseContext → 安装本进程ContentProvider
attachInfo / provider.onCreate；安装本进程ContentProvider
attachInfo / provider.onCreate → Instrumentation初始化
原方法中的独立错误边界；Instrumentation初始化
原方法中的独立错误边界 → 调用Application.onCreate
之后继续完成绑定与启动</desc>
