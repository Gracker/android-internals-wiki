<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Framework 按 PID 应用 Frozen/Unfrozen profile</title>
<desc id="desc">ProcessRecord 经 JNI 给目标 PID 写入对应 cgroup.freeze，Framework 按进程冻结标记更新 UID；内核完成状态要另查。 cgroup 冻结是异步完成的请求；同 UID 的多个 PID 分别处理，路径还受产品配置和读取权限约束。 ProcessRecord / PID / UID
进程具备冻结资格 → Process.setProcessFrozen
JNI调用SetProcessProfiles；Process.setProcessFrozen
JNI调用SetProcessProfiles → Frozen / Unfrozen profile
FreezerState写1或0；Frozen / Unfrozen profile
FreezerState写1或0 → Framework按进程标记更新UID
不等待events确认内核完成
实际状态另查cgroup.events</desc>
