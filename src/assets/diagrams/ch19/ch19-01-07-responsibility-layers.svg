<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">产品名称要落到具体改动层与执行动作</title>
<desc id="desc">应用通过公开 API 表达需求，系统服务决定策略，native/HAL 与内核驱动实施各自的资源动作。 这是责任依赖图，非每次调用必经四层；Binder 驱动位于内核，Rust 系统服务也可独立于 system_server。 应用与系统应用
SDK / 场景 / 用户模式 → Framework策略与产品配置
AMS / WMS / DeviceConfig；Framework策略与产品配置
AMS / WMS / DeviceConfig → native用户空间与HAL
SF / Binder库 / 设备实现；native用户空间与HAL
SF / Binder库 / 设备实现 → 内核与硬件执行
调度 / cgroup / 驱动 / 固件</desc>
