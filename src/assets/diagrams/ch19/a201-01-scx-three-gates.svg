<text x="853.0" y="186.5" text-anchor="middle" style="font-size:25px">
<tspan x="853.0" dy="0">策略接管范围</tspan>
<tspan x="853.0" dy="34.0">full / partial</tspan>
</text>
<path d="M 1032.0 130 Q 1159.0 130.5 1286.0 130 Q 1290.0 130 1290.0 134 L 1290.0 256 Q 1290.0 260 1286.0 260 Q 1159.0 259.2 1032.0 260 Q 1028.0 260 1028.0 256 L 1028.0 134 Q 1028.0 130 1032.0 130" fill="white" stroke="#5BA4CF" stroke-width="3"/>
