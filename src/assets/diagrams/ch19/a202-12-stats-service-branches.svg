<path d="M 525 124 L 535 130 L 525 136" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 720 180 L 720 250 L 280 250 L 280 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 274 330 L 280 340 L 286 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 720 180 L 720 290 L 700 290 L 700 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 694 330 L 700 340 L 706 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 720 180 L 720 250 L 1120 250 L 1120 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1114 330 L 1120 340 L 1126 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 84 80 Q 265.0 80.0 446 80 Q 450 80 450 84 L 450 176 Q 450 180 446 180 Q 265.0 179.5 84 180 Q 80 180 80 176 L 80 84 Q 80 80 84 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="265.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="265.0" dy="0">设备 PowerStats HAL</tspan>
<tspan x="265.0" dy="34.0">AIDL v2 / HIDL 回退</tspan>
</text>
<path d="M 539 80 Q 720.0 79.5 901 80 Q 905 80 905 84 L 905 176 Q 905 180 901 180 Q 720.0 179.9 539 180 Q 535 180 535 176 L 535 84 Q 535 80 539 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="720.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="720.0" dy="0">HALWrapper</tspan>
<tspan x="720.0" dy="34.0">PowerStatsService</tspan>
</text>
<path d="M 104 340 Q 280.0 339.9 456 340 Q 460 340 460 344 L 460 436 Q 460 440 456 440 Q 280.0 439.4 104 440 Q 100 440 100 436 L 100 344 Q 100 340 104 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="280.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="280.0" dy="0">PowerStatsLogger</tspan>
<tspan x="280.0" dy="34.0">滚动存储 / proto 导出</tspan>
</text>
<path d="M 524 340 Q 700.0 340.8 876 340 Q 880 340 880 344 L 880 436 Q 880 440 876 440 Q 700.0 439.3 524 440 Q 520 440 520 436 L 520 344 Q 520 340 524 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="700.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="700.0" dy="0">公开 Power Monitor</tspan>
<tspan x="700.0" dy="34.0">独立缓存 → 应用</tspan>
</text>
<path d="M 944 340 Q 1120.0 340.1 1296 340 Q 1300 340 1300 344 L 1300 436 Q 1300 440 1296 440 Q 1120.0 439.3 944 440 Q 940 440 940 436 L 940 344 Q 940 340 944 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1120.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="1120.0" dy="0">LocalService</tspan>
<tspan x="1120.0" dy="34.0">StatsPull → StatsD</tspan>
</text>
<text x="700.0" y="545" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">Logger 落盘转换为 Unix 时间；原始 HAL 读数仍用 BOOTTIME</tspan>
</text>
</svg>
