<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc">
<title id="title">运行状态与入口可见性分开建模</title>
<desc id="desc">锁定的两种 UI 状态都意味着资料用户停止；解锁重新启动用户，应用仍应按进程死亡后的常规恢复流程重建状态。 入口隐藏是展示配置；锁定是资料用户生命周期状态 锁定停止用户，可保留解锁入口；认证解锁重新启动用户；已锁定时入口隐藏设置影响 Launcher 可见性；隐藏入口下仍可经系统入口认证后解锁</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="690" fill="white"/>
<path d="M 460 270 L 650 270 L 650 155 L 850 155" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 840 149 L 850 155 L 840 161" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 850 195 L 730 195 L 730 330 L 460 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 470 324 L 460 330 L 470 336" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1050 230 L 1050 410" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1044 400 L 1050 410 L 1056 400" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 850 485 L 600 485 L 600 370 L 460 370" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 470 364 L 460 370 L 470 376" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 104 235 Q 280.0 234.8 456 235 Q 460 235 460 239 L 460 391 Q 460 395 456 395 Q 280.0 394.8 104 395 Q 100 395 100 391 L 100 239 Q 100 235 104 235" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="280.0" y="289.5" text-anchor="middle" style="font-size:25px">
<tspan x="280.0" dy="0">已解锁</tspan>
<tspan x="280.0" dy="34.0">private user started</tspan>
<tspan x="280.0" dy="34.0">应用可运行</tspan>
</text>
<path d="M 854 80 Q 1050.0 80.2 1246 80 Q 1250 80 1250 84 L 1250 226 Q 1250 230 1246 230 Q 1050.0 229.9 854 230 Q 850 230 850 226 L 850 84 Q 850 80 854 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1050.0" y="129.5" text-anchor="middle" style="font-size:25px">
<tspan x="1050.0" dy="0">已锁定，入口可见</tspan>
<tspan x="1050.0" dy="34.0">private user stopped</tspan>
<tspan x="1050.0" dy="34.0">仅展示解锁入口</tspan>
</text>
<path d="M 854 410 Q 1050.0 409.9 1246 410 Q 1250 410 1250 414 L 1250 556 Q 1250 560 1246 560 Q 1050.0 560.8 854 560 Q 850 560 850 556 L 850 414 Q 850 410 854 410" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1050.0" y="459.5" text-anchor="middle" style="font-size:25px">
<tspan x="1050.0" dy="0">已锁定，入口隐藏</tspan>
<tspan x="1050.0" dy="34.0">private user stopped</tspan>
<tspan x="1050.0" dy="34.0">入口也不展示</tspan>
</text>
<rect x="619.0" y="185.0" width="62.0" height="36.3" fill="white"/>
<text x="650" y="210" text-anchor="middle" style="font-size:23px">
<tspan x="650" dy="0">锁定</tspan>
</text>
<rect x="569.0" y="305.0" width="62.0" height="36.3" fill="white"/>
<text x="600" y="330" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">解锁</tspan>
</text>
<rect x="996.0" y="305.0" width="108.0" height="36.3" fill="white"/>
<text x="1050" y="330" text-anchor="middle" style="font-size:23px">
<tspan x="1050" dy="0">入口配置</tspan>
</text>
<rect x="581.0" y="460.0" width="108.0" height="36.3" fill="white"/>
<text x="635" y="485" text-anchor="middle" style="font-size:23px">
<tspan x="635" dy="0">认证解锁</tspan>
</text>
<text x="700.0" y="645" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">入口隐藏是展示配置；锁定是资料用户生命周期状态</tspan>
</text>
</svg>
