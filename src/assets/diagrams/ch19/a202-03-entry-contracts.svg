<text x="375.0" y="145.32" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">系统场景 / 特权调用</tspan>
</text>
<path d="M 784 80 Q 1025.0 80.3 1266 80 Q 1270 80 1270 84 L 1270 191 Q 1270 195 1266 195 Q 1025.0 194.5 784 195 Q 780 195 780 191 L 780 84 Q 780 80 784 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1025.0" y="129.68" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">PowerManagerService</tspan>
<tspan x="1025.0" dy="31.28">→ setMode / setBoost</tspan>
</text>
<path d="M 134 240 Q 375.0 239.7 616 240 Q 620 240 620 244 L 620 351 Q 620 355 616 355 Q 375.0 354.5 134 355 Q 130 355 130 351 L 130 244 Q 130 240 134 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="375.0" y="305.32" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">应用周期工作</tspan>
</text>
<path d="M 784 240 Q 1025.0 239.7 1266 240 Q 1270 240 1270 244 L 1270 351 Q 1270 355 1266 355 Q 1025.0 354.5 784 355 Q 780 355 780 351 L 780 244 Q 780 240 784 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1025.0" y="289.68" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">PerformanceHintManager</tspan>
<tspan x="1025.0" dy="31.28">→ HintManagerService</tspan>
</text>
<path d="M 134 400 Q 375.0 399.3 616 400 Q 620 400 620 404 L 620 511 Q 620 515 616 515 Q 375.0 515.8 134 515 Q 130 515 130 511 L 130 404 Q 130 400 134 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="375.0" y="465.32" text-anchor="middle" style="font-size:23px">
<tspan x="375.0" dy="0">Hint Session 报告</tspan>
</text>
<path d="M 784 400 Q 1025.0 399.8 1266 400 Q 1270 400 1270 404 L 1270 511 Q 1270 515 1266 515 Q 1025.0 514.2 784 515 Q 780 515 780 511 L 780 404 Q 780 400 784 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1025.0" y="465.32" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">Binder 会话；可选 FMQ 降低高频开销</tspan>
</text>
<text x="700" y="610" text-anchor="middle" style="font-size:23px">
<tspan x="700" dy="0">普通 SDK 没有直接调用 IPower.setMode / setBoost 的入口</tspan>
