<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">沿帧截止时间拆分执行与等待</title>
<desc id="desc">输入与 UI 工作进入渲染提交和 GPU，再由 SurfaceFlinger/HWC 组织目标 output 的合成与呈现。 箭头表示依赖，阶段可重叠；SF 与 HWC 协商合成类型，不能从线程跑上大核就断言命中私有白名单。 输入 / 主线程 / RenderThread
拆Running、Runnable与阻塞 → GPU工作与acquire fence
提交返回不等于执行完成；GPU工作与acquire fence
提交返回不等于执行完成 → SF与HWC协商合成类型
CLIENT由RenderEngine生成；SF与HWC协商合成类型
CLIENT由RenderEngine生成 → 目标output与present fence
联系deadline并核对屏幕归属</desc>
