<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">BPF 调度器的启用和回退</title>
<desc id="desc">编译支持还需要用户空间加载与挂载；策略退出、错误或失去进展时，内核回退到 fair，切换窗口应排除出稳定样本。 此固定版本不支持正在运行的 struct_ops 原地更新 GKI 编译支持 / 能力已存在 → loader 加载 BPF / struct_ops 挂载；loader 加载 BPF / struct_ops 挂载 → 启用成功 / 切换符合条件任务；启用成功 / 切换符合条件任务 → 退出 / 错误 / stall / 回到 fair</desc>
