<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img" aria-labelledby="title desc">
<title id="title">同包代码与两份用户数据</title>
<desc id="desc">在两个用户安装同一包会形成独立数据和运行环境；主空间的登录、数据库、缓存和下载内容不会自动复制。 共享包名与代码版本不代表共享 UID 或业务状态 同包安装到主用户，形成主用户实例；安装到 private profile，形成新实例</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1400" height="580" fill="white"/>
<path d="M 700 170 L 700 250 L 345 250 L 345 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 339 320 L 345 330 L 351 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 170 L 700 250 L 1055 250 L 1055 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1049 320 L 1055 330 L 1061 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 504 70 Q 700.0 69.2 896 70 Q 900 70 900 74 L 900 166 Q 900 170 896 170 Q 700.0 170.4 504 170 Q 500 170 500 166 L 500 74 Q 500 70 504 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="700.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="700.0" dy="0">同一包的代码版本</tspan>
<tspan x="700.0" dy="34.0">由 PackageManager 管理</tspan>
</text>
<path d="M 124 330 Q 345.0 330.3 566 330 Q 570 330 570 334 L 570 426 Q 570 430 566 430 Q 345.0 429.7 124 430 Q 120 430 120 426 L 120 334 Q 120 330 124 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="345.0" y="371.5" text-anchor="middle" style="font-size:25px">
<tspan x="345.0" dy="0">主用户 App 实例</tspan>
<tspan x="345.0" dy="34.0">独立 UID / 目录 / 账号</tspan>
</text>
<path d="M 834 330 Q 1055.0 329.9 1276 330 Q 1280 330 1280 334 L 1280 426 Q 1280 430 1276 430 Q 1055.0 429.5 834 430 Q 830 430 830 426 L 830 334 Q 830 330 834 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1055.0" y="371.5" text-anchor="middle" style="font-size:25px">
<tspan x="1055.0" dy="0">私密资料 App 实例</tspan>
<tspan x="1055.0" dy="34.0">另一 UID / 目录 / 账号</tspan>
</text>
<text x="700.0" y="535" text-anchor="middle" style="font-size:23px">
<tspan x="700.0" dy="0">共享包名与代码版本不代表共享 UID 或业务状态</tspan>
</text>
</svg>
