<text x="1025.0" y="305.32" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">组件累计能量；UID 分摊可选</tspan>
</text>
<path d="M 134 400 Q 375.0 400.3 616 400 Q 620 400 620 404 L 620 511 Q 620 515 616 515 Q 375.0 515.7 134 515 Q 130 515 130 511 L 130 404 Q 130 400 134 400" fill="white" stroke="#E8913A" stroke-width="3"/>
