<text x="1025.0" y="145.32" text-anchor="middle" style="font-size:23px">
<tspan x="1025.0" dy="0">累计驻留时间、次数与最近进入时间</tspan>
</text>
<path d="M 134 240 Q 375.0 239.7 616 240 Q 620 240 620 244 L 620 351 Q 620 355 616 355 Q 375.0 354.3 134 355 Q 130 355 130 351 L 130 244 Q 130 240 134 240" fill="white" stroke="#4CAF50" stroke-width="3"/>
