<tspan x="900.0" dy="34.0">脚本 / trigger / 历史配置</tspan>
<tspan x="900.0" dy="34.0">r1 已核对目录没有旧入口</tspan>
</text>
<text x="600" y="595" text-anchor="middle" style="font-size:24px">
<tspan x="600" dy="0">不假设 persist.mm_events.enabled、vendor cfg 或 mem.mm_events 视图存在</tspan>
