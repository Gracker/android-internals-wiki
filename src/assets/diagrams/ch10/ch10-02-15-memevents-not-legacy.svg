<tspan x="600.0" dy="0">按真实组件和版本确认能力</tspan>
</text>
<path d="M 74 330 Q 320.0 329.8 566 330 Q 570 330 570 334 L 570 486 Q 570 490 566 490 Q 320.0 490.4 74 490 Q 70 490 70 486 L 70 334 Q 70 330 74 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
