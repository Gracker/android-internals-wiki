<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">TLAB 快路径推进线程自己的指针</title>
<desc id="desc">TLAB 可容纳该次对象时，线程返回原 pos 并推进指针；空间不足需要申请新 TLAB。这里只画启用 TLAB 后的局部路径。 TLAB 可容纳该次对象时，线程返回原 pos 并推进指针；空间不足需要申请新 TLAB。这里只画启用 TLAB 后的局部路径。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="560" fill="white"/>
<path d="M 69 160 Q 240.0 160.1 411 160 Q 415 160 415 164 L 415 326 Q 415 330 411 330 Q 240.0 329.8 69 330 Q 65 330 65 326 L 65 164 Q 65 160 69 160" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="240.0" y="236.5" text-anchor="middle" style="font-size:25px">
<tspan x="240.0" dy="0">线程本地缓冲区</tspan>
<tspan x="240.0" dy="34.0">已分配对象</tspan>
</text>
<path d="M 419 160 Q 582.5 160.3 746 160 Q 750 160 750 164 L 750 326 Q 750 330 746 330 Q 582.5 329.6 419 330 Q 415 330 415 326 L 415 164 Q 415 160 419 160" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="582.5" y="236.5" text-anchor="middle" style="font-size:25px">
<tspan x="582.5" dy="0">本次对象</tspan>
<tspan x="582.5" dy="34.0">aligned size</tspan>
</text>
<path d="M 754 160 Q 942.5 160.4 1131 160 Q 1135 160 1135 164 L 1135 326 Q 1135 330 1131 330 Q 942.5 329.6 754 330 Q 750 330 750 326 L 750 164 Q 750 160 754 160" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="942.5" y="236.5" text-anchor="middle" style="font-size:25px">
<tspan x="942.5" dy="0">剩余可用</tspan>
<tspan x="942.5" dy="34.0">空间</tspan>
</text>
<path d="M 114 405 Q 600.0 404.4 1086 405 Q 1090 405 1090 409 L 1090 501 Q 1090 505 1086 505 Q 600.0 505.6 114 505 Q 110 505 110 501 L 110 409 Q 110 405 114 405" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="446.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">先检查剩余空间 ≥ aligned size</tspan>
<tspan x="600.0" dy="34.0">不足 → AllocWithNewTLAB；还受 allocator / 插桩等分支控制</tspan>
</text>
<text x="420" y="100" text-anchor="middle" style="font-size:23px">
<tspan x="420" dy="0">旧 pos：返回对象地址</tspan>
</text>
<text x="770" y="365" text-anchor="middle" style="font-size:23px">
<tspan x="770" dy="0">新 pos = 旧 pos + size</tspan>
</text>
<text x="1130" y="100" text-anchor="middle" style="font-size:23px">
<tspan x="1130" dy="0">end</tspan>
</text>
</svg>
