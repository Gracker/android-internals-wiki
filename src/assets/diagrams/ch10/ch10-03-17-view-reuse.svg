<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">绘制状态随 View 保存而非逐帧重建</title>
<desc id="desc">示例每个 View 创建一组 Paint 和 RectF；各帧更新同一个 RectF，再传给 Canvas。这里只减少显式绘制状态的重建，不能代表整帧零分配。 示例每个 View 创建一组 Paint 和 RectF；各帧更新同一个 RectF，再传给 Canvas。这里只减少显式绘制状态的重建，不能代表整帧零分配。 成员由 View 生命周期持有；每帧共享该 View 的绘制状态</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="620" fill="white"/>
<path d="M 420 155 L 420 225 L 320 225 L 320 310" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 314 300 L 320 310 L 326 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 780 155 L 780 225 L 880 225 L 880 310" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 874 300 L 880 310 L 886 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 104 55 Q 600.0 54.5 1096 55 Q 1100 55 1100 59 L 1100 151 Q 1100 155 1096 155 Q 600.0 155.5 104 155 Q 100 155 100 151 L 100 59 Q 100 55 104 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">View 创建</tspan>
<tspan x="600.0" dy="34.0">Paint + RectF</tspan>
</text>
<path d="M 84 310 Q 320.0 309.4 556 310 Q 560 310 560 314 L 560 461 Q 560 465 556 465 Q 320.0 465.0 84 465 Q 80 465 80 461 L 80 314 Q 80 310 84 310" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="362.0" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">第 1 次 onDraw</tspan>
<tspan x="320.0" dy="34.0">set 当前 width / height</tspan>
<tspan x="320.0" dy="34.0">drawRect(同一对象)</tspan>
</text>
<path d="M 644 310 Q 880.0 309.9 1116 310 Q 1120 310 1120 314 L 1120 461 Q 1120 465 1116 465 Q 880.0 464.7 644 465 Q 640 465 640 461 L 640 314 Q 640 310 644 310" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="880.0" y="362.0" text-anchor="middle" style="font-size:25px">
<tspan x="880.0" dy="0">后续 onDraw</tspan>
<tspan x="880.0" dy="34.0">重新 set 最新边界</tspan>
<tspan x="880.0" dy="34.0">drawRect(同一对象)</tspan>
</text>
<text x="600" y="555" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">跨线程使用前，先审查所有权与同步；不以复用推导线程安全</tspan>
</text>
</svg>
