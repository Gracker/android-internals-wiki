<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">按页取整只解释一部分容量差异</title>
<desc id="desc">示意数学例子：同为 17 KiB 请求，按 4 KiB 页取整得到 20 KiB，按 16 KiB 页得到 32 KiB；只验证页取整，不冒充实际 Gralloc 分配或固定增长率。 示意数学例子：同为 17 KiB 请求，按 4 KiB 页取整得到 20 KiB，按 16 KiB 页得到 32 KiB；只验证页取整，不冒充实际 Gralloc 分配或固定增长率。 独立视角：4 KiB 页 / 17 KiB → 20 KiB / 本例尾部多 3 KiB；独立视角：16 KiB 页 / 17 KiB → 32 KiB / 本例尾部多 15 KiB</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="620" fill="white"/>
<path d="M 450 145 L 450 220 L 320.0 220 L 320.0 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 314.0 290 L 320.0 300 L 326.0 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 145 L 750 220 L 900.0 220 L 900.0 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 894.0 290 L 900.0 300 L 906.0 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114 45 Q 600.0 45.1 1086 45 Q 1090 45 1090 49 L 1090 141 Q 1090 145 1086 145 Q 600.0 144.4 114 145 Q 110 145 110 141 L 110 49 Q 110 45 114 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="103.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">dma_heap_buffer_alloc：len = __PAGE_ALIGN(len)</tspan>
</text>
<path d="M 74 300 Q 320.0 299.6 566 300 Q 570 300 570 304 L 570 466 Q 570 470 566 470 Q 320.0 470.5 74 470 Q 70 470 70 466 L 70 304 Q 70 300 74 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="359.5" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">4 KiB 页</tspan>
<tspan x="320.0" dy="34.0">17 KiB → 20 KiB</tspan>
<tspan x="320.0" dy="34.0">本例尾部多 3 KiB</tspan>
</text>
<path d="M 654 300 Q 900.0 300.2 1146 300 Q 1150 300 1150 304 L 1150 466 Q 1150 470 1146 470 Q 900.0 470.1 654 470 Q 650 470 650 466 L 650 304 Q 650 300 654 300" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="359.5" text-anchor="middle" style="font-size:25px">
<tspan x="900.0" dy="0">16 KiB 页</tspan>
<tspan x="900.0" dy="34.0">17 KiB → 32 KiB</tspan>
<tspan x="900.0" dy="34.0">本例尾部多 15 KiB</tspan>
</text>
<text x="600" y="555" text-anchor="middle" style="font-size:24px">
<tspan x="600" dy="0">内核页大小在目标设备核对；图形布局与驱动粒度还有额外约束</tspan>
</text>
</svg>
