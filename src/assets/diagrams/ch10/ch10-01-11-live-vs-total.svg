<text x="600.0" y="113.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">同一调用栈的窗口内事件</tspan>
</text>
<path d="M 74 330 Q 320.0 329.6 566 330 Q 570 330 570 334 L 570 486 Q 570 490 566 490 Q 320.0 490.3 74 490 Q 70 490 70 486 L 70 334 Q 70 330 74 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="384.5" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">已经分配且已 free</tspan>
<tspan x="320.0" dy="34.0">进入 Total</tspan>
<tspan x="320.0" dy="34.0">不留在 Unreleased</tspan>
</text>
<path d="M 654 330 Q 900.0 330.0 1146 330 Q 1150 330 1150 334 L 1150 486 Q 1150 490 1146 490 Q 900.0 489.3 654 490 Q 650 490 650 486 L 650 334 Q 650 330 654 330" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="384.5" text-anchor="middle" style="font-size:25px">
<tspan x="900.0" dy="0">已分配而尚未 free</tspan>
<tspan x="900.0" dy="34.0">进入 Total</tspan>
<tspan x="900.0" dy="34.0">也留在 Unreleased</tspan>
</text>
<text x="600" y="595" text-anchor="middle" style="font-size:24px">
<tspan x="600" dy="0">Unreleased 不等于进程全部历史 live bytes；图不提供设备实测时长</tspan>
</text>
</svg>
