<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">累计分配差与存活量差分开</title>
<desc id="desc">原图展示两种独立计数：存活实例从 4,776 到 238,800，净增 234,024；累计分配从 73,979 到 134,731，增加 60,752 次，不代表仍存活 60,752 个。 原图展示两种独立计数：存活实例从 4,776 到 238,800，净增 234,024；累计分配从 73,979 到 134,731，增加 60,752 次，不代表仍存活 60,752 个。 分支：存活实例差分 / 238,800 - 4,776 / = 234,024 个；分支：累计分配差分 / 134,731 - 73,979 / = 60,752 次</desc>
