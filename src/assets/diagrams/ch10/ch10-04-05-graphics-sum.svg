<text x="220.0" y="109.0" text-anchor="middle" style="font-size:25px">
<tspan x="220.0" dy="0">Gfx dev</tspan>
<tspan x="220.0" dy="34.0">getOtherPrivate(GL_DEV)</tspan>
</text>
<path d="M 434 45 Q 600.0 44.5 766 45 Q 770 45 770 49 L 770 186 Q 770 190 766 190 Q 600.0 190.3 434 190 Q 430 190 430 186 L 430 49 Q 430 45 434 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="92.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">EGL mtrack</tspan>
<tspan x="600.0" dy="34.0">getOtherPrivate(</tspan>
<tspan x="600.0" dy="34.0">GRAPHICS)</tspan>
</text>
<path d="M 814 45 Q 980.0 45.5 1146 45 Q 1150 45 1150 49 L 1150 186 Q 1150 190 1146 190 Q 980.0 189.4 814 190 Q 810 190 810 186 L 810 49 Q 810 45 814 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="980.0" y="109.0" text-anchor="middle" style="font-size:25px">
<tspan x="980.0" dy="0">GL mtrack</tspan>
<tspan x="980.0" dy="34.0">getOtherPrivate(GL)</tspan>
</text>
<path d="M 114 365 Q 600.0 365.4 1086 365 Q 1090 365 1090 369 L 1090 481 Q 1090 485 1086 485 Q 600.0 485.6 114 485 Q 110 485 110 481 L 110 369 Q 110 365 114 365" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="416.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">App Summary Graphics</tspan>
<tspan x="600.0" dy="34.0">三类 private clean + private dirty 的和</tspan>
</text>
<text x="600" y="565" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">Other mtrack 不在该摘要内；Gfx dev 名称匹配也不是跨厂商完整 GPU 清点</tspan>
</text>
</svg>
