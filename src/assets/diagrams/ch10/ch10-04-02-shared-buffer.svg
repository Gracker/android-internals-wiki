<path d="M 214 310 L 220 320 L 226 310" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 165 L 600 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 310 L 600 320 L 606 310" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 165 L 750 240 L 980 240 L 980 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 974 310 L 980 320 L 986 310" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 354 45 Q 600.0 45.7 846 45 Q 850 45 850 49 L 850 161 Q 850 165 846 165 Q 600.0 164.5 354 165 Q 350 165 350 161 L 350 49 Q 350 45 354 45" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">一个 DMA-BUF 对象</tspan>
<tspan x="600.0" dy="34.0">inode + exporter + size</tspan>
</text>
<path d="M 54 320 Q 220.0 320.0 386 320 Q 390 320 390 324 L 390 456 Q 390 460 386 460 Q 220.0 459.9 54 460 Q 50 460 50 456 L 50 324 Q 50 320 54 320" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="220.0" y="364.5" text-anchor="middle" style="font-size:25px">
<tspan x="220.0" dy="0">生产者进程</tspan>
<tspan x="220.0" dy="34.0">GraphicBuffer /</tspan>
<tspan x="220.0" dy="34.0">HardwareBuffer</tspan>
</text>
<path d="M 434 320 Q 600.0 320.1 766 320 Q 770 320 770 324 L 770 456 Q 770 460 766 460 Q 600.0 459.4 434 460 Q 430 460 430 456 L 430 324 Q 430 320 434 320" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">合成器 / consumer</tspan>
<tspan x="600.0" dy="34.0">导入同一 buffer</tspan>
</text>
<path d="M 814 320 Q 980.0 319.4 1146 320 Q 1150 320 1150 324 L 1150 456 Q 1150 460 1146 460 Q 980.0 459.8 814 460 Q 810 460 810 456 L 810 324 Q 810 320 814 320" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="980.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="980.0" dy="0">GPU / 显示 / 媒体设备</tspan>
<tspan x="980.0" dy="34.0">按 usage / driver 映射</tspan>
</text>
<text x="600" y="555" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">引用、CPU 映射、GPU 映射与唯一对象容量是不同维度</tspan>
</text>
</svg>
