<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">同一 PSI 子系统有不同消费者</title>
<desc id="desc">lmkd 与 LowMemDetector 分别注册自己的触发器；监听数量不意味着停顿时间重复计算，也不意味着两个消费者执行相同策略。 lmkd 与 LowMemDetector 分别注册自己的触发器；监听数量不意味着停顿时间重复计算，也不意味着两个消费者执行相同策略。 分支：lmkd / 自有阈值 / 窗口 / 策略 / 读取上下文并选择候选；分支：system_server / LowMemDetector 状态 / AppProfiler 再更新 memory factor</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="680" fill="white"/>
<path d="M 450 155 L 450 245 L 320.0 245 L 320.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 314.0 320 L 320.0 330 L 326.0 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 155 L 750 245 L 900.0 245 L 900.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 894.0 320 L 900.0 330 L 906.0 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114 55 Q 600.0 54.6 1086 55 Q 1090 55 1090 59 L 1090 151 Q 1090 155 1086 155 Q 600.0 154.8 114 155 Q 110 155 110 151 L 110 59 Q 110 55 114 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="113.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">内核 PSI memory 停顿统计</tspan>
</text>
<path d="M 74 330 Q 320.0 329.5 566 330 Q 570 330 570 334 L 570 486 Q 570 490 566 490 Q 320.0 489.2 74 490 Q 70 490 70 486 L 70 334 Q 70 330 74 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="384.5" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">lmkd</tspan>
<tspan x="320.0" dy="34.0">自有阈值 / 窗口 / 策略</tspan>
<tspan x="320.0" dy="34.0">读取上下文并选择候选</tspan>
</text>
<path d="M 654 330 Q 900.0 330.7 1146 330 Q 1150 330 1150 334 L 1150 486 Q 1150 490 1146 490 Q 900.0 489.5 654 490 Q 650 490 650 486 L 650 334 Q 650 330 654 330" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="384.5" text-anchor="middle" style="font-size:25px">
<tspan x="900.0" dy="0">system_server</tspan>
<tspan x="900.0" dy="34.0">LowMemDetector 状态</tspan>
<tspan x="900.0" dy="34.0">AppProfiler 再更新 memory factor</tspan>
</text>
<text x="600" y="595" text-anchor="middle" style="font-size:24px">
<tspan x="600" dy="0">trigger 超阈值是事件通知，不是 PSI 替用户空间决定 kill</tspan>
</text>
</svg>
