<tspan x="600.0" dy="0">历史 Client Infra 方案</tspan>
</text>
<path d="M 74 330 Q 320.0 330.4 566 330 Q 570 330 570 334 L 570 486 Q 570 490 566 490 Q 320.0 490.8 74 490 Q 70 490 70 486 L 70 334 Q 70 330 74 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="384.5" text-anchor="middle" style="font-size:25px">
