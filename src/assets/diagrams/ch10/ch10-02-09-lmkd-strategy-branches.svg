<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">r1 init_psi_monitors()</tspan>
<tspan x="600.0" dy="34.0">读取 use_new_strategy 与默认组合</tspan>
</text>
<path d="M 74 330 Q 320.0 329.6 566 330 Q 570 330 570 334 L 570 486 Q 570 490 566 490 Q 320.0 489.4 74 490 Q 70 490 70 486 L 70 334 Q 70 330 74 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="384.5" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">新策略</tspan>
<tspan x="320.0" dy="34.0">LOW 不注册</tspan>
<tspan x="320.0" dy="34.0">MEDIUM some / CRITICAL full</tspan>
</text>
<path d="M 654 330 Q 900.0 330.8 1146 330 Q 1150 330 1150 334 L 1150 486 Q 1150 490 1146 490 Q 900.0 490.1 654 490 Q 650 490 650 486 L 650 334 Q 650 330 654 330" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="384.5" text-anchor="middle" style="font-size:25px">
<tspan x="900.0" dy="0">旧策略</tspan>
<tspan x="900.0" dy="34.0">仍可使用 PSI 通知</tspan>
<tspan x="900.0" dy="34.0">要求 v1 memcg</tspan>
</text>
<text x="600" y="595" text-anchor="middle" style="font-size:24px">
<tspan x="600" dy="0">minfree 策略选择与是否使用 PSI 是两个维度；没有旧 use_psi 开关路径</tspan>
</text>
</svg>
