<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">新旧 kill 策略都有条件</title>
<desc id="desc">固定 r1 直接初始化 PSI。use_new_strategy 和设备属性组合决定处理器；新策略中 LOW 关闭，MEDIUM/CRITICAL 使用配置的 partial/complete stall。 固定 r1 直接初始化 PSI。use_new_strategy 和设备属性组合决定处理器；新策略中 LOW 关闭，MEDIUM/CRITICAL 使用配置的 partial/complete stall。 分支：新策略 / LOW 不注册 / MEDIUM some / CRITICAL full；分支：旧策略 / 仍可使用 PSI 通知 / 要求 v1 memcg</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
