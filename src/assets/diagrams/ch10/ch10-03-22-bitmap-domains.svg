<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Bitmap 像素按实际存储域分析</title>
<desc id="desc">API 26 起普通软件 Bitmap 的像素位于 native heap；HARDWARE 像素保存在图形内存。Java wrapper 的数量不能代表像素总成本。 API 26 起普通软件 Bitmap 的像素位于 native heap；HARDWARE 像素保存在图形内存。Java wrapper 的数量不能代表像素总成本。 分别核对：普通软件 Bitmap / 像素在 native heap / 仍有 Java 对象引用；分别核对：Bitmap.Config.HARDWARE / 像素在图形内存 / 不能统一当成 malloc</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="620" fill="white"/>
<path d="M 450 145 L 450 220 L 320.0 220 L 320.0 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 314.0 290 L 320.0 300 L 326.0 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 145 L 750 220 L 900.0 220 L 900.0 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 894.0 290 L 900.0 300 L 906.0 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114 45 Q 600.0 44.6 1086 45 Q 1090 45 1090 49 L 1090 141 Q 1090 145 1086 145 Q 600.0 145.6 114 145 Q 110 145 110 141 L 110 49 Q 110 45 114 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="103.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Java Bitmap 对象与像素存储分开</tspan>
</text>
<path d="M 74 300 Q 320.0 299.6 566 300 Q 570 300 570 304 L 570 466 Q 570 470 566 470 Q 320.0 469.3 74 470 Q 70 470 70 466 L 70 304 Q 70 300 74 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="359.5" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">普通软件 Bitmap</tspan>
<tspan x="320.0" dy="34.0">像素在 native heap</tspan>
<tspan x="320.0" dy="34.0">仍有 Java 对象引用</tspan>
</text>
<path d="M 654 300 Q 900.0 300.7 1146 300 Q 1150 300 1150 304 L 1150 466 Q 1150 470 1146 470 Q 900.0 469.7 654 470 Q 650 470 650 466 L 650 304 Q 650 300 654 300" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="359.5" text-anchor="middle" style="font-size:25px">
<tspan x="900.0" dy="0">Bitmap.Config.HARDWARE</tspan>
<tspan x="900.0" dy="34.0">像素在图形内存</tspan>
<tspan x="900.0" dy="34.0">不能统一当成 malloc</tspan>
</text>
<text x="600" y="555" text-anchor="middle" style="font-size:24px">
<tspan x="600" dy="0">库持有的对象遵循库的 pool 协议；仍被使用时不能提前 recycle</tspan>
</text>
</svg>
