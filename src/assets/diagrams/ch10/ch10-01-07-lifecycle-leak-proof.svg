<text x="600.0" y="96.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">固定入口与初始状态</tspan>
</text>
<path d="M 114 175 Q 600.0 174.3 1086 175 Q 1090 175 1090 179 L 1090 256 Q 1090 260 1086 260 Q 600.0 259.3 114 260 Q 110 260 110 256 L 110 179 Q 110 175 114 175" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="209.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">重复生命周期动作</tspan>
<tspan x="600.0" dy="34.0">等待已知异步工作与动画结束</tspan>
</text>
<path d="M 114 305 Q 600.0 304.9 1086 305 Q 1090 305 1090 309 L 1090 386 Q 1090 390 1086 390 Q 600.0 389.9 114 390 Q 110 390 110 386 L 110 309 Q 110 305 114 305" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="356.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">确认对象已越过预期生命周期</tspan>
</text>
<path d="M 114 435 Q 600.0 435.1 1086 435 Q 1090 435 1090 439 L 1090 516 Q 1090 520 1086 520 Q 600.0 519.3 114 520 Q 110 520 110 516 L 110 439 Q 110 435 114 435" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="469.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">查稳定的强 GC Root 路径与持有者</tspan>
<tspan x="600.0" dy="34.0">修复后重放并比较对象图</tspan>
</text>
</svg>
