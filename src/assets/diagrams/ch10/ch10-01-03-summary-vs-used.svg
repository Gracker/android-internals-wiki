<title id="title">App Summary 与对象用量分开</title>
<desc id="desc">Java/Native 摘要主要来自页面分类；Runtime 与 mallinfo 则反映不同的分配状态，不能用相同字段名暗示它们相等。 Java/Native 摘要主要来自页面分类；Runtime 与 mallinfo 则反映不同的分配状态，不能用相同字段名暗示它们相等。 分支：summary.java-heap / dalvikPrivateDirty / + ART private；分支：summary.native-heap / nativePrivateDirty / 按页面分类；分支：Runtime / mallinfo / 对象堆 total - free / allocator uordblks</desc>
