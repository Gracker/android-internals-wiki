<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">RSS 与 PSS 的共享页算例</title>
<desc id="desc">教学算例：一张已驻留的 4 KiB 普通页，由两个进程各映射一次。RSS 各记 4 KiB，PSS 各分摊 2 KiB；这不是测量数据。 仅普通已驻留页、两个映射的教学算例。LinuxPss不含换出部分；不能把此算例直接用于AndroidtotalPss。 分支：进程 A / RSS = 4 KiB / PSS = 2 KiB；分支：进程 B / RSS = 4 KiB / PSS = 2 KiB</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="680" fill="white"/>
<path d="M 450 155 L 450 245 L 320.0 245 L 320.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 314.0 320 L 320.0 330 L 326.0 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 155 L 750 245 L 900.0 245 L 900.0 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 894.0 320 L 900.0 330 L 906.0 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 114 55 Q 600.0 55.1 1086 55 Q 1090 55 1090 59 L 1090 151 Q 1090 155 1086 155 Q 600.0 154.2 114 155 Q 110 155 110 151 L 110 59 Q 110 55 114 55" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">同一物理页：4 KiB</tspan>
<tspan x="600.0" dy="34.0">A、B 各有一个映射</tspan>
</text>
<path d="M 74 330 Q 320.0 329.7 566 330 Q 570 330 570 334 L 570 486 Q 570 490 566 490 Q 320.0 490.5 74 490 Q 70 490 70 486 L 70 334 Q 70 330 74 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="384.5" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">进程 A</tspan>
<tspan x="320.0" dy="34.0">RSS = 4 KiB</tspan>
<tspan x="320.0" dy="34.0">PSS = 2 KiB</tspan>
</text>
<path d="M 654 330 Q 900.0 329.4 1146 330 Q 1150 330 1150 334 L 1150 486 Q 1150 490 1146 490 Q 900.0 489.6 654 490 Q 650 490 650 486 L 650 334 Q 650 330 654 330" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="384.5" text-anchor="middle" style="font-size:25px">
<tspan x="900.0" dy="0">进程 B</tspan>
<tspan x="900.0" dy="34.0">RSS = 4 KiB</tspan>
<tspan x="900.0" dy="34.0">PSS = 2 KiB</tspan>
</text>
<text x="600" y="595" text-anchor="middle" style="font-size:24px">
<tspan x="600" dy="0">内核共享计数有别名与大页近似；Android totalPss 另含 SwapPss / memtrack</tspan>
</text>
</svg>
