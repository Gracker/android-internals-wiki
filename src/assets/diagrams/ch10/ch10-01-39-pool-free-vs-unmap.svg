<path d="M 654 330 Q 900.0 329.6 1146 330 Q 1150 330 1150 334 L 1150 486 Q 1150 490 1146 490 Q 900.0 490.3 654 490 Q 650 490 650 486 L 650 334 Q 650 330 654 330" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="384.5" text-anchor="middle" style="font-size:25px">
<tspan x="900.0" dy="0">归还条目</tspan>
<tspan x="900.0" dy="34.0">标记空闲</tspan>
<tspan x="900.0" dy="34.0">不等于立即 unmap</tspan>
</text>
