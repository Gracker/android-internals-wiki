<title id="title">引用路径与独占支配要分清</title>
<desc id="desc">教学对象图：A、B 都能到 C，只有 A 能到 D。A 不独占支配 C；支配树的边也不必是原始引用边。 纯教学图，不是实际Hprof。Retained集合包含对象自己；共享子图不能分别累加当独占内存。 Root到A；Root到B；A引用D；A引用C；B引用C</desc>
