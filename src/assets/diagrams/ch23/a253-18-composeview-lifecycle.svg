<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Fragment View 的销毁要带走 Composition</title>
<desc id="desc">说明 ComposeView 的释放策略应跟随 View lifecycle 而非 Fragment 对象自身。 Fragment View 场景用 DisposeOnViewTreeLifecycleDestroyed；默认 detach/pool 策略适用于其他相应宿主，不能混用。 Fragment 创建 View / ComposeView + setContent → 设置 ViewTreeLifecycle / 对应的 Composition 策略；设置 ViewTreeLifecycle / 对应的 Composition 策略 → View lifecycle DESTROYED / dispose Composition；View lifecycle DESTROYED / dispose Composition → remember / 副作用任务 / 按各自释放语义清理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 420 150 L 780 150" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 770 144 L 780 150 L 770 156" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 940.0 200 L 940.0 360" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 934.0 350 L 940.0 360 L 946.0 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 780 410 L 420 410" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 430 404 L 420 410 L 430 416" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 104 100 Q 260.0 100.4 416 100 Q 420 100 420 104 L 420 196 Q 420 200 416 200 Q 260.0 200.3 104 200 Q 100 200 100 196 L 100 104 Q 100 100 104 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="260.0" y="142.18" text-anchor="middle" style="font-size:23px">
<tspan x="260.0" dy="0">Fragment 创建 View</tspan>
<tspan x="260.0" dy="31.28">创建 ComposeView</tspan>
</text>
<path d="M 784 100 Q 940.0 99.7 1096 100 Q 1100 100 1100 104 L 1100 196 Q 1100 200 1096 200 Q 940.0 199.8 784 200 Q 780 200 780 196 L 780 104 Q 780 100 784 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="940.0" y="141.5" text-anchor="middle" style="font-size:25px">
<tspan x="940.0" dy="0">先设 Composition 策略</tspan>
<tspan x="940.0" dy="34.0">再执行 setContent</tspan>
</text>
<path d="M 784 360 Q 940.0 359.3 1096 360 Q 1100 360 1100 364 L 1100 456 Q 1100 460 1096 460 Q 940.0 459.3 784 460 Q 780 460 780 456 L 780 364 Q 780 360 784 360" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="940.0" y="402.18" text-anchor="middle" style="font-size:23px">
<tspan x="940.0" dy="0">View lifecycle DESTROYED</tspan>
<tspan x="940.0" dy="31.28">dispose Composition</tspan>
</text>
<path d="M 104 360 Q 260.0 360.0 416 360 Q 420 360 420 364 L 420 456 Q 420 460 416 460 Q 260.0 459.9 104 460 Q 100 460 100 456 L 100 364 Q 100 360 104 360" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="260.0" y="401.5" text-anchor="middle" style="font-size:25px">
<tspan x="260.0" dy="0">remember / 副作用任务</tspan>
<tspan x="260.0" dy="34.0">按各自释放语义清理</tspan>
</text>
<text x="600" y="550" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">释放 Composition 不等于所有外部资源都自动关闭：仍看资源所有者</tspan>
</text>
</svg>
