<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">常驻 Activity 的观察者表如何留住弹窗</title>
<desc id="desc">按真正持有方向重画货拉拉案例，定位 dismiss 缺少 removeObserver 的边。 原图的 References 面板从子对象向 Root 回溯；本图反向画出简化强引用持有方向，不复制原案例设备数据。 常驻 MainActivity / LifecycleRegistry → mObserverMap / 保留已注册的 Dialog；mObserverMap / 保留已注册的 Dialog → Dialog 自身是 Observer / 其 mView 仍存活；Dialog 自身是 Observer / 其 mView 仍存活 → 布局对象继续可达 / SolverVariable / ArrayRow</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 420 150 L 780 150" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 770 144 L 780 150 L 770 156" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 940.0 200 L 940.0 360" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 934.0 350 L 940.0 360 L 946.0 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 780 410 L 420 410" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 430 404 L 420 410 L 430 416" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 104 100 Q 260.0 100.7 416 100 Q 420 100 420 104 L 420 196 Q 420 200 416 200 Q 260.0 199.7 104 200 Q 100 200 100 196 L 100 104 Q 100 100 104 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="260.0" y="141.5" text-anchor="middle" style="font-size:25px">
<tspan x="260.0" dy="0">常驻 MainActivity</tspan>
<tspan x="260.0" dy="34.0">LifecycleRegistry</tspan>
</text>
<path d="M 784 100 Q 940.0 99.9 1096 100 Q 1100 100 1100 104 L 1100 196 Q 1100 200 1096 200 Q 940.0 200.4 784 200 Q 780 200 780 196 L 780 104 Q 780 100 784 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="940.0" y="141.5" text-anchor="middle" style="font-size:25px">
<tspan x="940.0" dy="0">mObserverMap</tspan>
<tspan x="940.0" dy="34.0">保留已注册的 Dialog</tspan>
</text>
<path d="M 784 360 Q 940.0 360.0 1096 360 Q 1100 360 1100 364 L 1100 456 Q 1100 460 1096 460 Q 940.0 460.0 784 460 Q 780 460 780 456 L 780 364 Q 780 360 784 360" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="940.0" y="401.5" text-anchor="middle" style="font-size:25px">
<tspan x="940.0" dy="0">Dialog 自身是 Observer</tspan>
<tspan x="940.0" dy="34.0">其 mView 仍存活</tspan>
</text>
<path d="M 104 360 Q 260.0 360.4 416 360 Q 420 360 420 364 L 420 456 Q 420 460 416 460 Q 260.0 460.1 104 460 Q 100 460 100 456 L 100 364 Q 100 360 104 360" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="260.0" y="401.84000000000003" text-anchor="middle" style="font-size:24px">
<tspan x="260.0" dy="0">布局对象继续可达</tspan>
<tspan x="260.0" dy="32.64">SolverVariable / ArrayRow</tspan>
</text>
<text x="600" y="550" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">修复点：dismiss 生命周期终点 → removeObserver(this)</tspan>
</text>
