<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">量化只改变权重预算的一部分</title>
<desc id="desc">把参数位数算术与运行时总成本分开，防止按模型文件体积直接准入。 7B按十进制参数量计算；GiB=2的30次方字节；不表示真实模型装载测量。 按16bit换算；按4bit换算</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 480 140 L 480 210 L 275 210 L 275 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 269 270 L 275 280 L 281 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 720 140 L 720 210 L 925 210 L 925 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 919 270 L 925 280 L 931 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 424 45 Q 600.0 45.2 776 45 Q 780 45 780 49 L 780 136 Q 780 140 776 140 Q 600.0 140.8 424 140 Q 420 140 420 136 L 420 49 Q 420 45 424 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="84.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">7B 个参数</tspan>
<tspan x="600.0" dy="34.0">仅计算权重位数</tspan>
</text>
<path d="M 54 280 Q 275.0 279.4 496 280 Q 500 280 500 284 L 500 371 Q 500 375 496 375 Q 275.0 375.3 54 375 Q 50 375 50 371 L 50 284 Q 50 280 54 280" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="275.0" y="319.0" text-anchor="middle" style="font-size:25px">
<tspan x="275.0" dy="0">FP16：7×10⁹×16÷8</tspan>
<tspan x="275.0" dy="34.0">约 13.04 GiB</tspan>
</text>
<path d="M 704 280 Q 925.0 280.3 1146 280 Q 1150 280 1150 284 L 1150 371 Q 1150 375 1146 375 Q 925.0 375.4 704 375 Q 700 375 700 371 L 700 284 Q 700 280 704 280" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="925.0" y="319.0" text-anchor="middle" style="font-size:25px">
<tspan x="925.0" dy="0">4-bit：7×10⁹×4÷8</tspan>
<tspan x="925.0" dy="34.0">约 3.26 GiB</tspan>
</text>
<text x="600" y="525" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">weight_min_bytes = P × b ÷ 8；公式示例，不是模型运行的总内存</tspan>
</text>
</svg>
