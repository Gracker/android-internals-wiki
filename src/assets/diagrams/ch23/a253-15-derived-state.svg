<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">derivedStateOf 把高频输入变成较少结果变化</title>
<desc id="desc">用滚动位置与按钮可见性说明派生状态降低无效重组的作用。 派生状态本身维护依赖与结果缓存；输入每变输出也变时不保证收益；创建时仍应 remember。 滚动位置高频变化 / firstVisibleItemIndex → remember 派生状态 / 计算 index &gt; 0；remember 派生状态 / 计算 index &gt; 0 → 结果 Boolean 改变时 / 才让读者需要更新</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="460" fill="white"/>
<path d="M 360 145 L 450 145" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 139 L 450 145 L 440 151" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 145 L 840 145" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 830 139 L 840 145 L 830 151" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 64 95 Q 210.0 95.5 356 95 Q 360 95 360 99 L 360 191 Q 360 195 356 195 Q 210.0 194.3 64 195 Q 60 195 60 191 L 60 99 Q 60 95 64 95" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="210.0" y="136.5" text-anchor="middle" style="font-size:25px">
<tspan x="210.0" dy="0">滚动位置高频变化</tspan>
<tspan x="210.0" dy="34.0">firstVisibleItemIndex</tspan>
</text>
<path d="M 454 95 Q 600.0 94.4 746 95 Q 750 95 750 99 L 750 191 Q 750 195 746 195 Q 600.0 194.9 454 195 Q 450 195 450 191 L 450 99 Q 450 95 454 95" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="136.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">remember 派生状态</tspan>
<tspan x="600.0" dy="34.0">计算 index &gt; 0</tspan>
</text>
<path d="M 844 95 Q 990.0 94.6 1136 95 Q 1140 95 1140 99 L 1140 191 Q 1140 195 1136 195 Q 990.0 194.4 844 195 Q 840 195 840 191 L 840 99 Q 840 95 844 95" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="990.0" y="136.5" text-anchor="middle" style="font-size:25px">
<tspan x="990.0" dy="0">结果 Boolean 改变时</tspan>
<tspan x="990.0" dy="34.0">才让读者需要更新</tspan>
</text>
<text x="600" y="380" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">1.12.0 已纳入 forward-write 保留问题修复；旧版本仍需查引用链</tspan>
</text>
</svg>
