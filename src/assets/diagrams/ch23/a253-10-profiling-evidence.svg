<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">分配画像与堆转储回答不同问题</title>
<desc id="desc">避免用单次存活快照推算对象创建速度或把累计分配当存活内存。 ART allocation profiling 不追踪对象删除/GC；heap dump 是采集时刻的引用快照，两者都受采集成本与权限约束。 高频分配用时间序列画像；生命周期持有用快照引用证据</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 500 180 L 500 250 L 310 250 L 310 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 320 L 310 330 L 316 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 180 L 700 250 L 890 250 L 890 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 320 L 890 330 L 896 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 404 80 Q 600.0 80.6 796 80 Q 800 80 800 84 L 800 176 Q 800 180 796 180 Q 600.0 180.6 404 180 Q 400 180 400 176 L 400 84 Q 400 80 404 80" fill="white" stroke="#202020" stroke-width="3"/>
<text x="600.0" y="121.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">问题：分配过快？</tspan>
<tspan x="600.0" dy="34.0">还是持有过久？</tspan>
</text>
<path d="M 74 330 Q 310.0 329.5 546 330 Q 550 330 550 334 L 550 446 Q 550 450 546 450 Q 310.0 450.2 74 450 Q 70 450 70 446 L 70 334 Q 70 330 74 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="310.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">Allocation profile</tspan>
<tspan x="310.0" dy="34.0">时窗内创建栈 / 字节 / 次数</tspan>
</text>
<path d="M 654 330 Q 890.0 330.8 1126 330 Q 1130 330 1130 334 L 1130 446 Q 1130 450 1126 450 Q 890.0 449.3 654 450 Q 650 450 650 446 L 650 334 Q 650 330 654 330" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="890.0" y="381.5" text-anchor="middle" style="font-size:25px">
<tspan x="890.0" dy="0">Heap dump</tspan>
<tspan x="890.0" dy="34.0">存活对象 / dominator / 引用链</tspan>
</text>
<text x="600" y="550" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">工具边界：累计分配字节 ≠ 当前 live bytes ≠ PSS</tspan>
</text>
</svg>
