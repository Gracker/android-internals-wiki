<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">largeHeap 在进程绑定阶段的分支</title>
<desc id="desc">从清单标志到ART增长限制解释largeHeap的实际影响范围。 getMemoryClass为设备建议级别，Runtime.maxMemory为当前ART堆上限，均不是此刻可分配余量。 设置标志时清除增长限制；普通进程收紧增长限制</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 480 145 L 480 225 L 260 225 L 260 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 254 290 L 260 300 L 266 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 720 145 L 720 225 L 940 225 L 940 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 934 290 L 940 300 L 946 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 414 50 Q 600.0 50.6 786 50 Q 790 50 790 54 L 790 141 Q 790 145 786 145 Q 600.0 144.8 414 145 Q 410 145 410 141 L 410 54 Q 410 50 414 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="89.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">handleBindApplication</tspan>
<tspan x="600.0" dy="34.0">FLAG_LARGE_HEAP ?</tspan>
</text>
<path d="M 64 300 Q 260.0 300.3 456 300 Q 460 300 460 304 L 460 391 Q 460 395 456 395 Q 260.0 394.7 64 395 Q 60 395 60 391 L 60 304 Q 60 300 64 300" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="260.0" y="339.0" text-anchor="middle" style="font-size:25px">
<tspan x="260.0" dy="0">已设置</tspan>
<tspan x="260.0" dy="34.0">clearGrowthLimit()</tspan>
</text>
<path d="M 744 300 Q 940.0 299.3 1136 300 Q 1140 300 1140 304 L 1140 391 Q 1140 395 1136 395 Q 940.0 395.7 744 395 Q 740 395 740 391 L 740 304 Q 740 300 744 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="940.0" y="339.0" text-anchor="middle" style="font-size:25px">
<tspan x="940.0" dy="0">未设置</tspan>
<tspan x="940.0" dy="34.0">clampGrowthLimit()</tspan>
</text>
<text x="600" y="520" text-anchor="middle" style="font-size:22px">
<tspan x="600" dy="0">memoryClass → heapgrowthlimit（缺省回退 heapsize）；largeMemoryClass → heapsize</tspan>
</text>
</svg>
