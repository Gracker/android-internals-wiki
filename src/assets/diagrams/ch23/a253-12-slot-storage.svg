<title id="title">固定 Runtime 版本与实验存储开关</title>
<desc id="desc">解释同一 Runtime 1.12.0 可以出现 gap-buffer 或 LinkTable 结构。 1.12.0 默认开关 false；首次 setContent 前确定值，R8 发布构建还受对应 ProGuard 规则约束。 读取实验实现标志；false 选择 gap-buffer；true 选择 LinkTable</desc>
