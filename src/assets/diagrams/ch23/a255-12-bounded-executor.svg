<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">线程数和队列都要设置上限</title>
<desc id="desc">说明有界工作线程阻止失控并发，但排队任务仍占内存与等待时间。 workerCount与queueCapacity需来自CPU/I/O、时延与驻留预算；CallerRuns会把工作转移给提交线程。 任务进入有界队列或被工作线程取走；工作线程消费队列；满载后进入显式拒绝策略</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 400 140 L 770 140" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 760 134 L 770 140 L 760 146" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 935 190 L 935 360" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 929 350 L 935 360 L 941 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 820 190 L 820 275 L 285 275 L 285 360" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 279 350 L 285 360 L 291 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 90 Q 235.0 90.4 396 90 Q 400 90 400 94 L 400 186 Q 400 190 396 190 Q 235.0 190.3 74 190 Q 70 190 70 186 L 70 94 Q 70 90 74 90" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="235.0" y="131.5" text-anchor="middle" style="font-size:25px">
<tspan x="235.0" dy="0">任务提交者</tspan>
<tspan x="235.0" dy="34.0">可能是主线程</tspan>
</text>
<path d="M 774 90 Q 935.0 89.7 1096 90 Q 1100 90 1100 94 L 1100 186 Q 1100 190 1096 190 Q 935.0 190.6 774 190 Q 770 190 770 186 L 770 94 Q 770 90 774 90" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="935.0" y="131.5" text-anchor="middle" style="font-size:25px">
<tspan x="935.0" dy="0">有界队列</tspan>
<tspan x="935.0" dy="34.0">queueCapacity</tspan>
</text>
<path d="M 774 360 Q 935.0 360.7 1096 360 Q 1100 360 1100 364 L 1100 456 Q 1100 460 1096 460 Q 935.0 460.5 774 460 Q 770 460 770 456 L 770 364 Q 770 360 774 360" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="935.0" y="401.5" text-anchor="middle" style="font-size:25px">
<tspan x="935.0" dy="0">固定工作线程</tspan>
<tspan x="935.0" dy="34.0">workerCount</tspan>
</text>
<path d="M 74 360 Q 285.0 359.2 496 360 Q 500 360 500 364 L 500 456 Q 500 460 496 460 Q 285.0 460.0 74 460 Q 70 460 70 456 L 70 364 Q 70 360 74 360" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="285.0" y="401.5" text-anchor="middle" style="font-size:25px">
<tspan x="285.0" dy="0">队列满时按业务处理</tspan>
<tspan x="285.0" dy="34.0">拒绝 / 合并 / 异步重试</tspan>
</text>
<text x="600" y="550" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">若使用CallerRunsPolicy，主线程提交可能变成主线程执行重任务</tspan>
</text>
</svg>
