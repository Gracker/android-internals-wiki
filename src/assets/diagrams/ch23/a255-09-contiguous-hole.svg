<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">总空闲地址够用仍可能没有连续空洞</title>
<desc id="desc">用纯示意的分段地址解释32位大mmap失败。 不使用设备测量数值；真实最大连续空洞还受映射边界、ABI、ASLR和资源限制影响。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 334 65 Q 600.0 64.7 866 65 Q 870 65 870 69 L 870 171 Q 870 175 866 175 Q 600.0 174.8 334 175 Q 330 175 330 171 L 330 69 Q 330 65 334 65" fill="white" stroke="#202020" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">待申请连续长度 L</tspan>
<tspan x="600.0" dy="34.0">A + B ≥ L，但 A &lt; L 且 B &lt; L</tspan>
</text>
<path d="M 64 330 Q 135.0 330.8 206 330 Q 210 330 210 334 L 210 436 Q 210 440 206 440 Q 135.0 440.8 64 440 Q 60 440 60 436 L 60 334 Q 60 330 64 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="135.0" y="393.5" text-anchor="middle" style="font-size:25px">
<tspan x="135.0" dy="0">已映射</tspan>
</text>
<path d="M 214 330 Q 360.0 330.3 506 330 Q 510 330 510 334 L 510 436 Q 510 440 506 440 Q 360.0 439.3 214 440 Q 210 440 210 436 L 210 334 Q 210 330 214 330" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="360.0" y="393.5" text-anchor="middle" style="font-size:25px">
<tspan x="360.0" dy="0">空洞 A</tspan>
</text>
<path d="M 514 330 Q 585.0 330.1 656 330 Q 660 330 660 334 L 660 436 Q 660 440 656 440 Q 585.0 439.7 514 440 Q 510 440 510 436 L 510 334 Q 510 330 514 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="585.0" y="393.5" text-anchor="middle" style="font-size:25px">
<tspan x="585.0" dy="0">已映射</tspan>
</text>
<path d="M 664 330 Q 810.0 330.7 956 330 Q 960 330 960 334 L 960 436 Q 960 440 956 440 Q 810.0 440.2 664 440 Q 660 440 660 436 L 660 334 Q 660 330 664 330" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="810.0" y="393.5" text-anchor="middle" style="font-size:25px">
<tspan x="810.0" dy="0">空洞 B</tspan>
</text>
<path d="M 964 330 Q 1035.0 330.3 1106 330 Q 1110 330 1110 334 L 1110 436 Q 1110 440 1106 440 Q 1035.0 440.1 964 440 Q 960 440 960 436 L 960 334 Q 960 330 964 330" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="1035.0" y="393.5" text-anchor="middle" style="font-size:25px">
<tspan x="1035.0" dy="0">已映射</tspan>
</text>
<text x="600" y="550" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">地址从左到右递增；矩形宽度仅为机制示意，不是实际地址长度</tspan>
</text>
</svg>
