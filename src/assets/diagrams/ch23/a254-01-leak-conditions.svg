<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">可达性和业务生命周期必须同时核验</title>
<desc id="desc">解释对象仍被保留与内存泄漏之间的差别。 合法单例、缓存和当前页面都有强引用路径；retained 只是观察窗口内仍存在的信号。 核验业务是否已经结束；核验是否被不合理引用保留；生命周期语义参与判断；引用链证据参与判断</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
