<path d="M 300 395 L 300 550 L 310 550" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 300 544 L 310 550 L 300 556" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 900 395 L 900 550 L 890 550" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 900 544 L 890 550 L 900 556" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 404 65 Q 600.0 65.7 796 65 Q 800 65 800 69 L 800 161 Q 800 165 796 165 Q 600.0 165.7 404 165 Q 400 165 400 161 L 400 69 Q 400 65 404 65" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="106.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">观察到对象仍存在</tspan>
<tspan x="600.0" dy="34.0">retained object</tspan>
</text>
<path d="M 74 285 Q 300.0 284.3 526 285 Q 530 285 530 289 L 530 391 Q 530 395 526 395 Q 300.0 395.7 74 395 Q 70 395 70 391 L 70 289 Q 70 285 74 285" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="300.0" y="331.5" text-anchor="middle" style="font-size:25px">
<tspan x="300.0" dy="0">业务生命周期已结束？</tspan>
<tspan x="300.0" dy="34.0">用途与所有者不再需要它</tspan>
</text>
<path d="M 674 285 Q 900.0 285.7 1126 285 Q 1130 285 1130 289 L 1130 391 Q 1130 395 1126 395 Q 900.0 395.5 674 395 Q 670 395 670 391 L 670 289 Q 670 285 674 285" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="331.5" text-anchor="middle" style="font-size:25px">
<tspan x="900.0" dy="0">仍有不必要的强引用？</tspan>
<tspan x="900.0" dy="34.0">Root → owner → 对象</tspan>
</text>
<path d="M 314 500 Q 600.0 500.6 886 500 Q 890 500 890 504 L 890 596 Q 890 600 886 600 Q 600.0 600.0 314 600 Q 310 600 310 596 L 310 504 Q 310 500 314 500" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="541.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">两项同时成立</tspan>
<tspan x="600.0" dy="34.0">再用重复复现支持泄漏结论</tspan>
</text>
</svg>
