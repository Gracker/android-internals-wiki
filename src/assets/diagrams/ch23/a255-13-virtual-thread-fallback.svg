<path d="M 700 94 L 710 100 L 700 106" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 930 150 L 930 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 924 270 L 930 280 L 936 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 780 150 L 780 220 L 300 220 L 300 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 294 270 L 300 280 L 306 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 200 380 L 200 500" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 194 490 L 200 500 L 206 490" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 540 330 L 620 330 L 620 440 L 920 440 L 920 500" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 914 490 L 920 500 L 926 490" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 64 50 Q 275.0 49.5 486 50 Q 490 50 490 54 L 490 146 Q 490 150 486 150 Q 275.0 149.3 64 150 Q 60 150 60 146 L 60 54 Q 60 50 64 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="275.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="275.0" dy="0">目标镜像开放创建API</tspan>
<tspan x="275.0" dy="34.0">进入 ThreadBuilders</tspan>
</text>
<path d="M 714 50 Q 925.0 50.2 1136 50 Q 1140 50 1140 54 L 1140 146 Q 1140 150 1136 150 Q 925.0 150.6 714 150 Q 710 150 710 146 L 710 54 Q 710 50 714 50" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="925.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="925.0" dy="0">ContinuationSupport</tspan>
<tspan x="925.0" dy="34.0">isSupported()？</tspan>
</text>
<path d="M 724 280 Q 930.0 280.0 1136 280 Q 1140 280 1140 284 L 1140 376 Q 1140 380 1136 380 Q 930.0 379.9 724 380 Q 720 380 720 376 L 720 284 Q 720 280 724 280" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="930.0" y="321.5" text-anchor="middle" style="font-size:25px">
<tspan x="930.0" dy="0">VirtualThread</tspan>
<tspan x="930.0" dy="34.0">continuation驱动</tspan>
</text>
<path d="M 64 280 Q 300.0 280.2 536 280 Q 540 280 540 284 L 540 376 Q 540 380 536 380 Q 300.0 380.4 64 380 Q 60 380 60 376 L 60 284 Q 60 280 64 280" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="300.0" y="321.5" text-anchor="middle" style="font-size:25px">
<tspan x="300.0" dy="0">不支持continuation</tspan>
<tspan x="300.0" dy="34.0">是否提供自定义scheduler？</tspan>
</text>
<path d="M 64 500 Q 325.0 499.4 586 500 Q 590 500 590 504 L 590 606 Q 590 610 586 610 Q 325.0 610.0 64 610 Q 60 610 60 606 L 60 504 Q 60 500 64 500" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="325.0" y="546.5" text-anchor="middle" style="font-size:25px">
<tspan x="325.0" dy="0">无自定义scheduler</tspan>
<tspan x="325.0" dy="34.0">BoundVirtualThread：一对一平台线程</tspan>
</text>
<path d="M 704 500 Q 920.0 499.5 1136 500 Q 1140 500 1140 504 L 1140 606 Q 1140 610 1136 610 Q 920.0 609.8 704 610 Q 700 610 700 606 L 700 504 Q 700 500 704 500" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="920.0" y="546.5" text-anchor="middle" style="font-size:25px">
<tspan x="920.0" dy="0">有自定义scheduler</tspan>
<tspan x="920.0" dy="34.0">UnsupportedOperationException</tspan>
</text>
