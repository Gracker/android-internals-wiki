<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">虚拟线程API存在不等于所有镜像都节省pthread</title>
<desc id="desc">按ThreadBuilders的运行时条件解释真正VirtualThread与绑定平台线程降级。 创建入口受FlaggedApi控制；先验证目标API开放，再检查continuation和调度器条件。 进入运行时支持判定；支持时创建VirtualThread；不支持先检查scheduler；没有scheduler时使用绑定平台线程；有scheduler则抛异常</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
