<text x="560" y="205" text-anchor="middle" style="font-size:23px">
<tspan x="560" dy="0">否</tspan>
</text>
<rect x="215.5" y="425.0" width="39.0" height="36.3" fill="white"/>
<text x="235" y="450" text-anchor="middle" style="font-size:23px">
<tspan x="235" dy="0">无</tspan>
</text>
<rect x="650.5" y="400.0" width="39.0" height="36.3" fill="white"/>
<text x="670" y="425" text-anchor="middle" style="font-size:23px">
<tspan x="670" dy="0">有</tspan>
</text>
</svg>
