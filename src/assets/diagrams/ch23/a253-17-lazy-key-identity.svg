<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">Lazy 列表稳定 key 维护业务身份</title>
<desc id="desc">用重排展示 remember 状态跟随 key 而非固定位置。 key 必须稳定唯一；不保证消除对象分配，也不让所有滚出屏幕的节点常驻；saveable key 需可被 Bundle 保存。 业务 A 的状态随 key A 移到新位置；业务 B 的状态随 key B 移到新位置</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="670" fill="white"/>
<path d="M 80 150 L 40 150 L 40 520 L 980 520 L 980 475" stroke="#4A90D9" stroke-width="2.8" fill="none"/>
<path d="M 974 485 L 980 475 L 986 485" stroke="#4A90D9" stroke-width="2.8" fill="none"/>
<path d="M 905 200 L 905 290 L 295 290 L 295 375" stroke="#4CAF50" stroke-width="2.8" fill="none"/>
<path d="M 289 365 L 295 375 L 301 365" stroke="#4CAF50" stroke-width="2.8" fill="none"/>
<path d="M 84 100 Q 295.0 99.7 506 100 Q 510 100 510 104 L 510 196 Q 510 200 506 200 Q 295.0 200.4 84 200 Q 80 200 80 196 L 80 104 Q 80 100 84 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="295.0" y="141.5" text-anchor="middle" style="font-size:25px">
<tspan x="295.0" dy="0">重排前：位置 0</tspan>
<tspan x="295.0" dy="34.0">key=A，状态 A</tspan>
</text>
<path d="M 694 100 Q 905.0 99.7 1116 100 Q 1120 100 1120 104 L 1120 196 Q 1120 200 1116 200 Q 905.0 200.6 694 200 Q 690 200 690 196 L 690 104 Q 690 100 694 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="905.0" y="141.5" text-anchor="middle" style="font-size:25px">
<tspan x="905.0" dy="0">重排前：位置 1</tspan>
<tspan x="905.0" dy="34.0">key=B，状态 B</tspan>
</text>
<path d="M 84 375 Q 295.0 374.5 506 375 Q 510 375 510 379 L 510 471 Q 510 475 506 475 Q 295.0 475.4 84 475 Q 80 475 80 471 L 80 379 Q 80 375 84 375" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="295.0" y="416.5" text-anchor="middle" style="font-size:25px">
<tspan x="295.0" dy="0">重排后：位置 0</tspan>
<tspan x="295.0" dy="34.0">key=B，状态 B</tspan>
</text>
<path d="M 694 375 Q 905.0 375.5 1116 375 Q 1120 375 1120 379 L 1120 471 Q 1120 475 1116 475 Q 905.0 475.0 694 475 Q 690 475 690 471 L 690 379 Q 690 375 694 375" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="905.0" y="416.5" text-anchor="middle" style="font-size:25px">
<tspan x="905.0" dy="0">重排后：位置 1</tspan>
<tspan x="905.0" dy="34.0">key=A，状态 A</tspan>
</text>
<text x="600" y="590" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">key 管身份；列表项内部的创建与生命周期仍要独立分析</tspan>
</text>
</svg>
