<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">完整 HPROF、HeapGraph 和分配画像的三条管线</title>
<desc id="desc">把同样叫“内存采集”的入口、产物与用途分开。 SIGUSR1 普通信号只触发 GC/profile save；HeapGraph 不是先生成完整 HPROF 再嵌入 trace；ART allocation 不追踪回收。 完整HPROF入口进入ART写文件；HeapGraph数据源由插件输出trace堆图；heapprofd输出分配画像</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
