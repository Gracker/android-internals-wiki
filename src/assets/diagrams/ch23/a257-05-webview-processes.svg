<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">WebView 宿主与沙箱渲染进程</title>
<desc id="desc">避免把自定义应用子进程误认为WebView自带渲染沙箱。 多进程WebView及其共享范围按官方API说明；GPU使用量需另计，不承诺单独固定进程。 应用组件可拆入自定义进程；WebView关联沙箱渲染进程</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="490" fill="white"/>
<path d="M 360 197 L 450 197" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 191 L 450 197 L 440 203" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 197 L 840 197" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 830 191 L 840 197 L 830 203" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 64 150 Q 210.0 149.7 356 150 Q 360 150 360 154 L 360 241 Q 360 245 356 245 Q 210.0 244.9 64 245 Q 60 245 60 241 L 60 154 Q 60 150 64 150" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="210.0" y="189.0" text-anchor="middle" style="font-size:25px">
<tspan x="210.0" dy="0">应用主进程</tspan>
<tspan x="210.0" dy="34.0">任务 / UI 调度</tspan>
</text>
<path d="M 454 150 Q 600.0 150.1 746 150 Q 750 150 750 154 L 750 241 Q 750 245 746 245 Q 600.0 245.3 454 245 Q 450 245 450 241 L 450 154 Q 450 150 454 150" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="189.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">应用自定义宿主进程</tspan>
<tspan x="600.0" dy="34.0">Activity + WebView</tspan>
</text>
<path d="M 844 150 Q 990.0 150.3 1136 150 Q 1140 150 1140 154 L 1140 241 Q 1140 245 1136 245 Q 990.0 244.4 844 245 Q 840 245 840 241 L 840 154 Q 840 150 844 150" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="990.0" y="189.0" text-anchor="middle" style="font-size:25px">
<tspan x="990.0" dy="0">WebView 沙箱渲染进程</tspan>
<tspan x="990.0" dy="34.0">网页内容渲染</tspan>
</text>
<text x="600" y="385" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">同一宿主内多个 WebView 可能共用渲染进程；不与其他应用进程共享</tspan>
</text>
</svg>
