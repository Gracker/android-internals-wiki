<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">编码文件与解码像素预算</title>
<desc id="desc">把文件大小与运行时像素数分开，用确定的算术解释先降采样的必要性。 只计算ARGB_8888像素数据，不含行对齐、对象、缓存或GPU额外开销；不是性能测量。 编码内容解码为像素；原尺寸像素预算</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="530" fill="white"/>
<path d="M 230 165 L 230 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 224 260 L 230 270 L 236 260" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 390 317 L 780 317" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 770 311 L 780 317 L 770 323" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 70 Q 230.0 70.2 386 70 Q 390 70 390 74 L 390 161 Q 390 165 386 165 Q 230.0 165.7 74 165 Q 70 165 70 161 L 70 74 Q 70 70 74 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="230.0" y="109.0" text-anchor="middle" style="font-size:25px">
<tspan x="230.0" dy="0">编码图片文件</tspan>
<tspan x="230.0" dy="34.0">文件大小 ≠ 解码占用</tspan>
</text>
<path d="M 74 270 Q 230.0 269.6 386 270 Q 390 270 390 274 L 390 361 Q 390 365 386 365 Q 230.0 364.7 74 365 Q 70 365 70 361 L 70 274 Q 70 270 74 270" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="230.0" y="309.0" text-anchor="middle" style="font-size:25px">
<tspan x="230.0" dy="0">原尺寸解码</tspan>
<tspan x="230.0" dy="34.0">4000 × 3000 × 4 B</tspan>
</text>
<path d="M 784 270 Q 940.0 270.3 1096 270 Q 1100 270 1100 274 L 1100 361 Q 1100 365 1096 365 Q 940.0 365.6 784 365 Q 780 365 780 361 L 780 274 Q 780 270 784 270" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="940.0" y="309.0" text-anchor="middle" style="font-size:25px">
<tspan x="940.0" dy="0">48,000,000 B</tspan>
<tspan x="940.0" dy="34.0">约 45.8 MiB</tspan>
</text>
<path d="M 784 70 Q 940.0 69.9 1096 70 Q 1100 70 1100 74 L 1100 161 Q 1100 165 1096 165 Q 940.0 165.4 784 165 Q 780 165 780 161 L 780 74 Q 780 70 784 70" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="940.0" y="109.0" text-anchor="middle" style="font-size:25px">
<tspan x="940.0" dy="0">目标 200 × 150</tspan>
<tspan x="940.0" dy="34.0">仅 30,000 个像素</tspan>
</text>
<text x="600" y="460" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">4000 × 3000 ÷ (200 × 150) = 400；算术预算，非设备实测</tspan>
</text>
</svg>
