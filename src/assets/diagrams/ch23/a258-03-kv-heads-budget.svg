<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">KV 缓存按 KV 头数和 token 计算</title>
<desc id="desc">用同一组层数与token参数展示GQA和多头KV的缓存量差异。 完整K/V、无滑动窗口、batch1；纯算术示例，不对应某个产品或实测模型。 GQA式少量KV头示例；多KV头示例</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 480 140 L 480 220 L 275 220 L 275 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 269 280 L 275 290 L 281 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 720 140 L 720 220 L 925 220 L 925 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 919 280 L 925 290 L 931 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 374 45 Q 600.0 44.4 826 45 Q 830 45 830 49 L 830 136 Q 830 140 826 140 Q 600.0 139.6 374 140 Q 370 140 370 136 L 370 49 Q 370 45 374 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="84.68" text-anchor="middle" style="font-size:23px">
<tspan x="600.0" dy="0">共同参数</tspan>
<tspan x="600.0" dy="31.28">32层 × 128维 × 4096 token</tspan>
</text>
<path d="M 54 290 Q 275.0 290.8 496 290 Q 500 290 500 294 L 500 381 Q 500 385 496 385 Q 275.0 384.4 54 385 Q 50 385 50 381 L 50 294 Q 50 290 54 290" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="275.0" y="329.0" text-anchor="middle" style="font-size:25px">
<tspan x="275.0" dy="0">8 个 KV 头 × 2 B</tspan>
<tspan x="275.0" dy="34.0">Key + Value → 512 MiB</tspan>
</text>
<path d="M 704 290 Q 925.0 290.0 1146 290 Q 1150 290 1150 294 L 1150 381 Q 1150 385 1146 385 Q 925.0 384.7 704 385 Q 700 385 700 381 L 700 294 Q 700 290 704 290" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="925.0" y="329.0" text-anchor="middle" style="font-size:25px">
<tspan x="925.0" dy="0">32 个 KV 头 × 2 B</tspan>
<tspan x="925.0" dy="34.0">Key + Value → 2 GiB</tspan>
</text>
<text x="600" y="535" text-anchor="middle" style="font-size:22px">
<tspan x="600" dy="0">KV 字节数 = 2 × batch × layers × kv_heads × head_dim × token数 × 元素字节数</tspan>
</text>
</svg>
