<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">共享库的映射、共享页与私有脏页</title>
<desc id="desc">把.so的只读共享映射与可写私有映射发生COW的成本分开。 只有具有相应写权限的私有映射才能写入并形成COW；只读映射不能直接随意修改。 只读代码与数据按实际共享分摊；可写段的初始化和重定位会增加私有成本</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 500 155 L 500 220 L 305 220 L 305 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 299 290 L 305 300 L 311 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 155 L 700 220 L 895 220 L 895 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 889 290 L 895 300 L 901 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 424 65 Q 600.0 64.3 776 65 Q 780 65 780 69 L 780 151 Q 780 155 776 155 Q 600.0 155.3 424 155 Q 420 155 420 151 L 420 69 Q 420 65 424 65" fill="white" stroke="#202020" stroke-width="3"/>
<text x="600.0" y="118.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">.so 文件页</tspan>
</text>
<path d="M 74 300 Q 305.0 299.4 536 300 Q 540 300 540 304 L 540 406 Q 540 410 536 410 Q 305.0 409.8 74 410 Q 70 410 70 406 L 70 304 Q 70 300 74 300" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="305.0" y="346.5" text-anchor="middle" style="font-size:25px">
<tspan x="305.0" dy="0">只读 / 可执行映射</tspan>
<tspan x="305.0" dy="34.0">可共享的干净文件页</tspan>
</text>
<path d="M 664 300 Q 895.0 299.7 1126 300 Q 1130 300 1130 304 L 1130 406 Q 1130 410 1126 410 Q 895.0 409.3 664 410 Q 660 410 660 406 L 660 304 Q 660 300 664 300" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="895.0" y="346.5" text-anchor="middle" style="font-size:25px">
<tspan x="895.0" dy="0">可写 MAP_PRIVATE 映射</tspan>
<tspan x="895.0" dy="34.0">写入时形成私有脏页</tspan>
</text>
<text x="600" y="550" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">按 Build ID、ABI 与映射段比较 Shared Clean / Private Dirty / PSS</tspan>
</text>
</svg>
