<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Strong Skipping 的参数比较规则</title>
<desc id="desc">说明有不稳定参数也可跳过，但引用反复改变仍会破坏跳过机会。 Kotlin 2.0.20 起默认启用；函数需 restartable；不把源代码中的 lambda 个数等同于运行时分配数。 稳定参数走对象相等；不稳定参数走引用相等；稳定参数比较参与跳过判断；不稳定参数比较参与跳过判断</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="680" fill="white"/>
<path d="M 500 165 L 500 220 L 300 220 L 300 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 294 270 L 300 280 L 306 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 165 L 700 220 L 900 220 L 900 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 894 270 L 900 280 L 906 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 300 380 L 300 550 L 320 550" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 310 544 L 320 550 L 310 556" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 900 380 L 900 550 L 880 550" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 890 544 L 880 550 L 890 556" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 404 65 Q 600.0 64.5 796 65 Q 800 65 800 69 L 800 161 Q 800 165 796 165 Q 600.0 164.9 404 165 Q 400 165 400 161 L 400 69 Q 400 65 404 65" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="106.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">可重启 composable</tspan>
<tspan x="600.0" dy="34.0">Strong Skipping</tspan>
</text>
<path d="M 74 280 Q 300.0 280.4 526 280 Q 530 280 530 284 L 530 376 Q 530 380 526 380 Q 300.0 379.5 74 380 Q 70 380 70 376 L 70 284 Q 70 280 74 280" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="300.0" y="321.5" text-anchor="middle" style="font-size:25px">
<tspan x="300.0" dy="0">稳定参数</tspan>
<tspan x="300.0" dy="34.0">按 equals 比较</tspan>
</text>
<path d="M 674 280 Q 900.0 279.4 1126 280 Q 1130 280 1130 284 L 1130 376 Q 1130 380 1126 380 Q 900.0 379.3 674 380 Q 670 380 670 376 L 670 284 Q 670 280 674 280" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="900.0" y="321.5" text-anchor="middle" style="font-size:25px">
<tspan x="900.0" dy="0">不稳定参数</tspan>
<tspan x="900.0" dy="34.0">按 === 比较</tspan>
</text>
<path d="M 324 500 Q 600.0 500.5 876 500 Q 880 500 880 504 L 880 596 Q 880 600 876 600 Q 600.0 600.5 324 600 Q 320 600 320 596 L 320 504 Q 320 500 324 500" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="541.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">所有参数满足比较条件</tspan>
<tspan x="600.0" dy="34.0">才具备本次跳过条件</tspan>
</text>
</svg>
