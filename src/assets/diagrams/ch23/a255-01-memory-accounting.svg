<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">分配器字节、VMA 和物理页的三层统计</title>
<desc id="desc">先区分对象归属、地址映射与实际驻留，避免用一个Native数字解释所有增长。 getNativeHeapAllocatedSize 不覆盖任意mmap/栈/Graphics；Native Heap分类依赖VMA和memtrack。 用分配器量分析逻辑分配；用VMA解释地址范围与来源；用页统计解释物理负担</desc>
