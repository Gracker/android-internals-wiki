<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">编译判断、运行次数、分配与持有分别取证</title>
<desc id="desc">把四类工具与它们能回答的问题对应，避免从编译报告推算运行分配。 接近发布配置的场景回归与可调试分配定位分开比较；所有观测工具都可能改变现场。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 84 80 Q 320.0 80.0 556 80 Q 560 80 560 84 L 560 181 Q 560 185 556 185 Q 320.0 184.7 84 185 Q 80 185 80 181 L 80 84 Q 80 80 84 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="124.0" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">Compiler reports</tspan>
<tspan x="320.0" dy="34.0">restartable / skippable / 稳定性</tspan>
</text>
<path d="M 644 80 Q 880.0 79.7 1116 80 Q 1120 80 1120 84 L 1120 181 Q 1120 185 1116 185 Q 880.0 185.2 644 185 Q 640 185 640 181 L 640 84 Q 640 80 644 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="880.0" y="124.0" text-anchor="middle" style="font-size:25px">
<tspan x="880.0" dy="0">Layout Inspector</tspan>
<tspan x="880.0" dy="34.0">当前会话重组与跳过</tspan>
</text>
<path d="M 84 330 Q 320.0 330.3 556 330 Q 560 330 560 334 L 560 431 Q 560 435 556 435 Q 320.0 434.6 84 435 Q 80 435 80 431 L 80 334 Q 80 330 84 330" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="320.0" y="374.0" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">Perfetto + Compose tracing</tspan>
<tspan x="320.0" dy="34.0">帧 / 线程 / 阶段 / GC</tspan>
</text>
<path d="M 644 330 Q 880.0 329.2 1116 330 Q 1120 330 1120 334 L 1120 431 Q 1120 435 1116 435 Q 880.0 435.7 644 435 Q 640 435 640 431 L 640 334 Q 640 330 644 330" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="880.0" y="374.0" text-anchor="middle" style="font-size:25px">
<tspan x="880.0" dy="0">Allocation / heap dump</tspan>
<tspan x="880.0" dy="34.0">创建调用栈 / dominator 引用</tspan>
</text>
<text x="600" y="550" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">同场景对照：分配、稳定占用、GC、慢帧和业务代价一起验收</tspan>
</text>
</svg>
