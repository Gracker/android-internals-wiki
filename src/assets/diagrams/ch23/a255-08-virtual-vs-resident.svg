<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">虚拟映射、驻留和换出是不同状态</title>
<desc id="desc">说明VmSize、RSS、PSS和VmSwap没有简单相加关系。 VmSwap只含匿名私有换出记账；压缩率和页面当前位于ZRAM还是后备存储不能由它推断。 映射地址可以只是预留；映射地址的一部分实际驻留；换出后地址仍属于原VMA</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="680" fill="white"/>
<path d="M 500 155 L 500 230 L 295 230 L 295 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 289 290 L 295 300 L 301 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 155 L 700 230 L 895 230 L 895 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 889 290 L 895 300 L 901 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 895 410 L 895 552 L 800 552" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 810 546 L 800 552 L 810 558" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 404 60 Q 600.0 59.6 796 60 Q 800 60 800 64 L 800 151 Q 800 155 796 155 Q 600.0 155.4 404 155 Q 400 155 400 151 L 400 64 Q 400 60 404 60" fill="white" stroke="#202020" stroke-width="3"/>
<text x="600.0" y="99.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">VMA 中的地址范围</tspan>
<tspan x="600.0" dy="34.0">计入 VmSize / VSS</tspan>
</text>
<path d="M 64 300 Q 295.0 300.8 526 300 Q 530 300 530 304 L 530 406 Q 530 410 526 410 Q 295.0 409.3 64 410 Q 60 410 60 406 L 60 304 Q 60 300 64 300" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="295.0" y="346.5" text-anchor="middle" style="font-size:25px">
<tspan x="295.0" dy="0">预留 / 尚未提交的映射</tspan>
<tspan x="295.0" dy="34.0">可能没有对应驻留页</tspan>
</text>
<path d="M 664 300 Q 895.0 300.0 1126 300 Q 1130 300 1130 304 L 1130 406 Q 1130 410 1126 410 Q 895.0 409.6 664 410 Q 660 410 660 406 L 660 304 Q 660 300 664 300" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="895.0" y="346.5" text-anchor="middle" style="font-size:25px">
<tspan x="895.0" dy="0">实际驻留 RAM 的页</tspan>
<tspan x="895.0" dy="34.0">RSS；共享按比例计入PSS</tspan>
</text>
<path d="M 404 505 Q 600.0 505.6 796 505 Q 800 505 800 509 L 800 596 Q 800 600 796 600 Q 600.0 600.1 404 600 Q 400 600 400 596 L 400 509 Q 400 505 404 505" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="544.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">匿名私有页被换出</tspan>
<tspan x="600.0" dy="34.0">VmSwap记账，VMA仍在</tspan>
</text>
</svg>
