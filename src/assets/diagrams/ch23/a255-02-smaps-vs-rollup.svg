<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">逐VMA分类与聚合总量来自不同读取路径</title>
<desc id="desc">区分必须保留名字的smaps分类和可用rollup加速的聚合统计。 smaps_rollup不含每个VMA的pathname，不能替代逐VMA分类。 分类需要扫描每个VMA；聚合按内核能力选择读取路径</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 530 155 L 670 155" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 660 149 L 670 155 L 660 161" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 530 415 L 670 415" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 660 409 L 670 415 L 660 421" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 64 100 Q 295.0 100.5 526 100 Q 530 100 530 104 L 530 206 Q 530 210 526 210 Q 295.0 209.6 64 210 Q 60 210 60 206 L 60 104 Q 60 100 64 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="295.0" y="146.5" text-anchor="middle" style="font-size:25px">
<tspan x="295.0" dy="0">/proc/PID/smaps</tspan>
<tspan x="295.0" dy="34.0">逐 VMA 名称与页统计</tspan>
</text>
<path d="M 674 100 Q 905.0 99.9 1136 100 Q 1140 100 1140 104 L 1140 206 Q 1140 210 1136 210 Q 905.0 209.7 674 210 Q 670 210 670 206 L 670 104 Q 670 100 674 100" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="905.0" y="146.5" text-anchor="middle" style="font-size:25px">
<tspan x="905.0" dy="0">ExtractAndroidHeapStats</tspan>
<tspan x="905.0" dy="34.0">按名字归 Native / Code 等</tspan>
</text>
<path d="M 64 360 Q 295.0 359.3 526 360 Q 530 360 530 364 L 530 466 Q 530 470 526 470 Q 295.0 469.8 64 470 Q 60 470 60 466 L 60 364 Q 60 360 64 360" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="295.0" y="406.5" text-anchor="middle" style="font-size:25px">
<tspan x="295.0" dy="0">smaps_rollup（若支持）</tspan>
<tspan x="295.0" dy="34.0">否则回退 smaps</tspan>
</text>
<path d="M 674 360 Q 905.0 359.8 1136 360 Q 1140 360 1140 364 L 1140 466 Q 1140 470 1136 470 Q 905.0 470.5 674 470 Q 670 470 670 466 L 670 364 Q 670 360 674 360" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="905.0" y="406.5" text-anchor="middle" style="font-size:25px">
<tspan x="905.0" dy="0">ProcMemInfo::SmapsOrRollup</tspan>
<tspan x="905.0" dy="34.0">汇总 PSS / RSS 等</tspan>
</text>
<text x="600" y="550" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">聚合统计回答总量；按VMA分类回答来源，它们并不互相替代</tspan>
</text>
</svg>
