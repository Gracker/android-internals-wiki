<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">HeapTaskDaemon 串行执行堆维护队列</title>
<desc id="desc">解释 concurrent GC 的名字不代表 HeapTask 可以在守护线程内同时执行。 队列含 GC、HeapTrim、收集器切换与阈值复查；Stop 时排空任务，不是简单丢弃未到期任务。 HeapTaskDaemon / VMRuntime.runHeapTasks() → GetTask() / 等待计划时间 / 条件变量；GetTask() / 等待计划时间 / 条件变量 → Run() → Finalize() / 完成后再取下一任务</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="460" fill="white"/>
<path d="M 360 145 L 450 145" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 440 139 L 450 145 L 440 151" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 750 145 L 840 145" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 830 139 L 840 145 L 830 151" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 64 95 Q 210.0 94.2 356 95 Q 360 95 360 99 L 360 191 Q 360 195 356 195 Q 210.0 194.3 64 195 Q 60 195 60 191 L 60 99 Q 60 95 64 95" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="210.0" y="137.86" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">HeapTaskDaemon</tspan>
<tspan x="210.0" dy="28.560000000000002">VMRuntime.runHeapTasks()</tspan>
</text>
<path d="M 454 95 Q 600.0 94.3 746 95 Q 750 95 750 99 L 750 191 Q 750 195 746 195 Q 600.0 195.6 454 195 Q 450 195 450 191 L 450 99 Q 450 95 454 95" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="136.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">GetTask()</tspan>
<tspan x="600.0" dy="34.0">等待计划时间 / 条件变量</tspan>
</text>
<path d="M 844 95 Q 990.0 95.2 1136 95 Q 1140 95 1140 99 L 1140 191 Q 1140 195 1136 195 Q 990.0 194.7 844 195 Q 840 195 840 191 L 840 99 Q 840 95 844 95" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="990.0" y="136.5" text-anchor="middle" style="font-size:25px">
<tspan x="990.0" dy="0">Run() → Finalize()</tspan>
<tspan x="990.0" dy="34.0">完成后再取下一任务</tspan>
</text>
<text x="600" y="370" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">Concurrent 表示与应用并发；单条 HeapTask 队列仍串行</tspan>
</text>
</svg>
