<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">当前像素需求与底层容量</title>
<desc id="desc">防止复用后只记录getByteCount而低估保留的分配区。 两个指标属于同一Bitmap；不是全进程PSS或图形内存总量。 当前像素需求；保留分配区</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="560" fill="white"/>
<path d="M 500 155 L 500 215 L 270 215 L 270 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 264 270 L 270 280 L 276 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 700 155 L 700 215 L 930 215 L 930 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 924 270 L 930 280 L 936 270" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 454 60 Q 600.0 59.5 746 60 Q 750 60 750 64 L 750 151 Q 750 155 746 155 Q 600.0 155.8 454 155 Q 450 155 450 151 L 450 64 Q 450 60 454 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="99.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">同一 Bitmap</tspan>
<tspan x="600.0" dy="34.0">复用 / reconfigure 后</tspan>
</text>
<path d="M 84 280 Q 270.0 279.4 456 280 Q 460 280 460 284 L 460 371 Q 460 375 456 375 Q 270.0 374.3 84 375 Q 80 375 80 371 L 80 284 Q 80 280 84 280" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="270.0" y="319.0" text-anchor="middle" style="font-size:25px">
<tspan x="270.0" dy="0">getByteCount()</tspan>
<tspan x="270.0" dy="34.0">rowBytes × height</tspan>
</text>
<path d="M 744 280 Q 930.0 279.3 1116 280 Q 1120 280 1120 284 L 1120 371 Q 1120 375 1116 375 Q 930.0 375.6 744 375 Q 740 375 740 371 L 740 284 Q 740 280 744 280" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="930.0" y="319.0" text-anchor="middle" style="font-size:25px">
<tspan x="930.0" dy="0">getAllocationByteCount()</tspan>
<tspan x="930.0" dy="34.0">底层分配区容量</tspan>
</text>
<text x="600" y="490" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">当前需求 ≤ 底层容量；容量口径仍不等同于整条图片管线的总内存</tspan>
</text>
</svg>
