<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">AndroidView 的创建、更新、复用与终止</title>
<desc id="desc">区分 factory、幂等 update、复用清理与不再复用后的资源释放。 Lazy 容器用非空 onReset 才允许 View 复用；onReset 不是最终释放；播放器等需调用自身资源 API。 创建后执行 update；可复用 View 离开当前项时先清理旧状态；复用后以新输入更新；不再复用进入 release；确定不再复用可直接进入 onRelease，无需先调用 onReset</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="640" fill="white"/>
<path d="M 400 150 L 780 150" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 770 144 L 780 150 L 770 156" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 940 200 L 940 360" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 934 350 L 940 360 L 946 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1100 415 L 1150 415 L 1150 150 L 1100 150" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 1110 144 L 1100 150 L 1110 156" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 780 415 L 400 415" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 410 409 L 400 415 L 410 421" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 810 200 L 810 265 L 240 265 L 240 360" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 234 350 L 240 360 L 246 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 84 100 Q 240.0 99.4 396 100 Q 400 100 400 104 L 400 196 Q 400 200 396 200 Q 240.0 199.6 84 200 Q 80 200 80 196 L 80 104 Q 80 100 84 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="240.0" y="141.5" text-anchor="middle" style="font-size:25px">
<tspan x="240.0" dy="0">factory</tspan>
<tspan x="240.0" dy="34.0">创建 View</tspan>
</text>
<path d="M 784 100 Q 940.0 100.0 1096 100 Q 1100 100 1100 104 L 1100 196 Q 1100 200 1096 200 Q 940.0 200.1 784 200 Q 780 200 780 196 L 780 104 Q 780 100 784 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="940.0" y="141.5" text-anchor="middle" style="font-size:25px">
<tspan x="940.0" dy="0">update</tspan>
<tspan x="940.0" dy="34.0">用当前状态更新 View</tspan>
</text>
<path d="M 784 360 Q 940.0 359.6 1096 360 Q 1100 360 1100 364 L 1100 466 Q 1100 470 1096 470 Q 940.0 470.0 784 470 Q 780 470 780 466 L 780 364 Q 780 360 784 360" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="940.0" y="406.5" text-anchor="middle" style="font-size:25px">
<tspan x="940.0" dy="0">onReset</tspan>
<tspan x="940.0" dy="34.0">清理上一项状态 / 监听</tspan>
</text>
<path d="M 84 360 Q 240.0 360.5 396 360 Q 400 360 400 364 L 400 466 Q 400 470 396 470 Q 240.0 469.5 84 470 Q 80 470 80 466 L 80 364 Q 80 360 84 360" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="240.0" y="406.5" text-anchor="middle" style="font-size:25px">
<tspan x="240.0" dy="0">onRelease</tspan>
<tspan x="240.0" dy="34.0">不再复用时终止清理</tspan>
</text>
<rect x="1109.0" y="270.0" width="62.0" height="36.3" fill="white"/>
<text x="1140" y="295" text-anchor="middle" style="font-size:23px">
<tspan x="1140" dy="0">复用</tspan>
</text>
<rect x="471.0" y="225.0" width="108.0" height="36.3" fill="white"/>
<text x="525" y="250" text-anchor="middle" style="font-size:23px">
<tspan x="525" dy="0">不再复用</tspan>
</text>
<text x="600" y="550" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">onReset 与 onRelease 是不同分支；普通 View 没有通用 release()</tspan>
</text>
</svg>
