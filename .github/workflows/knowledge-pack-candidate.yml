name: Knowledge Pack Candidate

on:
  push:
    branches: [master, develop]
    paths:
      - "src/**"
      - "knowledge-pack/**"
      - "scripts/knowledge_pack/**"
      - "scripts/build_knowledge_pack.py"
      - "scripts/bootstrap_knowledge_pack_repository.py"
      - "scripts/canary_knowledge_pack.py"
      - "scripts/publish_knowledge_pack.py"
      - "scripts/update_knowledge_pack.sh"
      - "scripts/verify_knowledge_pack.py"
      - "tests/test_knowledge_pack*.py"
      - "tests/fixtures/knowledge-pack/**"
      - "LICENSE"
      - "COMMERCIAL-LICENSE.md"
      - "KNOWLEDGE-PACK-LICENSE.md"
      - ".github/workflows/knowledge-pack-candidate.yml"
      - ".github/workflows/publish-knowledge-pack.yml"
  pull_request:
    branches: [master, develop]
    paths:
      - "src/**"
      - "knowledge-pack/**"
      - "scripts/knowledge_pack/**"
      - "scripts/build_knowledge_pack.py"
      - "scripts/bootstrap_knowledge_pack_repository.py"
      - "scripts/canary_knowledge_pack.py"
      - "scripts/publish_knowledge_pack.py"
      - "scripts/update_knowledge_pack.sh"
      - "scripts/verify_knowledge_pack.py"
      - "tests/test_knowledge_pack*.py"
      - "tests/fixtures/knowledge-pack/**"
      - "LICENSE"
      - "COMMERCIAL-LICENSE.md"
      - "KNOWLEDGE-PACK-LICENSE.md"
      - ".github/workflows/knowledge-pack-candidate.yml"
      - ".github/workflows/publish-knowledge-pack.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: knowledge-pack/requirements.txt
      - name: Install locked dependencies
        run: python -m pip install -r knowledge-pack/requirements.txt
      - name: Run Knowledge Pack tests
        run: python -m unittest discover -s tests -p "test_knowledge_pack*.py"
      - name: Report repository-wide metadata debt
        continue-on-error: true
        run: python scripts/check-metadata.py
      - name: Build all-body candidate
        run: >-
          python scripts/build_knowledge_pack.py
          --output dist/knowledge-pack
          --version 0.0.0-dev
      - name: Verify candidate and golden retrieval
        run: >-
          python scripts/verify_knowledge_pack.py
          --pack-dir dist/knowledge-pack
          --golden-queries knowledge-pack/golden-queries.yaml
      - name: Upload short-lived candidate
        uses: actions/upload-artifact@v4
        with:
          name: aiw-knowledge-pack-candidate-${{ github.sha }}
          path: dist/knowledge-pack
          retention-days: 7
          if-no-files-found: error
      - name: Attest candidate provenance
        if: github.event_name == 'push' && github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/knowledge-pack/**"
