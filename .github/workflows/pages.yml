name: GitHub Pages

on:
  schedule:
    # 每天 02:00 Asia/Shanghai（UTC 18:00）。不跟 master 每次 push。
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-mermaid
      - name: Install mermaid assets
        run: mdbook-mermaid install
      - name: Build
        run: mdbook build
      - name: Add Pages CNAME
        run: cp static/CNAME book/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
