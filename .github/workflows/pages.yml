name: GitHub Pages

on:
  schedule:
    # 每天 02:00 Asia/Shanghai（UTC 18:00）。不跟 master 每次 push。
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
      - name: Strip front matter for the web edition
        # Build a staging book root in src_filtered/ so mdBook can read it
        # as if it were the repo root. Strip YAML from every markdown file
        # under src/, then run mdbook build with src_filtered as cwd. The
        # source tree on disk stays untouched.
        run: |
          rm -rf src_filtered book
          mkdir -p src_filtered/src
          cp -R src/. src_filtered/src/
          python3 tools/filter_frontmatter.py src_filtered/src
          cp book.toml src_filtered/
          cp -R theme src_filtered/
          cp -R static src_filtered/
      - name: Build
        working-directory: src_filtered
        run: mdbook build -d ../book
      - name: Add Pages CNAME
        run: cp static/CNAME book/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
