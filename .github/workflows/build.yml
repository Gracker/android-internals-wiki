name: Build & Check

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  check-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Collect changed markdown files
        id: changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1
            RANGE="$BASE...HEAD"
          else
            # On master, previous PR merge commits may already contain legacy files that fail
            # the repository-wide checker. Gate the commit that triggered this push.
            RANGE="HEAD^..HEAD"
          fi
          git diff --name-only --diff-filter=ACMR "$RANGE" -- 'src/**/*.md' > /tmp/changed-md.txt || true
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/changed-md.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed markdown files:"
          cat /tmp/changed-md.txt
      - name: Check YAML frontmatter for changed files
        shell: bash
        run: |
          mapfile -t FILES < /tmp/changed-md.txt
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No changed src markdown files; skipping metadata check."
            exit 0
          fi
          python scripts/check-metadata.py --files "${FILES[@]}"
      - name: Check progress
        run: python scripts/progress-report.py

  build-book:
    runs-on: ubuntu-latest
    needs: check-metadata
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install mdbook plugins
        run: |
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.14.0/mdbook-mermaid-v0.14.0-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/.local/bin
      - name: Check SUMMARY links
        run: python scripts/check-summary-links.py
      - name: Build book
        run: mdbook build
      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book
