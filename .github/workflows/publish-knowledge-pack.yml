name: Publish Knowledge Pack

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: false
      version:
        description: Optional CalVer override (YYYY.MM.DD.N)
        type: string
        required: false
      revoke_version:
        description: Optional version to revoke
        type: string
        required: false
      minimum_safe_version:
        description: Minimum safe version for a revocation
        type: string
        required: false
      reason_code:
        description: Public machine-readable revocation reason
        type: string
        required: false

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: aiw-knowledge-pack-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: knowledge-pack/requirements.txt
      - name: Install locked dependencies
        run: python -m pip install -r knowledge-pack/requirements.txt
      - name: Prepare least-privilege deploy key
        env:
          DEPLOY_KEY: ${{ secrets.AIW_PACK_DEPLOY_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/aiw_pack_deploy"
          chmod 600 "$HOME/.ssh/aiw_pack_deploy"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          printf 'Host github.com\n  IdentityFile %s\n  IdentitiesOnly yes\n' \
            "$HOME/.ssh/aiw_pack_deploy" >> "$HOME/.ssh/config"
      - name: Check out public distribution repository
        run: >-
          git clone
          git@github.com:Gracker/android-internals-knowledge-pack.git
          "$RUNNER_TEMP/android-internals-knowledge-pack"
      - name: Materialize online TUF role keys
        env:
          NIGHTLY_KEY: ${{ secrets.AIW_TUF_NIGHTLY_KEY }}
          SNAPSHOT_KEY: ${{ secrets.AIW_TUF_SNAPSHOT_KEY }}
          TIMESTAMP_KEY: ${{ secrets.AIW_TUF_TIMESTAMP_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/aiw-tuf-keys"
          printf '%s\n' "$NIGHTLY_KEY" > "$RUNNER_TEMP/aiw-tuf-keys/nightly.pem"
          printf '%s\n' "$SNAPSHOT_KEY" > "$RUNNER_TEMP/aiw-tuf-keys/snapshot.pem"
          printf '%s\n' "$TIMESTAMP_KEY" > "$RUNNER_TEMP/aiw-tuf-keys/timestamp.pem"
          chmod 600 "$RUNNER_TEMP/aiw-tuf-keys/"*.pem
      - name: Build, verify, and update TUF repository
        id: update
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          VERSION: ${{ inputs.version || '' }}
          REVOKE_VERSION: ${{ inputs.revoke_version || '' }}
          MINIMUM_SAFE_VERSION: ${{ inputs.minimum_safe_version || '' }}
          REASON_CODE: ${{ inputs.reason_code || '' }}
          AIW_PACK_PYTHON: python
        run: |
          args=(
            scripts/update_knowledge_pack.sh
            --public-repo "$RUNNER_TEMP/android-internals-knowledge-pack"
            --keys-dir "$RUNNER_TEMP/aiw-tuf-keys"
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          else
            args+=(--publish)
          fi
          if [[ -n "$VERSION" ]]; then args+=(--version "$VERSION"); fi
          if [[ -n "$REVOKE_VERSION" ]]; then args+=(--revoke "$REVOKE_VERSION"); fi
          if [[ -n "$MINIMUM_SAFE_VERSION" ]]; then
            args+=(--minimum-safe-version "$MINIMUM_SAFE_VERSION")
          fi
          if [[ -n "$REASON_CODE" ]]; then args+=(--reason-code "$REASON_CODE"); fi
          "${args[@]}"
      - name: Commit and push immutable public update
        if: steps.update.outputs.published == 'true'
        working-directory: ${{ runner.temp }}/android-internals-knowledge-pack
        run: |
          git config user.name "aiw-knowledge-pack[bot]"
          git config user.email "aiw-knowledge-pack[bot]@users.noreply.github.com"
          git add metadata targets
          git commit -m "pack: publish ${{ steps.update.outputs.content_version || 'revocation' }}"
          git push origin HEAD:main
      - name: Resolve immutable public revision
        id: public
        working-directory: ${{ runner.temp }}/android-internals-knowledge-pack
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Clean-client TUF canary
        if: inputs.dry_run != true && steps.update.outputs.revoked_version == ''
        run: >-
          python scripts/canary_knowledge_pack.py
          --root "$RUNNER_TEMP/android-internals-knowledge-pack/metadata/1.root.json"
          --metadata-base-url
          "https://raw.githubusercontent.com/Gracker/android-internals-knowledge-pack/${{ steps.public.outputs.sha }}/metadata/"
          --target-base-url
          "https://raw.githubusercontent.com/Gracker/android-internals-knowledge-pack/${{ steps.public.outputs.sha }}/targets/"
      - name: Clean-client revocation canary
        if: inputs.dry_run != true && steps.update.outputs.revoked_version != ''
        run: >-
          python scripts/canary_knowledge_pack.py
          --root "$RUNNER_TEMP/android-internals-knowledge-pack/metadata/1.root.json"
          --metadata-base-url
          "https://raw.githubusercontent.com/Gracker/android-internals-knowledge-pack/${{ steps.public.outputs.sha }}/metadata/"
          --target-base-url
          "https://raw.githubusercontent.com/Gracker/android-internals-knowledge-pack/${{ steps.public.outputs.sha }}/targets/"
          --expected-revoked-version "${{ steps.update.outputs.revoked_version }}"
      - name: Attest published Pack provenance
        if: >-
          steps.update.outputs.published == 'true' &&
          steps.update.outputs.pack_dir != '' &&
          github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "${{ steps.update.outputs.pack_dir }}/**"
