schema_version: 1
pack_id: android-internals

distribution:
  smartperfetto:
    default: include-body-markdown
    projection_revision: 2
    excluded_paths:
      - src/graphify-out/**
    excluded_tags: []
    blocklist: []

audit_metadata:
  workflow_fields:
    - status
    - pipeline_stage
    - task6_state
    - task6_result
    - task9_state
    - task9_result

exported_metadata:
  - title
  - chapter
  - applicable_versions
  - last_verified
  - last_verified_against
  - confidence
  - tags
  - sources

license:
  expression: CC-BY-NC-SA-4.0 OR LicenseRef-AIW-Commercial
  copyright_holder: Gracker
  attribution: Android Internals Wiki by Gracker
  community_notice: LICENSE
  commercial_notice: COMMERCIAL-LICENSE.md
  redistribution_notice: KNOWLEDGE-PACK-LICENSE.md

compatibility:
  smartperfetto_min_version: 1.1.1
  smartperfetto_max_version: 2.x
