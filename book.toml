[book]
title = "Android 技术内幕：系统机制、性能优化与工具实战"
description = "一本由 AI 辅助持续进化的 Android 技术百科（English: Android Internals: System Architecture, Performance & Tooling in Practice）"
authors = ["高建武（Gracker）"]
language = "zh-CN"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "latte"
preferred-dark-theme = "mocha"
git-repository-url = "https://github.com/Gracker/android-internals-wiki"
edit-url-template = "https://github.com/Gracker/android-internals-wiki/edit/master/{path}"
site-url = "/"
additional-css = ["theme/catppuccin.css"]
no-section-label = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-hierarchical-headings = true
heading-split-level = 2
